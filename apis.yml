- aid: bird:bird-sms-messaging-api
  name: Bird SMS Messaging API
  description: >-
    MessageBird’s SMS API allows you to send and receive SMS messages to and from any country in the world
    through a REST API. Each message is identified by a unique random ID so that users can always check
    the status of a message using the given endpoint.


    The SMS API uses HTTP verbs and a RESTful endpoint structure with an access key that is used as the
    API Authorization. Request and response payloads are formatted as JSON using UTF-8 encoding and URL
    encoded values.
  humanURL: https://docs.bird.com/api/channels-api/api-reference/messaging
  baseURL: https://api.bird.com
