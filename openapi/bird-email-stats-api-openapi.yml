  /v1/email/health:
    get:
      operationId: getEmailHealth
      summary: Get sending health and deliverability limits
      description: 'Returns your workspace''s sending-health verdict for the requested window, together with reference deliverability limits and the boundaries used to classify risk. Use it to render a health badge, label the bounce-rate and complaint-rate limits, and draw the risk lines on a deliverability chart without hard-coding thresholds that we may retune.


        The overall `status` is `healthy`, `watching`, or `throttled`, taken as the worst of the delivery-rate, bounce-rate, and complaint-rate signals. It describes deliverability risk and never pauses your sending on its own. For the counts and rates the verdict is derived from, call Get aggregate email statistics over the same window.


        Rates follow each event''s occurrence time. A bounce or complaint that occurred during the window counts toward it even when the message was sent earlier. When you omit both dates the window ends today (UTC) and starts 7 days earlier. A window longer than 365 days returns `422`.'
      tags:
      - email-stats
      x-audiences:
      - public
      - command
      x-snippet-key: email.health
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: from
        in: query
        required: false
        description: Start date (inclusive) in `YYYY-MM-DD`, UTC. Defaults to 7 days before `to` when omitted.
        schema:
          type: string
          format: date
          example: '2026-05-19'
      - name: to
        in: query
        required: false
        description: End date (inclusive) in `YYYY-MM-DD`, UTC. Defaults to today (UTC) when omitted. Window may not exceed 365 days. Day boundaries are always UTC; unlike the statistics reads, this one takes no `timezone`.
        schema:
          type: string
          format: date
          example: '2026-05-25'
      responses:
        '200':
          description: Current sending-health verdict, reference limits, and risk classification boundaries.
