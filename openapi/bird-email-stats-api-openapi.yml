    EmailEngagementCounts:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'Open and click counts for a breakdown row whose dimension is resolved from engagement events only. `opens`, `opens_non_prefetched`, and `clicks` count each event. The same recipient opening or clicking more than once counts each time. The `unique_*` fields count distinct recipients instead, so a recipient who opened five times only counts once there. Rates and unsubscribe counts are not included here. A per-dimension delivered count is unavailable as a rate''s denominator, and an unsubscribe event has none of the information this breakdown is grouped by, so it cannot be placed on a row.

        '
      required:
      - opens
      - opens_non_prefetched
      - unique_opens
      - unique_opens_non_prefetched
      - clicks
      - unique_clicks
      properties:
        opens:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Distinct open events, counting repeat opens from the same recipient and opens auto-fetched by inbox privacy features (such as Apple Mail Privacy Protection and the Gmail image proxy).

            '
          example: 5420
        opens_non_prefetched:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Distinct open events excluding those auto-fetched by inbox privacy features. Same event-counting semantics as `opens`, with prefetched opens removed.

            '
          example: 3210
        unique_opens:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct recipients who opened at least once, including opens auto-fetched by inbox privacy features.
          example: 3640
        unique_opens_non_prefetched:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct recipients who opened at least once, excluding opens auto-fetched by inbox privacy features.
          example: 2480
        clicks:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct click events, counting repeat clicks from the same recipient.
          example: 924
        unique_clicks:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct recipients who clicked at least once.
          example: 621
    EmailDeliveryStats:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'Delivery counts and rates for the scope of the containing row (a time bucket, a breakdown dimension, or the whole period). Every count is the number of distinct recipients that reached the named lifecycle stage in scope. On the period summary, each count is the sum of the per-bucket distinct counts. Event time determines attribution; send time does not. A recipient delivered on Monday counts in Monday''s row. A recipient who bounced and then succeeded on a retry can appear in both `bounced` and `delivered`. Very large counts are close estimates rather than exact tallies.


        These counts are successive lifecycle stages, so a recipient can appear in more than one:


        - `rejected`: Happens before any send attempt, from suppression, policy, or a generation failure.

        - `deferred`: A temporary in-flight delay that is still being retried.

        - `bounced`: A delivery failure, with its own hard, soft, admin, block, and undetermined sub-types.

        - `complained`: Post-delivery spam feedback.


        Each rate is a fraction in the range 0 to 1 and is null when its denominator is zero. `accepted` is reported only where it can be attributed (time buckets and the period summary). Breakdown rows omit it.

        '
      required:
      - processed
      - delivered
      - bounced
      - complained
      - deferred
      - rejected
      - oob_bounces
      - effective_delivered
      - all_bounces
      - oob_rate
      - bounces
      - delivery_rate
      - bounce_rate
      - complaint_rate
      properties:
        accepted:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct recipients accepted for delivery after suppression filtering. Reported on time buckets and the period summary. Breakdown rows leave it out, because their rollups do not have it.
          example: 14820
        processed:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct recipients whose message was processed and handed off for delivery.
          example: 14810
        delivered:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct recipients whose message the receiving mail server accepted.
          example: 14720
        bounced:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Distinct recipients whose delivery failed. This is approximately the sum of the five `bounces.*` sub-counts (hard, soft, admin, block, undetermined). The two totals are worked out independently, so they can differ slightly.

            '
          example: 90
        bounces:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EmailBounceStatsWithRates'
        complained:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct recipients who reported the message as spam via a feedback loop.
          example: 3
        deferred:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Distinct recipients whose delivery the receiving server temporarily delayed and is still being retried.

            '
          example: 14
        rejected:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Distinct recipients rejected before any delivery attempt. Includes recipients on the workspace suppression list, transmissions that could not be completed, message-generation failures, and recipients refused by sending policy. The per-recipient `rejection_reason` field on `GET /v1/email/messages/{message_id}/recipients` surfaces the specific cause.

            '
          example: 10
        oob_bounces:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Out-of-band bounce events: distinct failure notifications received after the receiving server had initially confirmed delivery. The count represents deduplicated events rather than unique recipients.

            '
          example: 2
        effective_delivered:
          type: integer
          minimum: 0
          readOnly: true
          description: Recipients who remain delivered after all bounce signals resolve, computed as `delivered - oob_bounces`. Use this as the base for engagement-rate denominators. Clamped to 0 when `oob_bounces` exceeds `delivered`.
          example: 14718
        all_bounces:
          type: integer
          minimum: 0
          readOnly: true
          description: Total recipients in this scope who did not receive the message, computed as `bounced + oob_bounces`.
          example: 92
        oob_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          readOnly: true
          description: Share of this scope's delivery attempts that resulted in an out-of-band bounce, computed as `oob_bounces / (delivered + bounced)`. Null when there were no attempts.
          example: 0.00014
        delivery_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          readOnly: true
          description: 'Share of this scope''s delivery attempts that remained delivered after all bounce signals, computed as `effective_delivered / (delivered + bounced)`. Null when there were no attempts.

            '
          example: 0.9939
        bounce_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          readOnly: true
          description: 'Share of this scope''s delivery attempts that ultimately failed (inband or out-of-band), computed as `all_bounces / (delivered + bounced)`. Because `oob_bounces` counts events rather than recipients, `all_bounces` can exceed the attempt count. The rate is clamped to 1. Null when there were no attempts.

            '
          example: 0.0061
        complaint_rate:
          type:
          - number
          - 'null'
          minimum: 0
          readOnly: true
          description: 'Spam complaints in this scope relative to effectively delivered recipients, computed as `complained / effective_delivered`. Complaints are attributed by event time, so a scope can record more of them than it effectively delivered, pushing the rate above 1. Null when `effective_delivered` is zero.

            '
          example: 0.0002
    StatsGrain:
      type: string
      minLength: 1
      enum:
      - day
      - hour
      readOnly: true
      description: The bucket grain of the series, either `day` or `hour`.
      example: day
    EmailBounceCodeStatsPoint:
