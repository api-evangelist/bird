      - delivered
      - bounced
      - delivery_rate
      - bounce_rate
      - complaint_rate
      - open_rate
      - click_rate
      properties:
        bucket:
          type: string
          minLength: 1
          readOnly: true
          description: The day (YYYY-MM-DD) or hour (ISO 8601, on the hour) this point covers, matching the requested `trend_grain`.
          example: '2026-05-12'
        delivered:
          type: integer
          minimum: 0
          readOnly: true
          description: Delivered recipients in this bucket.
        bounced:
          type: integer
          minimum: 0
          readOnly: true
          description: Bounced recipients in this bucket.
        delivery_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          readOnly: true
          description: Delivery rate for this bucket, as a fraction. Null when nothing was delivered or bounced.
        bounce_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          readOnly: true
          description: Bounce rate for this bucket, as a fraction. Null when nothing was delivered or bounced.
        complaint_rate:
          type:
          - number
          - 'null'
          minimum: 0
          readOnly: true
          description: Complaint rate for this bucket, as a fraction. Event-time attribution can push it above 1 when complaints outrun the bucket's deliveries. Null when nothing was delivered in the bucket. On a sending-IP row complaints are not attributed to the IP, so this reads 0 in buckets that had deliveries and null in buckets that had none.
        open_rate:
          type:
          - number
          - 'null'
          minimum: 0
          readOnly: true
          description: Open rate for this bucket, as a fraction. Event-time attribution can push it above 1 when opens outrun the bucket's deliveries. Null when nothing was delivered in the bucket. On a sending-IP row engagement is not attributed to the IP, so this reads 0 in buckets that had deliveries and null in buckets that had none.
        click_rate:
          type:
          - number
          - 'null'
          minimum: 0
          readOnly: true
          description: Click rate for this bucket, as a fraction. Event-time attribution can push it above 1 when clicks outrun the bucket's deliveries. Null when nothing was delivered in the bucket. On a sending-IP row engagement is not attributed to the IP, so this reads 0 in buckets that had deliveries and null in buckets that had none.
    EmailHealthSignalThresholds:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'The boundaries this signal''s status was judged against. Use them to classify your own slices, such as per-domain or per-tag rates, against the same bands. The `direction` field identifies the risky side of the boundaries: `above` means the status degrades as the value rises past a boundary, as with bounce and complaint rates, and `below` means it degrades as the value falls, as with delivery rate. The boundaries are exclusive, so a value exactly on one keeps the better status. Omitted for a metric with no risk boundaries, such as open rate.

        '
      required:
      - direction
      - watching
      - throttled
      properties:
        direction:
          type: string
          minLength: 1
          readOnly: true
          description: Which side of the boundaries is at risk. `above` for higher-is-worse rates (bounce, complaint), `below` for lower-is-worse rates (delivery).
          enum:
          - above
          - below
          x-enum-varnames:
          - EmailHealthSignalThresholdsDirectionAbove
          - EmailHealthSignalThresholdsDirectionBelow
          example: above
        watching:
          type: number
          minimum: 0
          maximum: 1
          readOnly: true
          description: Crossing this boundary in the risk direction moves the signal to `watching`, as a fraction.
          example: 0.004
        throttled:
          type: number
          minimum: 0
          maximum: 1
          readOnly: true
          description: Crossing this boundary in the risk direction moves the signal to `throttled`, as a fraction.
          example: 0.006
