        description: Start date (inclusive) in YYYY-MM-DD, interpreted as a calendar day in `timezone` (a UTC day when `timezone` is omitted). Defaults to 30 days before `to` when omitted; with `include_trend=true` and `trend_grain=hourly` the default tightens to keep the window within the 720-hour trend cap.
        schema:
          type: string
          format: date
          example: '2026-05-01'
      - name: to
        in: query
        required: false
        description: End date (inclusive) in YYYY-MM-DD, interpreted as a calendar day in `timezone` (a UTC day when `timezone` is omitted). Defaults to today in that timezone when omitted. Window may not exceed 365 days.
        schema:
          type: string
          format: date
          example: '2026-05-25'
      - $ref: '#/components/parameters/StatsTimezone'
      - name: sort
        in: query
        required: false
        description: 'Metric to rank rows by, applied descending. Any lifecycle count or derived rate in the response may be used; rows whose rate is undefined (zero denominator) sort last. Defaults to `accepted`.

          '
        schema:
          $ref: '#/components/schemas/SMSStatsSortMetric'
      - name: limit
        in: query
        required: false
        description: Maximum number of country rows to return, ranked by the `sort` field descending.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: include_trend
        in: query
        required: false
        description: 'When true, each row also carries a `trend` array: a short per-bucket lifecycle-count series for that row over the window. Returned only when `limit` is 50 or fewer and the window is at most 90 days (trend_grain=daily) or 720 hours (trend_grain=hourly); a larger request returns 422.

          '
        schema:
          type: boolean
          default: false
      - name: trend_grain
        in: query
        required: false
        description: Bucket grain for the `trend` series. Has no effect unless `include_trend=true`.
        schema:
          $ref: '#/components/schemas/StatsTrendGrain'
      responses:
        '200':
          description: Per-country breakdown for the requested period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSStatsByCountryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/sms/stats/categories:
    get:
      operationId: getSMSStatsByCategory
      summary: Get outbound SMS statistics by category
