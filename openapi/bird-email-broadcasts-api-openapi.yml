        in: path
        required: true
        description: ID of the broadcast whose clicked links to read.
        schema:
          $ref: '#/components/schemas/EmailBroadcastID'
      responses:
        '200':
          description: The broadcast's clicked links, grouped by URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcastClickedLinkList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
