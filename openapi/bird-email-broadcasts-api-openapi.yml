openapi: 3.2.0
info:
  title: Bird Email Broadcasts API
  version: 1.0.0
  description: 'The Bird API: one REST API for email, SMS, WhatsApp, verification, and

    Realtime.'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: email-broadcasts
  description: Send one email to a stored audience. Create a broadcast as a draft, then send it immediately or schedule it for later; scheduled and in-progress broadcasts can be canceled. The audience's contacts at send time become the recipient set after suppressions are applied. The recipients endpoint returns each recipient's delivery state.
paths:
  /v1/email/broadcasts:
    post:
      operationId: createEmailBroadcast
      summary: Create a broadcast
      description: 'Creates a broadcast for a stored audience. The default is an editable draft.

        Set `send` to `true` to send now or at `scheduled_at`; `scheduled_at` without

        `send` set to `true` returns `422`. Use

        Create an email message for a small,

        explicit recipient list.


        Contacts in the audience at send time become recipients after suppressions. Read

        their states with

        List recipients of a broadcast.

        With `send`, the request returns `422` if any of these are true:


        - The sender domain is not verified.

        - No audience is selected, or the selected audience no longer exists.

        - The audience has no contact with an email address, or every contact is suppressed for the broadcast''s category.

        - No template is set, or the set template has no published version.

        - The organization has used its broadcast allowance for the current billing period, or (for an immediate send) is already at its concurrent-broadcast limit; schedule the send instead to wait for a free slot.


        If the audience is empty when a scheduled send starts, the broadcast becomes

        `failed` with a readable reason instead of silently dropping it.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.create
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBroadcastCreateRequest'
      responses:
        '201':
          description: Draft broadcast created.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcast'
              example:
                id: eb_01krdgeqcxet5s7t44vh8rt9mg
                from:
                  email: jane@acme.com
                  name: Jane Doe
                audience_id: adn_01krdgeqcxet5s7t44vh8rt9mg
                template:
                  id: emt_01krdgeqcxet5s7t44vh8rt9mg
                  version_id: null
                category: marketing
                reply_to:
                - email: jane@acme.com
                  name: Jane Doe
                tags:
                - name: category
                  value: welcome
                track_opens: true
                track_clicks: true
                created_at: '2026-09-01T09:14:02.418Z'
                recipient_count: 0
                sent_at: null
                status: draft
        '202':
          description: Broadcast accepted for delivery.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    get:
      operationId: listEmailBroadcasts
      summary: List broadcasts
      description: Returns a paginated list of broadcasts in the workspace, newest first. `created_after` and `created_before` narrow the list to broadcasts created in a half-open window, which is how you page a single month or quarter rather than the whole history.
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.list
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/EmailBroadcastStatusFilter'
      - $ref: '#/components/parameters/EmailBroadcastAudienceFilter'
      - $ref: '#/components/parameters/EmailBroadcastTagFilter'
      - $ref: '#/components/parameters/EmailBroadcastSearchFilter'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: Paginated list of broadcasts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcastList'
              example:
                data:
                - id: eb_01krdgeqcxet5s7t44vh8rt9mg
                  from:
                    email: jane@acme.com
                    name: Jane Doe
                  audience_id: adn_01krdgeqcxet5s7t44vh8rt9mg
                  template:
                    id: emt_01krdgeqcxet5s7t44vh8rt9mg
                    version_id: emv_01krdgeqcxet5s7t44vh8rt9mg
                  category: marketing
                  reply_to:
                  - email: jane@acme.com
                    name: Jane Doe
                  status: sent
                  failure_reason: null
                  failure_detail: null
                  recipient_count: 4820
                  sent_count: 4820
                  delivered_count: 4712
                  bounced_count: 96
                  complained_count: 12
                  open_count: 3104
                  click_count: 812
                  unique_opens_non_prefetched: 2140
                  unique_clicks: 693
                  out_of_band_bounces: 14
                  delivered_recipients: 4724
                  tags:
                  - name: category
                    value: welcome
                  track_opens: true
                  track_clicks: true
                  created_at: '2026-09-01T09:14:02.418Z'
                  scheduled_at: '2026-09-02T08:00:00Z'
                  started_at: '2026-09-02T08:00:03.771Z'
                  sent_at: '2026-09-02T08:11:47.902Z'
                next_cursor: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
                prev_cursor: null
                refresh_cursor: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/broadcasts/export:
    get:
      operationId: getEmailBroadcastsExport
      summary: Export broadcasts as CSV
      description: 'Downloads the workspace''s broadcasts as a CSV file, one row per broadcast,

        newest first. The header names fifteen columns, in this order:

        `created_at`, `broadcast_id`, `status`, `template_name`, `audience_id`,

        `audience_name`, `recipient_count`, `sent_count`, `delivered_count`,

        `track_opens`, `open_rate`, `track_clicks`, `click_rate`, `scheduled_at`

        and `sent_at`. `broadcast_id` is what joins a row back to the rest of the

        API. It takes the same filters as the broadcast list, so the file matches

        what the list shows for the same query. `recipient_count` is empty until a

        send resolves the audience, so an empty cell there means the broadcast has

        no recipient list yet rather than a list of nobody.


        `open_rate` and `click_rate` are decimal fractions to four places, over the

        recipients the message reached: `open_rate` is unique non-prefetched opens

        divided by that number, and `click_rate` is unique clicks divided by it.

        That divisor is not the `delivered_count` column, which resolves each

        recipient to a single status and so counts a recipient who delivered and

        then complained under the complaint, so neither rate can be reproduced from

        this file alone. Either is empty when its `track_opens` or `track_clicks`

        flag is `false`, and also when the message reached nobody, so an empty rate

        does not mean tracking is off. Both flags default to `true` and the export

        narrows by no status of its own, so a `draft` or `scheduled` row is included

        unless `status` excludes it, and carries `track_opens` as `true` with

        `open_rate` empty.


        A text cell whose first character is `=`, `+`, `-`, `@`, a tab or a carriage

        return is written with a leading apostrophe, so a spreadsheet reads it as

        text rather than as a formula. A value that begins with an apostrophe of

        its own is written unchanged, so the original text cannot always be

        recovered from the CSV cell. Match records by `broadcast_id` or `audience_id`,

        rather than by `template_name` or `audience_name`.


        The file is complete or it is refused: a query matching more broadcasts than

        one file carries returns a 422 naming the limit rather than a truncated

        download. Narrow it with `created_after` and `created_before` and request

        each window separately.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/EmailBroadcastStatusFilter'
      - $ref: '#/components/parameters/EmailBroadcastAudienceFilter'
      - $ref: '#/components/parameters/EmailBroadcastTagFilter'
      - $ref: '#/components/parameters/EmailBroadcastSearchFilter'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: The broadcasts as a CSV file.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/email/broadcasts/{broadcast_id}:
    get:
      operationId: getEmailBroadcast
      summary: Get a broadcast
      description: 'Returns one broadcast, with its audience reference and counters.


        The full recipient list, with each recipient''s own delivery status, is paginated separately: see List recipients of a broadcast.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.get
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: Broadcast identifier. Starts with `eb_`.
        schema:
          type: string
          pattern: ^eb_[0-9a-hjkmnp-tv-z]{26}$
      responses:
        '200':
          description: The broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcast'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    patch:
      operationId: updateEmailBroadcast
      summary: Update a broadcast
      description: 'Updates a draft or scheduled broadcast. A field you supply in the request is changed. A field you leave out is left as it is.


        A scheduled broadcast stays editable right up until it is accepted for sending. After that, editing it returns a conflict error.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.update
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: Broadcast identifier. Starts with `eb_`.
        schema:
          type: string
          pattern: ^eb_[0-9a-hjkmnp-tv-z]{26}$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBroadcastUpdateRequest'
      responses:
        '200':
          description: The updated broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcast'
              example:
                id: eb_01krdgeqcxet5s7t44vh8rt9mg
                from:
                  email: jane@acme.com
                  name: Jane Doe
                audience_id: adn_01krdgeqcxet5s7t44vh8rt9mg
                template:
                  id: emt_01krdgeqcxet5s7t44vh8rt9mg
                  version_id: null
                category: marketing
                reply_to:
                - email: jane@acme.com
                  name: Jane Doe
                tags:
                - name: category
                  value: welcome
                track_opens: true
                track_clicks: true
                created_at: '2026-09-01T09:14:02.418Z'
                status: scheduled
                recipient_count: 0
                scheduled_at: '2026-09-02T08:00:00Z'
                sent_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    delete:
      operationId: deleteEmailBroadcast
      summary: Delete a broadcast
      description: Deletes a draft broadcast. Only a draft can be deleted. To stop a scheduled or sending broadcast, use Cancel a broadcast instead.
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.delete
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: Broadcast identifier. Starts with `eb_`.
        schema:
          type: string
          pattern: ^eb_[0-9a-hjkmnp-tv-z]{26}$
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Draft broadcast deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/broadcasts/{broadcast_id}/counts:
    get:
      operationId: getEmailBroadcastCounts
      summary: Get a broadcast's audience counts
      description: 'Returns a live estimate of how many contacts the broadcast can reach, narrowing from everyone in its audience down to the ones the send would go to.


        - `total` is every contact in the audience.

        - `addressable` is how many of those have an email address.

        - `sendable` is how many addressable contacts are not suppressed for the broadcast''s category.


        A transactional broadcast still reaches a contact who unsubscribed from or complained about marketing mail. A marketing broadcast does not.


        The estimate can change until the broadcast sends. The broadcast must have an audience selected; otherwise, the request returns `422`.


        These are audience numbers, and sending does not change them: after a send they still describe who the broadcast resolved to, not what happened to them. `status` says which of the two situations you are in. For delivery outcomes, read the broadcast''s recipients for per-recipient status, its events for the raw feed, or email statistics by broadcast for the aggregates.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.counts
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: Broadcast identifier. Starts with `eb_`.
        schema:
          $ref: '#/components/schemas/EmailBroadcastID'
      responses:
        '200':
          description: The broadcast's audience counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcastCounts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/broadcasts/{broadcast_id}/send-quota:
    get:
      operationId: getEmailBroadcastSendQuota
      summary: Get how much of a broadcast the send allowance covers
      description: 'Returns how much of the broadcast the organization''s email send allowance covers, so a send that would run past it can be reconsidered rather than failing part-way. `recipients` is how many contacts the broadcast would send to right now, the same number the audience counts report as sendable. `allowed` is how many of those the allowance covers, and equals `recipients` when nothing limits the send. `limited_by` names the allowance that stops the rest, either the monthly one that runs with the billing period or the daily one, with `limit` and `remaining` describing it. Both numbers are live estimates: audience membership, suppressions and the sends already made in the current window all move until the broadcast sends. The broadcast must have an audience selected; a broadcast with no audience yet returns a 422.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.send_quota
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: ID of the broadcast whose send allowance to check.
        schema:
          $ref: '#/components/schemas/EmailBroadcastID'
      responses:
        '200':
          description: How much of the broadcast the send allowance covers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBroadcastSendQuota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/broadcasts/{broadcast_id}/recipients:
    get:
      operationId: listEmailBroadcastRecipients
      summary: List recipients of a broadcast
      description: 'Returns recipient-level delivery state for a broadcast, paginated. This is who a broadcast reached and how far each one got.


        The list is empty for a draft, scheduled, or accepted broadcast: recipients are resolved from the audience only once sending begins. Pass `to` to return just that address''s row, which is how you answer "did this person get it?" on a send too large to page through.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.list_recipients
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: ID of the broadcast whose recipients to read.
        schema:
          type: string
          pattern: ^eb_[0-9a-hjkmnp-tv-z]{26}$
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: to
        in: query
        required: false
        description: Return only the recipient at this address. Exact match, normalised to lowercase before comparison, so it returns at most one row.
        schema:
          type: string
          format: email
          example: user@example.com
      responses:
        '200':
          description: Paginated list of recipients for this broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailRecipientList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/broadcasts/{broadcast_id}/recipients/export:
    get:
      operationId: getEmailBroadcastRecipientsExport
      summary: Export a broadcast's recipients as CSV
      description: 'Downloads a broadcast''s recipients as a CSV file, one row per recipient. The

        header names ten columns, in this order: `recipient`, `status`,

        `rejection_reason`, `open_count`, `click_count`, `processed_at`,

        `delivered_at`, `processing_latency_ms`, `delivery_latency_ms` and

        `total_latency_ms`.


        `rejection_reason` is filled only on a `status: rejected` row and names why

        the message was never sent, which is not why it bounced. A bounce happens

        after the send, so no column here carries `bounce_type` or `bounce_code`:

        read List recipients of a broadcast

        for those. The three latency columns are milliseconds, and each is empty

        until the milestone it measures has happened: `processing_latency_ms` from

        the send being accepted to the message being prepared for delivery,

        `delivery_latency_ms` from prepared to the receiving mail server accepting

        it, and `total_latency_ms` the accepted-to-delivered time end to end.


        A text cell whose first character is `=`, `+`, `-`, `@`, a tab or a carriage

        return is written with a leading apostrophe, so a spreadsheet reads it as

        text rather than as a formula. Nothing else is prefixed, so a value that

        begins with an apostrophe of its own is written unchanged: strip a leading

        apostrophe only when one of those six characters follows it, before matching

        `recipient` back to the API.


        The file is complete or it is refused: a broadcast with more recipients than

        one file carries returns a 422 naming the limit rather than a truncated

        download. Pass `to` to export one address, or page

        List recipients of a broadcast,

        which has no limit.'
      tags:
      - email-broadcasts
      x-audiences:
      - public
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: Broadcast identifier. Starts with `eb_`.
        schema:
          type: string
          pattern: ^eb_[0-9a-hjkmnp-tv-z]{26}$
      - name: to
        in: query
        required: false
        description: Return only the recipient at this address. Exact match, normalised to lowercase before comparison, so the file carries at most one row.
        schema:
          type: string
          format: email
          example: user@example.com
      responses:
        '200':
          description: The broadcast's recipients as a CSV file.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/email/broadcasts/{broadcast_id}/events:
    get:
      operationId: listEmailBroadcastEvents
      summary: List events for a broadcast
      description: Returns the per-recipient delivery timeline for a broadcast, oldest first, as a cursor page. Each entry is one event, such as a send, an open, a click, or a bounce.
      tags:
      - email-broadcasts
      x-audiences:
      - public
      - command
      x-snippet-key: broadcasts.list_events
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: broadcast_id
        in: path
        required: true
        description: ID of the broadcast whose event timeline to read.
        schema:
          type: string
          pattern: ^eb_[0-9a-hjkmnp-tv-z]{26}$
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: type
        in: query
        required: false
        description: Filter by event type, for example `email.bounced` or `email.opened`. A broadcast timeline is recipient-scoped, so `email.scheduled` and `email.canceled` never appear on it; a canceled broadcast reports that in its own `status`.
        schema:
          $ref: '#/components/schemas/EmailEventType'
      responses:
        '200':
          description: Paginated event timeline for this broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailEventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/broadcasts/{broadcast_id}/clicked-links:
    get:
      operationId: listEmailBroadcastClickedLinks
      summary: List a broadcast's clicked links
      description: 'Returns the destination URLs a broadcast''s recipients clicked, grouped by URL and sorted by click count. Each entry carries an exact click count and distinct-recipient count over every click event the broadcast has, plus the link''s name: the name used by the most clicks that named it, or null if no click through that URL ever carried one. `data` is capped at the 100 most-clicked URLs; `total` carries the actual number of distinct URLs clicked, so a capped response is never mistaken for a complete one.'
      tags:
      - email-broadcasts
      x-audiences:
