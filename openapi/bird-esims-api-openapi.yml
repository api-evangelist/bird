openapi: 3.2.0
info:
  title: Bird Esims API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: esims
  description: Prepaid travel eSIMs. Order, install, top up, and manage data connectivity for travelers.
paths:
  /v1/esim/orders:
    post:
      operationId: createEsimOrder
      summary: Order a data package
      description: 'Purchases a data package at the quoted price. Omit `esim_id` to create an eSIM, or provide it to add a compatible package to an existing eSIM. Use List compatible offers before ordering a top-up. After purchase, use Send install credentials to deliver installation details separately.


        Inspect `status` even when the response is `201`: the order can be `completed` or `failed`. A `202` response means processing continues; use Get an order to follow the outcome. Failed orders receive an automatic credit for any charge; `refund_transaction_id` identifies the credit once issued.


        An order awaiting funds stays in `charging`. For a one-time purchase, funding retries automatically; for an initial recurring purchase, retry the same create request with the same `Idempotency-Key` after adding funds. For one-time purchases, pass `offer_revision` and `expected_price` to reject changed terms with `409`. Recurring purchases accept their quote through `recurrence`. An incompatible top-up or shortened package validity returns `409`; use `acknowledge_shortened_validity` to accept the latter. After a `503` or a lost response, retry the same request with the same `Idempotency-Key`.'
      tags:
      - esims
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsimOrderCreate'
            example:
              offer_id: eof_01krdgeqcxet5s7t44vh8rt9mg
              display_name: Amsterdam trip, order 8812
      responses:
        '201':
          description: The order finished within the request, either completed (esim_id and package_id are set) or failed (failure_code is set and the charge is credited back automatically; refund_transaction_id records the credit once it lands).
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOrder'
        '202':
          description: The order was accepted and is completing asynchronously; poll it until completed or failed.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
    get:
      operationId: listEsimOrders
      summary: List orders
      description: Returns the workspace's orders as a cursor-paginated list, newest first. Filter by `status` to find in-flight or failed purchases, by `esim_id` for one eSIM's purchase history, or by `mode` to separate test purchases from real ones. Test orders are listed alongside real ones by default, each carrying its own `mode`.
      tags:
      - esims
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        required: false
        description: Keep only orders whose `status` matches; repeat the parameter to match any of several.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/EsimOrderStatus'
      - name: esim_id
        in: query
        required: false
        description: Keep only orders for this eSIM.
        schema:
          $ref: '#/components/schemas/EsimID'
      - name: mode
        in: query
        required: false
        description: Keep only orders created in this mode. Without it, both live and test orders are returned.
        schema:
          $ref: '#/components/schemas/EsimMode'
      - name: completed_after
        in: query
        required: false
        description: Keep only orders completed at or after this timestamp. Combine it with `completed_before` to select a completion window, which is what the analytics spend and completion figures are counted by; `created_after` selects when an order was placed instead. Orders that never completed are excluded. Use an RFC 3339 timestamp with a timezone offset.
        schema:
          type: string
          format: date-time
          example: '2026-05-01T00:00:00Z'
      - name: completed_before
        in: query
        required: false
        description: Keep only orders completed before this timestamp. Combine it with `completed_after` to select a completion window. Orders that never completed are excluded. Use an RFC 3339 timestamp with a timezone offset.
        schema:
          type: string
          format: date-time
          example: '2026-06-01T00:00:00Z'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/orders/{order_id}:
    get:
      operationId: getEsimOrder
      summary: Get an order
      description: Returns one order. Poll until `status` is `completed` or `failed`; a completed order names the eSIM and package it produced.
      tags:
      - esims
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: order_id
        in: path
        required: true
        description: Order ID.
        schema:
          $ref: '#/components/schemas/EsimOrderID'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/orders/{order_id}/cancel:
    post:
      operationId: cancelEsimOrder
      summary: Cancel an unfunded order
      description: 'Cancels an order waiting for funds in `charging`. A canceled unfunded order returns `status: failed` with `failure_code: canceled`. If a charge is confirmed after cancellation, it is credited back automatically.


        For a one-time order, payment confirmed before cancellation returns `409`, and the purchase continues. For an initial recurring purchase, payment recovered during cancellation instead stops future renewal and returns the current order successfully. The paid package continues to delivery without an automatic refund. Inspect the returned order and its subscription to determine the outcome.


        Orders already completed, failed, or past the funding stage cannot be canceled through this operation and return `409`.'
      tags:
      - esims
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: order_id
        in: path
        required: true
        description: Order ID.
        schema:
          $ref: '#/components/schemas/EsimOrderID'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: 'The order after cancellation. An unfunded order is failed with `failure_code: canceled`. For an initial recurring purchase whose payment was recovered, the paid order continues and future renewal is stopped.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/offers/{offer_id}/checkout:
    parameters:
    - name: offer_id
      in: path
      required: true
      description: The offer.
      schema:
        $ref: '#/components/schemas/EsimOfferID'
    get:
      operationId: getEsimOfferCheckoutOptions
      summary: Get eSIM checkout options
      description: Returns published one-time terms and automatic renewal availability for a new eSIM, including tax-inclusive totals and current funding shortfalls. Automatic renewal includes its own price and cadence when an eligible mobile network is available. Availability and funding are checked again when purchasing; this read reserves no funds or package.
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      x-data-region: regional
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimCheckoutOptions'
              example:
                offer_id: eof_01krdgeqcxet5s7t44vh8rt9mg
                one_time:
                  offer_revision: 1
                  price:
                    amount: '1.00'
                    currency_code: EUR
                  funding:
                    tax_amount:
                      amount: '0.21'
                      currency_code: EUR
                    total:
                      amount: '1.21'
                      currency_code: EUR
                    covered: true
                    shortfall:
                      amount: '0'
                      currency_code: EUR
                recurrence:
                  available: true
                  quote:
                    delivery_mode: exact_period
                    offer_revision: 1
                    recurrence_revision: 2
                    price:
                      amount: '2.00'
                      currency_code: EUR
                    model: calendar_month
                    interval_count: 1
                    funding:
                      tax_amount:
                        amount: '0.42'
                        currency_code: EUR
                      total:
                        amount: '2.42'
                        currency_code: EUR
                      covered: false
                      shortfall:
                        amount: '1.21'
                        currency_code: EUR
                  unavailable_reason: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/offers/{offer_id}/recurrence:
    parameters:
    - name: offer_id
      in: path
      required: true
      description: The offer.
      schema:
        $ref: '#/components/schemas/EsimOfferID'
    get:
      operationId: getEsimOfferRecurrence
      summary: Get recurring eSIM offer terms
      description: Returns the published whole-package recurring price and calendar-month or fixed-day cadence. Enrollment additionally checks that the assigned eSIM mobile network supports these terms.
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      x-data-region: regional
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimRecurringOffer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/subscriptions:
    post:
      operationId: createEsimRecurringSubscription
      summary: Create a recurring eSIM subscription
      description: 'Starts a recurring package on an assigned eSIM and purchases the first period. Each accepted period is funded from your organization''s wallet. A changed price requires new acceptance; an unfunded renewal or confirmed delivery failure stops future renewal.


        An `Idempotency-Key` is required. Reuse the same key and request to recover the enrollment, including after the original response is no longer retained. Reusing the key with different enrollment details returns `409`. Read the subscription and its period history to check payment and package delivery separately.'
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      x-data-region: regional
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimRecurringSubscription'
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsimRecurringSubscriptionCreate'
      x-surfaces:
      - cli
      - mcp
      - sdk
    get:
      operationId: listEsimRecurringSubscriptions
      summary: List recurring eSIM subscriptions
      description: Returns recurring services for assigned eSIMs in this workspace.
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      x-data-region: regional
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/EsimSubscriberFilter'
      - name: esim_id
        in: query
        required: false
        description: Filter by esim id.
        schema:
          $ref: '#/components/schemas/EsimID'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimRecurringSubscriptionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/subscriptions/{subscription_id}:
    parameters:
    - name: subscription_id
      in: path
      required: true
      description: The recurring eSIM service.
      schema:
        $ref: '#/components/schemas/EsimRecurringSubscriptionID'
    get:
      operationId: getEsimRecurringSubscription
      summary: Get a recurring eSIM subscription
      description: Returns the current paid period separately from package delivery and cancellation state.
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      x-data-region: regional
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimRecurringSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/subscriptions/{subscription_id}/periods:
    parameters:
    - name: subscription_id
      in: path
      required: true
      description: The recurring eSIM service.
      schema:
        $ref: '#/components/schemas/EsimRecurringSubscriptionID'
    get:
      operationId: listEsimRecurringPeriods
      summary: List recurring eSIM periods
      description: Returns funded periods with their original charges, confirmed credits, and delivery orders. Unfunded renewals do not create a paid period.
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      x-data-region: regional
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimRecurringPeriodList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/subscriptions/{subscription_id}/cancel:
    parameters:
    - name: subscription_id
      in: path
      required: true
      description: The recurring eSIM service.
      schema:
        $ref: '#/components/schemas/EsimRecurringSubscriptionID'
    post:
      operationId: cancelEsimRecurringSubscription
      summary: Cancel recurring eSIM renewal
      description: Stops future package renewal at the current paid boundary. A period already committed remains payable. The installed profile and separately purchased packages are preserved.
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      x-data-region: regional
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimRecurringSubscription'
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/subscribers:
    post:
      operationId: createEsimSubscriber
      summary: Create an eSIM subscriber
      description: 'Creates or returns the subscriber associated with a contact in this workspace. A subscriber identifies the person using the service. This request does not buy an eSIM, assign a profile, or grant workspace access. It requires `email_marketing:read` and `esim:write`.


        Creating this association prevents deletion of the contact, including after the assigned eSIM ends. Subscriber associations cannot currently be removed, detached, or anonymized. Releasing an eSIM does not restore contact deletion.'
      tags:
      - esims
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
