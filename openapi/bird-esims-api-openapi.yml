  /v1/esim/sims:
    get:
      operationId: listEsims
      summary: List eSIMs
      description: 'Returns your workspace''s eSIMs as a cursor-paginated list, newest first.

        Filter by lifecycle `status`, recurring subscription (`renewal`), exact `iccid`, tag, or

        creation time;

        pass the response''s `next_cursor` back as `starting_after` to fetch the

        next page.


        To find an eSIM you cannot name by its full ICCID, search on

        `iccid_prefix`, `display_name`, or `phone_number`. Each searches a

        different identifier and each combines with the filters above, narrowing

        the list rather than widening it. Searching never reaches outside the

        workspace the request is scoped to, so an eSIM belonging to another

        workspace is absent from the results rather than reported as forbidden.'
      tags:
      - esims
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/EsimSubscriberFilter'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        required: false
        description: Keep only eSIMs whose current `status` matches; repeat the parameter to match any of several.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/EsimStatus'
      - name: iccid
        in: query
        required: false
        description: Filter by ICCID (exact match).
        schema:
          type: string
          minLength: 1
      - name: mode
        in: query
        required: false
        description: Keep only eSIMs created in this mode. Without it, both live and test eSIMs are returned.
        schema:
          $ref: '#/components/schemas/EsimMode'
      - name: renewal
        in: query
        required: false
        description: Keep only eSIMs whose recurring subscription that has not ended is in this status, or that have none (`none`); repeat the parameter to match any of several.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/EsimRenewalState'
      - $ref: '#/components/parameters/EsimTagFilter'
      - $ref: '#/components/parameters/EsimIccidPrefixFilter'
      - name: display_name
        in: query
        required: false
        description: Keep only eSIMs whose `display_name` contains this text, ignoring case. An eSIM you have not named has no `display_name`, so it never matches.
        schema:
          type: string
          minLength: 1
          maxLength: 120
          example: field team
      - name: phone_number
        in: query
        required: false
        description: 'Keep only eSIMs whose mobile network has reported this phone number, matched as a whole number rather than as a fragment. Give it in international form, with or without the leading `+`: `+31612345678` and `31612345678` select the same eSIMs. An eSIM matches on any number its mobile network has ever reported for the profile, so a number that has since moved on still finds the eSIM that held it. An eSIM whose number no network has reported yet never matches.'
        schema:
          type: string
          minLength: 1
          maxLength: 32
          example: '+31612345678'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of eSIMs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/sims/{esim_id}:
    parameters:
    - name: esim_id
      in: path
      required: true
