      description: 'Suspends the eSIM''s data service, for example during a payment dispute or a suspected-fraud hold. Suspension is reversible: use Resume an eSIM to restore service. The suspension does not pause validity: package expiry and the eSIM''s service period keep running while suspended. Completes asynchronously; the `esim.suspended` webhook event confirms it.'
