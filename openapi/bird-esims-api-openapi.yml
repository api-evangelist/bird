    get:
      operationId: getEsim
      summary: Get an eSIM
      description: 'Returns one eSIM: lifecycle status, device installation state, current data packages with balances, service-period timestamps, and the most recent network attachment. Balances update as mobile networks report usage: each package''s `balance.as_of` tells you how fresh they are.'
