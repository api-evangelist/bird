      - mcp
      - sdk
    delete:
      operationId: deleteEsimPackage
      summary: Remove a data package
      description: 'Removes a data package and frees capacity under the eSIM''s `package_limit`. Remaining data is forfeited without a refund. If usable balance remains, the request returns `409` unless `acknowledge_balance_forfeit=true`.


        A `202` response returns the package in `removing`. Use Get a data package to confirm `removed`. If the network rejects removal, the package returns to its previous status.'
      tags:
