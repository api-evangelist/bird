      - name: acknowledge_balance_forfeit
        in: query
        required: false
        description: 'Confirms you accept that remaining package balances are forfeited. Omitted or false while unexpired balance remains, the request fails with a conflict error.

          '
        schema:
          type: boolean
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '202':
          description: Release in progress. The eSIM is in releasing and transitions to released when complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Esim'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
