openapi: 3.2.0
info:
  title: Bird Esim Offers API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: esim-offers
  description: Prepaid travel eSIM offers. Commercial terms (allowance, validity, pricing) over a coverage zone.
paths:
  /v1/esim/offers:
    get:
      operationId: listEsimOffers
      summary: List eSIM offers
      description: Returns the eSIM offers your workspace can order as a cursor-paginated list. Filter by `country` to find offers covering a destination (the zone's country list is the guarantee), or by `zone_id` for one coverage footprint. Retired offers are excluded unless requested via `status`.
      tags:
      - esim-offers
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: sort
        in: query
        required: false
        description: 'Field to sort by. Possible values: created_at.'
        schema:
          $ref: '#/components/schemas/EsimOfferSortField'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/IncludeTotal'
      - name: country
        in: query
        required: false
        description: Keep only offers whose coverage zone includes this country (ISO 3166-1 alpha-2).
        schema:
          $ref: '#/components/schemas/CountryCode'
      - name: zone_id
        in: query
        required: false
        description: Keep only offers selling this coverage zone.
        schema:
          $ref: '#/components/schemas/EsimZoneID'
      - name: status
        in: query
        required: false
        description: Filter by offer availability. Omitted, only active offers are returned.
        schema:
          $ref: '#/components/schemas/EsimOfferStatus'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOfferList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/offers/{offer_id}:
    get:
      operationId: getEsimOffer
      summary: Get an eSIM offer
      description: Returns one eSIM offer with its pricing and embedded coverage zone.
      tags:
      - esim-offers
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: offer_id
        in: path
        required: true
        description: Offer ID.
        schema:
          $ref: '#/components/schemas/EsimOfferID'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOffer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/esim/offers/{offer_id}/requirements:
    get:
      operationId: getEsimOfferRequirements
      summary: Get country identification requirements for an eSIM offer
      description: 'Returns identification guidance as a JSON Schema for each country in the offer''s coverage zone. The schemas require `first_name`, `last_name`, and `email`, including countries with no additional requirements. Enable format assertions in your validator for email addresses and dates.


        You collect and validate the information. Bird does not receive or verify the answers, and fetching or satisfying these schemas does not authorize a purchase or assignment.'
      tags:
      - esim-offers
      x-audiences:
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: offer_id
        in: path
        required: true
        description: Offer ID.
        schema:
          $ref: '#/components/schemas/EsimOfferID'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Requirements for the offer coverage countries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsimOfferRequirements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  parameters:
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: Cursor from the `prev_cursor` or `refresh_cursor` field of a previous list response. Returns items immediately before the cursor position in the current sort order. `prev_cursor` returns the preceding page. `refresh_cursor` anchors at the first row of that response, which on a newest-first sort is how to fetch the items that have appeared since.
      schema:
        type: string
    PaginationLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IncludeTotal:
      name: include_total
      in: query
      required: false
      description: When true, the response includes a `total` field with the total number of items matching the request's filters across all pages.
      schema:
        type: boolean
        default: false
    OrderDesc:
      name: order
      in: query
      required: false
      description: 'Sort direction. Defaults to `desc`, which sorts from newest to oldest or largest to smallest, depending on the selected sort field.

        '
      schema:
        $ref: '#/components/schemas/SortOrder'
        default: desc
    XWorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace context for the request. Required for dashboard authentication and master keys. Workspace keys and access tokens already identify their workspace; send that workspace or omit the header. A different one is rejected.
      schema:
        type: string
        pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: Cursor from the `next_cursor` field of a previous list response. Returns items immediately after the cursor position in the current sort order.
      schema:
        type: string
    XOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Organization context for the request. Required for dashboard authentication. An API key or access token carries its own organization, so send either that organization or no header at all; a different one is rejected.
      schema:
        type: string
        pattern: ^org_[0-9a-hjkmnp-tv-z]{26}$
  schemas:
    EsimOfferValidityUnit:
      type: string
      minLength: 1
      enum:
      - day
      - month
      description: Unit of the validity period.
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: ISO 4217 three-letter currency code.
      example: EUR
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    EsimOfferPhoneInclusion:
      type: string
      minLength: 1
      enum:
      - always
      - on_request
      description: 'How the plan provides a phone number.


        - `always`: a phone number is included with each eSIM purchased from the offer.

        - `on_request`: reserved for offers with an optional phone number; currently unavailable.

        '
      example: always
    EsimOfferValidity:
      type: object
      additionalProperties: false
      description: 'How long a package from this offer stays usable. one_time offers run once for the given period after activation; recurring offers renew for a further period each time it lapses. Match on type and treat an unrecognized value as an offer your integration cannot order.

        '
      required:
      - type
      - unit
      - value
      properties:
        type:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferValidityType'
        unit:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferValidityUnit'
        value:
          type: integer
          minimum: 1
          readOnly: true
          description: Number of units per period.
          example: 30
        minimum_periods:
          type:
          - integer
          - 'null'
          minimum: 1
          readOnly: true
          description: For recurring offers, the minimum number of periods committed. Null when there is no minimum, and for one_time offers.
    _ListEnvelopeWithTotal:
      allOf:
      - $ref: '#/components/schemas/_ListEnvelope'
      - type: object
        properties:
          total:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 0
            description: Total number of items matching the request's filters across all pages. Present only when `include_total=true` was passed; otherwise `null`.
    EsimOfferStatus:
      type: string
      minLength: 1
      enum:
      - draft
      - active
      - retired
      description: 'Availability of an offer.


        - `draft`: being curated; never returned on the customer surface and not purchasable.

        - `active`: purchasable.

        - `retired`: no longer purchasable; packages already sold are unaffected.

        '
    EsimOfferData:
      type: object
      additionalProperties: false
      description: Data allowance of a bundle.
      required:
      - amount_bytes
      properties:
        amount_bytes:
          type: integer
          minimum: 1
          readOnly: true
          description: Total data allowance in bytes.
          example: 10737418240
        throttled_after_bytes:
          type:
          - integer
          - 'null'
          minimum: 1
          readOnly: true
          description: 'Data amount in bytes after which speed is reduced instead of cut off. Null when the allowance is a hard cap.

            '
    EsimZoneType:
      type: string
      minLength: 1
      enum:
      - local
      - regional
      - global
      description: 'Zone breadth: a single country, a multi-country region, or worldwide.'
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency_code
      properties:
        amount:
          type: string
          minLength: 1
          description: Decimal amount as a string, in major currency units.
          example: '0.00995'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          description: ISO 4217 currency code.
          example: USD
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    EsimOfferPhone:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'Phone service included with the plan. Every eSIM sold from the offer gets its own phone number; each flag states one direction of service on that number. A false flag means the plan does not include that service.

        '
      required:
      - included
      - voice_inbound
      - voice_outbound
      - sms_inbound
      - sms_outbound
      properties:
        included:
          $ref: '#/components/schemas/EsimOfferPhoneInclusion'
        voice_inbound:
          type: boolean
          description: The eSIM can receive calls on its phone number.
          example: false
        voice_outbound:
          type: boolean
          description: The eSIM can place calls.
          example: false
        sms_inbound:
          type: boolean
          description: The eSIM can receive text messages on its phone number.
          example: true
        sms_outbound:
          type: boolean
          description: The eSIM can send text messages.
          example: false
      example:
        included: always
        voice_inbound: false
        voice_outbound: false
        sms_inbound: true
        sms_outbound: false
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    EsimZone:
      type: object
      additionalProperties: false
      description: A group of countries covered by an offer. Use `countries` to check a destination rather than inferring coverage from the zone name. Purchased packages retain their coverage details from the time of purchase.
      required:
      - id
      - name
      - revision
      - type
      - countries
      - created_at
      properties:
        id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimZoneID'
        name:
          type: string
          minLength: 1
          readOnly: true
          description: Human-readable zone name.
          example: Europe
        revision:
          type: integer
          minimum: 1
          readOnly: true
          description: Increments whenever the country list changes.
        type:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimZoneType'
        countries:
          type: array
          minItems: 1
          readOnly: true
          items:
            $ref: '#/components/schemas/CountryCode'
          description: Countries covered by the zone, as ISO 3166-1 alpha-2 codes.
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    EsimZoneID:
      type: string
      minLength: 1
      pattern: ^ezn_[0-9a-hjkmnp-tv-z]{26}$
      example: ezn_01krdgeqcxet5s7t44vh8rt9mg
    EsimOfferValidityType:
      type: string
      minLength: 1
      enum:
      - one_time
      - recurring
      description: How the validity period behaves. one_time runs once and expires; recurring renews for a further period each time it lapses.
    EsimOfferRequirements:
      type: object
      additionalProperties: false
      required:
      - countries
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/EsimCountryRequirements'
      description: Identification guidance for the countries covered by the offer. You collect and validate the information; this response does not verify a person or authorize a purchase.
    EsimSchemaRevision:
      type: string
      minLength: 64
      maxLength: 64
      pattern: ^[a-f0-9]{64}$
      description: Revision identifying the returned identification schema. A changed revision means the requirements or guidance changed. It does not indicate an expiry time or purchase authorization.
    EsimOffer:
      type: object
      additionalProperties: false
      description: 'A purchasable offer from the curated catalog: the commercial terms for prepaid data in one coverage zone, priced as your workspace is billed. The coverage itself lives on the referenced zone, shared by every offer selling the same footprint.

        '
      required:
      - id
      - name
      - revision
      - zone_id
      - zone
      - speed
      - stackable
      - phone
      - pricing
      - product
      - status
      - created_at
      properties:
        id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferID'
        name:
          type: string
          minLength: 1
          readOnly: true
          description: Display name of the offer.
          example: Europe 10 GB / 30 days
        revision:
          type: integer
          minimum: 1
          readOnly: true
          description: Increments whenever the offer's terms change. Orders lock the revision they were quoted at.
        zone_id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimZoneID'
          description: Coverage zone the offer sells. Offers for the same footprint share one zone.
        zone:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimZone'
          description: The offer's coverage zone, embedded so one read answers "where does this work". The zone resource is authoritative.
        speed:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimSpeed'
          description: Speed class. For reduced-speed offers, the bundle's data.throttled_after_bytes carries the full-speed allowance.
        stackable:
          type: boolean
          readOnly: true
          description: Whether packages from this offer can be held alongside packages from other zones on the same eSIM, subject to the eSIM's package_limit.
        phone:
          readOnly: true
          description: 'Phone service that comes with the plan, or null when the plan includes no phone number. When present, `included` says how the number is provided and the flags state which call and text directions work.

            '
          oneOf:
          - $ref: '#/components/schemas/EsimOfferPhone'
          - type: 'null'
        pricing:
          readOnly: true
          description: 'Commercial terms of the offer. Every offer in the current catalog is a bundle: a fixed allowance with a validity period for a fixed price. Match on the pricing type; treat an unrecognized type as an offer your integration cannot order yet.

            '
          oneOf:
          - $ref: '#/components/schemas/EsimOfferBundlePricing'
        product:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/BillingProductSlug'
          description: Billing product the offer's charges post under, as it appears on your invoice line items.
        status:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferStatus'
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    EsimOfferID:
      type: string
      minLength: 1
      pattern: ^eof_[0-9a-hjkmnp-tv-z]{26}$
      example: eof_01krdgeqcxet5s7t44vh8rt9mg
    EsimCountryRequirements:
      type: object
      additionalProperties: false
      required:
      - country_code
      - schema_revision
      - schema
      properties:
        country_code:
          $ref: '#/components/schemas/CountryCode'
        schema_revision:
          $ref: '#/components/schemas/EsimSchemaRevision'
        schema:
          $ref: '#/components/schemas/EsimIdentificationSchema'
      description: Complete identification schema for one covered country. A country without maintained extra requirements returns the baseline schema requiring first_name, last_name, and email. Customers handle collection, validation, and compliance; Bird does not receive or verify these values.
    EsimOfferBundlePricing:
      type: object
      additionalProperties: false
      description: 'Fixed-allowance terms: a data allowance with a validity period, charged once per provisioned package.

        '
      required:
      - type
      - data
      - validity
      - price
      properties:
        type:
          type: string
          minLength: 1
          const: bundle
          readOnly: true
          description: Pricing type.
        data:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferData'
        validity:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferValidity'
          description: 'Validity of packages created from this offer. The period starts at activation, which happens on first use in the coverage zone. The effective validity is capped by the eSIM''s service period: see the package''s expires_at for the real expiry.

            '
        price:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Money'
          description: What your workspace is billed per package provisioned from this offer.
    EsimIdentificationSchema:
      type: object
      additionalProperties: true
      description: 'Complete JSON Schema draft 2020-12 document for customer-side identification validation. It declares $schema, type, title, description, properties, required, and additionalProperties. Property definitions use string or object types, standard format, pattern, minLength, maxLength, enum, and nested object keywords. Enable format assertions in your validator for email addresses and dates. Every country requires first_name, last_name, and email. Other customer-owned properties are allowed, so one details object can satisfy several countries. Bird does not receive or verify the values. Document references are opaque identifiers in customer-managed storage, not Bird upload IDs or required URLs.

        '
    EsimOfferSummary:
      type: object
      additionalProperties: false
      description: 'Compact offer row for lists: the full offer minus the embedded zone. Fetch the offer or its zone for the country list.

        '
      required:
      - id
      - name
      - revision
      - zone_id
      - speed
      - stackable
      - phone
      - pricing
      - product
      - status
      - created_at
      properties:
        id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferID'
        name:
          type: string
          minLength: 1
          readOnly: true
          description: Display name of the offer.
          example: Europe 10 GB / 30 days
        revision:
          type: integer
          minimum: 1
          readOnly: true
          description: Increments whenever the offer's terms change. Orders lock the revision they were quoted at.
        zone_id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimZoneID'
          description: Coverage zone the offer sells. Offers for the same footprint share one zone.
        speed:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimSpeed'
          description: Speed class. For reduced-speed offers, the bundle's data.throttled_after_bytes carries the full-speed allowance.
        stackable:
          type: boolean
          readOnly: true
          description: Whether packages from this offer can be held alongside packages from other zones on the same eSIM, subject to the eSIM's package_limit.
        phone:
          readOnly: true
          description: 'Phone service that comes with the plan, or null when the plan includes no phone number. When present, `included` says how the number is provided and the flags state which call and text directions work.

            '
          oneOf:
          - $ref: '#/components/schemas/EsimOfferPhone'
          - type: 'null'
        pricing:
          readOnly: true
          description: 'Commercial terms of the offer. Every offer in the current catalog is a bundle: a fixed allowance with a validity period for a fixed price. Match on the pricing type; treat an unrecognized type as an offer your integration cannot order yet.

            '
          oneOf:
          - $ref: '#/components/schemas/EsimOfferBundlePricing'
        product:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/BillingProductSlug'
          description: Billing product the offer's charges post under, as it appears on your invoice line items.
        status:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EsimOfferStatus'
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
    BillingProductSlug:
      type: string
      minLength: 1
      pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
      description: URL-safe identifier for a billing product. Lowercase letters and digits, separated by underscores. Must start with a letter.
      example: email_sends
    EsimOfferSortField:
      type: string
      enum:
      - created_at
      default: created_at
      description: Field to sort offers by. Only `created_at` is supported.
    EsimOfferList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/EsimOfferSummary'
            description: Offers, newest first.
      - $ref: '#/components/schemas/_ListEnvelopeWithTotal'
    EsimSpeed:
      type: string
      minLength: 1
      enum:
      - full
      - reduced
      description: 'Speed class. full: data flows at full network speed until the allowance is used; reduced: speed is limited, typically after the full-speed allowance. Full-speed and reduced-speed packages cannot be combined on one eSIM.

        '
    SortOrder:
      type: string
      enum:
      - asc
      - desc
      description: Sort direction, ascending or descending.
    CountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^[A-Za-z]{2}$
      description: ISO 3166-1 alpha-2 country code.
      example: US
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
  responses:
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Workspace

        keys use `bk_{region}_*`; organization master keys use `bm_{region}_*`.

        The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
