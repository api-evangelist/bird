openapi: 3.2.0
info:
  title: Bird Email Templates API
  version: 1.0.0
  description: 'The Bird API: one REST API for email, SMS, WhatsApp, verification, and

    Realtime.'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: Email Templates
  description: Reusable email templates and their versions, with stored subject, HTML, and plain-text content you manage and reference when sending.
paths:
  /v1/email/templates:
    post:
      operationId: createEmailTemplate
      summary: Create an email template
      description: 'Creates a template and its first editable draft.


        Send the template''s `slug` (the name you send the template by), an optional display name that

        defaults to the slug, a category, the authoring format (`source`), and the draft''s content in one

        or more languages. Leave the content out to start from an empty draft. A slug already used in the

        workspace returns a conflict.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateCreate'
      responses:
        '201':
          description: Email template created.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    get:
      operationId: listEmailTemplates
      summary: List email templates
      description: 'Returns a paginated list of email templates, newest first.


        The list covers both the workspace''s own templates and our built-in `system` templates. Use

        `scope` to get only one of the two, or leave it out to get both. When you leave it out, the

        workspace''s own templates come first, newest first, and our built-in templates fill the rest of

        the list once the workspace''s templates run out.


        Filter further by category or authoring format, or search with `q`, a case-insensitive substring

        match against the template''s slug, name, and description.


        Our built-in templates come in five visual themes. Each theme ships its own set of eight

        emails, and the sets overlap only partly. Use `theme` to see one of them. A template your

        workspace authored has no theme, so naming one returns our built-ins alone.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.templates.list
      parameters:
      - name: scope
        in: query
        required: false
        description: Filter by who owns the template. Use `system` for our built-in templates and `workspace` for the ones your workspace created. Leave it out to get both.
        schema:
          $ref: '#/components/schemas/TemplateScope'
      - name: category
        in: query
        required: false
        description: Return only `transactional` or `marketing` templates; omit to return both categories.
        schema:
          $ref: '#/components/schemas/EmailTemplateCategory'
      - name: source
        in: query
        required: false
        description: Return only templates authored in this format.
        schema:
          $ref: '#/components/schemas/EmailTemplateSource'
      - name: theme
        in: query
        required: false
        description: Filter by the visual theme a built-in template is designed in. Only our built-in templates have a theme, so naming one returns built-ins alone.
        schema:
          $ref: '#/components/schemas/EmailTemplateThemeFilter'
      - name: q
        in: query
        required: false
        description: A case-insensitive substring search across the template's slug, name, and description.
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: Paginated list of email templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - attio
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/email/templates/{template_ref}:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template''s id (`emt_…`) or slug. On read, a built-in `system` template''s `bird_` slug also resolves here. Write operations (update, delete) accept a workspace template only, because a `system` template is immutable.

        '
      schema:
        type: string
        minLength: 1
      example: bird_welcome
    get:
      operationId: getEmailTemplate
      summary: Get an email template
      description: 'Returns a template''s metadata, language states, sendable languages, draft revision, and draft and published version IDs. Read a version''s language to retrieve content.


        Accepts a workspace template ID (`emt_…`) or a built-in `system` template''s `bird_` slug. A `system` template has `null` for the workspace, draft, revision, and timestamp fields.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      responses:
        '200':
          description: The requested email template metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    patch:
      operationId: updateEmailTemplate
      summary: Update an email template
      description: 'Updates a template''s metadata and draft settings, such as its name or default language. Only the fields you send are changed.


        Content is not edited here: save a language on the draft version instead.


        Send the draft `revision` you last read. If someone else changed the draft first, including by saving a language, the revision is stale and the request returns a conflict so you can reload and retry.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateUpdate'
      responses:
        '200':
          description: The template with the updated metadata and draft settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    delete:
      operationId: deleteEmailTemplate
      summary: Delete an email template
      description: 'Deletes the template and all its versions. The slug becomes available for reuse in the workspace, and the deletion cannot be undone.


        A template can''t be deleted while a broadcast that has not started sending still uses it, because a `scheduled` or `accepted` broadcast has not pinned the content it will send yet. List the broadcasts blocking a template delete to see which ones those are. A broadcast that has already started sending does not block the delete: it pinned its version when it started, so it keeps sending the content it froze.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Email template deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/templates/{template_ref}/duplicate:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The source template to copy: a workspace template''s id (`emt_…`) or slug, or a built-in `system` template''s `bird_` slug. The copy is always a new workspace template.

        '
      schema:
        type: string
        minLength: 1
      example: welcome-email
    post:
      operationId: duplicateEmailTemplate
      summary: Duplicate an email template
      description: 'Creates a new template by copying an existing one: one of your workspace

        templates, or a built-in `system` template (by its `bird_` slug). The copy

        is a new template with its own id and a single editable draft seeded from

        the source''s current content. It inherits the source''s category, authoring

        format (`source`), and description. Copying a workspace template also

        carries over its default language and its missing-language policy, so the

        copy behaves like what it was copied from. The copy starts unpublished.


        By default the copy''s slug derives from the source''s slug, for example

        `welcome-email-copy`, with a numeric suffix added if that slug is already

        taken. Supply `slug` to choose your own. A slug already in use in the

        workspace returns a conflict.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateDuplicate'
      responses:
        '201':
          description: The newly created template copy.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/templates/{template_ref}/preview:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template to preview: a workspace template''s id (`emt_…`) or slug, or a built-in `system` template''s `bird_` slug.

        '
      schema:
        type: string
        minLength: 1
      example: welcome-email
    post:
      operationId: getEmailTemplatePreview
      summary: Get an email template preview
      description: 'Renders a template with the sample values you supply and returns the resulting subject, HTML, and plain-text bodies: the personalized email as it will look once sent. By default it renders the current draft, so you can check your changes before you submit it. Pass `version` to preview a specific published version instead; built-in `system` templates have no versions, so `version` on a `bird_` template returns a validation error. Pass `contact` to see the email the way one of your contacts would receive it. Works for your workspace templates and built-in `system` templates. Sample `parameters` are capped at 16 KB once serialized, and personalization that is not valid or not supported returns a validation error naming what to fix.

        The response also reports what the HTML uses that mail clients remove, ignore, or render inconsistently. Each finding in `compatibility` names the pattern, the line and column it sits on, and what to use instead, and `compatibility_severity` reduces them to one word for the whole body. It is advisory: the preview renders either way.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplatePreviewRequest'
      responses:
        '200':
          description: The rendered preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplatePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/templates/{template_ref}/versions:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template''s id (`emt_…`) or slug. A built-in `system` template''s `bird_` slug also resolves here, to its one permanently published version.

        '
      schema:
        type: string
        minLength: 1
      example: emt_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: listEmailTemplateVersions
      summary: List email template versions
      description: Returns the template's versions as a cursor page (the current draft plus all published versions), newest first. Each entry names its languages without returning their content. Templates retain every language of every submitted version, so listing their content would grow the response with the template's history. Read a single version for its content.
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: The template's versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateVersionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/templates/{template_ref}/broadcasts:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template''s id (`emt_…`) or slug. A built-in `system` template''s `bird_` slug also resolves here, but a system template can never be referenced by a broadcast, so this always returns an empty page for one.

        '
      schema:
        type: string
        minLength: 1
      example: emt_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: listEmailTemplateBroadcasts
      summary: List the broadcasts blocking a template delete
      description: 'Returns the broadcasts that block deleting this template, as a cursor page, newest first. Those are the ones that have not started sending, so they have not pinned the content they will send: `scheduled` and `accepted`. Clear every one of them and the delete goes through. Canceling clears either status; repointing at another template only works while the broadcast is `scheduled`, because an `accepted` broadcast is committed to send and an edit returns a conflict. A broadcast that is already sending is not listed and does not block the delete, because it froze its version when it started.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: The broadcasts blocking a delete of the template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateBroadcastList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/templates/{template_ref}/versions/{version_id}:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template''s id (`emt_…`) or slug. On read, a built-in `system` template''s `bird_` slug also resolves here, to its one permanently published version. Discarding a draft requires a workspace template, because a `system` template has no draft and returns `404` `not_found_error`.

        '
      schema:
        type: string
        minLength: 1
      example: emt_01krdgeqcxet5s7t44vh8rt9mg
    - name: version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EmailTemplateVersionID'
      example: emv_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: getEmailTemplateVersion
      summary: Get an email template version
      description: 'Returns a single version of an email template:


        - Its lifecycle metadata (`status`, `version_number`, `published_at`).

        - The content it froze in every language.

        - The `variables` that content expects at send time.


        Use List email template versions to enumerate the draft and published versions. Roll back an email template makes an earlier published version live again. Returns a `404 Not Found` error if the template or version does not exist in the workspace.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      responses:
        '200':
          description: Email template version object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    delete:
      operationId: deleteEmailTemplateVersion
      summary: Delete an email template draft
      description: 'Discards the draft''s unsaved work: its content resets to what is currently published (or to a single empty language when nothing has been published yet), so the draft matches what sends actually deliver again. Compare each language''s `content_hash` against the published version''s to see what a discard would throw away.


        The draft itself remains, ready for new edits at a bumped `revision`, and what is published never changes. Only the draft can be discarded. Addressing a published version returns a `422` `validation_error`, because published versions are permanent history.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The draft was reset.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/templates/{template_ref}/versions/{version_id}/languages:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template''s id (`emt_…`) or slug. A built-in `system` template''s `bird_` slug also resolves here, to its one permanently published version.

        '
      schema:
        type: string
        minLength: 1
      example: emt_01krdgeqcxet5s7t44vh8rt9mg
    - name: version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EmailTemplateVersionID'
      example: emv_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: listEmailTemplateVersionLanguages
      summary: List a version's languages
      description: 'Returns every language the version holds, ordered by language tag, without the content itself, so listing a template with twenty-five languages stays small.


        Each entry has the language''s `revision` (send it back when you save that language) and its `content_hash`, so you can tell which languages changed since you last read them and fetch only those. Read a single language for its subject and bodies.'
      tags:
      - Email Templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      responses:
        '200':
          description: The version's languages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateLanguageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/email/templates/{template_ref}/versions/{version_id}/languages/{language}:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template''s id (`emt_…`) or slug. On read, a built-in `system` template''s `bird_` slug also resolves here. Writing or removing a language requires a workspace template, because a `system` template has no draft to edit and returns `404` `not_found_error`.

        '
      schema:
        type: string
        minLength: 1
      example: emt_01krdgeqcxet5s7t44vh8rt9mg
    - name: version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EmailTemplateVersionID'
      example: emv_01krdgeqcxet5s7t44vh8rt9mg
    - name: language
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LanguageTag'
      example: pt-BR
    get:
      operationId: getEmailTemplateLanguage
      summary: Get one language of a version
      description: 'Returns one language''s content from a version (its subject and bodies) plus the `revision` to send back when saving it.


        Works on any version, including a published version whose content is frozen. Returns a `404 Not Found` error if the version does not have the language.'
      tags:
      - Email Templates
      security:
