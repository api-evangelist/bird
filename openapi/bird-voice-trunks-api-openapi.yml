openapi: 3.2.0
info:
  title: Bird Voice Trunks API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: voice-trunks
  description: SIP trunk management for trunks, IP allowlist entries, digest credentials, inbound gateways, and the numbers a trunk answers.
paths:
  /v1/voice/trunks:
    get:
      operationId: listVoiceTrunks
      x-snippet-key: voice.trunks.list
      summary: List SIP trunks
      description: Returns the workspace's SIP trunks as a paginated list, each with its assigned `domain` and access control lists. Create a trunk to provision a new one, or use `voice.trunks.get` to fetch an existing trunk by ID.
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: sort
        in: query
        required: false
        description: Field to sort by.
        schema:
          $ref: '#/components/schemas/VoiceTrunkSortField'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of SIP trunks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunkList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    post:
      operationId: createVoiceTrunk
      x-snippet-key: voice.trunks.create
      summary: Create a SIP trunk
      description: Provisions a new SIP trunk for the workspace. Bird assigns a unique domain for the trunk; use this domain as the SIP registrar or proxy address in your PBX or SIP client. Pass `digest_algorithms` when the PBX needs a specific Digest hash, such as MD5-only equipment. Otherwise the trunk offers Bird's default of SHA-256 then MD5.
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTrunkCreate'
            example:
              digest_algorithms:
              - MD5
              name: Production PBX trunk
              outbound_enabled: true
      responses:
        '201':
          description: SIP trunk created.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/voice/trunks/{trunk_id}:
    parameters:
    - name: trunk_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SIPTrunkID'
      example: spt_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: getVoiceTrunk
      x-snippet-key: voice.trunks.get
      summary: Get a SIP trunk
      description: Returns a single SIP trunk, including its Bird-assigned `domain`, its access control lists. Returns a 404 `not_found_error` if the trunk does not exist in the workspace.
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: SIP trunk with its current configuration and status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
    patch:
      operationId: updateVoiceTrunk
      x-snippet-key: voice.trunks.update
      summary: Update a SIP trunk
      description: Updates a SIP trunk's `name`, access control (`ip_acls`, `allowed_api_key_ids`), and Digest algorithm offer (`digest_algorithms`). Omitted fields stay unchanged; each list, when present, replaces the previous list wholesale. An empty body or invalid list entry returns a 422 `validation_error`; a trunk outside the workspace returns a 404 `not_found_error`.
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTrunkUpdate'
      responses:
        '200':
          description: Updated SIP trunk.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
    delete:
      operationId: deleteVoiceTrunk
      x-snippet-key: voice.trunks.delete
      summary: Delete a SIP trunk
      description: Removes the SIP trunk. Calls already in progress on this trunk are not affected. After deletion, new calls cannot use the trunk. Historical leg records retain the trunk reference. The generated domain is not reused.
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '204':
          description: SIP trunk deleted.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/voice/session-credentials:
    post:
      operationId: createVoiceSessionCredential
      x-snippet-key: voice.session_credentials.create
      summary: Create a SIP session credential
      description: 'Issues a workspace-scoped SIP digest credential valid for five minutes. The password appears only in this response; create another credential if you lose it. Trunks must allow session credentials to accept it.


        The request has no body. Each successful request creates a fresh credential, including retries. Keep retries bounded: creating more than 20 live credentials for the same caller invalidates the oldest. Treat the password as a bearer secret until expires_at.'
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Does not deduplicate this operation. Every successful attempt creates a fresh credential.
        schema:
          type: string
          maxLength: 255
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '201':
          headers:
            Cache-Control:
              description: Prevents storage of the credential in HTTP caches.
              schema:
                type: string
                enum:
                - no-store
          description: 'Credential minted. The password appears only in this response.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSessionCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/voice/trunks/{trunk_id}/gateways:
    parameters:
    - name: trunk_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SIPTrunkID'
      example: spt_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: listVoiceTrunkGateways
      x-snippet-key: voice.trunks.gateways.list
      summary: List a SIP trunk's gateways
      description: 'Returns the gateway addresses used to forward inbound calls to this trunk, ordered by priority. A trunk with no gateway refuses inbound calls. Returns a `404 Not Found` error if the trunk does not exist in the workspace.


        Returns the complete collection without pagination, including any pre-existing gateways above the current limit of 20. Reads are available when inbound calling is disabled.'
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: The complete gateway list, ordered by priority and then creation time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunkGatewayList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
    post:
      operationId: createVoiceTrunkGateway
      x-snippet-key: voice.trunks.gateways.create
      summary: Create a gateway on a SIP trunk
      description: 'Adds a gateway address for forwarding inbound calls to this trunk.


        Gateways are tried in `priority` order, lowest first, until one answers.

        Gateways with equal priority share calls evenly. `sip_uri` identifies the

        peer host, while `destination_format` and `origination_format` control the

        called and calling number formats. Both number formats default to E.164.


        A SIP URI already registered on this trunk returns `409 Conflict`. An

        invalid SIP URI, a SIP URI carrying a user part, or a malformed number

        format returns `422`. A trunk outside the workspace returns `404 Not Found`.

        A trunk without inbound calling enabled returns `412 Precondition Failed`.


        A trunk supports at most 20 gateways. Creating another returns 422; delete a gateway before adding its replacement. SIP ports must be between 1 and 65535.'
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTrunkGatewayCreate'
            example:
              sip_uri: sip:pbx.example.com:5060
              priority: 0
              destination_format: 1234#{number}
      responses:
        '201':
          description: Gateway created.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunkGateway'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/voice/trunks/{trunk_id}/gateways/{gateway_id}:
    parameters:
    - name: trunk_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SIPTrunkID'
      example: spt_01krdgeqcxet5s7t44vh8rt9mg
    - name: gateway_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VoiceTrunkGatewayID'
      example: vtg_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: getVoiceTrunkGateway
      x-snippet-key: voice.trunks.gateways.get
      summary: Get a SIP trunk gateway
      description: Returns a single gateway by ID. Returns a 404 `not_found_error` if the trunk or the gateway does not exist in the workspace.
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: Gateway with its current routing and connection settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunkGateway'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
    patch:
      operationId: updateVoiceTrunkGateway
      x-snippet-key: voice.trunks.gateways.update
      summary: Update a SIP trunk gateway
      description: 'Updates the gateway''s `sip_uri`, its `priority`, either number format, or any

        combination. Omitted fields stay unchanged; sending an empty string for a

        number format returns it to E.164.


        An updated SIP URI that collides with another gateway on this trunk returns

        `409 Conflict`. An empty body or invalid field returns `422`. A trunk or

        gateway outside the workspace returns `404 Not Found`. A trunk without

        inbound calling enabled returns `412 Precondition Failed`.'
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTrunkGatewayUpdate'
      responses:
        '200':
          description: Updated gateway.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceTrunkGateway'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
    delete:
      operationId: deleteVoiceTrunkGateway
      x-snippet-key: voice.trunks.gateways.delete
      summary: Delete a SIP trunk gateway
      description: Removes the gateway. Calls already ringing this address are not affected. Removing the last gateway leaves inbound calling enabled but removes its delivery targets. New inbound calls to numbers routed to this trunk are refused until a gateway is added back. The trunk must have inbound calling enabled, otherwise this returns `412 Precondition Failed`.
      tags:
      - voice-trunks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '204':
          description: Gateway deleted.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  schemas:
    VoiceTrunkList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/VoiceTrunk'
      - $ref: '#/components/schemas/_ListEnvelope'
    VoiceTrunkSortField:
      type: string
      enum:
      - created_at
      default: created_at
      description: Field used to sort the list.
    VoiceTrunkIPACL:
      type: object
      additionalProperties: false
      required:
      - id
      - trunk_id
      - cidr
      - created_at
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/SIPTrunkACLID'
          description: Unique identifier for this IP ACL entry.
        trunk_id:
          readOnly: true
          $ref: '#/components/schemas/SIPTrunkID'
        cidr:
          type: string
          minLength: 7
          readOnly: true
          description: IPv4 or IPv6 CIDR block that is allowed to send SIP traffic to this trunk.
          example: 203.0.113.0/24
        description:
          type:
          - string
          - 'null'
          minLength: 1
          description: Optional human-readable label for this ACL entry.
          example: Office network
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    VoiceTrunk:
      allOf:
      - $ref: '#/components/schemas/VoiceTrunkCore'
      - $ref: '#/components/schemas/Timestamps'
    Timestamps:
      type: object
      required:
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          example: '2026-05-20T09:14:52Z'
        updated_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          example: '2026-05-25T16:42:01Z'
    VoiceTrunkIPACLCreate:
      type: object
      additionalProperties: false
      required:
      - cidr
      properties:
        cidr:
          type: string
          minLength: 7
          description: IPv4 or IPv6 CIDR block to allow. Use /32 for a single IPv4 address or /128 for a single IPv6 address.
          example: 203.0.113.0/24
        description:
          type: string
          minLength: 1
          description: Optional human-readable label for this ACL entry.
          example: Office network
    VoiceTrunkUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'A change to the trunk''s directions, name, access control, and Digest algorithm

        offer. Every field is optional. An omitted field is left unchanged. The

        `ip_acls`, `allowed_api_key_ids`, and `digest_algorithms` fields each replace

        their whole list when present. Send an empty array to clear one. This lets you

        commit the trunk''s entire access configuration in one update.


        A direction has to be enabled before its settings can be set, but one update

        can do both: enable a direction and send its configuration together.

        '
      properties:
        name:
          type: string
          minLength: 1
          description: A human-readable label for this SIP trunk. Mutable, and distinct from the generated wire domain.
          example: Production PBX trunk
        outbound_enabled:
          type: boolean
          description: 'Whether this trunk may place calls. Turning it off stops the trunk admitting call attempts at the next call setup and leaves its connection and authentication settings stored, so turning it back on restores a working trunk. Omit the field to leave it unchanged.

            '
          example: true
        inbound_enabled:
          type: boolean
          description: 'Whether this trunk may receive calls. Turning it off resets number routes that use this trunk to reject incoming calls. Turning it back on does not restore those routes. The gateways remain configured. Omit the field to leave it unchanged.

            '
          example: true
        media_bypass:
          type: boolean
          description: 'Whether we take ourselves out of the audio path for calls we forward to this trunk. Turning it on takes effect at the next call setup and leaves calls already up untouched. It is an inbound setting, so the trunk must have `inbound_enabled` on; one update can do both. While it is on we cannot record those calls, report their audio quality, or end one because its audio stopped, and your equipment must be reachable for audio from the public internet. Turning it off puts us back in the path at the next call setup. Omit the field to leave it unchanged.

            '
          example: true
        ip_acls:
          type: array
          description: 'Replaces the trunk''s entire IP allow list. When present, the allow list is set to exactly these CIDR blocks: ranges not listed are removed and new ones are added. Send an empty array to clear the list, turning IP filtering off. Omit the field to leave the allow list unchanged.

            '
          items:
            $ref: '#/components/schemas/VoiceTrunkIPACLCreate'
        allowed_api_key_ids:
          type: array
          description: 'Replaces the trunk''s entire set of allowed API keys. When present, exactly these keys may authenticate the trunk over SIP Digest. Each key you ADD must belong to this workspace and hold `voice` at write level; a key that does not is refused and the whole update is rolled back. A key already on the list that has since lost the permission or expired does not block the update, so you can keep editing the trunk while you put its permission back. A non-empty list turns API-key authentication on; send an empty array to turn it off. Omit the field to leave the allowed keys unchanged.

            '
          items:
            $ref: '#/components/schemas/APIKeyID'
        digest_algorithms:
          type: array
          description: 'Replaces the Digest hash algorithms this trunk offers, in the order they should be offered. Send `["MD5"]` for a PBX that only implements MD5 and rejects or ignores a challenge offering SHA-256 first. Send an empty array to return to the default of `["SHA-256", "MD5"]`. The offer is never empty, because a trunk that offered nothing could not be authenticated at all. Narrowing the list also narrows what the trunk accepts: an answer using an algorithm no longer offered is rejected. Takes effect on the next call setup; no credential is re-issued. Omit the field to leave the offer unchanged.

            '
          items:
            $ref: '#/components/schemas/VoiceSIPDigestAlgorithm'
          example:
          - MD5
        session_credentials_enabled:
          type: boolean
          description: 'Whether a session credential may be used to connect to this trunk from a web browser, the CLI or MCP. Off by default; turning it on does not change what the allow lists admit, and turning it off stops those connections at the next call setup without re-issuing anything. Omit the field to leave it unchanged.

            '
          example: true
    WorkspaceID:
      type: string
      minLength: 1
      pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
      example: ws_01krdgeqcxet5s7t44vh8rt9mg
    SIPTrunkID:
      type: string
      minLength: 1
      pattern: ^spt_[0-9a-hjkmnp-tv-z]{26}$
      example: spt_01krdgeqcxet5s7t44vh8rt9mg
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    VoiceSIPDigestAlgorithm:
      type: string
      enum:
      - SHA-256
      - MD5
      description: 'A hash algorithm for SIP Digest authentication, spelled as it appears in the `algorithm=` parameter on the wire. `SHA-256` is the stronger option and is offered first; `MD5` is the algorithm most PBX and ITSP equipment implements.

        '
      example: SHA-256
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    VoiceTrunkGatewayCreate:
      type: object
      additionalProperties: false
      required:
      - sip_uri
      - priority
      properties:
        sip_uri:
          type: string
          minLength: 1
          maxLength: 512
          description: 'SIP URI an inbound call to this trunk should be forwarded to. Give the host only, with an optional port: which number is dialed there comes from `destination_format`, so a URI carrying a user part is rejected.

            '
          example: sip:pbx.example.com:5060
        priority:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: 'The order gateways are tried in, lowest first. Give two gateways the same priority to share calls between them evenly.

            '
          example: 0
        origination_format:
          type: string
          maxLength: 64
          description: 'How this gateway wants the calling number spelled. Write a template whose

            `{number}` stands for the number without its leading `+`; the result is

            stated in the `P-Asserted-Identity` header of the delivered call.


            Omit it for E.164, which is `+{number}`. The template may add digits,

            letters and the characters `-_.!~*''()&=+$,;?/%#` around `{number}`, which

            may appear at most once, and anything else in braces is rejected so a

            misspelled placeholder cannot reach a call.


            A format with no `{number}` at all states the same identity on every call,

            which is what a peer that only accepts one authorized number wants. The

            call then carries nothing about who really called.

            '
          example: +{number}
        destination_format:
          type: string
          maxLength: 64
          description: 'How this gateway formats the dialed number. In the template, `{number}`

            represents the number without its leading `+`. The result is placed before

            the `sip_uri` host. For example, `1234#{number}` formats `+31201234567` as

            `sip:1234#31201234567@pbx.example.com:5060`.


            Omit it for E.164, which is `+{number}`. A format with no `{number}` at all

            sends every number this trunk answers to one fixed number, so

            `777000447973` reaches `sip:777000447973@pbx.example.com:5060` whatever was

            dialed. The same rules as `origination_format` apply to what the template

            may contain.

            '
          example: 1234#{number}
    APIKeyID:
      type: string
      minLength: 1
      pattern: ^key_[0-9a-hjkmnp-tv-z]{26}$
      example: key_01krdgeqcxet5s7t44vh8rt9mg
    VoiceTrunkGatewayList:
      type: object
      additionalProperties: false
      required:
      - data
      description: 'The trunk''s gateways. Not paginated: a trunk holds a small, hand-managed set of dial targets, and the order across the whole set is what decides hunt order, so a partial page would misrepresent it.'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VoiceTrunkGateway'
          description: The trunk's gateways, in priority order.
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    VoiceTrunkGatewayID:
      type: string
      minLength: 1
      pattern: ^vtg_[0-9a-hjkmnp-tv-z]{26}$
      example: vtg_01krdgeqcxet5s7t44vh8rt9mg
    SIPTrunkACLID:
      type: string
      minLength: 1
      pattern: ^sta_[0-9a-hjkmnp-tv-z]{26}$
      example: sta_01krdgeqcxet5s7t44vh8rt9mg
    VoiceTrunkGateway:
      description: 'One address an inbound call to this trunk is forwarded to, and how that peer wants the call''s two numbers spelled. A trunk can have several, tried in priority order until one answers.

        '
      allOf:
      - type: object
        required:
        - id
        - trunk_id
        - sip_uri
        - priority
        - origination_format
        - destination_format
        properties:
          id:
            readOnly: true
            $ref: '#/components/schemas/VoiceTrunkGatewayID'
            description: Unique identifier for this gateway.
          trunk_id:
            readOnly: true
            $ref: '#/components/schemas/SIPTrunkID'
          sip_uri:
            type: string
            minLength: 1
            maxLength: 512
            description: 'SIP URI an inbound call to this trunk is forwarded to. The host only: which number is dialed at that host comes from `destination_format`, because it changes with every call.

              '
            example: sip:pbx.example.com:5060
          priority:
            type: integer
            minimum: 0
            description: 'The order gateways are tried in, lowest first. Gateways sharing a priority take an equal share of calls, and any of them may be tried first on a given call.

              '
            example: 0
          origination_format:
            type: string
            minLength: 1
            maxLength: 64
            description: 'How the calling number is spelled to this gateway, as a template whose

              `{number}` stands for the number without its leading `+`. It is stated

              in the `P-Asserted-Identity` header of the delivered call.


              A gateway that has not asked for anything else reports `+{number}`,

              which is E.164. A format with no `{number}` states that same identity on

              every call, whoever called.

              '
            example: +{number}
          destination_format:
            type: string
            minLength: 1
            maxLength: 64
            description: 'How this gateway formats the dialed number. In the template,

              `{number}` represents the number without its leading `+`. The result

              is placed before the `sip_uri` host. For example, `1234#{number}`

              formats `+31201234567` as

              `sip:1234#31201234567@pbx.example.com:5060`.


              A gateway that has not asked for anything else reports `+{number}`,

              which is E.164. A format with no `{number}` is dialed as it stands, so

              every number the trunk answers reaches that one number.

              '
            example: +{number}
      - $ref: '#/components/schemas/Timestamps'
    VoiceTrunkCreate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: A human-readable label for this SIP trunk. Mutable, and distinct from the generated wire domain.
          example: Production PBX trunk
        outbound_enabled:
          type: boolean
          default: false
          description: 'Whether the new trunk may place calls. Omit it to create a trunk that does neither direction yet, and enable the ones you want once you know what the trunk is for. The settings below configure outbound, so send this as `true` alongside them.

            '
          example: true
        inbound_enabled:
          type: boolean
          default: false
          description: 'Whether the new trunk may receive calls. Omit it to create a trunk that does neither direction yet. A trunk receives no calls until it also has at least one gateway and at least one number, both added after create.

            '
          example: true
        media_bypass:
          type: boolean
          default: false
          description: 'Whether we take ourselves out of the audio path for calls we forward to this trunk. Omit it to create the trunk with this off, which is what suits equipment behind NAT and any account that wants call recording. It is an inbound setting, so `true` is accepted only alongside `inbound_enabled: true`; `false` is always accepted. It can be changed later.

            '
          example: true
        digest_algorithms:
          type: array
          minItems: 1
          description: 'The Digest hash algorithms to offer, in the order they should be offered. Omit this to use the default of `["SHA-256", "MD5"]`, which suits most equipment. Send `["MD5"]` for a PBX that only implements MD5 and rejects or ignores a challenge offering SHA-256 first. This can be changed later without re-issuing credentials.

            '
          items:
            $ref: '#/components/schemas/VoiceSIPDigestAlgorithm'
          example:
          - MD5
        session_credentials_enabled:
          type: boolean
          default: false
          description: 'Whether a session credential may be used to connect to this trunk from a web browser, the CLI or MCP. Omit it to create the trunk with this off, which is what a trunk reached only by a PBX wants. It can be changed later.

            '
          example: true
    VoiceTrunkGatewayUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'A change to the gateway''s address, its place in the order, or how it wants numbers spelled. Every field is optional; an omitted field is left unchanged.

        '
      properties:
        sip_uri:
          type: string
          minLength: 1
          maxLength: 512
          description: 'SIP URI an inbound call to this trunk should be forwarded to. Give the host only, with an optional port: which number is dialed there comes from `destination_format`, so a URI carrying a user part is rejected.

            '
          example: sip:pbx.example.com:5060
        priority:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: 'The order gateways are tried in, lowest first. Give two gateways the same priority to share calls between them evenly.

            '
          example: 0
        origination_format:
          type: string
          maxLength: 64
          description: 'How this gateway wants the calling number spelled, as a template whose

            `{number}` stands for the number without its leading `+`. The result is

            stated in the `P-Asserted-Identity` header of the delivered call.


            Send an empty string to go back to E.164, which is `+{number}`. The template

            may add digits, letters and the characters `-_.!~*''()&=+$,;?/%#` around

            `{number}`, which may appear at most once, and anything else in braces is

            rejected so a misspelled placeholder cannot reach a call.


            A format with no `{number}` at all states the same identity on every call,

            which is what a peer that only accepts one authorized number wants. The

            call then carries nothing about who really called.

            '
          example: +{number}
        destination_format:
          type: string
          maxLength: 64
          description: 'How this gateway formats the dialed number. In the template, `{number}`

            represents the number without its leading `+`. The result is placed before

            the `sip_uri` host. For example, `1234#{number}` formats `+31201234567` as

            `sip:1234#31201234567@pbx.example.com:5060`.


            Send an empty string to go back to E.164, which is `+{number}`. A format

            with no `{number}` at all sends every number this trunk answers to one fixed

            number, so `777000447973` reaches `sip:777000447973@pbx.example.com:5060`

            whatever was dialed. The same rules as `origination_format` apply to what

            the template may contain.

            '
          example: 1234#{number}
    VoiceSessionCredential:
      type: object
      description: 'A short-lived SIP digest credential for a calling client. The `password` is returned once and cannot be recovered. Create a new credential if you lose it.

        '
      additionalProperties: false
      required:
      - username
      - password
      - realm
      - expires_at
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 'SIP digest username. Always `bird`. The credential identifies the workspace through `realm`. The username does not identify the workspace.

            '
          example: bird
        password:
          type: string
          minLength: 1
          maxLength: 128
          x-sensitive: true
          description: 'SIP digest password, returned once. Treat it as a bearer secret: until it expires it can place calls billed to this workspace.

            '
          example: 8Kx2mQ7pR4tYvB9nL3sW6dF1gH5jC0aZ
        realm:
          type: string
          minLength: 1
          maxLength: 253
          description: 'SIP digest realm to authenticate against. Workspace-scoped, so a credential minted for one workspace cannot authenticate against another.

            '
          example: 01ARZ3NDEKTSV4RRFFQ69G5FAV.sip.bird.com
        expires_at:
          type: string
          format: date-time
          minLength: 1
          description: When the credential stops authenticating, five minutes after creation. Existing calls may continue; use a fresh credential for later authentication.
          example: '2026-07-30T12:05:00Z'
        handshake_token:
          type: string
          minLength: 1
          maxLength: 4096
          x-sensitive: true
          description: 'Short-lived token required when upgrading the WebSocket connection. The token authorizes the connection only; each call still authenticates with `password`.

            '
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODU0NDMwMzV9.fp1xWxROEmgCafwiJ-ZHbZg9cIdYC-wLGcH-5gIVbco
    VoiceTrunkCore:
      type: object
      description: A SIP trunk's identity and access-control settings.
      required:
      - id
      - workspace_id
      - name
      - domain
      - outbound_enabled
      - inbound_enabled
      - media_bypass
      - ip_acls
      - allowed_api_key_ids
      - ineligible_api_key_ids
      - digest_algorithms
      - session_credentials_enabled
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/SIPTrunkID'
          description: Unique identifier for this SIP trunk.
        workspace_id:
          readOnly: true
          $ref: '#/components/schemas/WorkspaceID'
        name:
          type: string
          minLength: 1
          description: A human-readable label for this SIP trunk. Mutable, and distinct from the generated wire domain.
          example: Production PBX trunk
        domain:
          type: string
          minLength: 1
          readOnly: true
          description: 'Full SIP address for this trunk, generated as `{trunk-id}.trunk.{region}.sip.bird.com`. This is the trunk''s identity, so configure your PBX or SIP client to send calls to this address. It is derived from the trunk id and cannot be chosen or changed.

            '
          example: 01kxp5bb9qf878642atrf0xy5r.trunk.eu1.sip.bird.com
        outbound_enabled:
          type: boolean
          readOnly: true
          description: 'Whether this trunk may place calls: your PBX connects to us to dial out. Off on a new trunk. While it is off the trunk refuses every call attempt no matter what its allow lists say, and the connection and authentication settings below have no effect. Set `outbound_enabled` through the trunk update operation.

            '
        inbound_enabled:
          type: boolean
          readOnly: true
          description: 'Whether this trunk may receive calls: we dial the addresses you declared, for the numbers this trunk answers. Off on a new trunk. Turning it off resets number routes that use this trunk to reject incoming calls. Turning it back on does not restore those routes. Set `inbound_enabled` through the trunk update operation.

            '
        media_bypass:
          type: boolean
          readOnly: true
          description: 'Whether we take ourselves out of the audio path for calls we forward to this trunk: your equipment and the originating carrier exchange audio directly, and only the call signalling passes through us. Off by default. It applies to inbound calls alone (calls this trunk places are always carried through us, whatever this says). While it is on we cannot record those calls, report their audio quality, or end one because its audio stopped. Your equipment must be reachable for audio from the public internet. Set `media_bypass` through the trunk update operation.

            '
        ip_acls:
          type: array
          readOnly: true
          description: 'The trunk''s IP allow list. IP filtering is active whenever this has at least one entry: calls admitted through the allow lists must come from those CIDR ranges. This restriction does not apply to session credentials when `session_credentials_enabled` is true. An empty list means no IP restriction. Replace the whole `ip_acls` list through the trunk update operation.

            '
          items:
            $ref: '#/components/schemas/VoiceTrunkIPACL'
        allowed_api_key_ids:
          type: array
          readOnly: true
          description: 'The API keys allowed to authenticate this trunk over SIP Digest. A key must hold `voice` at write level and be neither revoked nor expired to authenticate. `ineligible_api_key_ids` names the entries that currently cannot. A nonempty list enables API-key authentication, limited to its eligible keys. An empty list means no API-key authentication. A trunk with empty `ip_acls` and `allowed_api_key_ids` lists accepts nothing when `session_credentials_enabled` is false. Replace the whole `allowed_api_key_ids` list through the trunk update operation.

            '
          items:
            $ref: '#/components/schemas/APIKeyID'
        ineligible_api_key_ids:
          type: array
          readOnly: true
          description: 'The entries in `allowed_api_key_ids` that cannot authenticate this trunk right now because the key lacks `voice` at write level, has expired, or was revoked. The bindings remain until you remove them from the trunk. Restoring `voice` at write level makes a key eligible again if it is still unexpired and unrevoked, without changing its secret or trunk binding. Empty when every allowed key can authenticate.

            '
          items:
            $ref: '#/components/schemas/APIKeyID'
        digest_algorithms:
          type: array
          readOnly: true
          minItems: 1
          description: 'The Digest hash algorithms this trunk offers, in the order they are offered. We send one challenge line per algorithm and your PBX answers with the first it supports, so the order decides what most equipment picks. Always populated: a trunk with no explicit setting reports the default, `["SHA-256", "MD5"]`. A trunk answering with an algorithm that is not on this list is rejected, so narrowing the list also narrows what the trunk accepts. Replace `digest_algorithms` through the trunk update operation.

            '
          items:
            $ref: '#/components/schemas/VoiceSIPDigestAlgorithm'
          example:
          - SHA-256
          - MD5
        session_credentials_enabled:
          type: boolean
          readOnly: true
          description: 'Whether a session credential may be used to connect to this trunk from a web browser, the CLI or MCP, alongside whatever the allow lists admit. Off by default. It grants nothing on its own: a call still has to present a credential issued to this workspace, and each one expires within minutes. Set `session_credentials_enabled` through the trunk update operation.

            '
    SortOrder:
      type: string
      enum:
      - asc
      - desc
      description: Sort direction, ascending or descending.
  parameters:
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: Cursor from the `prev_cursor` or `refresh_cursor` field of a previous list response. Returns items immediately before the cursor position in the current sort order. `prev_cursor` returns the preceding page. `refresh_cursor` anchors at the first row of that response, which on a newest-first sort is how to fetch the items that have appeared since.
      schema:
        type: string
    PaginationLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OrderDesc:
      name: order
      in: query
      required: false
      description: 'Sort direction. Defaults to `desc`, which sorts from newest to oldest or largest to smallest, depending on the selected sort field.

        '
      schema:
        $ref: '#/components/schemas/SortOrder'
        default: desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Client-supplied key. On operations supporting request deduplication, a retained\nresponse is replayed for duplicate requests with the same key within the\nidempotency window (3 hours by default). This protection requires a workspace,\norganization, or staff-account scope. User-only and unscoped unauthenticated operations,\nstreams, and operations with a separate replay contract do not use this\nresponse replay.\n\nOn a supported operation, if idempotency protection is unavailable before execution, the API returns\n`503 IdempotencyUnavailable` (E01033) without executing this attempt. Retry with\nbackoff using the same key and request. An operation that takes effect before\nits response is retained can still execute again on retry.\n\nTwo distinct 409 errors signal misuse:\n\n- `request_in_progress` (E01004): The same key is currently being\n  processed by a concurrent request. Wait briefly and retry. The lock expires within 30 seconds.\n- `idempotency_key_reuse` (E01005): The same key has already completed\n  against a different request body or method. Generate a new key.\n\nRecommended key format is `<event-type>/<entity-id>` (for example `welcome-user/usr_abc123`).\n"
      schema:
        type: string
        maxLength: 255
    XWorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace context for the request. Required for dashboard authentication and master keys. Workspace keys and access tokens already identify their workspace; send that workspace or omit the header. A different one is rejected.
      schema:
        type: string
        pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: Cursor from the `next_cursor` field of a previous list response. Returns items immediately after the cursor position in the current sort order.
      schema:
        type: string
    XOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Organization context for the request. Required for dashboard authentication. An API key or access token carries its own organization, so send either that organization or no header at all; a different one is rejected.
      schema:
        type: string
        pattern: ^org_[0-9a-hjkmnp-tv-z]{26}$
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    IdempotencyReplay:
      description: The API includes this header when it replays the response for an earlier request that used the same `Idempotency-Key`. The API does not process the request again.
      schema:
        type: string
        enum:
        - 'true'
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
  responses:
    ServiceUnavailable:
      description: 'The service is temporarily unavailable. If `Retry-After` is present, wait for that delay before retrying; otherwise, retry with exponential backoff. Reuse the same idempotency key and request when retrying a mutation.

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: Precondition failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Workspace

        keys use `bk_{region}_*`; organization master keys use `bm_{region}_*`.

        The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
