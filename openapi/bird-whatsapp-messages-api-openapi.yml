          description: Where the contact works.
        birthday:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: 'The contact''s birthday, as `YYYY-MM-DD`. WhatsApp rejects any other shape, and a date no calendar holds is rejected too.

            '
          example: '1999-01-23'
        phone_numbers:
          type: array
          maxItems: 10
          description: 'The numbers on the card. A number in E.164 renders a button that opens a WhatsApp chat with it; one that is not renders an invite instead.

            '
          items:
            $ref: '#/components/schemas/WhatsAppContactPhoneSend'
        emails:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/WhatsAppContactEmailSend'
        urls:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/WhatsAppContactUrlSend'
        addresses:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/WhatsAppContactAddressSend'
      example:
        name:
          formatted_name: Barbara J. Johnson
          first_name: Barbara
          last_name: Johnson
        phone_numbers:
        - phone_number: '+16505551234'
          type: Mobile
    WhatsAppInteractiveHeaderSend:
      type: object
      additionalProperties: false
      required:
      - type
      description: 'What to show above an interactive message''s body. `type` names the kind and the field that carries it: `text` for a line of copy, `url` for the file every other kind shows, the same pairing a template''s `parameters` use. A `list` accepts a `text` header only, and any other kind on it is refused.

        '
      oneOf:
      - properties:
          type:
            const: text
          url:
            not: {}
        required:
        - type
        - text
      - properties:
          type:
            enum:
            - image
            - video
            - document
          text:
            not: {}
        required:
        - type
        - url
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveHeaderTypeWrite'
          description: Which kind of header this is, and which field carries it.
        text:
          type: string
          minLength: 1
          maxLength: 60
          description: A single line of text above the body. Send it on a `text` header.
          example: New workshop dates announced
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the file to show. Send it on an `image`, `video` or `document` header. An image must be JPEG or PNG, up to 5 MB; a video, MP4 with H.264 video and AAC audio, up to 16 MB; a document, up to 100 MB, and PDF, Word, Excel, PowerPoint and plain text render reliably in the WhatsApp client while other file types are transmitted but unsupported. WhatsApp fetches it at send time, so it must still be reachable then: a signed URL has to outlive the send. We do not store or proxy the file. WhatsApp caches a fetched URL for 10 minutes and re-serves that copy for an identical URL sent again within the window; vary the URL to force a re-fetch.

            '
          example: https://cdn.example.com/banners/workshop.png
      example:
        type: image
        url: https://cdn.example.com/banners/workshop.png
    WhatsAppContactUrl:
      type: object
      additionalProperties: false
      description: One website on a shared contact card.
      properties:
        url:
          type: string
          description: 'The address as the card holds it, which is often bare rather than a full URL, so it is passed through as text rather than validated.

            '
          example: luckyshrub.example.com
        type:
          type: string
          description: 'The label attached to this value, for example `CELL`, `Home` or `iPhone`. Free text: WhatsApp defines no vocabulary. A label on a received card is lowercased; one this workspace sent reads back exactly as sent.

            '
          example: Company
    WhatsAppInteractiveReplyType:
      type: string
      minLength: 1
      x-extensible-enum:
      - button
      - list
      description: "Which kind of tap the reply came from.\n\n- `button`: a reply button on an interactive message, or a quick-reply\n  button on a template. Both carry an identifier and a label, so they read\n  the same way.\n- `list`: a row chosen from a list's menu. Only this kind carries a\n  `description`.\n\nOpen enum: WhatsApp adds interactive kinds over time, so treat an\nunrecognized value as a future kind rather than an error.\n"
      example: button
    WhatsAppMedia:
      type: object
      description: Fields shared by every media content object on a WhatsApp message.
      properties:
        id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppFileID'
          description: 'ID of the stored file, to pass as `media_id` when fetching it. Absent on an outbound message, whose file we never stored.

            '
        url:
          type: string
          format: uri
          description: 'Where to fetch the media. On an inbound message this is a Bird URL you fetch with your API key; it is absent when the file could not be retrieved from WhatsApp. It stays populated after the stored bytes expire, and the link returns `410` from then on. On an outbound message it is the URL the sender supplied, whose availability is the sender''s to guarantee.

            '
          example: https://platform.bird.com/v1/whatsapp/messages/wam_01kya19eknftrs2s6p82asmvnh/media/waf_01kyb2m4xq7whs0d8n3prv6tez
        mime_type:
          type: string
          description: 'Media type WhatsApp reported for the file, for example `image/jpeg`. Absent on outbound messages.

            '
          example: image/jpeg
    WhatsAppContactPhone:
      type: object
      additionalProperties: false
      description: One phone number on a shared contact card.
      properties:
        phone_number:
          type: string
          description: 'The number as the card holds it, normalized to E.164 where we can parse it. A card is whatever the contact''s device stored, so a number that no country''s numbering plan accepts, an extension among them, is passed through exactly as it arrived rather than dropped. Parse defensively: most values are E.164 and none is guaranteed to be.

            '
          example: '+16505551234'
        type:
          type: string
          description: 'The label attached to this value, for example `CELL`, `Home` or `iPhone`. Free text: WhatsApp defines no vocabulary. A label on a received card is lowercased; one this workspace sent reads back exactly as sent.

            '
          example: CELL
    WhatsAppReadReceipt:
      type: object
      additionalProperties: false
      required:
      - typing_indicator
      description: 'The acknowledgement Bird accepted. There is no status to poll afterwards: WhatsApp reports nothing about a read receipt.

        '
      properties:
        typing_indicator:
          type: boolean
          description: Whether a typing indicator was requested alongside the read receipt.
          example: true
    WhatsAppContactNameSend:
      type: object
      additionalProperties: false
      description: 'The contact''s name. `formatted_name` is what the card shows, and WhatsApp additionally requires at least one of the parts below it, so a card carrying only a formatted name is rejected.

        '
      required:
      - formatted_name
      properties:
        formatted_name:
          type: string
          minLength: 1
          maxLength: 256
          description: The whole name, as the card should render it.
          example: Barbara J. Johnson
        first_name:
          type: string
          maxLength: 256
          example: Barbara
        middle_name:
          type: string
          maxLength: 256
          example: Joana
        last_name:
          type: string
          maxLength: 256
          example: Johnson
        prefix:
          type: string
          maxLength: 64
          example: Dr.
        suffix:
          type: string
          maxLength: 64
          example: Esq.
    LanguageTag:
      type: string
      minLength: 2
      maxLength: 35
      description: A language tag in BCP-47 form, for example `en` or `pt-BR`.
      example: pt-BR
    WhatsAppMessageTemplateComponentParameter:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppTemplateParameterType'
          description: The kind of value this parameter carries, which decides which of the fields below to send.
        text:
          type: string
          minLength: 1
          description: The value substituted into the placeholder, as a plain string. Send it on a `text` parameter.
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the file a media header shows. Send it on an `image`, `video`, `gif` or `document` parameter. WhatsApp fetches it at send time, so it must still be reachable then, the same way a free-form media message''s `url` must.

            '
          example: https://cdn.example.com/receipts/a1b2c3.png
        location:
          allOf:
          - $ref: '#/components/schemas/WhatsAppLocationSend'
          description: The point on the map a location header opens. Send it on a `location` parameter.
        name:
          type: string
          minLength: 1
          description: 'Required when the template declares named parameters: the placeholder this value fills (for example `first_name`), matching exactly one of the names the template declares. Name every parameter in that case; order does not matter once names are supplied. Omit this field for a positional template, which takes its values in `{{n}}` order instead. Sending the wrong set of names, or leaving one out that the template requires, returns a `422` `WhatsAppTemplateParameterMismatch`.

            '
    WhatsAppDocumentSend:
      type: object
      additionalProperties: false
      required:
      - url
      description: 'A free-form document to send, with an optional caption and filename. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the document. WhatsApp fetches it at send time, so it must still be reachable then: a signed URL has to outlive the send. We do not store or proxy the file. WhatsApp caches a fetched URL for 10 minutes and re-serves that copy for an identical URL sent again within the window; vary the URL to force a re-fetch. Up to 100 MB. PDF, Word, Excel, PowerPoint and plain text render reliably in the WhatsApp client; other file types are transmitted but WhatsApp does not support them.

            '
          example: https://cdn.example.com/invoices/a1b2c3.pdf
        caption:
          type: string
          maxLength: 1024
          description: Text shown beneath the document.
          example: Your invoice for order A1B2C3
        filename:
          type: string
          minLength: 1
          maxLength: 100
          description: 'Name the recipient sees, including the extension. WhatsApp derives one from the URL when you omit it.

            '
          example: invoice-a1b2c3.pdf
      example:
        url: https://cdn.example.com/invoices/a1b2c3.pdf
        caption: Your invoice for order A1B2C3
        filename: invoice-a1b2c3.pdf
    WhatsAppEventType:
      type: string
      minLength: 1
      description: "Message timeline event type:\n\n- `whatsapp.accepted`: The API accepted the request.\n- `whatsapp.sent`: The message reached the WhatsApp network.\n- `whatsapp.delivered`: Delivery to the recipient's device was confirmed.\n- `whatsapp.read`: The message was read. On an outbound message the recipient\n  opened it; on an inbound one Bird acknowledged it to WhatsApp for the\n  business, which is what a read receipt records.\n- `whatsapp.failed`: Delivery failed permanently.\n- `whatsapp.rejected`: The message was refused before sending and not charged.\n- `whatsapp.received`: An inbound message arrived from the contact.\n\nThis is an open enum. Accept unrecognized values.\n"
      x-extensible-enum:
      - whatsapp.accepted
      - whatsapp.delivered
      - whatsapp.failed
      - whatsapp.read
      - whatsapp.received
      - whatsapp.rejected
      - whatsapp.sent
      example: whatsapp.delivered
    WhatsAppInteractiveQuickReplyButtonSend:
      type: object
      additionalProperties: false
      required:
      - slug
      - text
      description: 'One tappable reply button. Tapping it sends `slug` back as an inbound message, which reads as an `interactive_reply`.

        '
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 256
          description: 'Your own handle for this button, echoed back on the reply. You choose the value and it is never shown to the recipient, so it can carry whatever your application needs to route the answer. Any characters, up to 256.

            '
          example: change-booking
        text:
          type: string
          minLength: 1
          maxLength: 20
          description: 'The button''s label. It must differ from every other button''s label in the same message, because the recipient''s reply is identified to them by the label they tapped.

            '
          example: Change
      example:
        slug: change-booking
        text: Change
    WhatsAppMessageTemplateCard:
      type: object
      additionalProperties: false
      required:
      - components
      description: 'The values that fill one card of a carousel. Cards fill in the order the template was approved with, so send one entry per card and keep them in that order.

        '
      properties:
        components:
          type: array
          description: The values that fill this card's blocks.
          items:
            $ref: '#/components/schemas/WhatsAppMessageTemplateCardComponent'
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: ISO 4217 three-letter currency code.
      example: EUR
    WhatsAppContactOrgSend:
      type: object
      additionalProperties: false
      description: Where the contact works, as the card should record it.
      properties:
        company:
          type: string
          maxLength: 128
          example: Lucky Shrub
        department:
          type: string
          maxLength: 128
          example: Legal
        title:
          type: string
          maxLength: 128
          example: Lead Counsel
    WhatsAppInteractiveListSection:
      type: object
      additionalProperties: false
      required:
      - title
      - rows
      description: One group of options in the menu the message showed.
      properties:
        title:
          type: string
          minLength: 1
          description: The group's heading, shown above its rows.
          example: As soon as possible
        rows:
          type: array
          description: The options in this group, in the order shown.
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveListRow'
    WhatsAppInteractiveHeader:
      type: object
      additionalProperties: false
      required:
      - type
      description: 'What the interactive message showed above its body. `type` names the kind and the field that carries it: `text` for a line of copy, `url` for the file every other kind shows. As on the message itself, the read vocabulary is open: dispatch on `type` and treat an unrecognized value as a header kind added since.

        '
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveHeaderType'
          description: Which kind of header this is, and which field carries it.
        text:
          type: string
          description: The line of text shown above the body.
          example: New workshop dates announced
        url:
          type: string
          format: uri
          description: 'The URL of the file shown above the body, as the send supplied it. Interactive content is outbound only, so Bird neither stores nor proxies the file.

            '
          example: https://cdn.example.com/banners/workshop.png
    WhatsAppTemplateParameterType:
      type: string
      minLength: 1
      x-extensible-enum:
      - text
      - image
      - video
      - gif
      - document
      - location
      description: 'The kind of value a template parameter carries, which follows the block it fills. The `text` type is a plain string substituted into a placeholder. This includes a coupon button''s code, which the recipient copies from the button. The `image`, `video`, `gif`, and `document` types carry a media header''s file in `url`. Each matches its header''s `format`. The `location` type fills a location header and carries a point on the map. Open enum: more kinds may be added over time.

        '
    WhatsAppText:
      type: object
      additionalProperties: false
      description: Text content of a WhatsApp message.
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          description: The message text.
          example: Does it come in another color?
      example:
        body: Does it come in another color?
    WhatsAppMessageTemplateCardComponent:
      type: object
      additionalProperties: false
      required:
      - type
      description: The values that fill one block of one carousel card.
      properties:
        type:
          type: string
          minLength: 1
          x-extensible-enum:
          - header
          - body
          - button
          description: 'Which part of the card this fills in.


            - `header`: the card''s image or video.

            - `body`: its text.

            - `button`: a button''s variable.

            '
          example: header
        parameters:
          type: array
          description: The values that fill this part's placeholders, in placeholder order.
          items:
            $ref: '#/components/schemas/WhatsAppMessageTemplateComponentParameter'
    WhatsAppAudio:
      type: object
      description: 'Audio content of a WhatsApp message.

        '
      allOf:
      - $ref: '#/components/schemas/WhatsAppMedia'
      - type: object
        properties:
          voice:
            type: boolean
            description: 'Whether this is a voice note rather than an attached audio file. A voice note auto-downloads in the WhatsApp client and can be transcribed for the recipient.

              '
            example: true
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    WhatsAppInteractiveHeaderType:
      type: string
      minLength: 1
      x-extensible-enum:
      - text
      - image
      - video
      - document
      description: 'A header''s kind, and which field carries it. Open enum: WhatsApp adds header kinds over time, so treat an unrecognized value as a future kind rather than an error.

        '
      example: image
    WhatsAppInteractiveQuickReplyButton:
      type: object
      additionalProperties: false
      required:
      - slug
      - text
      description: 'A reply button''s label and the handle it carries back. On the echo of a message Bird sent, the pair the send declared; on an inbound `interactive_reply`, the pair the contact tapped. No length is declared here, because a tap can echo a template''s quick-reply button, whose label runs longer than an interactive message''s own allows.

        '
      properties:
        slug:
          type: string
          minLength: 1
          description: 'The handle the button carries back, never shown to the recipient. On a tap on a template''s quick-reply button, it is the payload that template declared.

            '
          example: change-booking
        text:
          type: string
          minLength: 1
          description: The label the recipient saw.
          example: Change
    WhatsAppErrorCode:
      type: string
      minLength: 1
      x-extensible-enum:
      - insufficient_balance
      - price_not_found
      - internal_error
      - undeliverable
      - service_window_expired
      - rate_limited
      - recipient_suppressed
      - media_rejected
      description: 'Standardized failure reason:


        - `insufficient_balance`: The workspace wallet could not fund the send.

        - `price_not_found`: No price was configured for the destination and template.

        - `internal_error`: An unexpected service failure occurred.

        - `undeliverable`: The recipient could not be reached.

        - `service_window_expired`: The 24-hour service window closed; send a template.

        - `rate_limited`: The send was throttled.

        - `recipient_suppressed`: The recipient is on the workspace suppression list.

        - `media_rejected`: WhatsApp could not fetch the media URL, or refused the file it found there; `description` carries its reason.


        This is an open enum. Accept unrecognized values.

        '
    WhatsAppContactOrg:
      type: object
      additionalProperties: false
      description: Where the contact works, as their card records it.
      properties:
        company:
          type: string
          example: Lucky Shrub
        department:
          type: string
          example: Engineering
        title:
          type: string
          example: Software Engineer
    WhatsAppReaction:
      type: object
      additionalProperties: false
      required:
      - emoji
      - from
      description: 'An emoji reaction standing on a message. One entry per sender: reacting again replaces that sender''s entry rather than adding one, and removing a reaction drops it from the list. A one-to-one message therefore carries at most two, one for the contact and one for your business number. This is the folded current state, so it names no single change; the message''s reaction log is what records how each one arrived.

        '
      properties:
        emoji:
          type: string
          minLength: 1
          readOnly: true
          description: 'The emoji, as WhatsApp sent it. It is not normalized, so two emoji that render identically can differ byte for byte and compare unequal.

            '
          example: 👍
        from:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppAddress'
          description: 'Who reacted. On a group message this is what tells one participant''s reaction from another''s. On a one-to-one message it is your business number on a reaction you placed and the contact on one they placed, which is why it is here rather than inferred from the message''s `direction`.

            '
    TemplateSlug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$
      description: 'A template''s slug: what you send it by, for example `welcome-email`. Email and SMS slugs stay fixed after creation. WhatsApp slugs can change only before the first submission. A slug can contain lowercase letters, numbers, hyphens, and underscores, has to start and end with a letter or a number, and can be up to 63 characters long.

        '
      example: welcome-email
    WhatsAppInteractiveHeaderTypeWrite:
      type: string
      minLength: 1
      enum:
      - text
      - image
      - video
      - document
      x-enum-varnames:
      - WhatsAppInteractiveHeaderTypeWriteText
      - WhatsAppInteractiveHeaderTypeWriteImage
      - WhatsAppInteractiveHeaderTypeWriteVideo
      - WhatsAppInteractiveHeaderTypeWriteDocument
      description: 'A header''s kind, and which field carries it. `text` is a line of copy; the rest each show a file whose address you give in `url`. A `list` accepts `text` only, and a carousel card accepts `image` or `video` only. Closed on the write side: a kind Bird cannot send to Meta is rejected rather than accepted and then failed asynchronously.

        '
      example: image
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    WhatsAppMessageTemplate:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'The template a message was sent from. On reads `slug`, `language`, `category`, and `components` are always present; `components` is an empty array for an authentication template (the filled-in values, for example a verification code, are never returned).

        '
      required:
      - slug
      - language
      - category
      - components
      properties:
        slug:
          allOf:
          - $ref: '#/components/schemas/TemplateSlug'
          readOnly: true
          description: The template's stable handle (for example `bird_otp`).
          example: bird_otp
        category:
          allOf:
          - $ref: '#/components/schemas/WhatsAppTemplateCategory'
          readOnly: true
          description: 'The category this message was priced at, recorded as it stood when the message was sent. For a template you authored this is the category Meta applies to the language the send resolved to, which can differ from the category declared on the template: Meta categorizes each language separately and may move one. A built-in `bird_` template is priced at the single category the built-in declares, the same in every language.

            '
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageTag'
          readOnly: true
          description: The canonical BCP-47 tag of the template variant that was sent.
          example: pt-BR
        components:
          type: array
          readOnly: true
          description: 'The values that filled the template''s placeholders. Empty for an authentication template, whose content is never returned.

            '
          items:
            $ref: '#/components/schemas/WhatsAppMessageTemplateComponent'
    WhatsAppMessageTemplateComponent:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          minLength: 1
          x-extensible-enum:
          - header
          - body
          - button
          - carousel
          description: 'Which part of the template this fills in.


            - `body`: the main text.

            - `button`: a button''s variable.

            - `header`: the header''s text, media or location.

            - `carousel`: the cards.

            '
        parameters:
          type: array
          description: 'The values that fill this part''s placeholders. A positional template takes them in `{{n}}` placeholder order; a template with named parameters requires each parameter''s `name` to match one the template declares, and order then carries no meaning. Send it on every part except `carousel`, which carries its values on `cards`. Send no `button` part at all for a button that takes no value, such as a `quick_reply` or `request_contact_info` button, or a `url` button whose address has no placeholder: a part the template has no slot for is refused here, before the message is sent and charged.

            '
          items:
            $ref: '#/components/schemas/WhatsAppMessageTemplateComponentParameter'
        cards:
          type: array
          minItems: 2
          maxItems: 10
          description: 'The values that fill each card of a carousel. Send it only on a `carousel` part. A carousel sends exactly the number of cards its template was approved with, so every card needs an entry.

            '
          items:
            $ref: '#/components/schemas/WhatsAppMessageTemplateCard'
    WhatsAppEventList:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          description: Timeline events for this WhatsApp message, in chronological order. The timeline is bounded and returned in full; this list is not paginated.
          items:
            $ref: '#/components/schemas/WhatsAppEvent'
    WhatsAppReadReceiptRequest:
      type: object
      additionalProperties: false
      description: 'What to acknowledge on the inbound message. An absent body and `{}` mean the same thing: mark the message read and show nothing.

        '
      properties:
        typing_indicator:
          type: boolean
          default: false
          example: true
          description: 'Show a typing indicator to the contact as well as marking the message read. WhatsApp clears it when you send your next message, or after 25 seconds, whichever comes first. Only ask for one if you are about to reply.

            '
    WhatsAppTemplateCategory:
      type: string
      minLength: 1
      x-extensible-enum:
      - authentication
      - utility
      - marketing
      description: 'Meta''s content classification for a template.


        - `authentication`: delivers one-time passcodes.

        - `utility`: delivers transaction-triggered updates (receipts, order status).

        - `marketing`: carries promotional content.


        The category determines the sender number and price. This is an open enum.

        Accept unrecognized values.

        '
    WhatsAppInteractiveCtaUrl:
      type: object
      additionalProperties: false
      required:
      - text
      - url
      description: 'The link button the message offered: its label and the address it opens.

        '
      properties:
        text:
          type: string
          minLength: 1
          description: The button's label.
          example: See dates
        url:
          type: string
          format: uri
          minLength: 1
          description: The address the button opens, as the send supplied it.
          example: https://example.com/workshops?click_id=a1b2c3
    WhatsAppMessage:
      type: object
      additionalProperties: false
      required:
      - id
      - direction
      - from
      - to
      - status
      - created_at
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/WhatsAppMessageID'
          description: 'ID of the message, assigned when the send is accepted. Pass it as `message_id` to the get-message and list-events endpoints.

            '
        direction:
          type: string
          minLength: 1
          readOnly: true
          enum:
          - outbound
          - inbound
          description: Whether the message was sent by the business (`outbound`) or received from the contact (`inbound`).
        from:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppAddress'
          description: Sender of the message. On outbound messages, the business number it was sent from; on inbound, the WhatsApp contact.
        to:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppAddress'
          description: Recipient of the message. On outbound messages, the WhatsApp contact; on inbound, the business number.
        template:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppMessageTemplate'
          description: The template the message was sent from. For authentication templates the filled-in values are not returned.
        text:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppText'
          description: Text the message carried.
        image:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppImage'
          description: Image the message carried.
        video:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppVideo'
          description: Video the message carried.
        audio:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppAudio'
          description: Audio the message carried.
        sticker:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppSticker'
          description: Sticker the message carried.
        document:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppDocument'
          description: Document the message carried.
        location:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppLocation'
          description: Location the message carried.
        contact_cards:
          readOnly: true
          type: array
          description: 'Contact cards on this message: cards the contact shared, either by tapping a button that asked for their number or by sending one from their address book, or the cards this workspace sent.

            '
          items:
            $ref: '#/components/schemas/WhatsAppContactCard'
        interactive:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractive'
          description: 'Interactive content the message carried. Outbound only: a contact cannot send one. A tap on a reply button or a list row reads back as `interactive_reply` on the contact''s inbound message; a `cta_url` link sends nothing back, and the two request kinds are answered by an inbound `location` or `contact_cards` message.

            '
        in_reply_to_message_id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppMessageID'
          description: 'The message this one answers. On an inbound message it is what WhatsApp reports as the reply''s target: a tap on a button or a list row, and equally a text or media message the contact sent as a quoted reply. An outbound message echoes the `in_reply_to_message_id` it was sent with. Absent when the message answers nothing, and absent on an inbound message whose target we cannot match to a message we hold, which is the case for one sent before this workspace started recording them or one already past the 15-day window we keep provider ids for.

            '
        interactive_reply:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveReply'
          description: 'What the contact tapped, on a message answering an interactive message or a template''s quick-reply button. Inbound only.

            '
        unsupported:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppUnsupported'
          description: 'Set when the contact sent content we do not model, naming the WhatsApp content type so the message is not silently empty. Inbound only.

            '
        reactions:
          readOnly: true
          type: array
          description: 'Emoji reactions standing on this message right now, one per sender. Absent when the message has none. A reaction that was replaced by a different emoji, or taken back, is not listed; the message''s reaction log keeps that history. WhatsApp accepts a reaction on a message up to 30 days old, and we keep provider ids for 15, so a reaction placed on a message older than that cannot be matched to it and does not appear here.

            '
          items:
            $ref: '#/components/schemas/WhatsAppReaction'
        status:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppMessageStatus'
        recipient_count:
          type: integer
          minimum: 1
          readOnly: true
          description: 'How many recipients a group send was addressed to, taken when the send

            was accepted. It is the group''s membership at that moment, not its

            membership now: someone joining through the invite link while the message

            is in flight does not receive it and does not change this count.


            Absent on a one-to-one message, along with `delivered_count` and

            `read_count`. A message with one recipient has no fan-out to report, and

            its delivery is what `status`, `delivered_at` and `read_at` already say.

            Absent for the same reason on a group message sent before Bird recorded

            the count, and on a send to a group nobody had joined yet: there is no

            denominator to report, and none can be recovered after the fact, since

            membership has moved on. `to.group_id` is what tells a group message from

            a one-to-one one in every case, including those two. With no denominator

            to resolve against, `status` is read as stored, the way a one-to-one

            message''s is: it reaches `sent` when the message is handed to WhatsApp and

            stops there, because delivery is confirmed per participant and a send with

            no participants collects no confirmations.


            It is also the denominator `status` is resolved against: on a group

            message `status` reports the furthest point *every* recipient has

            reached, so it turns `delivered` only once `delivered_count` equals this

            number, and stays `sent` while some have confirmed and others have not.

            `failed` and `rejected` are never per recipient: there is one hand-off to

            the WhatsApp network and one way for that to be refused. `delivered_at`

            and `read_at` are the first recipient''s, not the last.

            '
        delivered_count:
          type: integer
          minimum: 0
          readOnly: true
          description: 'How many of the `recipient_count` recipients WhatsApp has confirmed the

            message reached. A recipient who reported only a read counts here too:

            WhatsApp skips the delivery receipt when someone is already looking at

            the chat, so waiting for one would leave that person uncounted for ever.


            Absent on a one-to-one message, which has no fan-out to count, and on a

            group message with no `recipient_count` to count against.

            '
        read_count:
          type: integer
          minimum: 0
          readOnly: true
          description: 'How many of the `recipient_count` recipients have opened the message.

            Read receipts do not move `status`, which has no `read` value; they

            surface here and in `read_at`.


            Absent on a one-to-one message, which has no fan-out to count, and on a

            group message with no `recipient_count` to count against.

            '
        last_error:
          $ref: '#/components/schemas/WhatsAppError'
          description: Failure detail for a message that did not reach the recipient. Present only when the message failed or was rejected.
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When the message was accepted for delivery.
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the message was handed to the WhatsApp network. Null until then.
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When delivery was confirmed. Null until then.
        read_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: 'When the message was read. On an outbound message this is the recipient opening it. On an inbound one it is when Bird acknowledged the message to WhatsApp for the business, which a read receipt sets. Null until then.

            '
        cost:
          readOnly: true
          $ref: '#/components/schemas/MessageCost'
          description: What the message cost, split into Bird's charge and any third-party fees passed through. Null on an inbound message, which is never priced, on an outbound message that has not been priced yet, and on one rejected before pricing. The rate depends on the message category and the recipient's country.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: Structured `{name, value}` filter labels applied to this message.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSON metadata stored on the message.
    WhatsAppContactPhoneSend:
      type: object
      additionalProperties: false
      description: One phone number to put on a contact card.
      required:
      - phone_number
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
          description: 'The number to show. Send it in E.164 to get a card the recipient can message from; any other form still renders, with an invite button.

            '
          example: '+16505551234'
        type:
          type: string
          maxLength: 64
          description: 'A label for the number, shown beside it. Free text: WhatsApp defines no vocabulary, and the label is sent exactly as written.

            '
          example: Mobile
    WhatsAppLocationSend:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      description: 'A free-form location to send: a point on the map the recipient can open in their maps app. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude in decimal degrees.
          example: 52.3702
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude in decimal degrees.
          example: 4.8952
        name:
          type: string
          maxLength: 1000
          description: Name of the place, shown above the address.
          example: Bird HQ
        address:
          type: string
          maxLength: 1000
          description: Street address of the place. Shown only when `name` is also set.
          example: Keizersgracht 117, Amsterdam
      example:
        latitude: 52.3702
        longitude: 4.8952
        name: Bird HQ
        address: Keizersgracht 117, Amsterdam
    WhatsAppInteractiveSend:
      type: object
      additionalProperties: false
      required:
      - type
      - body_text
      description: 'An interactive message to send: body text plus something for the recipient to tap. Name the kind in `type` and carry that kind''s field alongside it: `buttons`, `list`, `cta_url` or `cards`. The schema pins each `type` to its own field and bars the other kinds'', so a request carrying a second kind''s field alongside the right one is refused. `location_request_message` and `request_contact_info` name no field: each is a single button asking the recipient for something, so `body_text` is the whole message and every other kind''s field is barred. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      oneOf:
      - properties:
          type:
            const: button
          body_text:
            maxLength: 1024
          buttons:
            items:
              properties:
                type:
                  const: quick_reply
          list:
            not: {}
          cta_url:
            not: {}
          cards:
            not: {}
        required:
        - type
        - buttons
      - properties:
          type:
            const: list
          header:
            properties:
              type:
                const: text
              url:
                not: {}
          buttons:
            not: {}
          cta_url:
            not: {}
          cards:
            not: {}
        required:
        - type
        - list
      - properties:
          type:
            const: cta_url
          body_text:
            maxLength: 1024
          buttons:
            not: {}
          list:
            not: {}
          cards:
            not: {}
        required:
        - type
        - cta_url
      - properties:
          type:
            const: carousel
          body_text:
            maxLength: 1024
          header:
            not: {}
          footer_text:
            not: {}
          buttons:
            not: {}
          list:
            not: {}
          cta_url:
            not: {}
        required:
        - type
        - cards
      - properties:
          type:
            const: location_request_message
          body_text:
            maxLength: 1024
          header:
            not: {}
          footer_text:
            not: {}
          buttons:
            not: {}
          list:
            not: {}
          cta_url:
            not: {}
          cards:
            not: {}
        required:
        - type
      - properties:
          type:
            const: request_contact_info
          body_text:
            maxLength: 1024
          header:
            not: {}
          footer_text:
            not: {}
          buttons:
            not: {}
          list:
            not: {}
          cta_url:
            not: {}
          cards:
            not: {}
        required:
        - type
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveTypeWrite'
          description: Which kind of interactive message this is, and which field carries it.
        header:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveHeaderSend'
          description: 'Optional content above the body. A `list` accepts a `text` header only; `button` and `cta_url` also accept an image, video or document. A `carousel` accepts none: its cards carry their own media. Neither request kind accepts one.

            '
        body_text:
          type: string
          minLength: 1
          maxLength: 4096
          description: 'The message''s main text, required on every kind, and the whole message on `location_request_message` and `request_contact_info`. The WhatsApp client turns any URL it contains into a clickable link. Only a `list` may use the full length; the other kinds cap it at 1024 characters.

            '
          example: Your workshop is scheduled for 9am tomorrow.
        footer_text:
          type: string
          minLength: 1
          maxLength: 60
          description: 'Optional small print below the body and above the buttons. A `carousel` and both request kinds take no footer.

            '
          example: Dates are subject to change.
        buttons:
          type: array
          minItems: 1
          maxItems: 3
          description: 'The buttons to show, in the order given. Send this on a `button` message, where every button is a `quick_reply`. Every label must be unique within the message; a repeat returns a `422` `WhatsAppInteractiveDuplicateLabel`.

            '
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveButtonSend'
        list:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveListSend'
          description: The menu to show. Send this on a `list` message.
        cta_url:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveCtaUrlSend'
          description: The link button to show. Send this on a `cta_url` message.
        cards:
          type: array
          minItems: 2
          maxItems: 10
          description: 'The cards to show, in the order they appear, left to right. Send this on a `carousel` message, with between 2 and 10 cards. The message''s own `body_text` introduces them; a carousel carries no header and no footer of its own.

            '
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveCardSend'
      examples:
      - type: button
        header:
          type: image
          url: https://cdn.example.com/banners/workshop.png
        body_text: Your gardening workshop is scheduled for 9am tomorrow. Use the buttons if you need to reschedule.
        footer_text: Lucky Shrub, your gateway to succulents
        buttons:
        - type: quick_reply
          quick_reply:
            slug: change-booking
            text: Change
        - type: quick_reply
          quick_reply:
            slug: cancel-booking
            text: Cancel
      - type: list
        header:
          type: text
          text: Choose a shipping option
        body_text: Which shipping option do you prefer?
        list:
          button_text: Shipping options
          sections:
          - title: As soon as possible
            rows:
            - slug: priority_express
              text: Priority Mail Express
              description: Next day to 2 days
          - title: I can wait a bit
            rows:
            - slug: ground_advantage
              text: Ground Advantage
              description: 2 to 5 days
      - type: cta_url
        body_text: Tap the button below to see the available dates.
        footer_text: Dates are subject to change.
        cta_url:
          text: See dates
          url: https://example.com/workshops?click_id=a1b2c3
      - type: carousel
        body_text: 'Here are two of our latest arrivals, each under $25:'
        cards:
        - header:
            type: image
            url: https://cdn.example.com/plants/blue-echeveria.jpeg
          body_text: Blue Echeveria. A rosette-shaped succulent with powdery blue leaves.
          buttons:
          - type: cta_url
            cta_url:
              text: Buy now
              url: https://shop.example.com/blue-echeveria
        - header:
            type: image
            url: https://cdn.example.com/plants/zebra-haworthia.jpeg
          body_text: Zebra Haworthia. Striking white stripes on deep green leaves.
          buttons:
          - type: cta_url
            cta_url:
              text: Buy now
              url: https://shop.example.com/zebra-haworthia
      - type: location_request_message
        body_text: Let's start with your pickup. Share your current location, or type an address instead.
      - type: request_contact_info
        body_text: To confirm your booking we need a number to reach you on. Tap below to share yours.
    WhatsAppReactionAccepted:
      type: object
      additionalProperties: false
      readOnly: true
      required:
      - id
      - emoji
      description: 'A reaction as accepted, which WhatsApp has not applied yet and may still refuse. It names the reaction-log entry the request created, so a caller that places two changes on one message can tell which entry is which; read the message''s `reactions` for what currently stands, or its reaction log for what became of this one.

        '
      properties:
        id:
          $ref: '#/components/schemas/WhatsAppReactionEventID'
          description: 'ID of the reaction-log entry this request created, matching the `id` that entry carries in [List reaction events for a WhatsApp message](/docs/api/reference/list-whatsapp-message-reaction-events).

            '
        emoji:
          type: string
          minLength: 1
          description: The emoji as accepted, echoing the one the request carried.
          example: 👍
    MessageCost:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - amount
      - currency_code
      - transaction_amount
      - passthrough_amount
      description: 'What was charged for a message, split into the components that make it up. `null` until at least one component has been priced.

        '
      properties:
        amount:
          type: string
          minLength: 1
          readOnly: true
          description: 'Total charged, as a decimal string: the sum of the components below. Net of tax, which applies to your wallet balance rather than to an individual charge.

            '
          example: '0.00990'
        currency_code:
          readOnly: true
          $ref: '#/components/schemas/CurrencyCode'
          description: ISO 4217 currency code. Every component is denominated in this currency.
          example: USD
        transaction_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to carry the message, as a decimal string. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00790'
        passthrough_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Third-party fees we pass on, as a decimal string, such as US 10DLC carrier surcharges. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00200'
    WhatsAppInteractiveCardHeaderSend:
      type: object
      additionalProperties: false
      required:
      - type
      - url
      description: 'The media at the top of a carousel card. Every card must carry one, and it must be an image or a video: a card takes no text or document header.

        '
      oneOf:
      - properties:
          type:
            const: image
      - properties:
          type:
            const: video
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveHeaderTypeWrite'
          description: 'Which kind of media this is. A card accepts `image` or `video` only.

            '
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the file to show at the top of the card. An image must be JPEG or PNG, up to 5 MB; a video, MP4 with H.264 video and AAC audio, up to 16 MB. WhatsApp fetches it at send time, on the same terms as a message header''s `url`.

            '
          example: https://cdn.example.com/plants/blue-echeveria.jpeg
      example:
        type: image
        url: https://cdn.example.com/plants/blue-echeveria.jpeg
    WhatsAppInteractiveCard:
      type: object
      additionalProperties: false
      required:
      - header
      - buttons
      description: One card the carousel showed, in the position it appeared in.
      properties:
        header:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveHeader'
          description: The image or video shown at the top of the card.
        body_text:
          type: string
          description: The card's own text. Absent when the card carried none.
          example: '*Blue Echeveria*'
        buttons:
          type: array
          description: The buttons the card offered, in the order shown.
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveButton'
    WhatsAppError:
      type:
      - object
      - 'null'
      additionalProperties: false
      readOnly: true
      required:
      - code
      - description
      - occurred_at
      description: Failure detail for a message that could not be delivered or was rejected.
      properties:
        code:
          $ref: '#/components/schemas/WhatsAppErrorCode'
        description:
          type: string
          minLength: 1
          readOnly: true
          description: Human-readable explanation of the failure.
          example: Message could not be delivered.
        meta_error_code:
          type:
          - string
          - 'null'
          readOnly: true
          description: Raw error code from the WhatsApp Cloud API, when available, for low-level debugging.
          example: '131026'
        occurred_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When the failure occurred.
    WhatsAppInteractiveListRow:
      type: object
      additionalProperties: false
      required:
      - slug
      - text
      description: 'One option in a list''s menu. On the echo of a message Bird sent, the row as declared; on an inbound `interactive_reply`, the row the contact chose. No length is declared here: this is what WhatsApp reported, not what a send is held to.

        '
      properties:
        slug:
          type: string
          minLength: 1
          description: The handle the row carries back, never shown to the recipient.
          example: priority_express
        text:
          type: string
          minLength: 1
          description: The row's label, shown as its title in the menu.
          example: Priority Mail Express
        description:
          type: string
          description: The second line under the label. Absent when the row carried none.
          example: Next day to 2 days
    WhatsAppMessageStatus:
      type: string
      minLength: 1
      enum:
      - scheduled
      - accepted
      - sent
      - delivered
      - failed
      - rejected
      - canceled
      - received
      description: 'Delivery status:


        - `accepted`: Accepted and queued for sending.

        - `sent`: Handed to the WhatsApp network.

        - `delivered`: Confirmed as delivered to the recipient''s device.

        - `failed`: Permanently failed.

        - `rejected`: Refused before sending and not charged.

        - `received`: Received as an inbound message.

        - `scheduled`: Reserved and not returned.

        - `canceled`: Reserved and not returned.


        Read receipts appear in `read_at` and `whatsapp.read` events, in both

        directions: the recipient opening an outbound message, and the business

        acknowledging an inbound one.

        '
    WhatsAppInteractiveButton:
      type: object
      additionalProperties: false
      required:
      - type
      description: 'One button the message offered. The field named by `type` is the one that is present. As on the message itself, the read vocabulary is open: dispatch on `type` and treat an unrecognized value as a button kind added since.

        '
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveButtonType'
          description: Which kind of button this is, and which field carries it.
        quick_reply:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveQuickReplyButton'
          description: The button's label and the handle it sends back.
        cta_url:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveCtaUrl'
          description: The button's label and the address it opens.
    WhatsAppContactName:
      type: object
      additionalProperties: false
      description: 'The contact''s name, in the parts their device supplied. Every part is optional: WhatsApp sends what the card holds and omits the rest.

        '
      properties:
        formatted_name:
          type: string
          description: The whole name as the contact's device renders it.
          example: Barbara J. Johnson
        first_name:
          type: string
          example: Barbara
        middle_name:
          type: string
          example: Joana
        last_name:
          type: string
          example: Johnson
        prefix:
          type: string
          example: Dr.
        suffix:
          type: string
          example: Esq.
    WhatsAppInteractiveTypeWrite:
      type: string
      minLength: 1
      enum:
      - button
      - list
      - cta_url
      - carousel
      - location_request_message
      - request_contact_info
      x-enum-varnames:
      - WhatsAppInteractiveTypeWriteButton
      - WhatsAppInteractiveTypeWriteList
      - WhatsAppInteractiveTypeWriteCtaUrl
      - WhatsAppInteractiveTypeWriteCarousel
      - WhatsAppInteractiveTypeWriteLocationRequestMessage
      - WhatsAppInteractiveTypeWriteRequestContactInfo
      description: "Which kind of interactive message to send.\n\n- `button`: up to three tappable buttons, each sending its own identifier\n  back as an inbound message. Carried in `buttons`.\n- `list`: a single button that opens a menu of rows to choose one from.\n- `cta_url`: a single button that opens a link, so the address stays out of\n  the message body.\n- `carousel`: 2 to 10 media cards the recipient scrolls through sideways,\n  each with its own buttons. Carried in `cards`.\n- `location_request_message`: a single button that asks the recipient to\n  share where they are. A tap arrives as an inbound `location` message.\n- `request_contact_info`: a single button that asks the recipient to share\n  their phone number. A tap arrives as an inbound message carrying the number\n  on `contact_cards`, with `origin` set to `contact_request`.\n\nThe last two name no field of their own: the ask is the whole message, and\n`body_text` is all they carry.\n\nClosed on the write side: a kind Bird cannot send to Meta is rejected rather\nthan accepted and then failed asynchronously.\n"
      example: button
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    WhatsAppInteractiveCardSend:
      type: object
      additionalProperties: false
      required:
      - header
      - buttons
      description: 'One card in a carousel: media at the top, optional text of its own, and the buttons under it. A card has no footer, and its position in `cards` is the position it appears in.

        '
      oneOf:
      - properties:
          buttons:
            maxItems: 1
            items:
              properties:
                type:
                  const: cta_url
      - properties:
          buttons:
            items:
              properties:
                type:
                  const: quick_reply
      properties:
        header:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveCardHeaderSend'
          description: The image or video at the top of the card.
        body_text:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[^\n]*(\n[^\n]*){0,2}$
          description: 'The card''s own text, below its media, with at most two line breaks. Optional: a card can carry media and buttons alone.

            '
          example: '*Blue Echeveria*


            A rosette-shaped succulent with powdery blue leaves.'
        buttons:
          type: array
          minItems: 1
          maxItems: 3
          description: 'The buttons under the card, in the order given. Either one `cta_url` button or up to three `quick_reply` buttons: the two kinds cannot be mixed on one card. Every card in the carousel must carry the same kinds in the same number, and a carousel whose cards disagree returns a `422` `WhatsAppInteractiveCarouselButtonsMismatch`.

            '
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveButtonSend'
    WhatsAppInteractiveCtaUrlSend:
      type: object
      additionalProperties: false
      required:
      - text
      - url
      description: 'A button that opens a link in the recipient''s browser, so a long or opaque address never has to appear in the message body.

        '
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20
          description: The button's label.
          example: See dates
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2000
          description: 'The address the button opens. It is fixed for every recipient, so per recipient tracking belongs in the address you supply, for example as a query parameter you generate per send.

            '
          example: https://example.com/workshops?click_id=a1b2c3
      example:
        text: See dates
        url: https://example.com/workshops?click_id=a1b2c3
    WhatsAppTemplateSend:
      type: object
      additionalProperties: false
      description: 'A send-by-template reference. Identify the template by its `id` or its `slug` (supply exactly one), optionally name a language, and fill its placeholders through `components`.

        '
      oneOf:
      - required:
        - id
      - required:
        - slug
      properties:
        id:
          description: The template to send, by its id.
          $ref: '#/components/schemas/WhatsAppTemplateID'
        slug:
          allOf:
          - $ref: '#/components/schemas/TemplateSlug'
          description: The template to send, by its slug handle (for example `bird_otp`).
          example: bird_otp
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageTag'
          description: 'Which of the template''s languages to send, as a BCP-47 tag (for example `en` or `pt-BR`); Meta''s underscore form (`pt_BR`) is accepted and normalized. Omit it to send the template''s default language, unless the template sets `language_source_required`, in which case a send naming no language is rejected. When the template does not carry the language you ask for, its own `on_missing_language` setting decides whether the closest available language is sent instead or the send is rejected. The accepted message echoes the canonical BCP-47 form of the language it resolved to, which is the language it is priced at: Meta categorizes each language separately, so a send served by a different language than the one you asked for is priced at that language''s category.

            '
          example: pt-BR
        components:
          type: array
          description: 'The values that fill the template''s placeholders: one entry per content block that has placeholders, each carrying its `parameters`. A positional template takes its parameters in `{{n}}` order; a template with named parameters requires each parameter''s `name` to match one the template declares. Either way, sending parameters that do not match what the template declares returns a `422` `WhatsAppTemplateParameterMismatch`.

            '
          items:
            $ref: '#/components/schemas/WhatsAppMessageTemplateComponent'
      examples:
      - id: wat_01ky4x8e4genzb7way45txfkm1
        language: en
        components:
        - type: body
          parameters:
          - type: text
            text: '1234'
        - type: button
          parameters:
          - type: text
            text: '1234'
      - slug: bird_order_confirmation
        language: en
        components:
        - type: body
          parameters:
          - type: text
            name: ref
            text: A1B2C3D4
          - type: text
            name: amount
            text: EUR 49.99
      - slug: bird_otp
        language: en
        components:
        - type: body
          parameters:
          - type: text
            text: '1234'
        - type: button
          parameters:
          - type: text
            text: '1234'
    WhatsAppInteractiveListRowSend:
      type: object
      additionalProperties: false
      required:
      - slug
      - text
      description: 'One option in a list''s menu. Choosing it sends `slug` back as an inbound message, which reads as an `interactive_reply`.

        '
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 200
          description: 'Your own handle for this option, echoed back on the reply. You choose the value and it is never shown to the recipient. Any characters, up to 200.

            '
          example: priority_express
        text:
          type: string
          minLength: 1
          maxLength: 24
          description: 'The option''s label, shown as the row''s title in the menu. It must differ from every other row''s label and from every button''s label in the same message, not merely within its own group; a repeat returns a `422` `WhatsAppInteractiveDuplicateLabel`.

            '
          example: Priority Mail Express
        description:
          type: string
          maxLength: 72
          description: A second line under the label, for detail that will not fit in it.
          example: Next day to 2 days
      example:
        slug: priority_express
        text: Priority Mail Express
        description: Next day to 2 days
    WhatsAppReactionUpsert:
      type: object
      additionalProperties: false
      required:
      - emoji
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 64
          description: 'The emoji to place, as the character itself. Replaces your existing reaction on this message if you have one. To take a reaction back entirely, delete it rather than sending an empty value. WhatsApp takes exactly one emoji, so a value carrying more than one is refused with a `422` rather than sent. The length cap is generous because a single joined emoji is many code points: a couple-kissing one carrying two skin tones is ten, which is why the cap alone cannot express the limit.

            '
          example: 👍
    WhatsAppDocument:
      type: object
      description: 'Document content of a WhatsApp message.

        '
      allOf:
      - $ref: '#/components/schemas/WhatsAppMedia'
      - type: object
        properties:
          caption:
            type: string
            description: Text shown beneath the document. Absent when the sender wrote none.
            example: Signed contract
          filename:
            type: string
            description: The sender's own name for the file.
            example: contract-a1b2c3.pdf
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    WhatsAppContactAddressSend:
      type: object
      additionalProperties: false
      description: One postal address to put on a contact card.
      properties:
        street:
          type: string
          maxLength: 128
          example: 1 Lucky Shrub Way
        city:
          type: string
          maxLength: 128
          example: Menlo Park
        state:
          type: string
          maxLength: 128
          example: CA
        zip:
          type: string
          maxLength: 128
          example: '94025'
        country:
          type: string
          maxLength: 128
          example: United States
        country_code:
          type: string
          maxLength: 128
          description: The country as it should appear on the address, commonly the ISO two-letter code.
          example: US
        type:
          type: string
          maxLength: 64
          description: 'A label for the address, shown beside it. Free text, sent exactly as written.

            '
          example: Office
    WhatsAppUnsupported:
      type: object
      additionalProperties: false
      description: 'A message whose content we do not model, named so it is visible in the message log rather than arriving empty. Inbound only.

        '
      required:
      - type
      properties:
        type:
          type: string
          minLength: 1
          x-extensible-enum:
          - reaction
          - interactive
          - button
          - order
          - system
          - unsupported
          description: 'The WhatsApp content type we did not model. `unsupported` is not a placeholder here: WhatsApp reports its own `unsupported` type for a message its own clients cannot render, and that arrives as this value. Open enum: WhatsApp adds content types over time, so treat an unrecognized value as a future type rather than an error.

            '
          example: reaction
      example:
        type: reaction
    WhatsAppTextSend:
      type: object
      additionalProperties: false
      required:
      - body
      description: 'Free-form text to send. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4096
          description: 'The message text. The WhatsApp client turns any URL it contains into a clickable link.

            '
          example: Your driver is 2 minutes away.
        preview_url:
          type: boolean
          default: false
          description: 'Whether the WhatsApp client renders a preview of the first URL in `body`. A URL must begin with `http://` or `https://`, only the first one is previewed, and the client falls back to a plain link when it cannot fetch a preview. Not returned when the message is read back, because WhatsApp does not report whether a preview rendered.

            '
      example:
        body: 'Your order shipped: https://example.com/track/A1B2C3'
        preview_url: true
    WhatsAppInteractiveListSectionSend:
      type: object
      additionalProperties: false
      required:
      - title
      - rows
      description: 'One group of options in a list''s menu. A menu with a single group still carries a title, which WhatsApp shows above its rows.

        '
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 24
          description: The group's heading, shown above its rows.
          example: As soon as possible
        rows:
          type: array
          minItems: 1
          maxItems: 10
          description: 'The options in this group. A message carries at most 10 rows across all its groups combined, so this per-group maximum is not additive: more than 10 in total returns a `422` `WhatsAppInteractiveLimitExceeded`. Row labels must be unique across the whole message too, not just within a group.

            '
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveListRowSend'
      example:
        title: As soon as possible
        rows:
        - slug: priority_express
          text: Priority Mail Express
          description: Next day to 2 days
    WhatsAppImageSend:
      type: object
      additionalProperties: false
      required:
      - url
      description: 'A free-form image to send, with an optional caption. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the image. WhatsApp fetches it at send time, so it must still be reachable then: a signed URL has to outlive the send. We do not store or proxy the file. WhatsApp caches a fetched URL for 10 minutes and re-serves that copy for an identical URL sent again within the window; vary the URL to force a re-fetch. JPEG and PNG only, up to 5 MB.

            '
          example: https://cdn.example.com/receipts/a1b2c3.png
        caption:
          type: string
          maxLength: 1024
          description: Text shown beneath the image.
          example: Your receipt for order A1B2C3
      example:
        url: https://cdn.example.com/receipts/a1b2c3.png
        caption: Your receipt for order A1B2C3
    WhatsAppReactionEventList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            description: Changes to this message's reactions, newest first.
            items:
              $ref: '#/components/schemas/WhatsAppReactionEvent'
      - $ref: '#/components/schemas/_ListEnvelope'
  headers:
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    IdempotencyReplay:
      description: The API includes this header when it replays the response for an earlier request that used the same `Idempotency-Key`. The API does not process the request again.
      schema:
        type: string
        enum:
        - 'true'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Client-supplied key. On operations supporting request deduplication, a retained\nresponse is replayed for duplicate requests with the same key within the\nidempotency window (3 hours by default). This protection requires a workspace,\norganization, or staff-account scope. User-only and unauthenticated operations,\nstreams, and operations with a separate replay contract do not use this\nresponse replay.\n\nOn a supported operation, if idempotency protection is unavailable before execution, the API returns\n`503 IdempotencyUnavailable` (E01033) without executing this attempt. Retry with\nbackoff using the same key and request. An operation that takes effect before\nits response is retained can still execute again on retry.\n\nTwo distinct 409 errors signal misuse:\n\n- `request_in_progress` (E01004): The same key is currently being\n  processed by a concurrent request. Wait briefly and retry. The lock expires within 30 seconds.\n- `idempotency_key_reuse` (E01005): The same key has already completed\n  against a different request body or method. Generate a new key.\n\nRecommended key format is `<event-type>/<entity-id>` (for example `welcome-user/usr_abc123`).\n"
      schema:
        type: string
        maxLength: 255
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: Cursor from the `next_cursor` field of a previous list response. Returns items immediately after the cursor position in the current sort order.
      schema:
        type: string
    PaginationLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CreatedAfter:
      name: created_after
      in: query
      required: false
      description: Limits the response to resources created at or after this timestamp. Combine it with `created_before` to select a time window. Use an RFC 3339 timestamp with a timezone offset.
      schema:
        type: string
        format: date-time
        example: '2026-05-01T00:00:00Z'
    CreatedBefore:
      name: created_before
      in: query
      required: false
      description: Limits the response to resources created before this timestamp. Combine it with `created_after` to select a time window. Use an RFC 3339 timestamp with a timezone offset.
      schema:
        type: string
        format: date-time
        example: '2026-06-01T00:00:00Z'
    TagFilter:
      name: tag
      in: query
      required: false
      description: 'Filter by tag. Accepts `name` to match any record carrying that tag name, or `name:value` to match a specific tag pair (for example `category:welcome`). Repeat the parameter to add more tags. A record must match every tag listed to be returned.

        '
      schema:
        type: array
        items:
          type: string
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: Cursor from the `prev_cursor` or `refresh_cursor` field of a previous list response. Returns items immediately before the cursor position in the current sort order. `prev_cursor` returns the preceding page. `refresh_cursor` anchors at the first row of that response, which on a newest-first sort is how to fetch the items that have appeared since.
      schema:
        type: string
  responses:
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: The resource existed but is no longer available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 'The service is temporarily unavailable. If `Retry-After` is present, wait for that delay before retrying; otherwise, retry with exponential backoff. Reuse the same idempotency key and request when retrying a mutation.

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Insufficient balance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Keys use

        the format `bk_{region}_*`. The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
