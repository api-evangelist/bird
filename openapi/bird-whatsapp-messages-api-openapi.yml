openapi: 3.2.0
info:
  title: Bird Whatsapp Messages API
  version: 1.0.0
  description: 'The Bird API: one REST API for email, SMS, WhatsApp, verification, and

    Realtime.'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: whatsapp-messages
  description: Send WhatsApp messages, whether a template, free-form content, or interactive content the recipient can tap, and read the messages your workspace sent and received, including their current delivery status and lifecycle events.
paths:
  /v1/whatsapp/messages:
    get:
      operationId: listWhatsAppMessages
      x-snippet-key: whatsapp.list
      summary: List WhatsApp messages
      description: 'Returns the workspace''s WhatsApp messages as a cursor-paginated list,

        newest first, outbound and inbound alike. Each message carries the one

        content object it was built from: `template`, or free-form `text`,

        `image`, `video`, `audio`, `sticker`, `document`, `location`,

        `interactive` or `contact_cards`. An inbound message carries

        `interactive_reply` when the contact tapped a reply button or a list row,

        on an interactive message or on a template''s quick reply. An inbound

        message whose content WhatsApp models and we do not carries `unsupported`

        instead, naming the type rather than reading back empty.

        Filter by direction, status, recipient (`to`), sender (`from`),

        business-scoped user ID (`bsuid`), group (`group_id`), template category,

        tag, or creation

        time. `to` and `from` name the same ends of the message the response

        does, and each accepts an E.164 phone number or a business-scoped user

        ID. Pair either with `direction` to search a single side of the message.

        Neither matches a group, so `group_id` is what narrows the list to one

        group''s messages.

        Pass the response''s `next_cursor` back as

        `starting_after` to fetch the next page. To follow a single message''s

        delivery, use

        Get a WhatsApp message

        instead.


        Messages are retained for **30 days**. A `created_after` earlier than that

        is accepted and raised to the retention bound rather than rejected, so a

        wider window returns what is still retained instead of failing. There is no

        way to read messages older than the window.'
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - command
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: status
        in: query
        required: false
        description: Filter by status. Repeat the parameter to match any of several statuses.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppMessageStatus'
      - name: direction
        in: query
        required: false
        description: 'Filter by whether the business sent the message (`outbound`) or received it from the contact (`inbound`).

          '
        schema:
          $ref: '#/components/schemas/MessageDirection'
      - name: to
        in: query
        required: false
        description: 'Filter by recipient, exact match. The recipient is the contact on an outbound message and your business number on an inbound one, matching the `to` each message returns. Accepts an E.164 phone number, or a business-scoped user ID to name the contact. Only a contact is ever identified by a business-scoped user ID, so `to=<business-scoped user ID>` matches outbound messages only.

          '
        schema:
          type: string
          minLength: 1
          example: '+15551234567'
      - name: from
        in: query
        required: false
        description: 'Filter by sender, exact match. The sender is your business number on an outbound message and the contact on an inbound one, matching the `from` each message returns. Accepts an E.164 phone number, or a business-scoped user ID to name the contact. Only a contact is ever identified by a business-scoped user ID, so `from=<business-scoped user ID>` matches inbound messages only.

          '
        schema:
          type: string
          minLength: 1
          example: '+13124495648'
      - name: phone_number
        in: query
        required: false
        deprecated: true
        description: 'Deprecated: use `to` or `from` instead, which also match a business-scoped user ID. Filters by contact phone number (E.164 exact match), in either direction.

          '
        schema:
          type: string
          example: '+15551234567'
      - name: bsuid
        in: query
        required: false
        description: 'Filter by business-scoped user ID (Meta identifier), matching the contact in either direction. `to` and `from` also accept one, but each matches a single end of the message.

          '
        schema:
          type: string
          example: NL.xxxx
      - name: category
        in: query
        required: false
        description: Filter by category.
        schema:
          $ref: '#/components/schemas/WhatsAppTemplateCategory'
      - name: group_id
        in: query
        required: false
        description: 'Filter by the WhatsApp group the message belongs to, in either direction: the group an outbound message was addressed to, or the group an inbound message arrived through. Matches the `group_id` on each message''s `to`. It names one group, so there is no way to ask for the messages that belong to no group: omit it to list group and one-to-one messages together.

          '
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/TagFilter'
      responses:
        '200':
          description: Paginated list of WhatsApp messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageList'
              example:
                data:
                - id: wam_01kya1b3xdq7fe8m2v5t9rncgs
                  direction: inbound
                  from:
                    phone_number: '+15550002222'
                    bsuid: US.AbC1
                    display_name: Dana Reyes
                  to:
                    phone_number: '+15550001111'
                    group_id: wag_01krdgeqcxet5s7t44vh8rt9mg
                  text:
                    body: Got it, thanks.
                  status: received
                  created_at: '2026-09-15T14:05:41Z'
                - id: wam_01kya19eknftrs2s6p82asmvnh
                  direction: outbound
                  from:
                    phone_number: '+15550001111'
                  to:
                    group_id: wag_01krdgeqcxet5s7t44vh8rt9mg
                  text:
                    body: The route sheet for Tuesday is up.
                  status: delivered
                  recipient_count: 2
                  delivered_count: 2
                  read_count: 1
                  created_at: '2026-09-15T14:03:10Z'
                next_cursor: null
                prev_cursor: null
                refresh_cursor: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - attio
      - cli
      - make
      - mcp
      - n8n
      - sdk
    post:
      operationId: createWhatsAppMessage
      x-snippet-key: whatsapp.send
      summary: Send a WhatsApp message
      description: Sends one WhatsApp message to one recipient.
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - command
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMessageSendRequest'
            examples:
              onboarding-whatsapp:
                summary: The first send from the dashboard's onboarding step
                value:
                  to: '+15551234567'
                  template:
                    slug: bird_delivery_update
                    components:
                    - type: body
                      parameters:
                      - type: text
                        name: ref
                        text: A1B2C3D4
                      - type: text
                        name: date
                        text: 10 Jul 2026
              audio:
                summary: A voice note or audio clip by URL
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  audio:
                    url: https://cdn.example.com/vm/9f2.ogg
              documents:
                summary: A PDF or other document by URL
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  document:
                    url: https://cdn.example.com/invoices/a1b2c3.pdf
              images:
                summary: An image by URL
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  image:
                    url: https://cdn.example.com/receipt.png
              stickers:
                summary: A WebP sticker by URL
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  sticker:
                    url: https://cdn.example.com/stickers/thumbs-up.webp
              video:
                summary: A video by URL
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  video:
                    url: https://cdn.example.com/unboxing.mp4
              location:
                summary: A pin the recipient can open in their maps app
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  location:
                    latitude: 37.7793
                    longitude: -122.4193
              groups:
                summary: A text message to every participant of a group
                value:
                  to: wag_01krdgeqcxet5s7t44vh8rt9mg
                  text:
                    body: The route sheet for Tuesday is up.
              interactive-overview:
                summary: Quick-reply buttons offering two replies
                value:
                  to: '+15551234567'
                  from: '+13124495648'
                  interactive:
                    type: button
                    body_text: Your gardening workshop is scheduled for 9am tomorrow.
                    buttons:
                    - type: quick_reply
                      quick_reply:
                        slug: change-booking
                        text: Change
                    - type: quick_reply
                      quick_reply:
                        slug: cancel-booking
                        text: Cancel
              reply-buttons:
                summary: A single quick-reply button
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  interactive:
                    type: button
                    body_text: Your gardening workshop is scheduled for 9am tomorrow.
                    buttons:
                    - type: quick_reply
                      quick_reply:
                        slug: change-booking
                        text: Change
              carousels:
                summary: A carousel of product cards, each with its own button
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  interactive:
                    type: carousel
                    body_text: 'Here are two of our latest arrivals, each under $25:'
                    cards:
                    - header:
                        type: image
                        url: https://cdn.example.com/plants/blue-echeveria.jpeg
                      buttons:
                      - type: cta_url
                        cta_url:
                          text: Buy now
                          url: https://shop.example.com/blue-echeveria
                    - header:
                        type: image
                        url: https://cdn.example.com/plants/zebra-haworthia.jpeg
                      buttons:
                      - type: cta_url
                        cta_url:
                          text: Buy now
                          url: https://shop.example.com/zebra-haworthia
              contact-info-requests:
                summary: A prompt asking the recipient to share their phone number
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  interactive:
                    type: request_contact_info
                    body_text: To confirm your booking we need a number to reach you on. Tap below to share yours.
              cta-url-buttons:
                summary: A button that opens a URL, with click tracking in the link
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  interactive:
                    type: cta_url
                    body_text: Tap the button below to see the available dates.
                    cta_url:
                      text: See dates
                      url: https://example.com/workshops?click_id=a1b2c3
              list-menus:
                summary: A list menu the recipient picks one row from
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  interactive:
                    type: list
                    body_text: Which shipping option do you prefer?
                    list:
                      button_text: Shipping options
                      sections:
                      - title: As soon as possible
                        rows:
                        - slug: priority_express
                          text: Priority Mail Express
              location-requests:
                summary: A prompt asking the recipient to share their location
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  interactive:
                    type: location_request_message
                    body_text: Let's start with your pickup. Share your current location, or type an address instead.
              template-authentication:
                summary: An authentication template carrying a one-time passcode
                value:
                  to: '+14155550100'
                  template:
                    slug: bird_otp
                    language: en
                    components:
                    - type: body
                      parameters:
                      - type: text
                        text: '481920'
              template-marketing:
                summary: A marketing template with an image header and a coupon button
                value:
                  to: '+16505551234'
                  from: '+13125550101'
                  template:
                    slug: summer_sale
                    language: en
                    components:
                    - type: header
                      parameters:
                      - type: image
                        url: https://cdn.example.com/banners/summer.png
                    - type: body
                      parameters:
                      - type: text
                        name: first_name
                        text: Pablo
                    - type: button
                      parameters:
                      - type: text
                        text: SUMMER25
              template-utility:
                summary: A utility template confirming an order
                value:
                  to: '+16505551234'
                  template:
                    slug: bird_order_confirmation
                    language: en
                    components:
                    - type: body
                      parameters:
                      - type: text
                        name: ref
                        text: A1B2C3D4
                      - type: text
                        name: amount
                        text: USD 49.99
              plain-text:
                summary: A plain text message, the smallest free-form send
                value:
                  to: '+16505551234'
                  from: '+13124495648'
                  text:
                    body: Your driver is 2 minutes away.
              free-form-text:
                summary: A free-form reply inside an open customer service window
                value:
                  to: '+31612345678'
                  from: '+13124495648'
                  text:
                    body: 'Your order shipped: https://example.com/track/A1B2C3'
                    preview_url: true
              interactive-buttons:
                summary: Reply buttons quoting the message that asked for them
                value:
                  to: '+31612345678'
                  from: '+13124495648'
                  in_reply_to_message_id: wam_01kya19eknftrs2s6p82asmvnh
                  interactive:
                    type: button
                    body_text: Your driver is 2 minutes away. Still at the same address?
                    buttons:
                    - type: quick_reply
                      quick_reply:
                        slug: same_address
                        text: Yes, same address
                    - type: quick_reply
                      quick_reply:
                        slug: change_address
                        text: Change address
      responses:
        '202':
          description: Message accepted for asynchronous delivery.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessage'
              example:
                id: wam_01kya19eknftrs2s6p82asmvnh
                direction: outbound
                from:
                  phone_number: '+15550001111'
                to:
                  group_id: wag_01krdgeqcxet5s7t44vh8rt9mg
                text:
                  body: The route sheet for Tuesday is up.
                status: accepted
                recipient_count: 2
                delivered_count: 0
                read_count: 0
                created_at: '2026-09-15T14:03:10Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - attio
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/whatsapp/messages/{message_id}:
    get:
      operationId: getWhatsAppMessage
      x-snippet-key: whatsapp.get
      summary: Get a WhatsApp message
      description: 'Returns a single WhatsApp message: its current delivery status, per-stage timestamps (`sent_at`, `delivered_at`, `read_at`), and failure detail when it failed. It carries the one content object it was built from: `template`, or free-form `text`, `image`, `video`, `audio`, `sticker`, `document`, `location`, `interactive` or `contact_cards`. An inbound message carries `interactive_reply` when the contact tapped a reply button or a list row. An inbound message whose content WhatsApp models and we do not carries `unsupported` instead, naming the type rather than reading back empty. The `status` advances asynchronously as delivery progresses, so poll this endpoint (or subscribe to `whatsapp.*` webhook events) after a send to confirm delivery. For the per-event timeline, use List events for a WhatsApp message instead.'
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - command
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        description: ID of the message, as returned in the send response's `id` field.
        schema:
          $ref: '#/components/schemas/WhatsAppMessageID'
      responses:
        '200':
          description: WhatsApp message object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessage'
              example:
                id: wam_01kya19eknftrs2s6p82asmvnh
                direction: outbound
                from:
                  phone_number: '+15550001111'
                to:
                  group_id: wag_01krdgeqcxet5s7t44vh8rt9mg
                text:
                  body: Tuesday's route sheet is up.
                status: delivered
                recipient_count: 2
                delivered_count: 2
                read_count: 2
                created_at: '2026-09-15T14:03:10Z'
                sent_at: '2026-09-15T14:03:11Z'
                delivered_at: '2026-09-15T14:03:12Z'
                read_at: '2026-09-15T14:04:02Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - attio
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/whatsapp/messages/{message_id}/read:
    post:
      operationId: sendWhatsAppReadReceipt
      summary: Mark a WhatsApp message as read
      description: 'Marks an inbound WhatsApp message as read, showing the contact the blue

        ticks. WhatsApp also marks every earlier message in that conversation read.


        Pass `typing_indicator: true` to show a typing indicator as well. WhatsApp

        clears it when you send your next message, or after 25 seconds, whichever

        comes first, and there is no call to clear it early, so ask for one only

        when you are about to reply. WhatsApp cannot show a typing indicator without

        a read receipt, so both arrive together.


        The acknowledgement is sent asynchronously: a `202` means Bird accepted the

        request, not that WhatsApp has shown it. Nothing reports back, because

        WhatsApp publishes no delivery, status or failure callback for an

        acknowledgement, so there is nothing to poll and no webhook event.

        Repeating the call is safe, and each call restarts the 25-second typing

        window. To refresh the indicator, send a fresh `Idempotency-Key` or none at

        all: a replayed key answers from the stored response without acknowledging

        anything again.


        Only an inbound message can be marked read. WhatsApp allows this for 30

        days after receipt, but Bird keeps the provider id a receipt needs for 15

        days, so a message older than that answers `404`. A message Bird sent, or

        one that never reached WhatsApp, answers `422`.'
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - dashboard
      - command
      x-snippet-key: whatsapp.markRead
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        description: ID of the inbound message to acknowledge.
        schema:
          $ref: '#/components/schemas/WhatsAppMessageID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppReadReceiptRequest'
      responses:
        '202':
          description: Acknowledgement accepted for asynchronous delivery.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppReadReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/whatsapp/messages/{message_id}/events:
    get:
      operationId: listWhatsAppMessageEvents
      x-snippet-key: whatsapp.listEvents
      summary: List events for a WhatsApp message
      description: Returns a WhatsApp message's lifecycle events in chronological order, one entry per delivery transition (`whatsapp.accepted`, `whatsapp.sent`, `whatsapp.delivered`, `whatsapp.read`, `whatsapp.failed`). The timeline is bounded and returned in full, so this list is not paginated; an unknown message ID returns `404`. For the message's current state in a single field, use Get a WhatsApp message instead.
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - command
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        description: ID of the message, as returned in the send response's `id` field.
        schema:
          $ref: '#/components/schemas/WhatsAppMessageID'
      - name: type
        in: query
        required: false
        description: 'Keep only events of this exact type (for example `whatsapp.delivered` or `whatsapp.failed`). Omit for the full timeline.

          '
        schema:
          $ref: '#/components/schemas/WhatsAppEventType'
      responses:
        '200':
          description: Event timeline for this WhatsApp message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppEventList'
              example:
                data:
                - id: ev_01kya19f8p2hs5w1y7k4cmqrtv
                  type: whatsapp.sent
                  occurred_at: '2026-09-15T14:03:11Z'
                - id: ev_01kya19f2m8xqe4v0t6r3bnpcd
                  type: whatsapp.delivered
                  occurred_at: '2026-09-15T14:03:12Z'
                  recipient:
                    phone_number: '+15550002222'
                    bsuid: US.AbC1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/whatsapp/messages/{message_id}/media/{media_id}:
    parameters:
    - name: message_id
      in: path
      required: true
      description: WhatsApp message ID.
      schema:
        $ref: '#/components/schemas/WhatsAppMessageID'
    - name: media_id
      in: path
      required: true
      description: Media ID, as returned in `id` on the message's content object.
      schema:
        $ref: '#/components/schemas/WhatsAppFileID'
    get:
      operationId: getWhatsAppMessageMedia
      summary: Get a WhatsApp message's media
      description: 'Redirects to a short-lived URL for the media on a received WhatsApp message.

        Inbound media is stored because WhatsApp''s own URL is not fetchable

        without our credentials; this endpoint is what the `url` on the message''s

        `image`, `video`, `audio`, `sticker` or `document` points at. The bytes

        live in object storage and are served straight from there, so they never

        transit the API.


        The response is a `302` whose `Location` is that pre-authorized storage URL,

        valid for 15 minutes; your client must follow redirects. The `Authorization`

        header must be absent from the request that fetches that URL: a client that

        attaches credentials centrally, at its transport, interceptor or middleware

        layer rather than per request, re-adds the header on every hop including the

        redirect, so the storage URL must be fetched with a client that carries

        none.


        Media is kept for 30 days after the message is received, and the message

        itself is kept longer. A message older than that still lists its media''s

        `mime_type` and `caption`, and this operation returns `410` once the bytes

        have expired. Outbound messages have no media to serve.'
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - command
      x-snippet-key: whatsapp.messages.media
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '302':
          description: Redirect to a storage URL valid for 15 minutes.
          headers:
            Location:
              description: The storage URL to fetch the media from.
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/whatsapp/messages/{message_id}/reaction:
    put:
      operationId: upsertWhatsAppMessageReaction
      summary: React to a WhatsApp message
      description: 'Places an emoji reaction on a message this workspace received, the same way

        tapping and holding a message in WhatsApp does.


        You hold at most one reaction per message, so this replaces your existing

        one rather than adding another. To take a reaction back entirely, delete it.


        The `202` means the reaction was accepted, not that WhatsApp applied it.

        Reactions carry no delivery or read receipt, so the furthest one gets is

        sent. Read the message''s `reactions` for what currently stands, or

        List reaction events for a WhatsApp message

        for what became of each change, including one WhatsApp refused.


        Each of these returns a `422`:


        - A message this workspace sent. This endpoint places reactions on messages

        the contact sent; reacting to your own outbound message is not supported.

        - More than one emoji, since WhatsApp takes exactly one.


        A message Bird can no longer resolve returns a `404` instead. WhatsApp

        accepts a reaction on a message up to 30 days old, but Bird keeps the

        provider id a reaction needs for **15 days**, so that is the practical age

        limit. The message and its reaction log stay readable for 30; only the id

        a placement needs is gone.


        Reacting to a message received in a group addresses the group, so the

        group''s own state applies: a group this workspace no longer holds returns

        a `404` `WhatsAppGroupNotFound`, and one that is not active a `409`

        `WhatsAppGroupNotActive`.


        Reactions are not charged for.'
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - dashboard
      - command
      x-snippet-key: whatsapp.reaction.set
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        description: 'ID of the message to react to, as returned in the `id` field of the message. Must be a message this workspace received.

          '
        schema:
          $ref: '#/components/schemas/WhatsAppMessageID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppReactionUpsert'
            examples:
              thumbs-up:
                summary: Acknowledge a message with a thumbs up
                value:
                  emoji: 👍
      responses:
        '202':
          description: Reaction accepted; WhatsApp applies it asynchronously.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppReactionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
    delete:
      operationId: deleteWhatsAppMessageReaction
      summary: Remove your reaction from a WhatsApp message
      description: 'Takes back the reaction this workspace placed on a message, the same way

        tapping your own reaction in WhatsApp does. Only your own reaction can be

        removed; one the contact placed is theirs to take back.


        Removing a reaction from a message you have not reacted to changes nothing

        and still answers `202`, so a repeated call is safe.


        A removal travels the same path as placing a reaction, so it is refused on

        the same grounds. A message this workspace sent returns a `422`: it could

        never have carried a reaction of ours to remove, since placing one there is

        not supported either.


        A message Bird can no longer resolve returns a `404` instead, on the same

        15-day retention a placement is bounded by. A reaction on a message

        received in a group addresses the group, so a group this workspace no

        longer holds returns a `404` `WhatsAppGroupNotFound` and one that is not

        active a `409` `WhatsAppGroupNotActive`, the same as placing one does.


        The `202` is the removal accepted rather than applied. The reaction stays in

        the message''s `reactions` until WhatsApp confirms the removal and then drops

        out, so one on its way off reads as still standing rather than disappearing

        before it is gone.'
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - dashboard
      - command
      x-snippet-key: whatsapp.reaction.remove
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        description: 'ID of the message to take your reaction off, as returned in the `id` field of the message.

          '
        schema:
          $ref: '#/components/schemas/WhatsAppMessageID'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 'Removal accepted. No body: the reaction is still standing at this point, and on a message this workspace never reacted to there is nothing to return. Read the message''s `reactions` to see it go.

            '
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/whatsapp/messages/{message_id}/reaction-events:
    get:
      operationId: listWhatsAppMessageReactionEvents
      summary: List reaction events for a WhatsApp message
      description: 'Returns the changes made to this message''s reactions as a cursor-paginated

        list, newest first: each emoji placed, each one replaced by a different

        emoji, and each one taken back. Entries are never edited, so a contact who

        reacts, changes their mind and then removes it leaves three of them.


        One case is missing rather than recorded. A reaction is matched to the

        message it was placed on through a provider id we keep for 15 days, while

        WhatsApp accepts a reaction on a message up to 30 days old, so one placed on

        a message older than that cannot be matched and is recorded nowhere: not

        here, and not in the message''s `reactions`.


        Use this to show who reacted and when, or to find out what became of a

        reaction that never appeared: a `failed` or `rejected` entry carries the

        reason on `error`. For what currently stands on the message, read its

        `reactions`, which folds this log down to one entry per sender.


        Pass the response''s `next_cursor` back as `starting_after` to fetch the next

        page.


        Reaction events are kept for **30 days**, counted from when the message they

        belong to was accepted rather than from the reaction itself. They therefore

        go at about the same time as the message, not 30 days after the last

        reaction on it.'
      tags:
      - whatsapp-messages
      x-audiences:
      - public
      - dashboard
      - command
      x-snippet-key: whatsapp.reaction.listEvents
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        description: 'ID of the message whose reactions to read, as returned in the `id` field of the message.

          '
        schema:
          $ref: '#/components/schemas/WhatsAppMessageID'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: Paginated list of reaction changes for this WhatsApp message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppReactionEventList'
              example:
                data:
                - id: war_01krdgeqcxet5s7t44vh8rt9mh
                  emoji: 🎉
                  status: rejected
                  from:
                    phone_number: '+13124495569'
                  error:
                    code: internal_error
                    description: the receiving number is no longer connected
                    occurred_at: '2026-08-28T19:04:22Z'
                  occurred_at: '2026-08-28T19:04:22Z'
                - id: war_01krdgeqcxet5s7t44vh8rt9mg
                  emoji: 👍
                  status: received
                  from:
                    phone_number: '+14155550100'
                    bsuid: US.13491208655302741918
                  occurred_at: '2026-08-28T19:01:10Z'
                next_cursor: null
                prev_cursor: null
                refresh_cursor: eyJ2IjoxLCJzIjoiMjAyNi0wOC0yOFQxOTowNDoyMloiLCJpIjoiMDE5ZTFiMDctNWQ5ZC03NjhiLTkzZTgtODRkYzUxOGQyNjkxIn0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
components:
  schemas:
    WhatsAppGroupID:
      type: string
      minLength: 1
      pattern: ^wag_[0-9a-hjkmnp-tv-z]{26}$
      example: wag_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppReactionEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - emoji
      - status
      - from
      - occurred_at
      description: 'One change to a reaction on a message: a reaction placed, replaced by a different emoji, or taken back. Entries are never edited, so a sender who reacts twice and then removes it leaves three of them.

        '
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/WhatsAppReactionEventID'
          description: ID of this entry, unique within the message's reaction log.
        emoji:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'The emoji this entry placed, as WhatsApp sent it and not normalized. Null when the entry took a reaction back rather than placing one. Always present, so null is the removal itself rather than a value we are missing.

            '
          example: 👍
        status:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppReactionEventStatus'
        from:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppAddress'
          description: 'Who made the change. Your business number on a reaction you placed, the contact on one they placed.

            '
        error:
          readOnly: true
          $ref: '#/components/schemas/WhatsAppError'
          description: 'Why the change did not take effect. Always carried by a `failed` or `rejected` entry, and never by any other, so a failure always says what went wrong. Absent rather than null on the entries that did take effect. The schema leaves it optional because that is a conditional the generators do not express. `code` is drawn from the vocabulary a message send shares, less its two billing codes: a reaction is never charged, so neither `insufficient_balance` nor `price_not_found` appears here.

            '
        occurred_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When the change was made.
          example: '2026-08-28T19:01:10Z'
    WhatsAppAddress:
      type: object
      additionalProperties: false
      description: 'Sender or recipient of a WhatsApp message: a phone number, a business-scoped user ID, or both. A message received from a WhatsApp user carries whatever profile they publish, which may be neither.'
      properties:
        phone_number:
          type: string
          minLength: 1
          description: Phone number in E.164 format, when known.
          example: '+15550001111'
        bsuid:
          type: string
          minLength: 1
          description: 'Business-scoped user ID, Meta''s identifier for the WhatsApp user. Present only on the WhatsApp-user side of the message.

            '
          example: NL.xxxx
        group_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupID'
          description: 'The group this address was addressed as, or reached through. It appears on a message''s `to` and nowhere else: never on `from`, and never on an event''s `recipient`. Outbound, it stands in for the recipient, because a group send names no single phone number. Inbound, it qualifies one: `to` carries the business `phone_number` that received the message and the group it arrived through, while `from` stays the participant who wrote it. Its presence on `to` is what tells a group message from a one-to-one one, in either direction.

            '
        username:
          type: string
          minLength: 1
          description: 'Present only on a message received from a WhatsApp user, on `from`; never on an outbound send''s `to`, where the profile is not known. Absent when the contact has not adopted one, and on a message received before this workspace started recording them. Same form as a number''s own username (`WhatsAppNumberProfile.username`), without a leading `@`; a message cannot be addressed by it.

            '
        display_name:
          type: string
          minLength: 1
          description: 'Present only on a message received from a WhatsApp user, on `from`; never on an outbound send''s `to`, where the profile is not known. Absent when the message carries no profile, and on a message received before this workspace started recording them.

            '
    WhatsAppLocation:
      type: object
      additionalProperties: false
      description: 'Location content of a WhatsApp message: a point on the map the recipient can open in their maps app.

        '
      properties:
        latitude:
          type: number
          format: double
          description: Latitude in decimal degrees.
          example: 52.3702
        longitude:
          type: number
          format: double
          description: Longitude in decimal degrees.
          example: 4.8952
        name:
          type: string
          description: Name of the place. Absent when the sender shared a plain pin.
          example: Bird HQ
        address:
          type: string
          description: Street address of the place. Shown only when `name` is also set.
          example: Keizersgracht 117, Amsterdam
        url:
          type: string
          format: uri
          description: 'Link to the place, which WhatsApp includes mainly for business locations. Present on an inbound message when the sender''s client supplied one, and absent on a message you sent, since sending a location does not support this field.

            '
          example: https://www.google.com/maps/place/Statue+of+Liberty/@40.6246301,-74.5291919,124716m/
    WhatsAppAudioSend:
      type: object
      additionalProperties: false
      required:
      - url
      description: 'Free-form audio to send, either as a voice note or as a basic audio file. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the audio file. WhatsApp fetches it at send time, so it must still be reachable then: a signed URL has to outlive the send. We do not store or proxy the file. WhatsApp caches a fetched URL for 10 minutes and re-serves that copy for an identical URL sent again within the window; vary the URL to force a re-fetch. AAC, AMR, MP3, M4A and OGG (OPUS codec, mono) are supported, up to 16 MB.

            '
          example: https://cdn.example.com/voice/9f2e4a.ogg
        voice:
          type: boolean
          default: false
          description: 'Whether to send this as a voice note rather than a basic audio message. A voice note auto-downloads, shows the sender''s profile picture, and can be transcribed for the recipient. It requires an `.ogg` file encoded with the OPUS codec; any other format makes transcription fail. Leave it false for an ordinary audio attachment.

            '
      example:
        url: https://cdn.example.com/voice/9f2e4a.ogg
        voice: true
    WhatsAppMessageList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            description: Page of WhatsApp messages, newest first.
            items:
              $ref: '#/components/schemas/WhatsAppMessage'
      - $ref: '#/components/schemas/_ListEnvelope'
    WhatsAppStickerSend:
      type: object
      additionalProperties: false
      required:
      - url
      description: 'A free-form sticker to send. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the sticker. WhatsApp fetches it at send time, so it must still be reachable then: a signed URL has to outlive the send. We do not store or proxy the file. WhatsApp caches a fetched URL for 10 minutes and re-serves that copy for an identical URL sent again within the window; vary the URL to force a re-fetch. WebP only: up to 100 KB for a static sticker and 500 KB for an animated one. A sticker carries no caption.

            '
          example: https://cdn.example.com/stickers/thumbs-up.webp
      example:
        url: https://cdn.example.com/stickers/thumbs-up.webp
    WhatsAppContactEmailSend:
      type: object
      additionalProperties: false
      description: One email address to put on a contact card.
      required:
      - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          example: barbara@example.com
        type:
          type: string
          maxLength: 64
          description: 'A label for the address, shown beside it. Free text, sent exactly as written.

            '
          example: Work
    WhatsAppInteractiveType:
      type: string
      minLength: 1
      x-extensible-enum:
      - button
      - list
      - cta_url
      - carousel
      - location_request_message
      - request_contact_info
      description: "Which kind of interactive message this is.\n\n- `button`: up to three tappable buttons, each sending its own identifier\n  back as an inbound message. Carried in `buttons`.\n- `list`: a single button that opens a menu of rows to choose one from.\n- `cta_url`: a single button that opens a link.\n- `carousel`: 2 to 10 media cards the recipient scrolls through sideways,\n  each with its own buttons. Carried in `cards`.\n- `location_request_message`: a single button that asks the recipient to\n  share where they are. A tap arrives as an inbound `location` message.\n- `request_contact_info`: a single button that asks the recipient to share\n  their phone number. A tap arrives as an inbound message carrying the number\n  on `contact_cards`, with `origin` set to `contact_request`.\n\nThe last two name no field of their own: the ask is the whole message, and\n`body_text` is all they carry.\n\nOpen enum: WhatsApp adds interactive kinds over time, so treat an\nunrecognized value as a future kind rather than an error.\n"
      example: button
    WhatsAppInteractiveListSend:
      type: object
      additionalProperties: false
      required:
      - button_text
      - sections
      description: 'A menu of options behind a single button. The recipient taps the button, WhatsApp opens the menu, and choosing one option sends it back as a reply.

        '
      properties:
        button_text:
          type: string
          minLength: 1
          maxLength: 20
          description: The label of the button that opens the menu.
          example: Shipping options
        sections:
          type: array
          minItems: 1
          maxItems: 10
          description: 'The groups of options in the menu, in the order shown. At most 10 rows across all groups combined, each carrying a label unique across the whole message.

            '
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveListSectionSend'
      example:
        button_text: Shipping options
        sections:
        - title: As soon as possible
          rows:
          - slug: priority_express
            text: Priority Mail Express
            description: Next day to 2 days
        - title: I can wait a bit
          rows:
          - slug: ground_advantage
            text: Ground Advantage
            description: 2 to 5 days
    WhatsAppReactionEventID:
      type: string
      minLength: 1
      pattern: ^war_[0-9a-hjkmnp-tv-z]{26}$
      example: war_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppInteractiveReply:
      type: object
      additionalProperties: false
      description: 'What the contact tapped, on an inbound message answering an interactive message or a template''s quick-reply button. `type` names the kind and the field it names carries it, as everywhere else in this arm. Inbound only: a message that offers something to tap reads as `interactive` instead, and the two never appear together.

        '
      required:
      - type
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveReplyType'
          description: Which kind of tap this reply came from, and which field carries it.
        button:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveQuickReplyButton'
          description: 'The button the contact tapped, as you declared it. On a reply to a template''s quick-reply button, `slug` is the button''s payload, which WhatsApp sets to the button''s own label.

            '
        list:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveListRow'
          description: 'The row the contact chose, as you declared it. `description` is present only when the row carried one.

            '
      example:
        type: list
        list:
          slug: priority_express
          text: Priority Mail Express
          description: Next day to 2 days
    Tag:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      description: 'Structured key/value label attached to a message or a call. Use tags for low-cardinality filtering dimensions (category, experiment ID, template ID); they surface in the list filter of whatever carries them.


        On a message they also surface in the event log and in webhook payloads, and a message can carry `metadata` beside them for arbitrary per-send context that does not need to be filterable. A call has none of those three: its tags are set on the wire when the call is placed, and the call record is the one place you read them back.


        Whatever carries the tags defines how many it may have. Tag names are unique: a send that repeats one is rejected, and on a call the first instance of a name wins.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag name. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 32 characters.

            '
          example: category
        value:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag value. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 64 characters.

            '
          example: welcome
    WhatsAppMessageSendRequest:
      type: object
      additionalProperties: false
      description: 'A WhatsApp message to send. Carry exactly one kind of content: a request with none returns a `422` `WhatsAppContentRequired`, and one carrying more than one returns a `422` `WhatsAppContentAmbiguous`. The schema does not express that constraint, because which combinations are available depends on the content types your workspace can send.

        '
      required:
      - to
      properties:
        to:
          type: string
          minLength: 1
          description: 'The message recipient: a phone number in E.164 format (for example `+31612345678`), the recipient''s business-scoped user ID (for example `US.13491208655302741918`), which addresses a WhatsApp user whose phone number you do not have, or a WhatsApp group ID (for example `wag_01krdgeqcxet5s7t44vh8rt9mg`), which sends to every participant of that group. A value that is none of these returns a `422` `WhatsAppInvalidRecipient`. One-time-passcode templates require a phone number and return a `422` `WhatsAppRecipientNotSupportedForTemplate` when sent to a business-scoped user ID. A group ID naming no group this workspace holds returns a `404` `WhatsAppGroupNotFound`, and one whose group is not active returns a `409` `WhatsAppGroupNotActive`. Content a group cannot take is refused ahead of both, so a group ID paired with interactive content returns the `422` below whether or not the group exists.

            '
          example: '+31612345678'
        from:
          type: string
          minLength: 1
          description: 'The business phone number to send from, in E.164 format. Omit it for a Bird-managed template, which selects its own number from its category: setting it there returns a `422` `WhatsAppSenderNotAllowed`. Every other send, whether free-form content of any kind or a template your workspace authored, requires it, and the number must be one this workspace owns. Omitting it returns a `422` `WhatsAppSenderRequired`, and naming a number this workspace cannot send from returns a `422` `WhatsAppSenderNotFound`. Naming a number this workspace owns but that sits on a different WhatsApp Business Account than an authored template returns a `422` `WhatsAppSenderWABAMismatch`. A number this workspace holds but has not finished connecting returns a `422` `WhatsAppSenderNotConnected`. Omit it for a group send too: the group sends on its own number, so naming one returns a `422` `WhatsAppSenderNotAllowed`.

            '
          example: '+13124495648'
        template:
          allOf:
          - $ref: '#/components/schemas/WhatsAppTemplateSend'
          description: 'The template to send. A Bird-managed template selects the sender number from the template''s category, so `from` must be omitted. A template is the only content deliverable outside a customer service window. A group send takes a template your workspace authored in any category but authentication: WhatsApp does not deliver an authentication template to a group, which returns a `422` `WhatsAppGroupContentNotSupported`. A Bird-managed template sends from a Bird-owned number that no group is scoped to, so addressing one to a group returns a `422` `WhatsAppInvalidRecipient`.

            '
        text:
          allOf:
          - $ref: '#/components/schemas/WhatsAppTextSend'
          description: 'Free-form text to send instead of a template. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`.

            '
        image:
          allOf:
          - $ref: '#/components/schemas/WhatsAppImageSend'
          description: 'A free-form image to send instead of a template. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`.

            '
        video:
          allOf:
          - $ref: '#/components/schemas/WhatsAppVideoSend'
          description: 'A free-form video to send instead of a template. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`.

            '
        audio:
          allOf:
          - $ref: '#/components/schemas/WhatsAppAudioSend'
          description: 'Free-form audio to send instead of a template. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`.

            '
        sticker:
          allOf:
          - $ref: '#/components/schemas/WhatsAppStickerSend'
          description: 'A free-form sticker to send instead of a template. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`.

            '
        document:
          allOf:
          - $ref: '#/components/schemas/WhatsAppDocumentSend'
          description: 'A free-form document to send instead of a template. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`.

            '
        location:
          allOf:
          - $ref: '#/components/schemas/WhatsAppLocationSend'
          description: 'A free-form location to send instead of a template. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`.

            '
        interactive:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveSend'
          description: 'Free-form interactive content to send instead of a template: body text plus reply buttons, a menu, a link button, media cards, or a single button asking the recipient to share their location or their phone number. Deliverable only inside an open 24-hour customer service window, which the contact opens by messaging or calling you and resets each time they do it again. A send into a closed window is refused with a `422` `WhatsAppServiceWindowClosed` before anything is created or charged; one whose window closes between accept and dispatch fails asynchronously, with `service_window_expired` on the message''s `last_error`. WhatsApp does not deliver interactive content to a group, so a group recipient returns a `422` `WhatsAppGroupContentNotSupported`.

            '
        contact_cards:
          type: array
          minItems: 1
          maxItems: 5
          description: 'Contact cards to send instead of a template. Up to five: WhatsApp accepts far more, and a message that opens as one name plus a count of the rest is not a card the recipient will read.

            '
          items:
            $ref: '#/components/schemas/WhatsAppContactCardSend'
        in_reply_to_message_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppMessageID'
          description: 'Quote a message the contact will see above this one, the way replying in the WhatsApp client does. Name a message from the same conversation: one this workspace sent to this recipient, or received from them. Any content quotes, template or free-form. The quote is resolved before the send is accepted, so a quote WhatsApp cannot render fails this request rather than the message. An id naming no message this workspace holds, or one older than the 15 days we keep provider ids for, answers `404`; a message that never reached WhatsApp, or one from a different conversation than this send''s `to` and `from`, answers `422`. Nothing is charged either way.

            '
          example: wam_01kya19eknftrs2s6p82asmvnh
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          maxItems: 20
          description: 'Structured `{name, value}` labels for filtering. Tags become first-class query dimensions: filter the list endpoint by tag name. Maximum 20 tags per send. Use tags for low-cardinality dimensions (`category`, `experiment_variant`). For arbitrary structured context you do not need as a filter dimension, use `metadata` instead.

            '
        metadata:
          type: object
          additionalProperties: true
          description: 'Arbitrary JSON object stored on the message and returned on API reads. Maximum 2 KB serialized. Use metadata for per-send context like internal IDs and foreign keys. For low-cardinality filterable labels, use `tags` instead.

            '
      example:
        to: '+31612345678'
        template:
          slug: bird_otp
          language: en
          components:
          - type: body
            parameters:
            - type: text
              text: '1234'
          - type: button
            parameters:
            - type: text
              text: '1234'
    WhatsAppImage:
      type: object
      description: 'Image content of a WhatsApp message.

        '
      allOf:
      - $ref: '#/components/schemas/WhatsAppMedia'
      - type: object
        properties:
          caption:
            type: string
            description: Text shown beneath the image. Absent when the sender wrote none.
            example: Your receipt for order A1B2C3
    WhatsAppInteractive:
      type: object
      additionalProperties: false
      description: 'Interactive content of a WhatsApp message: body text plus something the recipient can tap. The field named by `type` is the one that is present, except on `location_request_message` and `request_contact_info`, which name no field: each is a single button asking the recipient for something, so `body_text` is the whole message. Outbound only, and so an echo of what the send asked for: a contact cannot send interactive content, and a tap on it reads as `interactive_reply`, or on a location or contact request as the message the recipient shared in answer. Unlike the send schema, this one does not pin each `type` to its field. The vocabulary in `type` is open, so dispatch on it and treat an unrecognized value as a kind added since. Only the discriminator is open: this schema declares no additional properties, so a new kind''s own payload field arrives here in the same change that introduces the kind, which is additive.

        '
      required:
      - type
      - body_text
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveType'
          description: Which kind of interactive message this is, and which field carries it.
        header:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveHeader'
          description: What was shown above the body. Absent when the message carried no header.
        body_text:
          type: string
          minLength: 1
          description: The message's main text.
          example: Your workshop is scheduled for 9am tomorrow.
        footer_text:
          type: string
          description: The small print below the body. Absent when the message carried none.
          example: Lucky Shrub, your gateway to succulents
        buttons:
          type: array
          description: The buttons the message offered, in the order shown.
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveButton'
        list:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveList'
          description: The menu the message offered.
        cta_url:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveCtaUrl'
          description: The link button the message offered.
        cards:
          type: array
          description: 'The cards the message offered, in the order they appeared, left to right.

            '
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveCard'
    WhatsAppReactionEventStatus:
      type: string
      minLength: 1
      enum:
      - received
      - sent
      - failed
      - rejected
      description: "What became of one reaction change:\n\n- `received` means the contact placed or removed the reaction and WhatsApp\n  told us about it. Every inbound entry carries this.\n- `sent` means your reaction reached WhatsApp. Reactions have no delivery or\n  read receipt, so this is as far as an outbound entry gets.\n- `failed` means WhatsApp refused it. `error` says why, most often because the\n  contact deleted the message. The grounds we can check for ourselves (a\n  message you sent, one that is itself a reaction, one over 30 days old) are\n  refused when you ask, so they do not reach here.\n- `rejected` means we refused it before it reached WhatsApp, so nothing was\n  sent. `error` says why.\n\nOnly `received` and `sent` entries change what stands on the message, so those\nare the ones the message's `reactions` are folded from.\n"
      example: received
    MessageDirection:
      type: string
      enum:
      - outbound
      - inbound
      description: Whether a message was sent from the workspace (`outbound`) or received by it (`inbound`).
    WhatsAppContactCard:
      type: object
      additionalProperties: false
      description: 'A contact card on this message: one the contact shared, or one this workspace sent.

        Nothing here is required. WhatsApp sends the parts the card holds and omits the rest, and a card that arrives with only an `origin` is still meaningful, so an empty card reads back empty rather than being dropped.

        '
      properties:
        origin:
          type: string
          minLength: 1
          x-extensible-enum:
          - contact_request
          - other
          description: 'Why the card arrived. `contact_request` means the contact tapped a button this workspace sent asking for their number, which is the only signal that the message answers that ask; `other` means they shared a card in the chat. Open enum: treat an unrecognized value as a way of sharing added since. Set on a card the contact shared; absent on one this workspace sent.

            '
          example: contact_request
        vcard:
          type: string
          description: 'The contact''s card in vCard format. WhatsApp sends it on a card shared in the chat and omits it on a button tap, which carries the number alone. Set on a card the contact shared; absent on one this workspace sent.

            '
          example: 'BEGIN:VCARD

            VERSION:3.0

            N:Johnson;Barbara;;;

            TEL;type=CELL:+16505551234

            END:VCARD

            '
        name:
          allOf:
          - $ref: '#/components/schemas/WhatsAppContactName'
          description: The contact's name, when the card carries one.
        org:
          allOf:
          - $ref: '#/components/schemas/WhatsAppContactOrg'
          description: Where the contact works, when the card carries it.
        birthday:
          type: string
          description: 'The contact''s birthday, which WhatsApp sends as `YYYY-MM-DD`. Passed through as text rather than typed as a date: the value comes off the contact''s own device unvalidated, and a card we could not parse would otherwise have to lose the field or fail the whole read.

            '
          example: '1999-01-23'
        phone_numbers:
          type: array
          description: 'The numbers on the card. A button tap carries the contact''s own number here, which is the point of asking.

            '
          items:
            $ref: '#/components/schemas/WhatsAppContactPhone'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppContactEmail'
        urls:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppContactUrl'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppContactAddress'
      example:
        origin: contact_request
        phone_numbers:
        - phone_number: '+16505551234'
          type: CELL
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    WhatsAppContactEmail:
      type: object
      additionalProperties: false
      description: One email address on a shared contact card.
      properties:
        email:
          type: string
          example: barbara@example.com
        type:
          type: string
          description: 'The label attached to this value, for example `CELL`, `Home` or `iPhone`. Free text: WhatsApp defines no vocabulary. A label on a received card is lowercased; one this workspace sent reads back exactly as sent.

            '
          example: Personal
    WhatsAppContactUrlSend:
      type: object
      additionalProperties: false
      description: One website to put on a contact card.
      required:
      - url
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: 'The address to show. Not validated as a URL, because a card commonly carries a bare domain.

            '
          example: https://luckyshrub.example.com
        type:
          type: string
          maxLength: 64
          description: 'A label for the website, shown beside it. Free text, sent exactly as written.

            '
          example: Company
    WhatsAppVideo:
      type: object
      description: 'Video content of a WhatsApp message.

        '
      allOf:
      - $ref: '#/components/schemas/WhatsAppMedia'
      - type: object
        properties:
          caption:
            type: string
            description: Text shown beneath the video. Absent when the sender wrote none.
            example: How to set it up
    WhatsAppFileID:
      type: string
      minLength: 1
      pattern: ^waf_[0-9a-hjkmnp-tv-z]{26}$
      example: waf_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppVideoSend:
      type: object
      additionalProperties: false
      required:
      - url
      description: 'A free-form video to send, with an optional caption. Deliverable only inside an open 24-hour customer service window; outside one, send a template instead.

        '
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: 'Public `https` URL of the video. WhatsApp fetches it at send time, so it must still be reachable then: a signed URL has to outlive the send. We do not store or proxy the file. WhatsApp caches a fetched URL for 10 minutes and re-serves that copy for an identical URL sent again within the window; vary the URL to force a re-fetch. MP4 with H.264 video and AAC audio, up to 16 MB.

            '
          example: https://cdn.example.com/unboxing.mp4
        caption:
          type: string
          maxLength: 1024
          description: Text shown beneath the video.
          example: How to set it up
      example:
        url: https://cdn.example.com/unboxing.mp4
        caption: How to set it up
    WhatsAppInteractiveButtonSend:
      type: object
      additionalProperties: false
      required:
      - type
      description: 'One button on an interactive message or on a carousel card. `type` names the kind and the field that carries it, so a button kind WhatsApp adds later arrives as another `type` here rather than as a new shape somewhere else.

        '
      oneOf:
      - properties:
          type:
            const: quick_reply
          cta_url:
            not: {}
        required:
        - type
        - quick_reply
      - properties:
          type:
            const: cta_url
          quick_reply:
            not: {}
        required:
        - type
        - cta_url
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveButtonTypeWrite'
          description: Which kind of button this is, and which field carries it.
        quick_reply:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveQuickReplyButtonSend'
          description: The button's label and the handle it sends back. Send this on a `quick_reply` button.
        cta_url:
          allOf:
          - $ref: '#/components/schemas/WhatsAppInteractiveCtaUrlSend'
          description: The button's label and the address it opens. Send this on a `cta_url` button.
      example:
        type: quick_reply
        quick_reply:
          slug: change-booking
          text: Change
    WhatsAppInteractiveButtonTypeWrite:
      type: string
      minLength: 1
      enum:
      - quick_reply
      - cta_url
      x-enum-varnames:
      - WhatsAppInteractiveButtonTypeWriteQuickReply
      - WhatsAppInteractiveButtonTypeWriteCtaUrl
      description: "Which kind of button this is, and which field carries it.\n\n- `quick_reply`: sends its own identifier back as an inbound message. The\n  name `WhatsAppTemplateButtonTypeWrite` already uses for the same control.\n- `cta_url`: opens a link in the recipient's browser.\n\nClosed on the write side: a kind Bird cannot send to Meta is rejected rather\nthan accepted and then failed asynchronously.\n"
      example: quick_reply
    WhatsAppSticker:
      type: object
      description: 'Sticker content of a WhatsApp message.

        '
      allOf:
      - $ref: '#/components/schemas/WhatsAppMedia'
      - type: object
        properties:
          animated:
            type: boolean
            description: 'Whether the sticker is animated. Absent on an outbound message.

              '
            example: false
    WhatsAppTemplateID:
      type: string
      minLength: 1
      pattern: ^wat_[0-9a-hjkmnp-tv-z]{26}$
      example: wat_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - occurred_at
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/WhatsAppEventID'
          description: ID of the event, unique within the message's timeline.
        type:
          $ref: '#/components/schemas/WhatsAppEventType'
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When this event occurred.
        recipient:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppAddress'
          description: 'The participant this confirmation is about, on a group message. Present only on `whatsapp.delivered` and `whatsapp.read`, the two events a group send fans out: one per participant, so a group of eight produces up to eight of each. The rest describe the message as a whole and carry no recipient, because there is one hand-off to the WhatsApp network and one way for that to be refused. Absent on a one-to-one message, whose `to` already names its recipient. Never carries `group_id`: the group belongs to the message''s `to`, not to a participant.

            '
        error:
          $ref: '#/components/schemas/WhatsAppError'
          description: Failure detail. Present only on `whatsapp.failed` and `whatsapp.rejected` events.
    WhatsAppEventID:
      type: string
      minLength: 1
      pattern: ^ev_[0-9a-hjkmnp-tv-z]{26}$
      example: ev_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppInteractiveButtonType:
      type: string
      minLength: 1
      x-extensible-enum:
      - quick_reply
      - cta_url
      description: 'Which kind of button this is, and which field carries it.


        - `quick_reply`: sends its own identifier back as an inbound message.

        - `cta_url`: opens a link in the recipient''s browser.


        Open enum: WhatsApp adds button kinds over time, so treat an unrecognized

        value as a future kind rather than an error.

        '
      example: quick_reply
    WhatsAppMessageID:
      type: string
      minLength: 1
      pattern: ^wam_[0-9a-hjkmnp-tv-z]{26}$
      example: wam_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppInteractiveList:
      type: object
      additionalProperties: false
      required:
      - button_text
      - sections
      description: 'The menu the message offered: a button that opens it, and the groups of options behind it.

        '
      properties:
        button_text:
          type: string
          minLength: 1
          description: The label of the button that opens the menu.
          example: Shipping options
        sections:
          type: array
          description: The groups of options in the menu, in the order shown.
          items:
            $ref: '#/components/schemas/WhatsAppInteractiveListSection'
    WhatsAppContactAddress:
      type: object
      additionalProperties: false
      description: One postal address on a shared contact card.
      properties:
        street:
          type: string
          example: 1 Hacker Way
        city:
          type: string
          example: Menlo Park
        state:
          type: string
          example: CA
        zip:
          type: string
          example: '94025'
        country:
          type: string
          example: United States
        country_code:
          type: string
          description: 'The country as the card holds it, left exactly as WhatsApp sent it: it describes a postal address rather than a routing destination.

            '
          example: US
        type:
          type: string
          description: 'The label attached to this value, for example `CELL`, `Home` or `iPhone`. Free text: WhatsApp defines no vocabulary. A label on a received card is lowercased; one this workspace sent reads back exactly as sent.

            '
          example: Home
    WhatsAppContactCardSend:
      type: object
      additionalProperties: false
      description: 'A contact card to send. WhatsApp shows the name on the card and the rest in a profile view the recipient opens from it.

        A card carrying a phone number renders buttons that message or save the contact; a card without one can only be added to an address book.

        '
      required:
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/WhatsAppContactNameSend'
        org:
          allOf:
