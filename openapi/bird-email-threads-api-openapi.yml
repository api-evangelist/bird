openapi: 3.2.0
info:
  title: Bird Email Threads API
  version: 1.0.0
  description: 'The Bird API: one REST API for email, SMS, WhatsApp, verification, and

    Realtime.'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: email-threads
  description: Conversations in a mailbox. Threads group related inbound and outbound messages and carry read state, labels, and participants.
paths:
  /v1/email/threads:
    get:
      operationId: listEmailThreads
      summary: List threads
      description: 'Returns a paginated list of conversations across the workspace''s mailboxes, most recently active first. `label` selects the view: the inbox (the default when omitted), `archive`, `spam`, `blocked`, or any custom label. You can also filter by mailbox, by linked contact, by participant address, or by a subject substring.


        This listing filters; it does not search message content.

        Conversations whose every message is trashed are excluded; restoring a message

        returns the conversation to the list.


        `before` and `after` filter by time. To page through the results, pass the response cursors back as `starting_after` or `ending_before`.'
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.list
      parameters:
      - name: mailbox_id
        in: query
        required: false
        description: Filter to conversations in a specific mailbox.
        schema:
          $ref: '#/components/schemas/MailboxID'
      - name: contact_id
        in: query
        required: false
        description: Filter to conversations linked to a specific contact.
        schema:
          $ref: '#/components/schemas/ContactID'
      - name: label
        in: query
        required: false
        description: 'Filter to conversations that have this label. Repeat the parameter to ask for more than one: only conversations that have every label you list are returned.


          A placement label picks a folder: `inbox`, `archive`, `spam`, or `blocked`. A custom label matches a conversation in any folder. Leave this out and you get the inbox.'
        schema:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
        example:
        - urgent
      - name: has_unread
        in: query
        required: false
        description: When `true`, only conversations with unread messages are returned. This filters on the conversation's unread state, so you can combine it with `label`, for example to get unread conversations in the archive. The `unread` label itself lives on individual messages; this filter uses the conversation's aggregate unread state.
        schema:
          type: boolean
      - name: participant
        in: query
        required: false
        description: Conversations involving this address, matching the sender or any recipient. The match is case-insensitive and matches on any part of the address, so a fragment works as well as the whole address.
        schema:
          type: string
          minLength: 3
          maxLength: 320
        example: billing@acme.com
      - name: subject
        in: query
        required: false
        description: Conversations whose subject contains this text (case-insensitive).
        schema:
          type: string
          minLength: 3
          maxLength: 256
        example: quarterly invoice
      - name: after
        in: query
        required: false
        description: Filter to conversations whose most recent message is at or after this time. Use the response cursors for pagination.
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        description: Filter to conversations whose most recent message is at or before this time. Use the response cursors for pagination.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: Paginated list of threads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - attio
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/email/threads/{thread_id}:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    get:
      operationId: getEmailThread
      summary: Get a thread
      description: Returns a single conversation. Fetch the messages in the conversation with List messages in a thread. A thread whose retention tier has ended returns `410 Gone`.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.get
      responses:
        '200':
          description: Thread object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
    patch:
      operationId: updateEmailThread
      summary: Update a thread
      description: Applies label changes to a conversation, and links or unlinks a contact. Adding `spam` files the conversation, and its received messages, as spam. Adding `archive` files it away without deleting it. Adding `inbox`, or removing `spam`, `blocked`, or `archive`, returns it to the inbox, and its unread count recomputes to match. An archived conversation returns to the inbox by itself when a new message arrives that isn't spam or blocked; a junk reply or an outbound send leaves it archived. To block a sender going forward, add a receive rule instead. Any field you leave out stays unchanged.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.update
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailThreadUpdateRequest'
      responses:
        '200':
          description: The updated thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
    delete:
      operationId: deleteEmailThread
      summary: Delete a thread
      description: Moves the conversation and all of its messages to the trash. Trashed messages are permanently deleted after 30 days, or sooner if the mailbox's retention period ends first. Pass `permanent=true` to permanently delete the conversation and its messages immediately.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.delete
      parameters:
      - name: permanent
        in: query
        required: false
        description: Permanently delete the conversation and its messages immediately instead of moving them to the trash.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Thread deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/email/threads/{thread_id}/messages:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    get:
      operationId: listEmailThreadMessages
      summary: List messages in a thread
      description: 'Returns the messages in a conversation, newest first, both received and sent. To page through older messages, use `starting_after`. The sort order is fixed, so to render the messages in conversation order, reverse the page yourself.


        By default, every message that is not in the trash is returned, whichever folder the conversation is in. Pass `label` to narrow the view instead: use `trash` for trashed messages, or any custom label.


        Pass `include=extracted_text` to inline each message''s extracted plain text. A thread whose retention tier has ended returns `410 Gone`.'
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.messages.list
      parameters:
      - name: direction
        in: query
        required: false
        description: Filter to received (`inbound`) or sent (`outbound`) messages.
        schema:
          $ref: '#/components/schemas/MessageDirection'
      - name: label
        in: query
        required: false
        description: 'Filter to messages that have this label. `trash` lists trashed messages. Any other label, whether that is `archive`, `spam`, `blocked`, `unread` or one of your own, lists the messages that have it and are not in the trash. When omitted, every message that is not trashed is returned, whichever folder the conversation is in.

          '
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: unread
      - name: include
        in: query
        required: false
        description: Set to `extracted_text` to inline each message's extracted plain text.
        schema:
          type: string
          enum:
          - extracted_text
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: Paginated list of messages in the conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - attio
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/email/threads/{thread_id}/messages/{message_id}:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    - name: message_id
      in: path
      required: true
      description: Message ID (`rem_` for a received message, `em_` for a sent one).
      schema:
        type: string
        minLength: 1
        pattern: ^(rem|em)_[0-9a-hjkmnp-tv-z]{26}$
    get:
      operationId: getEmailThreadMessage
      summary: Get a message in a thread
      description: Returns a single message in a conversation, including its extracted plain text. Metadata and extracted text stay readable for the mailbox's retention tier. A message that has aged past its retention tier returns `410 Gone`. A message that exists but does not belong to this thread returns `404`.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.messages.get
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
    patch:
      operationId: updateEmailThreadMessage
      summary: Update a message in a thread
      description: Applies read-state, label, and contact changes to a message in a conversation. Omitted fields are left unchanged. The read flag is only valid on received messages.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      x-snippet-key: none
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailThreadMessageUpdateRequest'
      responses:
        '200':
          description: The updated message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - make
      - n8n
    delete:
      operationId: deleteEmailThreadMessage
      summary: Delete a message in a thread
      description: Moves the message to the trash. Trashed messages are permanently deleted after 30 days, or sooner if the mailbox's retention period ends first. Pass `permanent=true` to permanently delete the message immediately. When the last message in a conversation is permanently deleted, the conversation is deleted with it.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      x-snippet-key: none
      parameters:
      - name: permanent
        in: query
        required: false
        description: Permanently delete the message immediately instead of moving it to the trash.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Message deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - make
      - n8n
  /v1/email/threads/{thread_id}/messages/{message_id}/body:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    - name: message_id
      in: path
      required: true
      description: Message ID (`rem_` for a received message, `em_` for a sent one).
      schema:
        type: string
        minLength: 1
        pattern: ^(rem|em)_[0-9a-hjkmnp-tv-z]{26}$
    get:
      operationId: getEmailThreadMessageBody
      summary: Get a thread message's original body
      description: Returns the original rendered HTML and plain-text body of a message in a conversation. The original body is available for 30 days after the message occurred. Later requests return `410 Gone`, while the message's extracted text stays readable on the message itself.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.messages.body
      responses:
        '200':
          description: The original rendered body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessageBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/email/threads/{thread_id}/messages/{message_id}/raw:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    - name: message_id
      in: path
      required: true
      description: Message ID (`rem_` for a received message, `em_` for a sent one).
      schema:
        type: string
        minLength: 1
        pattern: ^(rem|em)_[0-9a-hjkmnp-tv-z]{26}$
    get:
      operationId: getEmailThreadMessageRaw
      summary: Get a thread message's raw content
      description: Returns the original message exactly as received, in RFC 5322 (MIME) format. Available for received messages for 30 days after the message occurred. Later requests return `410 Gone`. Sent messages have no stored raw form and return `404`.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      responses:
        '200':
          description: The original message in RFC 5322 (MIME) format.
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
  /v1/email/threads/{thread_id}/messages/{message_id}/attachments:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    - name: message_id
      in: path
      required: true
      description: Message ID (`rem_` for a received message, `em_` for a sent one).
      schema:
        type: string
        minLength: 1
        pattern: ^(rem|em)_[0-9a-hjkmnp-tv-z]{26}$
    get:
      operationId: listEmailThreadMessageAttachments
      summary: List a thread message's attachments
      description: Returns the attachments on a message in a conversation. Attachment bytes are downloadable for the mailbox's retention tier after the message occurred. Later requests return `410 Gone`, while the attachment metadata stays readable on the message's `attachment_manifest`.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: email.threads.messages.attachments
      responses:
        '200':
          description: The message's attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessageAttachmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
      - n8n
      - sdk
  /v1/email/threads/{thread_id}/messages/{message_id}/attachments/{attachment_id}:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    - name: message_id
      in: path
      required: true
      description: Message ID (`rem_` for a received message, `em_` for a sent one).
      schema:
        type: string
        minLength: 1
        pattern: ^(rem|em)_[0-9a-hjkmnp-tv-z]{26}$
    - name: attachment_id
      in: path
      required: true
      description: Attachment identifier. Starts with `ea_` for sent mail or `rea_` for received mail.
      schema:
        type: string
        minLength: 1
        pattern: ^(ea|rea)_[0-9a-hjkmnp-tv-z]{26}$
    get:
      operationId: getEmailThreadMessageAttachment
      summary: Get a thread message's attachment
      description: Returns the raw bytes of a single attachment on a conversation message. Works for both received messages (`rem_`) and sent messages (`em_`). Attachment bytes are downloadable for the mailbox's retention tier after the message occurred. Later requests return `410 Gone`.
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      x-snippet-key: none
      responses:
        '200':
          description: The raw attachment bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - make
      - mcp
  /v1/email/threads/{thread_id}/messages/{message_id}/reply:
    parameters:
    - name: thread_id
      in: path
      required: true
      description: Thread identifier. Starts with `thr_`.
      schema:
        $ref: '#/components/schemas/ThreadID'
    - name: message_id
      in: path
      required: true
      description: Message ID (`rem_` for a received message, `em_` for a sent one).
      schema:
        type: string
        minLength: 1
        pattern: ^(rem|em)_[0-9a-hjkmnp-tv-z]{26}$
    post:
      operationId: replyEmailThreadMessage
      summary: Reply to a thread message
      description: 'Sends a reply to a specific message in a conversation, from the mailbox''s own address. Recipients are derived from the message being replied to: for a received message, its Reply-To address when present, otherwise its From address; for a message the mailbox sent, its original To recipients. Set `reply_all` to copy the original To and Cc recipients in as `Cc`, leaving out the mailbox''s own address. The subject and the threading headers that keep the reply in this conversation are set automatically, and the reply is recorded in the conversation. To reply to a conversation as a whole, target its newest received message.'
      tags:
      - email-threads
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
