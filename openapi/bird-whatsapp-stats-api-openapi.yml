        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - make
      - mcp
      - sdk
  /v1/whatsapp/stats/phone-numbers:
    get:
      operationId: getWhatsAppStatsByPhoneNumber
      x-snippet-key: whatsapp.stats.by_phone_number
      summary: Get outbound WhatsApp statistics by phone number
      description: 'Returns delivery counts grouped by business phone number, including whether each is platform-managed or customer-owned. Rows use send-time attribution, rank by accepted volume, and are capped by `limit` (default 50, maximum 200). A recent period under-reports `delivered` while delivery reports are still arriving. The maximum window is 365 days; a longer range returns `422`. A breakdown is already a single-dimension view and takes no dimension filter; to restrict statistics to a single template, category, phone number or tag, use the summary, daily or hourly statistics instead. Each row also carries the same three latency families as the summary: `processing`, `delivery` and `total`. `delivery` is measured from a best-effort handoff timestamp that a fast delivery callback can beat, so it can be absent for a row whose other two families are present.'
      tags:
      - whatsapp-stats
      x-audiences:
      - public
      - command
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: from
        in: query
        required: false
        description: Inclusive start of the window, a calendar day (YYYY-MM-DD). Interpreted in `timezone`, or UTC when omitted. Must not be after `to`. Max window 365 days. Defaults to 30 days before `to` when omitted.
        schema:
          type: string
          format: date
          minLength: 1
          example: '2026-06-14'
      - name: to
        in: query
        required: false
        description: Inclusive end of the window, a calendar day (YYYY-MM-DD). Interpreted in `timezone`, or UTC when omitted. Max window 365 days. Defaults to today in that timezone when omitted.
        schema:
          type: string
          format: date
          minLength: 1
          example: '2026-07-13'
      - $ref: '#/components/parameters/StatsTimezone'
      - name: limit
