          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppInboundStatsComparison'
    WhatsAppEngagementCounts:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'WhatsApp engagement counts for a time bucket, attributed by send time. A message accepted on Monday and read on Tuesday counts in Monday''s bucket. Read rates are available only for the whole period. Very large counts are close estimates rather than exact tallies.

        '
      required:
      - read
      properties:
        read:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages confirmed read by the recipient.
          example: 3105
    WhatsAppStatsPoint:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'WhatsApp lifecycle counts, engagement, and latency percentiles for one time bucket (a calendar day or hour), bucketed by send time. Every count in a bucket describes the messages accepted in it, regardless of when their later events arrived. Rates apply to the whole window rather than individual buckets.

        '
      required:
      - bucket
      - delivery
      - engagement
      - latency
      properties:
        bucket:
          type: string
          minLength: 1
          readOnly: true
          description: The day (YYYY-MM-DD) or hour (RFC 3339, on the hour) this point covers, matching the period's grain.
          example: '2026-05-25'
        delivery:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppDeliveryCounts'
        engagement:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppEngagementCounts'
        latency:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppLatencyStats'
    WhatsAppLatencyStats:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'Latency percentiles in milliseconds for the requested scope:


        - `processing`: From acceptance to WhatsApp handoff.

        - `delivery`: From WhatsApp handoff to delivery confirmation.

        - `total`: From acceptance to delivery confirmation.


        Each family is omitted when no qualifying message contributes a measurement.

        Individual percentiles can also be null. `delivery` is measured on a best-effort basis, so

        it can be absent for a scope whose `processing` and `total` are present.

        '
      example:
        processing:
          p50_ms: 610
          p95_ms: 2140
          p99_ms: 5380
        delivery:
          p50_ms: 1530
          p95_ms: 6820
          p99_ms: 18400
        total:
          p50_ms: 2180
          p95_ms: 9060
          p99_ms: 24300
      properties:
        processing:
          $ref: '#/components/schemas/WhatsAppLatencyQuantiles'
        delivery:
          $ref: '#/components/schemas/WhatsAppLatencyQuantiles'
        total:
          $ref: '#/components/schemas/WhatsAppLatencyQuantiles'
    WhatsAppTagStatsPoint:
      type: object
      additionalProperties: false
      description: Lifecycle counts, derived rates, and engagement for a single tag (name:value) over the requested period.
      required:
      - tag
      - delivery
      - engagement
      - latency
      properties:
        tag:
          type: string
          minLength: 1
          readOnly: true
          description: The tag this row aggregates, in `name:value` form.
