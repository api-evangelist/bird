      - engagement
      - latency
      properties:
        phone_number:
          type: string
          minLength: 1
          readOnly: true
          description: The business sender phone number in E.164 form.
          example: '+13124495569'
        shared:
          type: boolean
          readOnly: true
          description: '`true` for a shared Bird-managed number; `false` for a number owned by your workspace.

            '
          example: true
        delivery:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppDeliveryStats'
        engagement:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppEngagementStats'
        latency:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppLatencyStats'
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    WhatsAppStatsByPhoneNumberResponse:
      type: object
      additionalProperties: false
      description: Per-phone-number breakdown for the requested period, ranked by accepted volume descending and capped at the requested `limit` (default 50, max 200).
      required:
      - period
      - data
      - total
      properties:
        period:
          $ref: '#/components/schemas/WhatsAppStatsSummaryPeriod'
          description: The window the response covers (echoed back), plus `data_as_of`.
        data:
          type: array
          readOnly: true
          description: Phone-number rows ranked by accepted volume descending.
          items:
            $ref: '#/components/schemas/WhatsAppPhoneNumberStatsPoint'
        total:
          type: integer
          minimum: 0
          readOnly: true
          description: Total distinct phone numbers with activity in the period, regardless of `limit`.
          example: 2
    WhatsAppErrorCode:
      type: string
      minLength: 1
      x-extensible-enum:
      - insufficient_balance
      - price_not_found
      - internal_error
      - undeliverable
      - service_window_expired
      - rate_limited
      - recipient_suppressed
      - media_rejected
      description: 'Standardized failure reason:


        - `insufficient_balance`: The workspace wallet could not fund the send.

        - `price_not_found`: No price was configured for the destination and template.

        - `internal_error`: An unexpected service failure occurred.

        - `undeliverable`: The recipient could not be reached.

        - `service_window_expired`: The 24-hour service window closed; send a template.

        - `rate_limited`: The send was throttled.

        - `recipient_suppressed`: The recipient is on the workspace suppression list.

        - `media_rejected`: WhatsApp could not fetch the media URL, or refused the file it found there; `description` carries its reason.


        This is an open enum. Accept unrecognized values.

        '
    WhatsAppInboundStatsByPhoneNumberResponse:
      type: object
      additionalProperties: false
      description: Per-phone-number breakdown of received messages for the requested period, ranked by volume descending and capped at the requested `limit` (default 50, max 200).
      required:
      - period
      - data
      - total
      properties:
        period:
          $ref: '#/components/schemas/WhatsAppStatsSummaryPeriod'
          description: The window the response covers (echoed back), plus `data_as_of`.
        data:
          type: array
          readOnly: true
          description: 'Phone-number rows ranked by received-message volume descending, capped at the requested `limit`. A number with no messages in the period is absent rather than zero-filled, because unlike a time bucket it is not part of a continuous axis.

            '
          items:
            $ref: '#/components/schemas/WhatsAppInboundPhoneNumberStatsPoint'
        total:
          type: integer
          minimum: 0
          readOnly: true
          description: Total distinct phone numbers with received messages in the period, regardless of `limit`. When it exceeds the number of rows returned, the ranking was capped; raise `limit` (up to 200) or narrow the window to see more.
          example: 2
    WhatsAppTemplateCategory:
      type: string
      minLength: 1
      x-extensible-enum:
      - authentication
      - utility
      - marketing
      description: 'Meta''s content classification for a template.


        - `authentication`: delivers one-time passcodes.

        - `utility`: delivers transaction-triggered updates (receipts, order status).

        - `marketing`: carries promotional content.


        The category determines the sender number and price. This is an open enum.

        Accept unrecognized values.

        '
    WhatsAppStatsComparisonDelta:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'Changes from the previous period. A `*_pct_change` value is the signed relative change `(current - previous) / previous` and is null when the previous count is zero. A `*_rate_pp` value is the signed difference between rate fractions and is null when either rate is undefined.

        '
      required:
      - accepted_pct_change
      - sent_pct_change
      - delivered_pct_change
      - failed_pct_change
      - rejected_pct_change
      - read_pct_change
      - delivery_rate_pp
      - failure_rate_pp
      - read_rate_pp
      properties:
        accepted_pct_change:
          type:
          - number
          - 'null'
          readOnly: true
          description: Relative change in accepted messages (`delivery.accepted`) versus the previous period, as a signed fraction. Null when the previous period accepted none.
          example: 0.508
        sent_pct_change:
          type:
          - number
          - 'null'
          readOnly: true
          description: Relative change in sent messages (`delivery.sent`) versus the previous period, as a signed fraction. Null when the previous period had none.
          example: 0.508
        delivered_pct_change:
          type:
          - number
          - 'null'
          readOnly: true
          description: Relative change in delivered messages (`delivery.delivered`) versus the previous period, as a signed fraction. Null when the previous period delivered none.
          example: 0.513
        failed_pct_change:
          type:
          - number
          - 'null'
          readOnly: true
          description: Relative change in failed messages (`delivery.failed`) versus the previous period, as a signed fraction. Null when the previous period had none.
          example: -0.194
        rejected_pct_change:
          type:
          - number
          - 'null'
          readOnly: true
          description: Relative change in rejected messages (`delivery.rejected`) versus the previous period, as a signed fraction. Null when the previous period had none.
          example: 0.084
        read_pct_change:
          type:
          - number
          - 'null'
          readOnly: true
          description: Relative change in messages read (`engagement.read`) versus the previous period, as a signed fraction. Null when the previous period had none.
          example: 0.568
        delivery_rate_pp:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
          readOnly: true
          description: Signed difference between this period's and the previous period's delivery rate, both fractions in [0,1] (multiply by 100 for percentage points). Null when either period's delivery rate is undefined.
          example: 0.0031
        failure_rate_pp:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
          readOnly: true
          description: Signed difference between this period's and the previous period's failure rate, both fractions in [0,1] (multiply by 100 for percentage points). Null when either period's failure rate is undefined.
          example: -0.0045
        read_rate_pp:
          type:
          - number
          - 'null'
          readOnly: true
          description: 'Signed difference between the current and previous read-rate fractions. Multiply by 100 for percentage points. The value can fall outside `[-1, 1]` because a read receipt can arrive for a message whose delivery receipt did not, and high-volume counts are approximate. Null when either rate is undefined.

            '
          example: 0.0232
    WhatsAppCountryStatsPoint:
      type: object
      additionalProperties: false
      description: Lifecycle counts, derived rates, engagement and latency for a single destination country over the requested period.
      required:
      - country
      - delivery
      - engagement
      - latency
      properties:
        country:
          readOnly: true
          description: The destination country this row aggregates, as an ISO 3166-1 alpha-2 code. `ZZ` collects recipients whose country could not be resolved.
          allOf:
          - $ref: '#/components/schemas/CountryCode'
        delivery:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppDeliveryStats'
        engagement:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppEngagementStats'
        latency:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppLatencyStats'
    WhatsAppStatsByErrorCodeResponse:
      type: object
      additionalProperties: false
      description: Per-error-code failure breakdown for the requested period, ranked by failure count descending and capped at the requested `limit` (default 50, max 200).
      required:
      - period
      - data
      - total
      properties:
        period:
          $ref: '#/components/schemas/WhatsAppStatsSummaryPeriod'
          description: The window the response covers (echoed back), plus `data_as_of`.
        data:
          type: array
          readOnly: true
          description: Error-code rows ranked by failure count descending. Empty when no failures occurred in the period.
          items:
            $ref: '#/components/schemas/WhatsAppErrorCodeStatsPoint'
        total:
          type: integer
          minimum: 0
          readOnly: true
          description: Total distinct error codes with failures in the period, regardless of `limit`.
          example: 3
    StatsComparePeriod:
      type: string
      description: 'Set to `previous_period` to also return the same figures for the immediately preceding window of equal length, plus the change between the two, so you can show "+X% vs last period" without a second request.

        '
      enum:
      - previous_period
    WhatsAppDeliveryStats:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'WhatsApp lifecycle counts and rates for the requested period, attributed by send time, so a later delivery stays attributed to the period in which its message was accepted, and a recent period under-reports `delivered` while delivery reports are still arriving. The sibling `engagement` block reports read counts and rates. Rates are null when their denominator is zero. Very large counts are close estimates rather than exact tallies.

        '
      required:
      - accepted
      - sent
      - delivered
      - failed
      - rejected
      - delivery_rate
      - failure_rate
      properties:
        accepted:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages accepted for sending after admission checks. This is the denominator for `delivery_rate` and `failure_rate`.
          example: 4820
        sent:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages handed off for delivery.
          example: 4810
        delivered:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages confirmed delivered to the recipient's device.
          example: 4720
        failed:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages that failed during sending or delivery.
          example: 25
        rejected:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages rejected before any send attempt, because the recipient is on the workspace's suppression list, no reachable recipient was given, the destination has no price, or the wallet could not fund the send. Rejected messages are never charged and are not counted in `accepted`, so the total addressed is `accepted + rejected`. Excluded from `failure_rate`, which covers send failures only.
          example: 412
        delivery_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          readOnly: true
          description: 'Share of accepted messages that were delivered, computed as `delivered / accepted`. Null when no messages were accepted in scope.

            '
          example: 0.9793
        failure_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          readOnly: true
          description: 'Share of accepted messages that ultimately failed, computed as `failed / accepted`. Null when no messages were accepted in scope.

            '
          example: 0.0052
    WhatsAppDeliveryCounts:
      type: object
      additionalProperties: false
      readOnly: true
      description: 'WhatsApp lifecycle counts for a time bucket, attributed by send time. A message accepted on Monday and delivered on Tuesday counts in Monday''s bucket. The sibling `engagement` block reports read counts. Rates are available only for the whole period. Very large counts are close estimates rather than exact tallies.

        '
      required:
      - accepted
      - sent
      - delivered
      - failed
      - rejected
      properties:
        accepted:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages accepted for sending after admission checks.
          example: 4820
        sent:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages handed off for delivery.
          example: 4810
        delivered:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages confirmed delivered to the recipient's device.
          example: 4720
        failed:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages that failed during sending or delivery.
          example: 25
        rejected:
          type: integer
          minimum: 0
          readOnly: true
          description: Distinct messages rejected before any send attempt, because the recipient is on the workspace's suppression list, no reachable recipient was given, the destination has no price, or the wallet could not fund the send. Rejected messages are never charged and are not counted in `accepted`, so the total addressed is `accepted + rejected`. Excluded from `failure_rate`, which covers send failures only.
          example: 412
  parameters:
    StatsTimezone:
      name: timezone
      in: query
      required: false
      description: 'IANA timezone identifier used to group statistics, for example `Asia/Kathmandu`. The default is UTC. Day and hour boundaries, including the default window when `from` and `to` are omitted, follow this timezone. When this parameter is set, pass `from` and `to` as calendar days or `Z` instants instead of timestamps with explicit UTC offsets.

        '
      schema:
        type: string
        minLength: 1
        example: Asia/Kathmandu
    WhatsAppStatsTemplateFilter:
      name: template
      in: query
      required: false
      description: 'Restricts the statistics to one template, identified by its ID (`wat_…`) or slug. Mutually exclusive with the other dimension filters (`category`, `phone_number`, `tag`); only one may be set per request. An ID matches the `template_id` key on a row of the per-template breakdown; a slug is accepted for callers that predate that key and resolves to the same messages.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: ^(wat_[0-9a-hjkmnp-tv-z]{26}|[a-z0-9]([a-z0-9_-]*[a-z0-9])?)$
        example: wat_01krdgeqcxet5s7t44vh8rt9mg
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 'The service is temporarily unavailable. If `Retry-After` is present, wait for that delay before retrying; otherwise, retry with exponential backoff. Reuse the same idempotency key and request when retrying a mutation.

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Keys use

        the format `bk_{region}_*`. The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
