        delivery:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppDeliveryStats'
        engagement:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppEngagementStats'
        latency:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppLatencyStats'
    WhatsAppPhoneNumberStatsPoint:
      type: object
      additionalProperties: false
      description: Lifecycle counts, rates, and engagement for one business phone number over the requested period, including whether the number is shared.
      required:
      - phone_number
      - shared
