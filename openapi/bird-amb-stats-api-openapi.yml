      x-snippet-key: amb.stats.inbound.daily
      summary: Get daily inbound Apple Messages for Business statistics
      description: 'Returns one row of inbound Apple Messages for Business counts per calendar day for the workspace, gap-filled so a silent day is a zero row rather than a missing one. Every row is attributed to the day the inbound event occurred, not to any earlier outbound message.


