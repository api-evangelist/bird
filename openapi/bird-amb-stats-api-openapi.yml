        schema:
          type: string
          format: date-time
          minLength: 1
          example: '2026-05-25T00:00:00Z'
      - name: to
        in: query
        required: false
        description: End of the window (RFC 3339 instant), rounded down to the start of its hour and included. The boundary uses the local hour when `timezone` is set and the UTC hour otherwise, so both bounds are inclusive. The window may not exceed 30 days (720 hours). Defaults to the current hour when omitted.
        schema:
          type: string
          format: date-time
          minLength: 1
          example: '2026-05-25T23:59:59Z'
