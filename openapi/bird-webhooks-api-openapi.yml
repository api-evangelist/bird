    WebhookAttempt:
      type: object
      additionalProperties: false
      required:
      - id
      - event_type
      - status
      - url
      - response_status_code
      - response_duration_ms
      - attempted_at
      properties:
        id:
          type: string
          readOnly: true
          minLength: 1
          description: 'Identifier of this individual delivery attempt. Each retry is a separate attempt with its own id; use `event_id` to group the attempts for one event.

            '
          example: msgatt_3FdaB1NkOmM6m8AxhgEYTJgqHU3
        event_id:
          description: Bird's source event ID, stable across retries of the same event. Null only for older attempts recorded before event IDs were available.
          oneOf:
          - $ref: '#/components/schemas/WebhookEventID'
          - type: 'null'
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          minLength: 1
          enum:
          - delivered
          - pending
          - failed
          description: "Outcome of this attempt.\n\n- `delivered`: your endpoint accepted it with a `2xx` response.\n- `pending`: the attempt is still in flight.\n- `failed`: it returned a non-`2xx` response or no response at all. Automatic\n  retries appear as further attempts with the same `event_id`, so a `failed`\n  attempt is final for the event only once the retry schedule is spent. A\n  replayed delivery takes a single attempt and is never retried.\n"
        url:
          type: string
          format: uri
          minLength: 1
          description: 'URL the request was sent to: the endpoint''s `url` at the time of the attempt, which can differ from the current configuration after an update.

            '
          example: https://example.com/webhooks
        failure_reason:
          type: string
          minLength: 1
          description: 'Why the attempt failed before any request was sent, for example a connector body that could not be rendered or an endpoint whose connection changed after the event was queued. Absent for an attempt that reached the network.

            '
          example: The endpoint's connection changed after this delivery was queued.
        response_status_code:
          type:
          - integer
          - 'null'
          description: HTTP status returned by the receiver. Null when no response was received (timeout, connection error, DNS failure).
          example: 200
        response_body:
          type: string
          description: 'Response body your endpoint returned, which may be truncated. Omitted when no body was returned.

            '
          example: '{"ok":true}'
        response_duration_ms:
          type: integer
          minimum: 0
          description: Round-trip duration in milliseconds.
          example: 87
        attempted_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: 'When this attempt was made. Attempts are listed newest first by this timestamp, and the list''s `before`/`after` parameters bound it.

            '
          example: '2026-05-22T11:50:38.080Z'
