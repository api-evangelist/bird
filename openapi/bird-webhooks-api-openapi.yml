        type: string
        minLength: 1
        maxLength: 4096
      description: 'Values for the connector''s secret fields, keyed by field `name`. Every required secret field must be present, after merging with the stored values on an update, and a key the connector does not declare as secret returns a `422`. No response includes these values.

        '
      example:
        token: example-trigger-token
    WebhookEndpoint:
      allOf:
      - type: object
        required:
        - id
        - url
        - events
        - filter
        - status
        - created_at
        - updated_at
        properties:
          id:
            readOnly: true
            $ref: '#/components/schemas/WebhookEndpointID'
            description: 'Unique identifier for the endpoint (`whk_` prefix). Accepted as `webhook_id` by every `/v1/webhooks/{webhook_id}` operation.

              '
          url:
            type: string
            format: uri
            minLength: 1
            description: HTTPS URL where the API delivers events for this endpoint.
            example: https://example.com/webhook
          description:
            type: string
            minLength: 1
            description: Human-readable label for the endpoint.
            example: Production webhook endpoint
          filter:
            description: Mailbox scope configured through filter, or null.
            example: null
            oneOf:
            - $ref: '#/components/schemas/WebhookFilter'
            - type: 'null'
          events:
            type: array
            items:
              $ref: '#/components/schemas/WebhookEventType'
            description: 'Event types this endpoint is subscribed to; only matching events are delivered. Change the set with [Update a webhook endpoint](/docs/api/reference/update-webhook).

              '
            example:
            - email.delivered
            - email.bounced
          status:
            type: string
            readOnly: true
            minLength: 1
            description: "Delivery state of the endpoint.\n\n- `active`: The initial state; events are being delivered normally.\n- `degraded`: Recent deliveries are failing. We keep delivering and retrying,\n  and the endpoint returns to `active` automatically once deliveries succeed\n  again.\n- `paused`: All delivery is stopped, either because an update set `status` to\n  `paused` or automatically after sustained delivery failures. A paused endpoint\n  never resumes on its own: re-enable it with\n  [Update a webhook endpoint](/docs/api/reference/update-webhook), then\n  [Replay failed deliveries](/docs/api/reference/create-webhook-replay) to\n  recover the deliveries that failed before the pause. Events that arrived\n  while it was paused were never attempted, so a replay does not reach them.\n"
            enum:
            - active
            - degraded
            - paused
          destination:
            allOf:
            - $ref: '#/components/schemas/WebhookDestination'
            description: How each delivery to the endpoint is built.
            example:
              type: webhook
      - $ref: '#/components/schemas/Timestamps'
    AMBNativeAttachment:
      type: object
      additionalProperties: false
      description: Provide source_url or the complete encrypted reference, never both.
      properties:
        source_url:
          type: string
          minLength: 1
          description: HTTPS URL Bird downloads and uploads to Apple. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          x-sensitive: true
        name:
          type: string
          description: Display filename.
        mime_type:
          type: string
          description: Media type of the attachment.
        url:
          type: string
          format: uri
          pattern: ^https://
          minLength: 1
          description: Encrypted attachment URL returned by Apple.
        owner:
          type: string
          minLength: 1
          description: Opaque owner value returned by Apple.
        signature_base64:
          type: string
          minLength: 1
          description: Attachment authorization signature returned by Apple.
        key:
          type: string
          minLength: 66
          maxLength: 66
          pattern: ^00[0-9a-fA-F]{64}$
          description: Attachment decryption key returned by Apple.
        size:
          type: integer
          format: int64
          minimum: 1
          description: Attachment size in bytes.
          maximum: 99999999
      oneOf:
      - required:
        - source_url
        not:
          anyOf:
          - properties:
              url: {}
            required:
            - url
          - properties:
              owner: {}
            required:
            - owner
          - properties:
              key: {}
            required:
            - key
          - properties:
              signature_base64: {}
            required:
            - signature_base64
          - properties:
              size: {}
            required:
            - size
      - required:
        - url
        - owner
        - key
        - signature_base64
        - size
        not:
          properties:
            source_url: {}
          required:
          - source_url
    EventAMBReceived:
      type: object
      additionalProperties: false
      description: Bird received an ordinary customer message from Apple. Invitation responses are excluded.
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          $ref: '#/components/schemas/AMBReceivedEventType'
        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: When this lifecycle event occurred, independent of webhook delivery time.
          example: '2026-09-25T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventAMBMessageData'
          example:
            workspace_id: ws_01krdgeqcxet5s7t44vh8rt9mg
            message:
              id: amb_01krdgh7m2zq8w4x6y9b3c5d7e
              conversation_id: acv_01krdgeqcxet5s7t44vh8rt9mg
              business_account_id: abz_01krdgeqcxet5s7t44vh8rt9mg
              direction: inbound
              status: received
              kind: text
              content:
                type: text
                body: Where is my order?
              locale: en_US
              cost: null
              created_at: '2026-09-25T12:00:00Z'
    SMSErrorCode:
      type: string
      minLength: 1
      x-extensible-enum:
      - invalid_destination
      - unreachable
      - blocked_by_carrier
      - blocked_by_fraud_protection
      - blocked_by_recipient
      - landline_unreachable
      - content_rejected
      - sender_unregistered
      - recipient_opted_out
      - provider_unavailable
      - insufficient_balance
      - unknown
      description: 'Standardized failure reason:


        - `invalid_destination`: The number is unassigned, ported out, or malformed.

        - `unreachable`: The handset is off or outside coverage.

        - `blocked_by_carrier`: The carrier filtered the message.

        - `blocked_by_fraud_protection`: Bird fraud protection blocked suspected SMS pumping.

        - `blocked_by_recipient`: The recipient device blocked the sender.

        - `landline_unreachable`: The destination is a landline that does not accept SMS.

        - `content_rejected`: The carrier rejected the content.

        - `sender_unregistered`: The sender is not registered for the destination.

        - `recipient_opted_out`: The recipient is on a suppression list.

        - `provider_unavailable`: The provider remained unavailable after retries.

        - `insufficient_balance`: The workspace wallet could not fund the send.

        - `unknown`: The failure could not be classified.


        This is an open enum. Accept unrecognized values.

        '
    EventEmailMailboxMessageSentData:
      type: object
      additionalProperties: false
      description: Payload of the email_mailbox.message_sent event.
      required:
      - message_id
      - mailbox_id
      - thread_id
      properties:
        message_id:
          $ref: '#/components/schemas/EmailID'
          description: ID of the sent message. Per-recipient `email.*` events use this value as `email_id`. Use it to deduplicate events when you subscribe to both event families.
        mailbox_id:
          $ref: '#/components/schemas/MailboxID'
          description: ID of the mailbox the message was sent from.
        thread_id:
          $ref: '#/components/schemas/ThreadID'
          description: ID of the thread the message belongs to.
    EventEmailMailboxMessageSent:
      type: object
      additionalProperties: false
      description: A mailbox message was handed off for delivery. This event fires once per message. The same send also emits per-recipient `email.*` events. Choose one event family for each automation and deduplicate mailbox events by `message_id`.
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          type: string
          minLength: 1
          enum:
          - email_mailbox.message_sent
          description: Event type.
          example: email_mailbox.message_sent
        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: When the event occurred.
          example: '2026-07-08T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventEmailMailboxMessageSentData'
    EventWhatsAppGroupJoinRequestRevoked:
      type: object
