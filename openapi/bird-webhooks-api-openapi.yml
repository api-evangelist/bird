          description: When the person withdrew their request.
          example: '2026-09-22T11:12:03Z'
        data:
          $ref: '#/components/schemas/EventWhatsAppGroupJoinRequestData'
    AMBReceivedEventType:
      type: string
      minLength: 1
      enum:
      - amb.received
      description: Always `amb.received` for this event.
      example: amb.received
    AMBFormPageType:
      type: string
      minLength: 1
      enum:
      - select
      - picker
      - date_picker
      - input
    EmailBroadcastID:
      type: string
      minLength: 1
      pattern: ^eb_[0-9a-hjkmnp-tv-z]{26}$
      example: eb_01krdgeqcxet5s7t44vh8rt9mg
    ThreadID:
      type: string
      minLength: 1
      pattern: ^thr_[0-9a-hjkmnp-tv-z]{26}$
      example: thr_01krdgeqcxet5s7t44vh8rt9mg
    EventWhatsAppReceived:
      type: object
      additionalProperties: false
      description: 'A contact sent the business a WhatsApp message. Not raised while the Meta Business Agent holds the conversation; the message is still stored and returned by the message reads.

        '
      required:
