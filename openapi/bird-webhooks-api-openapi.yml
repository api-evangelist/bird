    AMBMessage:
      type: object
      additionalProperties: false
      dependentRequired:
        reply_message_id:
        - replied_at
        replied_at:
        - reply_message_id
      required:
      - id
      - conversation_id
      - business_account_id
      - direction
      - status
      - kind
      - content
      - created_at
      - cost
      - requested_language
      - resolved_language
      - template_id
      - template_version_id
      - template_content_hash
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageID'
          description: ID of the message, assigned when it is accepted or received. Pass it as `message_id` to the get-message and list-events endpoints.
        conversation_id:
          readOnly: true
          $ref: '#/components/schemas/AMBConversationID'
          description: The conversation this message belongs to.
        business_account_id:
          readOnly: true
          $ref: '#/components/schemas/AMBBusinessID'
          description: The business the message was sent from or received by.
        from:
          type: string
          readOnly: true
          minLength: 1
          description: Apple business identifier on outbound messages, or the customer's opaque Apple identifier on inbound messages. Omitted when that address is unavailable on a historical record.
        to:
          type: string
          readOnly: true
          minLength: 1
          description: Customer's opaque Apple identifier on outbound messages, or the Apple business identifier on inbound messages. Omitted when that address is unavailable on a historical record.
        direction:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageDirection'
        status:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageStatus'
        kind:
          readOnly: true
          $ref: '#/components/schemas/AMBContentKind'
          description: Derived content classification for filtering and statistics.
        source:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageSource'
          description: Who sent this message. Absent on an inbound message, which has no source to report.
        content:
          readOnly: true
          description: Native message content. Outgoing interactions contain requests; incoming interactions contain replies.
          anyOf:
          - $ref: '#/components/schemas/AMBMessageContent'
          - $ref: '#/components/schemas/AMBInboundContent'
          x-sensitive: true
        in_reply_to_message_id:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageID'
          description: Original message matched through Apple’s request identifier within the same workspace, business, and conversation. Omitted when no verified match exists, including when more than one sent message in the conversation uses the reply's request identifier.
        reply_message_id:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageID'
          example: amb_01krdgh7m2zq8w4x6y9b3c5d7e
          description: Latest customer reply whose `in_reply_to_message_id` names this message. Omitted until a reply is matched, and in webhook payloads.
        replied_at:
          type: string
          format: date-time
          readOnly: true
          description: When Apple delivered the reply in `reply_message_id` to Bird. This can be slightly earlier than that reply's `created_at`, which records when Bird processed it. Omitted until a reply is matched, and in webhook payloads.
          example: '2026-10-13T10:09:00Z'
        locale:
          type:
          - string
          - 'null'
          readOnly: true
          minLength: 1
          description: Locale for this message, preserved in Apple’s format, for example en_US. Outbound messages use the request override, then the conversation locale, then the business default. Inbound messages preserve the locale in Apple’s callback. Null when unknown.
          example: en_US
        category:
          type: string
          readOnly: true
          description: The category this message was sent with, for reporting only. It does not affect sending or suppression policy, or select an Apple department or purpose. Defaults to an empty string when a send names no category. Absent on an inbound message, which has no category to report.
          example: order_update
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSON object for per-message context. Maximum 2 KB serialized. Top-level keys beginning with `__bird` are reserved. Returned in the send response, message reads and customer message webhooks.
          readOnly: true
        tags:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Tag'
          description: Structured `{name, value}` filter labels applied to this message. Absent on an inbound message.
        cost:
          readOnly: true
          $ref: '#/components/schemas/MessageCost'
          description: Recorded per-message charge before MAC pricing. Null in the initial send response, while unpriced, and for MAC-covered replies. MAC fees belong to monthly contact usage, not individual messages. Historical charges have no priced passthrough component.
        last_error:
          readOnly: true
          description: Failure detail on a message whose send failed or that Bird rejected before any send attempt. Omitted when there is no failure detail.
          $ref: '#/components/schemas/AMBError'
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: The moment this message was accepted (outbound), or recorded by Bird after Apple delivered it (inbound). This is the timestamp the outbound statistics families bucket and attribute on; there is no separate `accepted_at` field.
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the selected sending outcome occurred. Null unless the current status is `sent` and the message is outbound. For older messages without a retained sending event, the stored record time is used.
        data_ref:
          $ref: '#/components/schemas/AMBRichLinkReference'
          readOnly: true
          description: Reusable encrypted content reference returned by Apple after a successful send. Absent until Apple returns one.
        group:
          type: string
          readOnly: true
          minLength: 1
          description: Apple department identifier carried by this message. Omitted when absent from the message or unavailable on a historical record.
        intent:
          type: string
          readOnly: true
          minLength: 1
          description: Apple purpose identifier carried by this message. Omitted when absent from the message or unavailable on a historical record.
        requested_language:
          readOnly: true
          description: 'The template language requested by the send, in canonical form. Null when the send named no language or used no template.

            '
          oneOf:
          - $ref: '#/components/schemas/LanguageTag'
          - type: 'null'
        resolved_language:
          readOnly: true
          description: 'The template language whose text was rendered, in canonical form. Null when the send used no template. This can differ from `requested_language` when the template''s fallback policy selects another language.

            '
          oneOf:
          - $ref: '#/components/schemas/LanguageTag'
          - type: 'null'
        template_id:
          readOnly: true
          description: The template rendered for this message, or null for a message sent with native content.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateID'
          - type: 'null'
        template_version_id:
          readOnly: true
          description: 'The workspace published version or synthetic built-in version rendered at acceptance, or null for a message sent with native content. For a built-in template, `template_content_hash` identifies the exact catalogue source.

            '
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        template_content_hash:
          readOnly: true
          description: The rendered language's source fingerprint, or null for a message sent with native content.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateContentHash'
          - type: 'null'
    AMBPaymentID:
