          - $ref: '#/components/schemas/MailboxID'
          description: 'Mailbox to receive events for. Must belong to this workspace; a mailbox outside it returns `422`.

            '
      description: 'Exact match on `mailbox_id`, for `email_mailbox.*` events only; the mailbox must belong to this workspace. Cannot be combined with Realtime app scope. Omit on create for all resources; on update omit to keep, send `null` to clear.

        '
      example:
        mailbox_id: mbx_01kr97a6rje4wbe5z40wxdfcy9
    WhatsAppContactAddress:
      type: object
      additionalProperties: false
      description: One postal address on a shared contact card.
      properties:
        street:
          type: string
          example: 1 Hacker Way
        city:
          type: string
          example: Menlo Park
        state:
          type: string
          example: CA
        zip:
          type: string
          example: '94025'
        country:
          type: string
          example: United States
        country_code:
          type: string
          description: 'The country as the card holds it, left exactly as WhatsApp sent it: it describes a postal address rather than a routing destination.

            '
          example: US
        type:
          type: string
          description: 'The label attached to this value, for example `CELL`, `Home` or `iPhone`. Free text: WhatsApp defines no vocabulary. A label on a received card is lowercased; one this workspace sent reads back exactly as sent.

            '
          example: Home
    ConnectionConfig:
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 2048
      description: 'Values for the connector''s nonsecret fields, keyed by field `name`, such as the URL the endpoint''s requests go to. A URL must be HTTPS, on one of the connector''s `allowed_origins`, and under its `path_prefix` when it has one. It cannot include user info, a fragment, an IP address as its host, dot segments, or encoded slashes.

        '
      example:
        trigger_url: https://agents.example.com/triggers/support
    AMBNativeInboundInteractiveContent:
      type: object
      additionalProperties: false
      required:
      - type
      - interactive_data
      properties:
        type:
          const: interactive
          description: Always interactive.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Message body supplied by Apple.
          x-sensitive: true
        subject:
          type: string
          description: Message subject supplied by Apple.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments supplied by Apple.
        interactive_data:
          $ref: '#/components/schemas/AMBNativeInboundInteractiveData'
    EventWhatsAppGroupJoinRequestData:
      type: object
      additionalProperties: false
      description: 'Payload shared by the whatsapp.group.join_request_created and whatsapp.group.join_request_revoked events. Everything about the person who asked is nested under `join_request`; the sibling identifiers name the business side.

        '
      required:
      - group_id
      - whatsapp_number_id
      - workspace_id
      - join_request
      properties:
        group_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupID'
          description: The group the person asked to join.
          example: wag_01krdgeqcxet5s7t44vh8rt9mg
        whatsapp_number_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppNumberID'
          description: The business number that created the group and administers it.
          example: wan_01krdgeqcxet5s7t44vh8rt9mg
        workspace_id:
          allOf:
          - $ref: '#/components/schemas/WorkspaceID'
          description: The workspace that owns the group.
          example: ws_01krdgeqcxet5s7t44vh8rt9mg
        join_request:
          $ref: '#/components/schemas/WhatsAppGroupJoinRequestSummary'
          description: The request itself, and who made it.
    WhatsAppLocation:
      type: object
      additionalProperties: false
      description: 'Location content of a WhatsApp message: a point on the map the recipient can open in their maps app.

        '
      properties:
        latitude:
          type: number
          format: double
          description: Latitude in decimal degrees.
          example: 52.3702
        longitude:
          type: number
          format: double
          description: Longitude in decimal degrees.
          example: 4.8952
        name:
          type: string
          description: Name of the place. Absent when the sender shared a plain pin.
          example: Bird HQ
        address:
          type: string
          description: Street address of the place. Shown only when `name` is also set.
          example: Keizersgracht 117, Amsterdam
        url:
          type: string
          format: uri
          description: 'Link to the place, which WhatsApp includes mainly for business locations. Present on an inbound message when the sender''s client supplied one, and absent on a message you sent, since sending a location does not support this field.

            '
          example: https://www.google.com/maps/place/Statue+of+Liberty/@40.6246301,-74.5291919,124716m/
    InboundEmailMessageID:
      type: string
      minLength: 1
      pattern: ^rem_[0-9a-hjkmnp-tv-z]{26}$
      example: rem_01krdgeqcxet5s7t44vh8rt9mg
    AMBNativeRichLinkContent:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          const: rich_link
          description: Always rich_link.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Automatic introductions for rich links are enabled regionally in stages. When enabled for a new send, a nonblank body is sent as a separate text before the link. All parts belong to one message, which becomes sent after Apple accepts all parts. Before activation, and for retries retaining legacy behavior, body is included in the rich link request and is not guaranteed to appear on the device. To ensure an introduction without relying on activation, send a separate text message and omit body from the rich link. Use one U+FFFC object replacement character per attachment to control placement.
          x-sensitive: true
        subject:
          type: string
          description: Subject displayed above the message body.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments. Each object supplies a source URL or an encrypted Apple reference.
        rich_link_data:
          $ref: '#/components/schemas/AMBNativeRichLinkData'
        rich_link_data_ref:
          $ref: '#/components/schemas/AMBRichLinkReference'
        rich_link_construct:
          $ref: '#/components/schemas/AMBRichLinkConstruct'
      oneOf:
      - required:
        - rich_link_data
        not:
          properties:
            rich_link_data_ref: {}
            rich_link_construct: {}
          required:
          - rich_link_data_ref
          - rich_link_construct
      - required:
        - rich_link_data_ref
        not:
          properties:
            rich_link_data: {}
            rich_link_construct: {}
          required:
          - rich_link_data
          - rich_link_construct
      - required:
        - rich_link_construct
        not:
          properties:
            rich_link_data: {}
            rich_link_data_ref: {}
          required:
          - rich_link_data
          - rich_link_data_ref
    AMBConversationID:
      type: string
      minLength: 1
      pattern: ^acv_[0-9a-hjkmnp-tv-z]{26}$
      example: acv_01krdgeqcxet5s7t44vh8rt9mg
    EventEmailProcessedData:
      type: object
      description: Payload of the email.processed event.
      allOf:
      - $ref: '#/components/schemas/EventEmailBase'
    AMBStatsErrorCode:
      type: string
      minLength: 1
      pattern: ^(bird:[a-z0-9_]+|apple:\d{3})$
      description: 'Machine-readable reason a send failed, in one of two namespaces: `bird:` for a reason Bird''s own pipeline assigned (for example `bird:business_not_registered`), or `apple:` followed by the HTTP status Apple''s API returned for the send attempt (for example `apple:404`). This is an open, growing set in both namespaces; accept unrecognized values.

        '
      example: bird:business_not_registered
    SMSError:
      type:
      - object
      - 'null'
      additionalProperties: false
      readOnly: true
      required:
      - code
      - description
      - occurred_at
      description: Failure detail for a message that could not be delivered or was rejected.
      properties:
        code:
          $ref: '#/components/schemas/SMSErrorCode'
        description:
          type: string
          minLength: 1
          description: 'The failure in words: the provider''s reason text, or Bird''s explanation for a fraud protection block or a message refused before submission. Free-form, so branch on `code` and show this to a human.'
          example: Carrier filtered as spam
        carrier_error_code:
          type:
          - string
          - 'null'
          description: Raw provider-supplied error code, finer-grained than the `code` that normalizes it. Not a Bird-defined value, so quote it to support when asking why a message failed. Null when the provider sent none, including any failure decided before one was reached.
        occurred_at:
          type: string
          format: date-time
          minLength: 1
          description: When the failure occurred.
    EventEmailBounced:
      type: object
      additionalProperties: false
      description: An outbound email permanently failed at the recipient's mail server. Fires once per recipient.
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          type: string
          minLength: 1
          enum:
          - email.bounced
          description: Event type.
          example: email.bounced
        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: Time the bounce was recorded.
          example: '2026-05-21T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventEmailBouncedData'
    WebhookTestResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - response_status_code
      - response_duration_ms
      properties:
        status:
          type: string
          minLength: 1
          enum:
          - delivered
          - failed
          description: 'Whether your endpoint accepted the test event. `delivered` means it returned a `2xx` status; `failed` means it returned a non-`2xx` status or could not be reached (see `error` for the latter).

            '
        response_status_code:
          type:
          - integer
          - 'null'
          description: HTTP status returned by your endpoint. Null when no response was received (timeout, connection error, DNS failure).
          example: 200
        response_body:
          type: string
          description: 'Response body returned by your endpoint, truncated to the first 1024 bytes. Omitted when your endpoint returned no body or could not be reached.

            '
          example: OK
        response_duration_ms:
          type: integer
          minimum: 0
          description: Round-trip delivery latency in milliseconds.
          example: 142
        event_payload:
          description: 'The full event body delivered to your endpoint. Test sends use a minimal synthetic body rather than a full event payload, so this field is omitted.

            '
          $ref: '#/components/schemas/WebhookEvent'
        error:
          type: string
          minLength: 1
          description: A short explanation of why the event could not be delivered. Present only when your endpoint could not be reached.
          example: connection refused
    AMBSuppressionReason:
      type: string
      minLength: 1
      x-extensible-enum:
      - manual
      - opted_out
      description: 'Why the handle is suppressed. `manual` means it was added directly through this API or the dashboard. `opted_out` covers every case where Apple or the customer signaled they should not be contacted: a close, a permanent delivery failure, a declined invitation, or a stop keyword. This list grows over time, so treat an unknown value as informational rather than rejecting the record.

        '
      example: manual
    EventSMSDelivered:
      type: object
