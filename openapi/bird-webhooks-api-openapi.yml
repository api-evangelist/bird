        workspace_id:
          $ref: '#/components/schemas/WorkspaceID'
          description: The workspace the suppression belongs to.
          example: ws_01krdgeqcxet5s7t44vh8rt9mg
    EventVerifyAttemptDeliveredData:
      type: object
