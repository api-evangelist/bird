          $ref: '#/components/schemas/EventWhatsAppReceivedData'
    EventAMBSent:
      type: object
      additionalProperties: false
      description: Apple accepted an outbound message from Bird. This does not establish delivery to the customer or a read receipt.
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          $ref: '#/components/schemas/AMBSentEventType'
        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: When this lifecycle event occurred, independent of webhook delivery time.
          example: '2026-09-25T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventAMBMessageData'
          example:
            workspace_id: ws_01krdgeqcxet5s7t44vh8rt9mg
            message:
              id: amb_01krdgeqcxet5s7t44vh8rt9mg
              conversation_id: acv_01krdgeqcxet5s7t44vh8rt9mg
              business_account_id: abz_01krdgeqcxet5s7t44vh8rt9mg
              direction: outbound
              status: sent
              kind: text
              source: operator
              content:
                type: text
                body: Your order has shipped.
              locale: en_US
