            format: date-time
            description: Time the verification was verified.
            example: '2026-07-24T12:01:00Z'
    EventSMSBase:
      type: object
      description: Identity fields shared by every SMS lifecycle event payload.
      required:
      - sms_id
      - workspace_id
      - to
      - from
      - tags
      - metadata
      - requested_language
      - resolved_language
      - template_id
      - template_version_id
      - template_content_hash
      properties:
        sms_id:
          $ref: '#/components/schemas/SMSMessageID'
          description: ID of the SMS message.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceID'
          description: ID of the workspace that owns this event.
        to:
          type: string
          minLength: 1
          description: 'Where the message went. On an outbound message this is the recipient''s phone number in E.164 format; on an inbound one it is your own number that received it.

            '
          example: '+15551234567'
        from:
          type: string
          minLength: 1
          description: 'Where the message came from. On an outbound message this is the sender you sent it from: an E.164 number, an alphanumeric sender ID, or a short code. On an inbound one it is the phone number that sent it to you.

            '
          example: '+15557654321'
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Tag'
          description: 'Tags provided on the send request, echoed on every event for the message so you can route and correlate without an extra lookup. Null when the message carried no tags.

            '
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'The metadata object provided on the send request, echoed on every event for the message so you can correlate events with your own records. Null when the message carried no metadata.

            '
          example:
            order_id: ord_123
        requested_language:
          description: 'The template language requested by the send, in canonical form. Null when the send named no language or used no template.

            '
          oneOf:
          - $ref: '#/components/schemas/LanguageTag'
          - type: 'null'
        resolved_language:
          description: 'The template language rendered at acceptance, in canonical form. Null when the send used no template.

            '
          oneOf:
          - $ref: '#/components/schemas/LanguageTag'
          - type: 'null'
        template_id:
          description: The template rendered at acceptance, or null for a free-text message.
          oneOf:
          - $ref: '#/components/schemas/SMSTemplateID'
          - type: 'null'
        template_version_id:
          description: 'The workspace published version or synthetic built-in version rendered at acceptance, or null for a free-text message. For a built-in template, `template_content_hash` identifies the exact catalogue source.

            '
          oneOf:
          - $ref: '#/components/schemas/SMSTemplateVersionID'
          - type: 'null'
        template_content_hash:
          description: The rendered language's source fingerprint, or null for a free-text message.
          oneOf:
          - $ref: '#/components/schemas/SMSTemplateContentHash'
          - type: 'null'
        cost:
          $ref: '#/components/schemas/MessageCost'
          description: 'Message cost as of this event, split into the platform charge and any

            third-party fees passed through. Null on an event that priced nothing.


            Components are named so you can merge them per component rather than replacing the

            object: webhook delivery is not ordered, so an older event arriving late would

            otherwise overwrite a newer figure. Take the latest `occurred_at` you have seen for

            each component. `amount` is the sum of the components in this payload and does not

            represent a settled total.

            '
    SMSTemplateID:
      type: string
      minLength: 1
      pattern: ^smt_[0-9a-hjkmnp-tv-z]{26}$
      example: smt_01krdgeqcxet5s7t44vh8rt9mg
    EmailBounceType:
      type: string
      minLength: 1
      enum:
      - hard
      - soft
      - undetermined
      - admin
      - block
      description: 'Bounce classification.


        - `hard`: A permanent failure, such as an invalid address or a domain that does not exist.

        - `soft`: A transient failure, such as a full mailbox or a server that is temporarily unavailable.

        - `block`: The receiving mail server refused the sending IP on reputation grounds.

        - `admin`: An administrative refusal, such as relaying denied or a blocklisted domain.

        - `undetermined`: The receiving server''s response was ambiguous.

        '
      example: hard
    WebhookReplayRequest:
      type: object
      additionalProperties: false
      properties:
        since:
          type: string
          format: date-time
          minLength: 1
          description: 'Replay events whose delivery attempt failed at or after this timestamp. The bound is inclusive and applies to attempt time, not to when the event occurred, so a retry that trailed its event by a day falls in the window by the hour it was attempted. Defaults to 24 hours before the request when omitted. Attempts are retained for three days, so that is the oldest history a replay reaches: an earlier `since` widens the window without recovering anything older.

            '
          example: '2026-05-07T00:00:00Z'
        until:
          type: string
          format: date-time
          minLength: 1
          description: 'Replay events whose delivery attempt failed at or before this timestamp, on the same attempt-time bound as `since`. Omitted, it resolves to the time of the request.

            '
          example: '2026-05-07T23:59:59Z'
    AMBNativeInboundListPickerSection:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        title:
          type: string
          minLength: 1
          description: Heading shown above this section's rows.
        order:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Where this section sits relative to its siblings, ascending. Sections omitting it are laid out in list order, after any that specify one.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AMBListPickerItem'
          description: The rows in this section.
        multiple_selection:
          type: boolean
          default: false
          description: Whether the customer can select more than one row in this section.
    AMBMessageStatus:
      type: string
      minLength: 1
      enum:
      - accepted
      - sent
      - send_failed
      - rejected
      - received
      description: "Send status:\n\n- `accepted`: Accepted and queued for delivery to Apple.\n- `sent`: Handed to Apple. There is no delivery or read receipt on this\n  channel, so `sent` is the furthest an outbound message's status\n  advances.\n- `send_failed`: Sending stopped because of a business or conversation\n  restriction, a recipient opt-out, an Apple refusal, or exhausted attempts.\n  An earlier attempt may have reached Apple if its response or the local\n  record of success was lost. See `last_error` for why sending stopped.\n- `rejected`: Refused by Bird before any send attempt and never charged:\n  the destination has no price, the wallet could not fund the send, or the\n  content cannot be sent yet. See `last_error`.\n- `received`: Received as an inbound message.\n"
    WebhookAttemptList:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          description: Delivery attempts, newest first.
          items:
            $ref: '#/components/schemas/WebhookAttempt'
    AMBMessageBubbleStyle:
      type: string
      enum:
      - icon
      - small
      - large
      description: Layout of an Apple interactive message bubble.
    AMBFormInputPage:
      allOf:
      - $ref: '#/components/schemas/AMBFormPageCommon'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            minLength: 1
            const: input
          hint_text:
            type: string
          options:
            $ref: '#/components/schemas/AMBFormInputOptions'
      unevaluatedProperties: false
    EventSMSUndelivered:
      type: object
      additionalProperties: false
      description: The carrier reported a non-permanent failure to deliver the message.
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          type: string
          minLength: 1
          enum:
          - sms.undelivered
          description: Event type.
          example: sms.undelivered
        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: Time the non-delivery was recorded.
          example: '2026-05-21T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventSMSUndeliveredData'
    WhatsAppAddress:
      type: object
      additionalProperties: false
      description: 'Sender or recipient of a WhatsApp message: a phone number, a business-scoped user ID, or both. A message received from a WhatsApp user carries whatever profile they publish, which may be neither.'
      properties:
        phone_number:
          type: string
          minLength: 1
          description: Phone number in E.164 format, when known.
          example: '+15550001111'
        bsuid:
          type: string
          minLength: 1
          description: 'Business-scoped user ID, Meta''s identifier for the WhatsApp user. Present only on the WhatsApp-user side of the message.

            '
          example: NL.xxxx
        group_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupID'
          description: 'The group this address was addressed as, or reached through. It appears on a message''s `to` and nowhere else: never on `from`, and never on an event''s `recipient`. Outbound, it stands in for the recipient, because a group send names no single phone number. Inbound, it qualifies one: `to` carries the business `phone_number` that received the message and the group it arrived through, while `from` stays the participant who wrote it. Its presence on `to` is what tells a group message from a one-to-one one, in either direction.

            '
        username:
          type: string
          minLength: 1
          description: 'Present only on a message received from a WhatsApp user, on `from`; never on an outbound send''s `to`, where the profile is not known. Absent when the contact has not adopted one, and on a message received before this workspace started recording them. Same form as a number''s own username (`WhatsAppNumberProfile.username`), without a leading `@`; a message cannot be addressed by it.

            '
        display_name:
          type: string
          minLength: 1
          description: 'Present only on a message received from a WhatsApp user, on `from`; never on an outbound send''s `to`, where the profile is not known. Absent when the message carries no profile, and on a message received before this workspace started recording them.

            '
    AMBMessageBubble:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Text shown on the message bubble.
        subtitle:
          type: string
          maxLength: 512
          description: Secondary text shown below the title.
        style:
          $ref: '#/components/schemas/AMBMessageBubbleStyle'
          description: Bubble layout. Apple defaults to `icon` when omitted and ignores it for custom iMessage apps.
        image_identifier:
          type: string
          minLength: 1
          description: Identifier of an image in interactive_data.data.images. Apple ignores it for custom iMessage apps.
        image_title:
          type: string
          maxLength: 512
          description: Title shown over an attached image in a custom iMessage app bubble.
        image_subtitle:
          type: string
          maxLength: 512
          description: Subtitle shown over an attached image in a custom iMessage app bubble.
        secondary_subtitle:
          type: string
          maxLength: 512
          description: Right-aligned title in a custom iMessage app bubble.
        tertiary_subtitle:
          type: string
          maxLength: 512
          description: Right-aligned subtitle in a custom iMessage app bubble.
    EventVerifyBase:
      type: object
      description: Identity fields shared by every Verify lifecycle event payload.
      required:
      - verification_id
      - workspace_id
      - to
      - metadata
      properties:
        verification_id:
          $ref: '#/components/schemas/VerificationID'
          description: ID of the verification session.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceID'
          description: ID of the workspace that owns this event.
        to:
          $ref: '#/components/schemas/VerificationTo'
          description: The recipient identity of the verification session (email address, phone number, or both), echoed on every event so you can correlate without an extra lookup. An individual attempt reports the single address it was dispatched to in its own `address` field.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'The metadata object provided when the verification was created, echoed on every event for the session so you can correlate events with your own records. Null when the verification carried no metadata.

            '
          example:
            user_id: usr_123
    EventWhatsAppSentData:
      type: object
      description: Payload of the whatsapp.sent event.
      allOf:
      - $ref: '#/components/schemas/EventWhatsAppBase'
    VerificationID:
      type: string
      minLength: 1
      pattern: ^vrf_[0-9a-hjkmnp-tv-z]{26}$
      example: vrf_01krdgeqcxet5s7t44vh8rt9mg
    EventWhatsAppSent:
      type: object
      additionalProperties: false
      description: 'The message was handed to Meta for delivery. Raised for a message your workspace sent through Bird, for one sent from the WhatsApp Business app on a number shared with it (`origin: business_app_echo`), and for one the Meta Business Agent sent on your number (`origin: business_agent_echo`).

        '
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          type: string
          minLength: 1
          enum:
          - whatsapp.sent
          description: Event type.
          example: whatsapp.sent
        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: Time the message was handed to Meta for delivery.
          example: '2026-07-16T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventWhatsAppSentData'
    EventWhatsAppReactedData:
      type: object
      additionalProperties: false
      description: 'Payload of the whatsapp.reacted event. Names the message the contact reacted to, not the reaction, because a reaction is an annotation on a message rather than a message of its own.

        '
      required:
      - whatsapp_id
      - emoji
      - from
      - to
      - workspace_id
      properties:
        whatsapp_id:
          $ref: '#/components/schemas/WhatsAppMessageID'
          description: 'The message the contact reacted to. WhatsApp accepts a reaction on a message up to 30 days old, and we keep provider ids for 15, so a reaction placed on a message older than that cannot be matched to it and raises no event at all.

            '
        emoji:
          type:
          - string
          - 'null'
          description: 'The emoji the contact placed, as WhatsApp sent it and not normalized. Null when they took their reaction back rather than placing one. Always present, so null is the removal itself rather than a value we are missing.

            '
          example: 👍
        from:
          allOf:
          - $ref: '#/components/schemas/WhatsAppAddress'
          description: The contact who reacted, as WhatsApp identified them.
        to:
          allOf:
          - $ref: '#/components/schemas/WhatsAppAddress'
          description: Your WhatsApp number, the business side of the conversation.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceID'
          description: ID of the workspace that owns this event.
    AMBNativeInboundPayment:
      type: object
      additionalProperties: false
      x-sensitive: true
      properties:
        state:
          type: string
          description: Payment state reported by Apple. This does not confirm that a payment settled.
    WhatsAppUnsupported:
      type: object
      additionalProperties: false
      description: 'A message whose content we do not model, named so it is visible in the message log rather than arriving empty. Never on a message sent through Bird.

        '
      required:
      - type
      properties:
        type:
          type: string
          minLength: 1
          x-extensible-enum:
          - reaction
          - interactive
          - button
          - order
          - system
          - unsupported
          description: 'The WhatsApp content type we did not model. `unsupported` is not a placeholder here: WhatsApp reports its own `unsupported` type for a message its own clients cannot render, and that arrives as this value. Open enum: WhatsApp adds content types over time, so treat an unrecognized value as a future type rather than an error.

            '
          example: reaction
      example:
        type: reaction
    WorkspaceID:
      type: string
      minLength: 1
      pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
      example: ws_01krdgeqcxet5s7t44vh8rt9mg
    PreferenceID:
      type: string
      minLength: 1
      pattern: ^prf_[0-9a-hjkmnp-tv-z]{26}$
      example: prf_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppGroupJoinRequestCreatedEventType:
      type: string
      minLength: 1
