        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: Time the carrier confirmed delivery.
          example: '2026-05-21T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventSMSDeliveredData'
    AMBTemplateVersionID:
      type: string
      minLength: 1
      pattern: ^amv_[0-9a-hjkmnp-tv-z]{26}$
      example: amv_01krdgeqcxet5s7t44vh8rt9mg
    EventSMSReceived:
      type: object
      additionalProperties: false
      description: A message was received on one of your numbers.
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          $ref: '#/components/schemas/SMSReceivedEventType'
        timestamp:
          type: string
          minLength: 1
          format: date-time
          description: Time the sender sent the message.
          example: '2026-05-21T12:00:00Z'
        data:
          $ref: '#/components/schemas/EventSMSReceivedData'
    EventSMSUndeliveredData:
      type: object
      description: Payload of the sms.undelivered event.
      allOf:
      - $ref: '#/components/schemas/EventSMSBase'
      - type: object
        required:
        - error
        properties:
          error:
            $ref: '#/components/schemas/SMSError'
            description: Why the message was not delivered.
    EventWhatsAppDeliveredData:
      type: object
      description: Payload of the whatsapp.delivered event.
      allOf:
      - $ref: '#/components/schemas/EventWhatsAppBase'
      - type: object
        properties:
          recipient:
            allOf:
            - $ref: '#/components/schemas/WhatsAppAddress'
            description: 'The participant delivery was confirmed to, on a group message. A group send raises this event once per participant, so this is what tells the deliveries apart. Absent on a one-to-one message, whose `to` already names its recipient.

              '
    MessageCost:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - amount
      - currency_code
      - transaction_amount
      - passthrough_amount
      description: 'What was charged for a message, split into the components that make it up. `null` until at least one component has been priced.

        '
      properties:
        amount:
          type: string
          minLength: 1
          readOnly: true
          description: 'Total charged, as a decimal string: the sum of the components below. Net of tax, which applies to your wallet balance rather than to an individual charge.

            '
          example: '0.00990'
        currency_code:
          readOnly: true
          $ref: '#/components/schemas/CurrencyCode'
          description: ISO 4217 currency code. Every component is denominated in this currency.
          example: USD
        transaction_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to carry the message, as a decimal string. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00790'
        passthrough_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Third-party fees we pass on, as a decimal string, such as US 10DLC carrier surcharges. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00200'
    EventEmailCanceledData:
      type: object
      description: Payload of the email.canceled event.
      allOf:
      - $ref: '#/components/schemas/EventEmailMessageBase'
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    WebhookConnectorSetupUpdate:
      type: object
      additionalProperties: false
      properties:
        connector_id:
          allOf:
          - $ref: '#/components/schemas/WebhookConnectorID'
          description: The endpoint's connector. It cannot change, so a different value returns a `422`.
        action:
          allOf:
          - $ref: '#/components/schemas/ConnectorActionID'
          description: The endpoint's action. It cannot change, so a different value returns a `422`.
        credentials:
          allOf:
          - $ref: '#/components/schemas/ConnectionCredentials'
          description: 'New values for the connector''s secret fields, merged over the stored ones: a key given replaces that field and an omitted key keeps its value. The next delivery, retries included, uses them.

            '
        config:
          $ref: '#/components/schemas/ConnectionConfigPatch'
      description: 'Changes to the endpoint''s connector, nested as on creation. A field the endpoint''s URL is built from moves the URL with it. New deliveries are prepared with the current config. Queued deliveries keep their prepared body, but every send attempt, including retries, uses the current destination URL and credentials.

        '
    WhatsAppContactName:
