    MessageCost:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - amount
      - currency_code
      - transaction_amount
      - passthrough_amount
      description: 'What was charged for a message, split into the components that make it up. `null` until at least one component has been priced.

        '
      properties:
        amount:
          type: string
          minLength: 1
          readOnly: true
          description: 'Total charged, as a decimal string: the sum of the components below. Net of tax, which applies to your wallet balance rather than to an individual charge.

            '
          example: '0.00990'
        currency_code:
          readOnly: true
          $ref: '#/components/schemas/CurrencyCode'
          description: ISO 4217 currency code. Every component is denominated in this currency.
          example: USD
        transaction_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to carry the message, as a decimal string. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00790'
        passthrough_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Third-party fees we pass on, as a decimal string, such as US 10DLC carrier surcharges. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00200'
    Tag:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      description: 'Structured key/value label attached to a message or a call. Use tags for low-cardinality filtering dimensions (category, experiment ID, template ID); they surface in the list filter of whatever carries them.


        On a message they also surface in the event log and in webhook payloads, and a message can carry `metadata` beside them for arbitrary per-send context that does not need to be filterable. A call has none of those three: its tags are set on the wire when the call is placed, and the call record is the one place you read them back.


        Whatever carries the tags defines how many it may have. Tag names are unique: a send that repeats one is rejected, and on a call the first instance of a name wins.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag name. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 32 characters.

            '
          example: category
        value:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag value. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 64 characters.

            '
          example: welcome
    EventEmailMailboxMessageFailedData:
      type: object
      additionalProperties: false
      description: Payload of the email_mailbox.message_failed event.
      required:
      - message_id
      - mailbox_id
      - thread_id
      - reason
      properties:
        message_id:
          $ref: '#/components/schemas/EmailID'
          description: ID of the failed message. Per-recipient `email.*` events use this value as `email_id`. Use it to deduplicate events when you subscribe to both event families.
        mailbox_id:
          $ref: '#/components/schemas/MailboxID'
          description: ID of the mailbox the message was sent from.
        thread_id:
          $ref: '#/components/schemas/ThreadID'
          description: ID of the thread the message belongs to.
        reason:
          type: string
          minLength: 1
          description: Why the message reached a terminal delivery failure.
          example: all recipients bounced
    EventEmailBouncedData:
      type: object
      description: Payload of the email.bounced event.
      allOf:
      - $ref: '#/components/schemas/EventEmailBase'
      - type: object
        required:
        - bounce_type
        - bounce_class
        - bounce_code
        - bounce_description
        - sending_ip
        properties:
          bounce_type:
            $ref: '#/components/schemas/EmailBounceType'
          bounce_class:
            type:
            - integer
            - 'null'
            minimum: 1
            maximum: 255
            description: 'Numeric bounce classification for fine-grained deliverability triage, or null when the receiving server''s response could not be classified. Lets you distinguish, for example, a DNS failure from a spam block when both would be `bounce_type: soft` or `bounce_type: block`.

              '
            example: 10
          bounce_code:
            type:
            - string
            - 'null'
            description: SMTP reply code returned by the receiving mail server, or null when none was provided.
            example: '550'
          bounce_description:
            type:
            - string
            - 'null'
            description: Human-readable reason the receiving mail server gave for the bounce, or null when none was provided.
            example: 5.1.1 Unknown user
          sending_ip:
            type:
            - string
            - 'null'
            description: The IP address used to send this message, or null when it is not known.
            example: 192.0.2.10
    EventDomainVerifiedData:
