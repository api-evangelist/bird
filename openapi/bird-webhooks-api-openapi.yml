openapi: 3.2.0
info:
  title: Bird Webhooks API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: Webhooks
  description: Webhook endpoint management.
paths:
  /v1/webhooks:
    post:
      operationId: createWebhook
      summary: Create a webhook endpoint
      description: 'Registers an `active` webhook endpoint that receives the event types in `events` as signed HTTPS `POST` requests. See the webhooks guide for delivery, signing, and retry behavior.


        The `201` response is the only response that includes the signing secret (`whsec_` prefix). Store it immediately; if it is lost, rotate the signing secret.


        A non-HTTPS or non-public `url`, an unknown event type, or exceeding the organization''s endpoint limit returns `422`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.create
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointCreate'
      responses:
        '201':
          description: Created webhook endpoint, including its one-time signing secret.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      description: Returns the workspace's webhook endpoints as a cursor-paginated list, newest first by default. Endpoint objects never include the signing secret; to inspect a single endpoint, use Get a webhook endpoint.
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.list
      x-audiences:
      - public
      - command
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/WebhookSortField'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/IncludeTotal'
      - name: url
        in: query
        required: false
        description: 'Only endpoints delivering to exactly this URL. Several endpoints can share a URL, so this finds matches for a setup to reuse; it does not prevent a duplicate.

          '
        schema:
          type: string
          maxLength: 2048
        example: https://hooks.zapier.com/hooks/catch/123/abc/
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of webhook endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
  /v1/webhooks/{webhook_id}:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: getWebhook
      summary: Get a webhook endpoint
      description: Returns one webhook endpoint's configuration and current delivery `status`, including its URL and subscribed event types. The signing secret is never included; if you lost it, mint a new one with Rotate webhook signing secret.
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.get
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: Webhook endpoint with its current URL, subscriptions, and status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    patch:
      operationId: updateWebhook
      summary: Update a webhook endpoint
      description: 'Updates the webhook endpoint. Only the fields you send change: `events` replaces the

        whole subscription set, and `status` pauses or re-enables delivery.


        The `200` response is the updated endpoint. Invalid input (a non-HTTPS or non-public

        `url`, an event type outside the catalog) returns a `422`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.update
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdate'
            example:
              url: https://example.com/webhook
              description: Updated webhook endpoint
              events:
              - email.delivered
              - email.bounced
              - email.complained
              status: active
      responses:
        '200':
          description: Webhook endpoint after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: 'Permanently removes the webhook endpoint and stops all deliveries to it, including retries of earlier failed deliveries. This cannot be undone: recreating an endpoint later mints a new `id` and signing secret. To stop deliveries temporarily instead, set `status` to `paused` with Update a webhook endpoint.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.delete
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '204':
          description: Webhook endpoint deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
  /v1/webhooks/{webhook_id}/rotate-secret:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    post:
      operationId: rotateWebhookSecret
      summary: Rotate webhook signing secret
      description: 'Generates a new signing secret for the endpoint and returns it exactly once: store it

        immediately, it cannot be retrieved after this response. For 24 hours every delivery

        is signed with both the old and the new secret, so a receiver verifying with either

        keeps working while you roll the new one out. After the window the old secret stops

        signing. Verification details are in the webhooks guide.


        An endpoint holds at most 5 concurrently valid secrets, so rotating repeatedly within

        the overlap window fails with `WebhookTooManySecrets` until an older secret expires.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.rotate_secret
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: New signing secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRotateSecretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
  /v1/webhooks/{webhook_id}/test:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    post:
      operationId: testWebhook
      summary: Test a webhook with a sample event
      description: 'Sends a signed synthetic event and returns whether your endpoint accepted it, its HTTP status, and the round-trip latency. An unreachable endpoint returns `status: failed` in the response body. The endpoint has 10 seconds to respond.


        The body is a minimal JSON object with the event `type`, signed like a real delivery. It does not mirror that event''s payload. Tests work on paused endpoints and do not appear in List delivery attempts.


        The operation returns `412` if the endpoint lacks a valid signing secret or, when `event_type` is omitted, has no subscribed event type to use.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.test
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTestRequest'
      responses:
        '200':
          description: The test result, including whether your endpoint accepted the event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
  /v1/webhooks/{webhook_id}/replay:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    post:
      operationId: createWebhookReplay
      summary: Replay failed deliveries
      description: 'Queues redelivery of deliveries that failed. The window runs from `since`

        (default: the last 24 hours) to `until`, and events the endpoint already received

        successfully are skipped, so a replay never double-delivers.


        Only failed attempts are replayed, and the window selects on attempt time rather than

        on when the event occurred. An event the endpoint was never sent, such as one that

        arrived while it was paused, has no failed attempt to replay, so a replay does not

        recover it. Replay reads the delivery-attempt log, which retains three days, so that

        is the oldest history it reaches: an earlier `since` widens the window without

        recovering anything older. A paused endpoint redelivers nothing at all:

        re-enable it with Update a webhook endpoint

        first.


        The `202` response means the replay is queued. Each redelivery then takes a single

        attempt rather than the retry schedule a live delivery follows, so a replay into an

        endpoint that is still broken costs one request per event; fix the endpoint and replay

        again. No count or task ID is returned, so track results with

        List delivery attempts.


        One replay redelivers at most the oldest 10,000 events in the window, and replays are

        limited to 20 per organization per UTC day; beyond that the request returns a `429`

        `WebhookReplayQuotaExceeded`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.replay
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookReplayRequest'
      responses:
        '202':
          description: Replay queued. Events are redelivered asynchronously; no count or task ID is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
  /v1/webhooks/{webhook_id}/attempts:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: listWebhookAttempts
      summary: List delivery attempts
      description: 'Returns the endpoint''s recent delivery attempts, newest first. Each entry is one HTTP

        request, so a retried event appears once per try; use it to see what failed and why

        before requesting redelivery with

        Replay failed deliveries.


        Bound the window with the `before`/`after` timestamps and cap the page with `limit`.

        To page further back without a cursor, pass the oldest `attempted_at`

        you received as `before`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.attempts
      x-audiences:
      - public
      - command
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of attempts to return. Defaults to 50, capped at 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: before
        in: query
        required: false
        description: Only return attempts strictly before this timestamp.
        schema:
          type: string
          format: date-time
          minLength: 1
      - name: after
        in: query
        required: false
        description: Only return attempts strictly after this timestamp.
        schema:
          type: string
          format: date-time
          minLength: 1
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Recent delivery attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAttemptList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
components:
  schemas:
    AMBRichLinkConstruct:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          minLength: 1
          description: The App Clip, Apple Music, or Apple Maps URL to build a preview for. An `http://` URL is refused with a `422` `AMBEndpointNotHTTPS`. A URL Apple cannot build a preview for is refused with a `422` `AMBConstructPayloadFailed`; send `rich_link` content with your own `title` and `image` instead.
          example: https://apps.apple.com/app/id123456789?clip=1
          x-sensitive: true
        store_region:
          $ref: '#/components/schemas/CountryCode'
          description: App Store storefront used to build an App Clip preview. Defaults to `US` when omitted.
      description: Asks Apple to build the rich link preview when the message is sent, rather than through a prior `POST /v1/amb/messages/construct-payload` call. No caller holds a signed reference until the send itself resolves one.
    EventDomainVerifiedData:
      type: object
      additionalProperties: false
      description: Payload of the domain.verified event.
      required:
      - domain_id
      - domain
      - workspace_id
      properties:
        domain_id:
          $ref: '#/components/schemas/DomainID'
          description: The sending domain resource that verified.
          example: dom_01krdgeqcxet5s7t44vh8rt9mg
        domain:
          type: string
          minLength: 1
          description: The sending domain hostname.
          example: mail.example.com
        workspace_id:
          $ref: '#/components/schemas/WorkspaceID'
          description: The workspace the domain is assigned to.
          example: ws_01krdgeqcxet5s7t44vh8rt9mg
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: ISO 4217 three-letter currency code.
      example: EUR
    EventEmailDeliveredData:
      type: object
      description: Payload of the email.delivered event.
      allOf:
      - $ref: '#/components/schemas/EventEmailBase'
    WebhookTestRequest:
      type: object
      additionalProperties: false
      properties:
        event_type:
          type: string
          description: 'Event type to simulate. Any type from the event catalog is accepted, whether or not the endpoint subscribes to it; an unknown type returns a `422`. When omitted, the endpoint''s first subscribed event type is used.

            '
          example: email.delivered
      example:
        event_type: email.delivered
    WhatsAppContactUrl:
      type: object
      additionalProperties: false
      description: One website on a shared contact card.
      properties:
        url:
          type: string
          description: 'The address as the card holds it, which is often bare rather than a full URL, so it is passed through as text rather than validated.

            '
          example: luckyshrub.example.com
        type:
          type: string
          description: 'The label attached to this value, for example `CELL`, `Home` or `iPhone`. Free text: WhatsApp defines no vocabulary. A label on a received card is lowercased; one this workspace sent reads back exactly as sent.

            '
          example: Company
    PreferenceGrantedEventType:
      type: string
      minLength: 1
      enum:
      - preference.granted
      description: Always `preference.granted` for this event.
      example: preference.granted
    EventEmailMailboxMessageFailedData:
      type: object
      additionalProperties: false
      description: Payload of the email_mailbox.message_failed event.
      required:
      - message_id
      - mailbox_id
      - thread_id
      - reason
      properties:
        message_id:
          $ref: '#/components/schemas/EmailID'
          description: ID of the failed message. Per-recipient `email.*` events use this value as `email_id`. Use it to deduplicate events when you subscribe to both event families.
        mailbox_id:
          $ref: '#/components/schemas/MailboxID'
          description: ID of the mailbox the message was sent from.
        thread_id:
          $ref: '#/components/schemas/ThreadID'
          description: ID of the thread the message belongs to.
        reason:
          type: string
          minLength: 1
          description: Why the message reached a terminal delivery failure.
          example: all recipients bounced
    AMBNativeInteractiveData:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          minLength: 1
          description: App Store identifier of the iMessage app.
        app_name:
          type: string
          minLength: 1
          description: Name of the iMessage app.
        bid:
          type: string
          minLength: 1
          description: Identifier of the iMessage extension, in Apple's `com.apple.messages.MSMessageExtensionBalloonPlugin:team-id:extension-id` format.
        url:
          x-sensitive: true
          type: string
          minLength: 1
          description: Opaque URL string that Messages passes to the iMessage app.
          example: ?order=1234&view=detail
        use_live_layout:
          type: boolean
          description: Whether Messages renders the received and reply bubbles using Live Layout.
        session_identifier:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Session UUID to preserve across interactions. Apple creates one when omitted.
        received_message:
          $ref: '#/components/schemas/AMBMessageBubble'
          description: Content Messages shows in the received message bubble.
        reply_message:
          $ref: '#/components/schemas/AMBMessageBubble'
          description: Content Messages shows in the reply message bubble.
        app_icon_source_url:
          type: string
          minLength: 1
          description: Publicly accessible HTTPS URL of the app's PNG icon. The icon must be smaller than 15 kB. We fetch and include it in the request to Apple. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          x-sensitive: true
        data:
          $ref: '#/components/schemas/AMBNativeInteractivePayload'
      description: A built-in interaction or custom iMessage app. Custom apps require the app metadata and both message bubbles.
      oneOf:
      - required:
        - data
        not:
          anyOf:
          - properties:
              app_id: {}
            required:
            - app_id
          - properties:
              app_name: {}
            required:
            - app_name
          - properties:
              bid: {}
            required:
            - bid
          - properties:
              url: {}
            required:
            - url
          - properties:
              app_icon_source_url: {}
            required:
            - app_icon_source_url
          - properties:
              use_live_layout: {}
            required:
            - use_live_layout
      - required:
        - app_id
        - app_name
        - bid
        - url
        - app_icon_source_url
        - use_live_layout
        - received_message
        - reply_message
        not:
          properties:
            data: {}
          required:
          - data
