    EventVerifyVerificationFailedData:
      type: object
      description: Payload of the verify.verification.failed event.
      allOf:
      - $ref: '#/components/schemas/EventVerifyBase'
      - type: object
        required:
        - status
        - reason
        - channel
        - last_attempt_reason
        - failed_at
        properties:
          status:
            type: string
            minLength: 1
            x-extensible-enum:
            - failed
            description: The verification's state, always `failed`. Open enum for forward compatibility.
            example: failed
          reason:
            $ref: '#/components/schemas/VerificationTerminalReason'
            description: 'Why the verification ended. Always `undeliverable` on this event: no planned channel delivered a passcode.'
            example: undeliverable
          channel:
            oneOf:
            - $ref: '#/components/schemas/VerificationChannel'
            - type: 'null'
            description: The last channel the verification tried, the one whose failure left it with nowhere else to go. Null when no channel was attributed.
            example: sms
          last_attempt_reason:
            $ref: '#/components/schemas/VerificationAttemptFailureReason'
            description: 'Why that last send did not deliver. This is the actionable half of the event: `not_billable` means the workspace balance could not cover the send, while the delivery reasons point at the recipient or the channel.'
            example: not_billable
          failed_at:
            type: string
            minLength: 1
            format: date-time
            description: Time the verification was resolved.
            example: '2026-07-24T12:00:05Z'
    AMBMessageID:
      type: string
