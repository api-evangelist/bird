        required:
        - bounce_type
        - bounce_class
        - bounce_code
        - bounce_description
        - sending_ip
        properties:
          bounce_type:
            $ref: '#/components/schemas/EmailBounceType'
          bounce_class:
            type:
            - integer
            - 'null'
            minimum: 1
            maximum: 255
            description: 'Numeric bounce classification for fine-grained deliverability triage, or null when the receiving server''s response could not be classified. Lets you distinguish, for example, a DNS failure from a spam block when both would be `bounce_type: soft` or `bounce_type: block`.

              '
            example: 10
          bounce_code:
            type:
            - string
            - 'null'
            description: SMTP reply code returned by the receiving mail server, or null when none was provided.
            example: '550'
          bounce_description:
            type:
            - string
            - 'null'
            description: Human-readable reason the receiving mail server gave for the bounce, or null when none was provided.
            example: 5.1.1 Unknown user
          sending_ip:
            type:
            - string
            - 'null'
            description: The IP address used to send this message, or null when it is not known.
            example: 192.0.2.10
