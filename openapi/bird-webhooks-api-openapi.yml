    WebhookEndpointCreate:
      type: object
      additionalProperties: false
      required:
      - url
      - events
      properties:
        url:
          type: string
          maxLength: 2048
          format: uri
          minLength: 1
          description: 'HTTPS URL to deliver events to, at most 2048 characters. The host must be publicly reachable: URLs on private, loopback, or link-local addresses are rejected with a `422`.

            '
          example: https://example.com/webhook
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          minItems: 1
          description: Event types to subscribe to; the endpoint receives only matching events. Types outside the event catalog return a `422`, and an endpoint holds at most 100 entries.
          example:
          - email.delivered
          - email.bounced
        description:
          type: string
          maxLength: 256
          description: Human-readable label for this endpoint, up to 256 characters.
          example: Production webhook endpoint
      example:
        url: https://example.com/webhooks/bird
        events:
        - email.delivered
        - email.bounced
        description: Production delivery + bounce notifications
    EventEmailReceivedData:
      type: object
      additionalProperties: false
      description: Payload of the email.received event.
      required:
      - inbound_message_id
      - workspace_id
      - message_id
      - from
      - to
      - subject
      properties:
        inbound_message_id:
          $ref: '#/components/schemas/InboundEmailMessageID'
          description: ID of the received email. Fetch its parsed metadata with `GET /v1/email/inbound-messages/{id}`, and its content from that message's `/body`, `/raw`, and `/attachments` sub-resources.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceID'
          description: ID of the workspace that owns this event.
        message_id:
          type:
          - string
          - 'null'
          description: RFC 5322 Message-ID header from the sender, or null when the sender did not include one.
          example: <CAH+T8d5...@mail.gmail.com>
        from:
          type: string
          minLength: 1
          format: email
          description: Address from the message's From header, with the relay's parsed sender and then the SMTP envelope sender as fallbacks when that header cannot be read.
          example: alice@example.com
        to:
          type: array
          items:
            type: string
            format: email
          description: Recipient addresses the message was sent to.
          example:
          - support@acme.com
        subject:
          type:
          - string
          - 'null'
          description: Subject line as received, or null when the message had no subject.
          example: Welcome to Bird
        in_reply_to:
          type:
          - string
          - 'null'
          description: '`In-Reply-To` header containing the `Message-ID` this message replies to, or null when it is not a reply.'
          example: <previous-message@example.com>
        authentication:
          type:
          - string
          - 'null'
          enum:
          - pass
          - fail
          - unknown
          - null
          description: 'DMARC result for the domain in the received message''s `From` header.


            - `pass`: SPF or DKIM passed and aligned with that domain.

            - `fail`: DMARC was evaluated and did not pass.

            - `unknown`: no trustworthy verdict is available.


            This follows `dmarc_pass` and does not verify a particular person. The receiving provider currently supplies no DMARC result, so received messages report `unknown`.

            '
        spf_pass:
          type:
          - boolean
          - 'null'
          description: Whether the receiving provider reports that SPF authorized the envelope sender for the sending server. A soft failure is `false`. Missing, neutral and inconclusive results are `null`.
        dkim_pass:
          type:
          - boolean
          - 'null'
          description: Whether the receiving provider verified a DKIM signature. A passing signature makes this `true` even when another signature fails. Missing signatures and inconclusive verification results are `null`.
        dmarc_pass:
          type:
          - boolean
          - 'null'
          description: Whether SPF or DKIM passed and aligned with the domain in the message's `From` header. The receiving provider currently supplies no DMARC result, so this is `null`.
        spam_score:
          type:
          - number
          - 'null'
          description: Content spam score when available. The receiving provider currently supplies no score, so this is `null`.
