openapi: 3.2.0
info:
  title: Bird Webhooks API
  version: '1.0'
  description: 'Operations tagged webhooks across 2 of this provider''s published API definitions: messagebird-bird-api-openapi.yml, messagebird-webhooks-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
- url: https://conversations.messagebird.com/v1
  description: Production Server
- url: https://voice.messagebird.com
  description: Production Server
tags:
- name: Webhooks
  description: Webhook endpoint management.
paths:
  /v1/webhooks:
    post:
      operationId: createWebhook
      summary: Create a webhook endpoint
      description: 'Registers an `active` webhook endpoint that receives the event types in `events` as signed HTTPS `POST` requests. See the webhooks guide for delivery, signing, and retry behavior.


        The `201` response is the only response that includes the signing secret (`whsec_` prefix). Store it immediately; if it is lost, rotate the signing secret.


        A non-HTTPS or non-public `url`, an unknown event type, or exceeding the organization''s endpoint limit returns `422`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.create
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointCreate'
      responses:
        '201':
          description: Created webhook endpoint, including its one-time signing secret.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      description: Returns the workspace's webhook endpoints as a cursor-paginated list, newest first by default. Endpoint objects never include the signing secret; to inspect a single endpoint, use Get a webhook endpoint.
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.list
      x-audiences:
      - public
      - command
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/WebhookSortField'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/IncludeTotal'
      responses:
        '200':
          description: Paginated list of webhook endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/webhooks/{webhook_id}:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: getWebhook
      summary: Get a webhook endpoint
      description: Returns one webhook endpoint's configuration and current delivery `status`, including its URL and subscribed event types. The signing secret is never included; if you lost it, mint a new one with Rotate webhook signing secret.
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.get
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: Webhook endpoint with its current URL, subscriptions, and status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    patch:
      operationId: updateWebhook
      summary: Update a webhook endpoint
      description: 'Updates the webhook endpoint. Only the fields you send change: `events` replaces the

        whole subscription set, and `status` pauses or re-enables delivery.


        The `200` response is the updated endpoint. Invalid input (a non-HTTPS or non-public

        `url`, an event type outside the catalog) returns a `422`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.update
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdate'
      responses:
        '200':
          description: Webhook endpoint after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: 'Permanently removes the webhook endpoint and stops all deliveries to it, including retries of earlier failed deliveries. This cannot be undone: recreating an endpoint later mints a new `id` and signing secret. To stop deliveries temporarily instead, set `status` to `paused` with Update a webhook endpoint.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.delete
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Webhook endpoint deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/webhooks/{webhook_id}/rotate-secret:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    post:
      operationId: rotateWebhookSecret
      summary: Rotate webhook signing secret
      description: 'Generates a new signing secret for the endpoint and returns it exactly once: store it

        immediately, it cannot be retrieved after this response. For 24 hours every delivery

        is signed with both the old and the new secret, so a receiver verifying with either

        keeps working while you roll the new one out. After the window the old secret stops

        signing. Verification details are in the webhooks guide.


        An endpoint holds at most 5 concurrently valid secrets, so rotating repeatedly within

        the overlap window fails with `WebhookTooManySecrets` until an older secret expires.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.rotate_secret
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New signing secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRotateSecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/webhooks/{webhook_id}/test:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    post:
      operationId: testWebhook
      summary: Test a webhook with a sample event
      description: 'Sends a signed synthetic event and returns whether your endpoint accepted it, its HTTP status, and the round-trip latency. An unreachable endpoint returns `status: failed` in the response body. The endpoint has 10 seconds to respond.


        The body is a minimal JSON object with the event `type`, signed like a real delivery. It does not mirror that event''s payload. Tests work on paused endpoints and do not appear in List delivery attempts.


        The operation returns `412` if the endpoint lacks a valid signing secret or, when `event_type` is omitted, has no subscribed event type to use.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.test
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTestRequest'
      responses:
        '200':
          description: The test result, including whether your endpoint accepted the event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/webhooks/{webhook_id}/replay:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    post:
      operationId: createWebhookReplay
      summary: Replay failed deliveries
      description: 'Queues redelivery of deliveries that failed. The window runs from `since`

        (default: the last 24 hours) to `until`, and events the endpoint already received

        successfully are skipped, so a replay never double-delivers.


        Only failed attempts are replayed. An event the endpoint was never sent, such as one

        that arrived while it was paused, has no failed attempt to replay, so a replay does

        not recover it.


        The `202` response means the replay is queued. Events are redelivered asynchronously

        and retried like any other delivery; no count or task ID is returned, so track results

        with List delivery attempts.


        Replays are limited to 20 per organization per UTC day; beyond that the request

        returns a `429` `WebhookReplayQuotaExceeded`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookReplayRequest'
      responses:
        '202':
          description: Replay queued. Events are redelivered asynchronously; no count or task ID is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - n8n
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/webhooks/{webhook_id}/attempts:
    parameters:
    - name: webhook_id
      in: path
      required: true
      description: ID of the webhook endpoint (`whk_` prefix), as returned when it was created.
      schema:
        $ref: '#/components/schemas/WebhookEndpointID'
      example: whk_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: listWebhookAttempts
      summary: List delivery attempts
      description: 'Returns the endpoint''s recent delivery attempts, newest first. Each entry is one HTTP

        request, so a retried event appears once per try; use it to see what failed and why

        before requesting redelivery with

        Replay failed deliveries.


        Bound the window with the `before`/`after` timestamps and cap the page with `limit`.

        To page further back without a cursor, pass the oldest `attempted_at`

        you received as `before`.'
      tags:
      - Webhooks
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-snippet-key: webhooks.attempts
      x-audiences:
      - public
      - command
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of attempts to return. Defaults to 50, capped at 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: before
        in: query
        required: false
        description: Only return attempts strictly before this timestamp.
        schema:
          type: string
          format: date-time
          minLength: 1
      - name: after
        in: query
        required: false
        description: Only return attempts strictly after this timestamp.
        schema:
          type: string
          format: date-time
          minLength: 1
      responses:
        '200':
          description: Recent delivery attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAttemptList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /webhooks:
    servers:
    - url: https://conversations.messagebird.com/v1
      description: Production Server
    get:
      operationId: getWebhooks
      summary: List webhooks
      description: Retrieves a list of all configured conversation webhooks. The platform supports up to 10 channel-specific webhooks and 5 generic webhooks.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: A list of webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '401':
          description: Unauthorized
      security:
      - accessKey: []
      x-operation-id-source: normalized
      x-operation-id-original: listWebhooks
    post:
      operationId: postWebhooks
      summary: Create a webhook
      description: Creates a new webhook to receive real-time notifications for conversation events. Webhooks can be channel-specific or generic.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '200':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      security:
      - accessKey: []
      x-operation-id-source: normalized
      x-operation-id-original: createWebhook
  /webhooks/{webhookId}:
    servers:
    - url: https://conversations.messagebird.com/v1
      description: Production Server
    get:
      operationId: viewWebhook
      summary: View a webhook
      description: Retrieves the details of a specific webhook by its unique identifier.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/webhookIdParam'
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized
        '404':
          description: Webhook not found
      security:
      - accessKey: []
    patch:
      operationId: patchWebhooksByWebhookId
      summary: Update a webhook
      description: Updates the configuration of an existing webhook.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/webhookIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Webhook not found
      security:
      - accessKey: []
      x-operation-id-source: normalized
      x-operation-id-original: updateWebhook
    delete:
      operationId: deleteWebhooksByWebhookId
      summary: Delete a webhook
      description: Deletes an existing webhook by its unique identifier.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/webhookIdParam'
      responses:
        '204':
          description: Webhook deleted
        '401':
          description: Unauthorized
        '404':
          description: Webhook not found
      security:
      - accessKey: []
      x-operation-id-source: normalized
      x-operation-id-original: deleteWebhook
    put:
      operationId: updateVoiceWebhook
      summary: Update a voice webhook
      description: Updates an existing voice webhook configuration.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/webhookIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceWebhookCreate'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceWebhookResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Webhook not found
      security:
      - accessKey: []
components:
  schemas:
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    SMSSegments:
      type: object
      additionalProperties: false
      required:
      - count
      - encoding
      - characters
      description: Segment breakdown for the message body. Segment count drives billing.
      properties:
        count:
          type: integer
          minimum: 1
          readOnly: true
          description: Number of segments the body is split into. Each segment is a billable unit.
        encoding:
          type: string
          minLength: 1
          readOnly: true
          enum:
          - GSM_7BIT
          - UCS2
          description: 'Encoding used for the body. The `GSM_7BIT` encoding fits 160 septets

            (seven-bit units) in one segment, or 153 per part in a multi-segment

            message. The `UCS2` encoding applies when the body contains a character

            outside the GSM 03.38 alphabet, including emoji, CJK, and some accented

            characters. It fits 70 UTF-16 code units in one segment, or 67 per part.


            Neither limit counts characters, and both alphabets have characters that

            cost two units. Under `GSM_7BIT` there are ten such entries, and they are

            the whole set: `^`, `{`, `}`, `\`, `[`, `]`, `~`, `|`, `€`, and the form

            feed control. Eighty of those fill a single segment. Under `UCS2` an emoji

            outside the Basic Multilingual Plane is a surrogate pair costing two code

            units, so 35 of those fill a single segment.

            '
        characters:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Character count of the body, counted in Unicode code points under either encoding. This is not the segment measure: a `GSM_7BIT` extended-table character counts once here but costs two septets, and a `UCS2` emoji outside the Basic Multilingual Plane counts once here but costs two of the segment''s 70 code units.

            '
    WhatsAppMessageID:
      type: string
      minLength: 1
      pattern: ^wam_[0-9a-hjkmnp-tv-z]{26}$
      example: wam_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppFileID:
      type: string
      minLength: 1
      pattern: ^waf_[0-9a-hjkmnp-tv-z]{26}$
      example: waf_01krdgeqcxet5s7t44vh8rt9mg
    EventEmailMailboxMessageReceivedData:
      type: object
      additionalProperties: false
      description: Identifiers, threading details, authentication results, and extracted text for a received mailbox message. The thread-message endpoints provide the original source during its 30-day retention window.
      required:
      - message_id
      - mailbox_id
      - thread_id
      - from
      - to
      - subject
      - attachment_count
      properties:
        message_id:
          $ref: '#/components/schemas/InboundEmailMessageID'
          description: ID of the received message. The corresponding `email.received` event uses this value as `inbound_message_id`. Use it to deduplicate events when you subscribe to both event families.
        mailbox_id:
          $ref: '#/components/schemas/MailboxID'
          description: ID of the mailbox that received the message.
        thread_id:
          $ref: '#/components/schemas/ThreadID'
          description: ID of the thread the message was filed into.
        route_id:
          type:
          - string
          - 'null'
          description: ID (ein_…) of the explicit inbound route that matched, or null when the message was delivered by the virtual exact-address route.
          example: null
        from:
          type: string
          minLength: 1
          format: email
          description: Envelope-from address.
          example: alice@example.com
        to:
          type: array
          items:
            type: string
            format: email
          description: Recipient addresses the message was sent to.
          example:
          - support@inbox.ai
        subject:
          type:
          - string
          - 'null'
          description: Subject line as received, or null when the message had no subject.
          example: 'Re: Your quote'
        extracted_text:
          type:
          - string
          - 'null'
          description: Plain-text body with quoted history removed, capped at 64 KB. See `truncated_text` to check whether the value was truncated. Null when extraction produces no text.
          example: Sounds good — can you send the invoice?
        truncated_text:
          type: boolean
          description: True when `extracted_text` was truncated to the 64 KB cap. Fetch the full text through the thread-member endpoint.
          default: false
        attachment_count:
          type: integer
          minimum: 0
          description: Number of attachments on the message. Attachment content remains available for the mailbox's retention tier.
          example: 1
        authentication:
          type:
          - string
          - 'null'
          enum:
          - pass
          - fail
          - unknown
          - null
          description: 'DMARC result for the domain in the received message''s `From` header.


            - `pass`: SPF or DKIM passed and aligned with that domain.

            - `fail`: DMARC was evaluated and did not pass.

            - `unknown`: no trustworthy verdict is available.


            This follows `dmarc_pass` and does not verify a particular person. The receiving provider currently supplies no DMARC result, so received messages report `unknown`.

            '
        spf_pass:
          type:
          - boolean
          - 'null'
          description: Whether the receiving provider reports that SPF authorized the envelope sender for the sending server. A soft failure is `false`. Missing, neutral and inconclusive results are `null`.
        dkim_pass:
          type:
          - boolean
          - 'null'
          description: Whether the receiving provider verified a DKIM signature. A passing signature makes this `true` even when another signature fails. Missing signatures and inconclusive verification results are `null`.
        dmarc_pass:
          type:
          - boolean
          - 'null'
          description: Whether SPF or DKIM passed and aligned with the domain in the message's `From` header. The receiving provider currently supplies no DMARC result, so this is `null`.
