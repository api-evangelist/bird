          minLength: 1
          const: webhook
    EmailRejectionReason:
      type: string
      minLength: 1
      enum:
      - recipient_suppressed
      - transmission_failed
      - generation_failure
      - policy_rejection
      - domain_unverified
      - quota_exceeded
      - recipient_not_allowed
      x-enum-varnames:
      - EmailRejectionReasonRecipientSuppressed
      - EmailRejectionReasonTransmissionFailed
      - EmailRejectionReasonGenerationFailure
      - EmailRejectionReasonPolicyRejection
      - EmailRejectionReasonDomainUnverified
      - EmailRejectionReasonQuotaExceeded
      - EmailRejectionReasonRecipientNotAllowed
      description: "Why an email was rejected before delivery.\n\n- `recipient_suppressed`: The recipient is on the workspace suppression list, so\n  delivery was never attempted.\n- `transmission_failed`: The message could not be transmitted for delivery.\n- `generation_failure`: The message could not be built for delivery (template or\n  content issue).\n- `policy_rejection`: The message was refused by sending policy.\n- `domain_unverified`: The sending domain was not verified.\n- `quota_exceeded`: The organization's send quota was reached.\n- `recipient_not_allowed`: A recipient was not permitted for this send (for shared\n  onboarding-domain sends, recipients must be verified workspace members).\n"
