    EventPreferenceBase:
      type: object
      description: 'Identity fields shared by every preference lifecycle event: the key plus the ledger entry the write appended. `effective_at` is not repeated here: it is the envelope `timestamp`.'
      required:
      - preference_id
      - transition_id
      - channel
      - handle
      - sender_scope
      - topic_id
      - coverage
      - contact_id
      properties:
        preference_id:
          $ref: '#/components/schemas/PreferenceID'
          description: The preference key this write applied to.
          example: prf_01krdgeqcxet5s7t44vh8rt9mg
        transition_id:
          $ref: '#/components/schemas/PreferenceTransitionID'
          description: The ledger entry this write appended.
          example: prt_01krdgeqcxet5s7t44vh8rt9mg
        channel:
          allOf:
          - $ref: '#/components/schemas/PreferenceChannel'
        handle:
          type: string
          minLength: 1
          maxLength: 320
          description: 'Who the statement is about: an email address on the email channel, a phone number in E.164 format on SMS, WhatsApp, and Apple Messages for Business.'
          example: '+15550001234'
        sender_scope:
          type:
          - string
          - 'null'
          description: 'The sender the statement is limited to, or null when it covers the whole channel. On Apple Messages for Business, this is the Apple business ID used to send invitations. Present-with-null on every payload of this type: it is part of the key alongside `topic_id`, and pinning its presence keeps a subscriber from ever learning `(handle, channel)` as the unique key.'
          example: '+15557654321'
        topic_id:
          type:
          - string
          - 'null'
          description: 'The topic the statement is limited to, or null when it covers every topic. Reserved: always null in v1. Present-with-null for the same reason as `sender_scope`.'
          example: null
        coverage:
          allOf:
          - $ref: '#/components/schemas/PreferenceCoverage'
        contact_id:
          oneOf:
          - $ref: '#/components/schemas/ContactID'
          - type: 'null'
          description: The contact whose handle matched when the statement was recorded. Null when no contact matched at that moment.
    WhatsAppContactOrg:
      type: object
      additionalProperties: false
      description: Where the contact works, as their card records it.
      properties:
        company:
          type: string
          example: Lucky Shrub
        department:
          type: string
          example: Engineering
        title:
          type: string
          example: Software Engineer
    VoiceCallStatus:
      type: string
      minLength: 1
      enum:
      - answered
      - no_answer
      - busy
      - canceled
      - failed
      - rejected
      - unknown
      - ringing
      - in_progress
      description: "Call status.\n\nA call that has ended carries one of:\n\n- `answered` means it connected and the far end picked up.\n- `no_answer` means nobody picked up before the call timed out.\n- `rejected` means it was refused rather than attempted. Either we turned it\n  away before dialing a carrier, in which case `rejection_reason` names the\n  check it failed where there was one, or the far end declined it.\n- `failed` means it was attempted and did not work, and `sip_response_code`\n  is what came back.\n- `unknown` means the outcome could not be determined. Contact support with\n  the call `id` if you see one.\n\nAn active call carries `ringing` before it is picked up and `in_progress`\nafterward. The call list's `status` filter takes any mix of the two sets.\n\n`busy` and `canceled` are reserved for incoming calls delivered to your own\nnumbers: `busy` for a called party that rejected the call as busy, `canceled`\nfor a caller who hung up before it was picked up. Neither is emitted yet and\nboth outcomes are reported as `failed` today.\n"
      example: answered
    ContactID:
      type: string
      minLength: 1
      pattern: ^con_[0-9a-hjkmnp-tv-z]{26}$
      example: con_01krdgeqcxet5s7t44vh8rt9mg
    Tag:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      description: 'Structured key/value label attached to a message or a call. Use tags for low-cardinality filtering dimensions (category, experiment ID, template ID); they surface in the list filter of whatever carries them.


        On a message they also surface in the event log and in webhook payloads, and a message can carry `metadata` beside them for arbitrary per-send context that does not need to be filterable. A call has none of those three: its tags are set on the wire when the call is placed, and the call record is the one place you read them back.


        Whatever carries the tags defines how many it may have. Tag names are unique: a send that repeats one is rejected, and on a call the first instance of a name wins.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag name. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 32 characters.

            '
          example: category
        value:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag value. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 64 characters.

            '
          example: welcome
    WhatsAppInteractiveQuickReplyButton:
      type: object
      additionalProperties: false
      required:
      - slug
      - text
      description: 'A reply button''s label and the handle it carries back. On the echo of a message Bird sent, the pair the send declared; on an inbound `interactive_reply`, the pair the contact tapped. No length is declared here, because a tap can echo a template''s quick-reply button, whose label runs longer than an interactive message''s own allows.

        '
      properties:
        slug:
          type: string
          minLength: 1
          description: 'The handle the button carries back, never shown to the recipient. On a tap on a template''s quick-reply button, it is the payload that template declared.

            '
          example: change-booking
        text:
          type: string
          minLength: 1
          description: The label the recipient saw.
          example: Change
