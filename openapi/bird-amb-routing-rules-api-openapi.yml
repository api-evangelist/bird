openapi: 3.2.0
info:
  title: Bird Amb Routing Rules API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: amb-routing-rules
  description: Rules that put a new conversation in a queue, matched on the entry point's group and intent.
paths:
  /v1/amb/routing-rules:
    get:
      operationId: listAMBRoutingRules
      x-snippet-key: amb.routing_rules.list
      summary: List Apple Messages for Business routing rules
      description: Returns the workspace's Apple Messages for Business routing rules, highest precedence first. Rules run when a conversation is created, when a closed conversation reopens, and when a customer writes to a resolved conversation, matching its group and intent to a queue. A message without a group or intent routes on the conversation's stored values. Later messages while the conversation is open in the inbox retain its queue.
      tags:
      - amb-routing-rules
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: query
        required: false
        description: 'Keep only routing rules belonging to this business. Omit to return rules across all businesses in the workspace.

          '
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The workspace's routing rules, optionally filtered by business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBRoutingRuleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    post:
      operationId: createAMBRoutingRule
      x-snippet-key: amb.routing_rules.create
      summary: Create an Apple Messages for Business routing rule
      description: Creates a routing rule for one of your Apple Messages for Business brands. Set `is_default` to make it the rule that catches a conversation matching nothing else. A business can have only one default rule, and creating a second while one exists returns a `409`.
      tags:
      - amb-routing-rules
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMBRoutingRuleCreate'
            example:
              business_account_id: abz_01krdgeqcxet5s7t44vh8rt9mg
              match_kind: intent
              match_intent_id: order_status
              queue: billing
              precedence: 10
              is_default: false
      responses:
        '201':
          description: Routing rule created.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBRoutingRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/routing-rules/{routing_rule_id}:
    parameters:
    - name: routing_rule_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AMBRoutingRuleID'
      example: arr_01krdgeqcxet5s7t44vh8rt9mg
    get:
      operationId: getAMBRoutingRule
      x-snippet-key: amb.routing_rules.get
      summary: Get an Apple Messages for Business routing rule
      description: Returns one routing rule by ID.
      tags:
      - amb-routing-rules
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      responses:
        '200':
          description: The requested routing rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBRoutingRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
    patch:
      operationId: updateAMBRoutingRule
      x-snippet-key: amb.routing_rules.update
      summary: Update an Apple Messages for Business routing rule
      description: 'Changes a routing rule''s business, match, queue, precedence, or default status. The match changes as a unit: send `match_kind` with the intent and group ids it requires, as on create. Returns a `409` when the update would leave this rule as the default of a business that already has a different default rule. The change applies to conversations that start or reopen afterwards.'
      tags:
      - amb-routing-rules
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMBRoutingRuleUpdate'
            example:
              precedence: 20
      responses:
        '200':
          description: Routing rule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBRoutingRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
    delete:
      operationId: deleteAMBRoutingRule
      x-snippet-key: amb.routing_rules.delete
      summary: Delete an Apple Messages for Business routing rule
      description: Deletes a routing rule. A conversation already routed by it keeps its queue; only newly created or reopened conversations stop matching it. Deleting a business's default rule leaves it with none, so unmatched conversations route to an empty queue until you create another.
      tags:
      - amb-routing-rules
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '204':
          description: Routing rule deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    IdempotencyReplay:
      description: The API includes this header when it replays the response for an earlier request that used the same `Idempotency-Key`. The API does not process the request again.
      schema:
        type: string
        enum:
        - 'true'
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
  responses:
    ServiceUnavailable:
      description: 'The service is temporarily unavailable. If `Retry-After` is present, wait for that delay before retrying; otherwise, retry with exponential backoff. Reuse the same idempotency key and request when retrying a mutation.

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    Timestamps:
      type: object
      required:
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          example: '2026-05-20T09:14:52Z'
        updated_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          example: '2026-05-25T16:42:01Z'
    AMBRoutingRuleID:
      type: string
      minLength: 1
      pattern: ^arr_[0-9a-hjkmnp-tv-z]{26}$
      example: arr_01krdgeqcxet5s7t44vh8rt9mg
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    AMBRoutingRuleUpdate:
      type: object
      additionalProperties: false
      description: 'Changes to a routing rule. Send `business_account_id` to move the rule to another Apple Messages for Business brand in the workspace. Send `match_kind` to replace what the rule matches, with the ids that kind requires, as on create; a stored id the new kind does not use is cleared. `match_intent_id` and `match_group_id` require `match_kind`. The update returns a `409` when it would leave this rule as the default of a business that already has a different default rule.

        '
      properties:
        business_account_id:
          $ref: '#/components/schemas/AMBBusinessID'
          description: Move this rule to another Apple Messages for Business brand in the workspace.
        match_kind:
          $ref: '#/components/schemas/AMBRoutingRuleMatchKind'
          description: 'Replace what this rule matches. Send it with the ids the new kind requires, validated as on create. A stored id the new kind does not use is cleared.

            '
        match_intent_id:
          type: string
          minLength: 1
          description: 'The entry point intent to match, as sent in Apple''s `intentID`. Requires `match_kind`: required when it is `intent` or `both`, and rejected when it is `group`.

            '
          example: order_status
        match_group_id:
          type: string
          minLength: 1
          description: 'The entry point group to match, as sent in Apple''s `groupID`. Requires `match_kind`: required when it is `group` or `both`, and rejected when it is `intent`.

            '
          example: support
        queue:
          $ref: '#/components/schemas/AMBQueue'
          minLength: 1
          description: Change the queue this rule files a matching conversation into.
          example: billing
        precedence:
          type: integer
          format: int32
          description: Change this rule's evaluation order among the business's other rules.
          example: 10
        is_default:
          type: boolean
          description: 'Set to true to make this the rule that catches a conversation matching nothing else, or to false to stop it from being the default.

            '
          example: false
      oneOf:
      - title: Keep the match
        not:
          anyOf:
          - properties:
              match_kind:
                type: string
                minLength: 1
            required:
            - match_kind
          - properties:
              match_intent_id:
                type: string
                minLength: 1
            required:
            - match_intent_id
          - properties:
              match_group_id:
                type: string
                minLength: 1
            required:
            - match_group_id
      - title: Match on intent
        properties:
          match_kind:
            const: intent
          match_intent_id:
            type: string
            minLength: 1
        required:
        - match_kind
        - match_intent_id
        not:
          properties:
            match_group_id:
              type: string
              minLength: 1
          required:
          - match_group_id
      - title: Match on group
        properties:
          match_kind:
            const: group
          match_group_id:
            type: string
            minLength: 1
        required:
        - match_kind
        - match_group_id
        not:
          properties:
            match_intent_id:
              type: string
              minLength: 1
          required:
          - match_intent_id
      - title: Match on intent and group
        properties:
          match_kind:
            const: both
          match_intent_id:
            type: string
            minLength: 1
          match_group_id:
            type: string
            minLength: 1
        required:
        - match_kind
        - match_intent_id
        - match_group_id
    AMBRoutingRule:
      description: 'A rule that puts a conversation into a queue when it is created or reopened, based on the group and intent the entry point that started it carried.

        '
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Timestamps'
      - type: object
        required:
        - id
        - business_account_id
        - match_kind
        - queue
        - precedence
        - is_default
        properties:
          id:
            readOnly: true
            description: Unique identifier for the routing rule.
            $ref: '#/components/schemas/AMBRoutingRuleID'
          business_account_id:
            description: The Apple Messages for Business brand this rule belongs to.
            $ref: '#/components/schemas/AMBBusinessID'
          match_kind:
            $ref: '#/components/schemas/AMBRoutingRuleMatchKind'
          match_intent_id:
            type:
            - string
            - 'null'
            minLength: 1
            description: 'The entry point intent this rule matches, as sent in Apple''s `intentID`. Set when `match_kind` is `intent` or `both`, null when it is `group`.

              '
            example: order_status
          match_group_id:
            type:
            - string
            - 'null'
            minLength: 1
            description: 'The entry point group this rule matches, as sent in Apple''s `groupID`. Set when `match_kind` is `group` or `both`, null when it is `intent`.

              '
            example: support
          queue:
            type: string
            minLength: 1
            description: 'The queue a matching conversation is filed into. A queue is a label your console filters by rather than a resource you create ahead of time, so any value routes.

              '
            example: billing
          precedence:
            type: integer
            format: int32
            description: 'Evaluation order among this business''s rules. The highest-precedence rule a conversation matches wins; rules tied on precedence are evaluated by their `id`.

              '
            example: 10
          is_default:
            type: boolean
            description: 'Whether this rule catches a conversation that matches nothing else. A business has at most one. A conversation created or reopened while none exists routes to an empty queue, which the console lists as unrouted.

              '
            example: false
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    AMBQueue:
      type: string
      minLength: 1
      maxLength: 64
      description: Queue label used for routing and filtering conversations.
    AMBRoutingRuleCreate:
      type: object
      additionalProperties: false
      required:
      - business_account_id
      - match_kind
      - queue
      properties:
        business_account_id:
          description: The Apple Messages for Business brand this rule belongs to.
          $ref: '#/components/schemas/AMBBusinessID'
        match_kind:
          $ref: '#/components/schemas/AMBRoutingRuleMatchKind'
        match_intent_id:
          type:
          - string
          - 'null'
          minLength: 1
          description: 'The entry point intent to match, as sent in Apple''s `intentID`. Required when `match_kind` is `intent` or `both`, and rejected when it is `group`.

            '
          example: order_status
        match_group_id:
          type:
          - string
          - 'null'
          minLength: 1
          description: 'The entry point group to match, as sent in Apple''s `groupID`. Required when `match_kind` is `group` or `both`, and rejected when it is `intent`.

            '
          example: support
        queue:
          $ref: '#/components/schemas/AMBQueue'
          description: 'The queue a matching conversation is filed into. Your console lists whichever values your rules use.

            '
          example: billing
        precedence:
          type: integer
          format: int32
          default: 0
          description: 'Evaluation order among this business''s rules. The highest-precedence rule a conversation matches wins. Omit it to default to 0.

            '
          example: 10
        is_default:
          type: boolean
          default: false
          description: 'Set to make this the rule that catches a conversation matching nothing else. A business can have only one; creating a second while one exists returns a `409`.

            '
          example: false
      oneOf:
      - properties:
          match_kind:
            const: intent
          match_intent_id:
            type: string
            minLength: 1
        required:
        - match_intent_id
        not:
          properties:
            match_group_id:
              type: string
              minLength: 1
          required:
          - match_group_id
      - properties:
          match_kind:
            const: group
          match_group_id:
            type: string
            minLength: 1
        required:
        - match_group_id
        not:
          properties:
            match_intent_id:
              type: string
              minLength: 1
          required:
          - match_intent_id
      - properties:
          match_kind:
            const: both
          match_intent_id:
            type: string
            minLength: 1
          match_group_id:
            type: string
            minLength: 1
        required:
        - match_intent_id
        - match_group_id
    AMBRoutingRuleMatchKind:
      type: string
      minLength: 1
      enum:
      - intent
      - group
      - both
      description: 'What a routing rule matches against the entry point that started the conversation.


        - `intent` matches on the entry point''s intent alone: `match_intent_id` is set and `match_group_id` is null.

        - `group` matches on the entry point''s group alone: `match_group_id` is set and `match_intent_id` is null.

        - `both` matches only when the entry point carries the given intent and the given group together, so `match_intent_id` and `match_group_id` are both set. There are two match fields rather than one because `both` needs to carry an intent and a group at once.

        '
      example: intent
    AMBBusinessID:
      type: string
      minLength: 1
      pattern: ^abz_[0-9a-hjkmnp-tv-z]{26}$
      example: abz_01krdgeqcxet5s7t44vh8rt9mg
    AMBRoutingRuleList:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          description: 'The workspace''s routing rules, optionally filtered by business, highest precedence first and ties broken by `id`. Rules are evaluated within their business in this order. The set is returned in full; this list is not paginated.

            '
          items:
            $ref: '#/components/schemas/AMBRoutingRule'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Client-supplied key. On operations supporting request deduplication, a retained\nresponse is replayed for duplicate requests with the same key within the\nidempotency window (3 hours by default). This protection requires a workspace,\norganization, or staff-account scope. User-only and unscoped unauthenticated operations,\nstreams, and operations with a separate replay contract do not use this\nresponse replay.\n\nOn a supported operation, if idempotency protection is unavailable before execution, the API returns\n`503 IdempotencyUnavailable` (E01033) without executing this attempt. Retry with\nbackoff using the same key and request. An operation that takes effect before\nits response is retained can still execute again on retry.\n\nTwo distinct 409 errors signal misuse:\n\n- `request_in_progress` (E01004): The same key is currently being\n  processed by a concurrent request. Wait briefly and retry. The lock expires within 30 seconds.\n- `idempotency_key_reuse` (E01005): The same key has already completed\n  against a different request body or method. Generate a new key.\n\nRecommended key format is `<event-type>/<entity-id>` (for example `welcome-user/usr_abc123`).\n"
      schema:
        type: string
        maxLength: 255
    XWorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace context for the request. Required for dashboard authentication and master keys. Workspace keys and access tokens already identify their workspace; send that workspace or omit the header. A different one is rejected.
      schema:
        type: string
        pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
    XOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Organization context for the request. Required for dashboard authentication. An API key or access token carries its own organization, so send either that organization or no header at all; a different one is rejected.
      schema:
        type: string
        pattern: ^org_[0-9a-hjkmnp-tv-z]{26}$
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Workspace

        keys use `bk_{region}_*`; organization master keys use `bm_{region}_*`.

        The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
