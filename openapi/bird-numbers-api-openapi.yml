      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/numbers/{number_id}/release:
    post:
      operationId: releaseWorkspaceNumber
      x-snippet-key: numbers.release
      summary: Release a dedicated number
      description: Releases one of your workspace's dedicated numbers now and stops its recurring charge. Your workspace can no longer use the number after release, and the rest of the current billing period is not refunded. This also releases a number already scheduled for cancellation. While a renewal payment for the number is overdue, the request answers `409` until it is paid. To keep the number until the end of the period you paid for, use `DELETE /v1/numbers/{number_id}` instead. Shared numbers belong to Bird-managed shared infrastructure and cannot be released from your workspace.
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: number_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AllocatedNumberID'
        description: Identifier of the number to release, as returned in the id field of GET /v1/numbers.
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '204':
          description: Number released.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /workspaces/{workspaceId}/numbers:
    get:
      operationId: listNumbers
      tags:
      - Numbers
      summary: List your numbers
      description: List long-code numbers assigned to a workspace, filterable by country code, capabilities (sms, mms, voice, whatsapp), and leading digits.
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: countryCode
        in: query
        schema:
          type: string
      - name: capabilities
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberList_2'
      security:
      - AccessKey: []
    servers:
    - url: https://api.bird.com
      description: Bird platform API
    - url: https://rest.messagebird.com
      description: Legacy MessageBird REST API
  /workspaces/{workspaceId}/network-lookup:
