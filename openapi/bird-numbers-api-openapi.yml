openapi: 3.2.0
info:
  title: Bird Numbers API
  version: '1.0'
  description: 'Operations tagged numbers across 2 of this provider''s published API definitions: bird-openapi.json, bird-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
- url: https://api.bird.com
  description: Bird platform API
- url: https://rest.messagebird.com
  description: Legacy MessageBird REST API
tags:
- name: Numbers
  description: Phone number catalog and purchasing.
paths:
  /v1/numbers:
    get:
      operationId: listWorkspaceNumbers
      x-snippet-key: numbers.list
      summary: List your allocated numbers
      description: 'Returns a paginated list of the phone numbers currently allocated to your workspace, newest first. Each entry is either a dedicated number you bought or a shared number managed for you, as its `kind` field indicates. Pass `number` to look one up, or narrow the list with `country_code`, `number_type`, `prefix`, and `capabilities`. Use `search` to find a number by its name or reference, or `reference` for an exact match. An allocated number is not always enough to send from it: some countries also require an approved registration for the sender.'
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: search
        in: query
        required: false
        description: Matches part of the number, name, or reference, ignoring case. Number matching also ignores phone formatting such as spaces, parentheses, and hyphens. Name and reference matching preserves punctuation. Characters such as percent and underscore match literally.
        schema:
          type: string
          maxLength: 200
      - name: reference
        in: query
        required: false
        description: Return numbers with this exact reference. Matching is case-sensitive.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: number
        in: query
        required: false
        description: 'Return only the number matching these digits. Give a full number with its country code, however your own records spell it: `+12025550188`, `12025550188`, `0012025550188`, and `+1 202 555 0188` all resolve to the same number. Spacing and punctuation are fine once a leading `+` or `00` marks the country code, or when `country_code` names the country; a grouped spelling without either is refused rather than guessed at, and a national spelling (bare digits without the country code) matches only when `country_code` names the country. A short code is matched on its bare digits instead, and since the same short code can be allocated in more than one country, pass `country_code` alongside it to name which one. This filter narrows the list like the others rather than replacing them, so a country or capability filter still applies. To match a range of numbers rather than one, use `prefix`.'
        schema:
          type: string
          minLength: 1
          maxLength: 24
          pattern: ^[0-9+()\-. ]+$
      - name: country_code
        in: query
        required: false
        description: Filter by the country a number belongs to, as an ISO 3166-1 alpha-2 code.
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: number_type
        in: query
        required: false
        description: Return only allocated numbers of this physical type after applying the country and prefix filters.
        schema:
          $ref: '#/components/schemas/NumberType'
      - name: prefix
        in: query
        required: false
        description: 'Return only numbers that start with these digits. With `country_code`, the digits are national ones, matched right after the country dial code: with `country_code=US`, `prefix=212` returns the +1 212 area-code numbers allocated to you. Leave out the dial code and any national dialing prefix such as a leading 0; short codes never match a country-anchored prefix search. Without `country_code`, the digits are matched from the start of each stored number, ignoring a leading `+`, so short codes are reachable and a full number in digits finds itself. Digits only: up to 10 of them with `country_code`, 15 without.'
        schema:
          type: string
          pattern: ^[0-9]{1,15}$
      - name: capabilities
        in: query
        required: false
        description: 'Filter by capability. Repeat the parameter to require several at once: `capabilities=sms&capabilities=voice` returns only numbers that support both.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            x-extensible-enum:
            - sms
            - voice
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: List of the numbers allocated to the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/numbers/available:
    get:
      operationId: listAvailableNumbers
      x-snippet-key: numbers.available.list
      summary: List available phone numbers
      description: 'Returns phone numbers available for purchase in a country. Narrow the search with `number_type`, `capabilities`, and `prefix`. Inventory numbers come first and support pagination. The final page can include a live snapshot of numbers available from suppliers.


        Inventory results are newest first by default. When you specify `number_type` and the suppliers on sale in the market are ranked into multiple priority tiers, results follow supplier priority, newest first within each tier. These searches reject `ending_before` and return neither `prev_cursor` nor `refresh_cursor`, so backward and refresh paging are unavailable. Country-only searches and markets with a single tier keep newest-first inventory ordering and support backward and refresh paging.'
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: country_code
        in: query
        required: true
        description: ISO 3166-1 alpha-2 country code to search in.
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: number_type
        in: query
        required: false
        description: Return only numbers of this physical type after applying the country and prefix filters.
        schema:
          $ref: '#/components/schemas/NumberType'
      - name: prefix
        in: query
        required: false
        description: 'Return only numbers that start with these digits, matched right after the country dial code: with `country_code=US`, `prefix=212` matches +1 212 area-code numbers and `prefix=833` matches 833 toll-free numbers. Digits only. Leave out the country dial code and any national dialing prefix such as a leading 0. Short codes never match a prefix search.'
        schema:
          type: string
          pattern: ^[0-9]{1,10}$
      - name: capabilities
        in: query
        required: false
        description: 'Filter by capability. Repeat the parameter to require several at once: `capabilities=sms&capabilities=voice` returns only numbers that support both.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            x-extensible-enum:
            - sms
            - voice
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: List of available phone numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableNumberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/numbers/available/{number}:
    get:
      operationId: getAvailableNumber
      x-snippet-key: numbers.available.get
      summary: Get an available phone number
      description: Returns a single phone number available for purchase, whether it is already in inventory or can be acquired for you. Numbers supplied through a carrier remain available only while the carrier has them, so a number listed a moment ago may already be gone. A `404` means the number is currently unavailable for sale.
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: number
        in: path
        required: true
        description: Phone number in E.164 format. The leading `+` is optional.
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The available phone number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableNumber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/numbers/orders:
    post:
      operationId: createNumbersOrder
      x-snippet-key: numbers.orders.create
      summary: Create a number order
      description: 'Orders a number for your workspace and starts its recurring charge. The available number''s

        `pricing` is the current price, not a quote: the order resolves the price again when it

        charges, so a price published in between applies. Pass a

        number from `GET /v1/numbers/available`. Whether the number is already in

        inventory or acquired from a supplier, the response contains an order.


        Most orders complete immediately and return `201` with `status` of

        `completed` and `number_id` populated. Read the number with

        `GET /v1/numbers/{number_id}`. An order that cannot complete in the request

        returns `202`; poll `GET /v1/numbers/orders/{order_id}` until it is

        `completed` or `failed`.


        A `412` means required identity verification is incomplete or organization

        eligibility prevents the purchase. Follow the error''s recovery guidance:

        complete missing verification, or contact support about an eligibility review

        or denial. An eligibility assessment still in progress returns `503`; retry later.'
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumbersOrderCreate'
      responses:
        '201':
          description: The order completed and the number is now allocated to your workspace. Its status is completed, with number and number_id populated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumbersOrder'
        '202':
          description: The order was accepted but could not complete in this request. Poll it for completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumbersOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    get:
      operationId: listNumbersOrders
      x-snippet-key: numbers.orders.list
      summary: List your number orders
      description: Returns your workspace's number orders, newest first. Filter by status to find in-progress or failed orders.
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: status
        in: query
        required: false
        description: Return only orders with status `charging`, `ordering`, `pending`, `completed`, or `failed`.
        schema:
          $ref: '#/components/schemas/NumbersOrderStatus'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: List of the workspace's number orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumbersOrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/numbers/orders/{order_id}:
    get:
      operationId: getNumbersOrder
      x-snippet-key: numbers.orders.get
      summary: Get a number order
      description: Returns a single number order by id, including its current lifecycle state and, once completed, the number it produced.
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/NumbersOrderID'
        description: Identifier of the order.
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumbersOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    servers:
    - url: https://{region}.platform.bird.com
      description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

        '
      variables:
        region:
          default: us1
          enum:
          - us1
          - eu1
          description: The region your organization's data is hosted in.
    - url: https://platform.bird.com
      description: Region-independent endpoint for authentication and account administration.
    - url: http://localhost:8080
      description: Local development.
  /v1/numbers/{number_id}:
    get:
      operationId: getWorkspaceNumber
      x-snippet-key: numbers.get
      summary: Get an allocated number
      description: 'Returns a single phone number allocated to your workspace, whether it is a dedicated number you bought or a shared number managed for you. Numbers you have released are no longer returned. An allocated number is not always enough to send from it: some countries also require an approved registration for the sender.'
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: number_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AllocatedNumberID'
        description: Identifier of the number, as returned in the id field of GET /v1/numbers.
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Number'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    patch:
      operationId: updateWorkspaceNumber
      x-snippet-key: numbers.update
      summary: Update an allocated number
      description: Updates the name and reference for a number allocated to your workspace. Omit a field to keep its current value, or send null to clear it. Leading and trailing whitespace is removed. References need not be unique.
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: number_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AllocatedNumberID'
        description: Identifier returned by the allocated-number list.
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberUpdate'
      responses:
        '200':
          description: The updated number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Number'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
    delete:
      operationId: cancelWorkspaceNumber
      x-snippet-key: numbers.cancel
      summary: Cancel a dedicated number
      description: Cancels one of your workspace's dedicated numbers at the end of its current billing period. The number is not charged for another period, keeps its current status until the period ends, and is then released. The `202` response returns the number with `releases_at` set to that time, and cancelling a number that is already scheduled returns the same schedule. A number with no subscription behind it, such as one allocated to you without a charge, is released immediately and answers `200` with the number as released. While a renewal payment for the number is overdue, the request answers `409` until it is paid. To release a number now, use `POST /v1/numbers/{number_id}/release`. Shared numbers belong to Bird-managed shared infrastructure and cannot be cancelled from your workspace.
      tags:
      - Numbers
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: number_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AllocatedNumberID'
        description: Identifier of the number to cancel, as returned in the id field of GET /v1/numbers.
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The number had no subscription behind it and was released now. Its `status` is `released` and `released_at` is set.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Number'
              example:
                id: nda_01krdgeqcxet5s7t44vh8rt9mg
                kind: dedicated
                number: '+12025550123'
                name: Support line
                reference: CUST-778812
                country_code: US
                number_type: local
                capabilities:
                - sms
                - voice
                status: released
                allocated_at: '2026-08-19T10:00:00Z'
                releases_at: null
                released_at: '2026-10-06T14:02:11Z'
                ownership: null
                pricing: null
        '202':
          description: Cancellation scheduled. The number stays allocated, with its current status, until `releases_at`.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Number'
              example:
                id: nda_01krdgeqcxet5s7t44vh8rt9mg
                kind: dedicated
                number: '+12025550123'
                name: Support line
                reference: CUST-778812
                country_code: US
                number_type: local
                capabilities:
                - sms
                - voice
                status: active
                allocated_at: '2026-08-19T10:00:00Z'
                releases_at: '2026-10-19T10:00:00Z'
                released_at: null
                ownership: null
                pricing:
                  recurring_price:
                    amount: '0.00995'
                    currency_code: USD
                  recurring_period:
                    unit: month
                    count: 1
                  intervals_per_charge: 12
                  error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
