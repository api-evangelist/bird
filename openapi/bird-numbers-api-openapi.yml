    servers:
    - url: https://api.bird.com
      description: Bird platform API
    - url: https://rest.messagebird.com
      description: Legacy MessageBird REST API
components:
  schemas:
    NumberOwnershipStatus:
      type: string
      minLength: 1
      readOnly: true
      enum:
      - needs_input
      - under_review
      - approval_pending
      - approved
      - not_required
      - rejected
      - unknown
      description: 'Current ownership registration approval status. Operational activation is separate:

        `blocked_at` records the ownership block on number use, and `next` describes remaining work.


        - `needs_input` means ownership details or a submission correction are needed.

        - `under_review` means your current answers are being reviewed.

        - `approval_pending` means your paperwork is accepted but registration approval is still pending.

        - `approved` means ownership registration is approved. Number activation can still be pending while `blocked_at` is non-null.

        - `not_required` means no active ownership requirement applies, including after a requirement is withdrawn.

        - `rejected` means the submission was closed or the verifier correction deadline passed. Corrections are no longer accepted for this submission.

        - `unknown` means current approval status could not be determined. Read `blocked_at` for any recorded ownership block. Retry the read.

        '
    Number:
      type: object
      readOnly: true
      additionalProperties: false
      required:
      - id
      - kind
      - number
      - name
      - reference
      - country_code
      - number_type
      - capabilities
      - status
      - allocated_at
      - releases_at
      - released_at
      - pricing
      properties:
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
          description: The name you gave this number in your workspace. Null when no name is set.
        reference:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
          description: Your own reference for this number in your workspace. Null when no reference is set.
        id:
          allOf:
          - $ref: '#/components/schemas/AllocatedNumberID'
          description: Identifier of this allocated number. Pass it as `number_id` to read this number, or to cancel or release it when kind is dedicated.
        kind:
          type: string
          minLength: 1
          enum:
          - dedicated
          - shared
          description: How this number is allocated. `dedicated` belongs to your workspace and is billed as a subscription. `shared` is provided through Bird-managed shared infrastructure and is not owned or billed as a workspace subscription.
        number:
          type: string
          minLength: 1
          description: Phone number in E.164 format.
        country_code:
          allOf:
          - $ref: '#/components/schemas/CountryCode'
        number_type:
          allOf:
          - $ref: '#/components/schemas/NumberType'
          description: Physical type of this phone number.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/NumberCapability'
          description: Capabilities supported by this number.
        status:
          type: string
          minLength: 1
          enum:
          - active
          - pending_ownership_registration
          - released
          description: "The allocation and ownership-approval status of this number.\n\n- `active` means this number is allocated to your workspace and usable.\n- `pending_ownership_registration` means this number is allocated to your workspace and billed,\n  but outbound SMS and both inbound and outbound voice calls are blocked until ownership registration\n  is approved and activation completes, or the ownership requirement is withdrawn.\n  This ownership status does not gate inbound SMS or WhatsApp.\n  Read `ownership.status` and `ownership.next` for the current decision and remaining work.\n- `released` means this number is no longer allocated to your workspace.\n\nAn allocated number is not always enough to send from it: some destination\ncountries also require an approved registration for the sender.\n"
        allocated_at:
          type: string
          format: date-time
          minLength: 1
          description: When this number was allocated to your workspace.
        releases_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When a scheduled release of this number takes effect, at the end of its current billing period. The number stays allocated, with its current `status`, until then. `null` when no release is scheduled.
        released_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When this number was released. `null` while it is still allocated to your workspace.
        ownership:
          description: 'Ownership paperwork and activation progress. `null` when no ownership requirements, recorded block, or recorded decision apply, or when requirements or progress cannot be read and no ownership block or decision has been recorded. A recorded block still returns an ownership object with `status: unknown` when progress cannot be read; retry the read. We manage the paperwork for shared short codes, so this field is always `null` for them. Other sending requirements can apply even when ownership registration is complete.

            '
          oneOf:
          - $ref: '#/components/schemas/NumberOwnership'
          - type: 'null'
        pricing:
          description: What your organization pays for this number. `null` for a `shared` number, and, when the price was read, for a number with no live subscription. Otherwise its prices are `null` when no price applies. When the price could not be read, every dedicated number carries this object with `error` set, whether or not it has a live subscription.
          oneOf:
          - $ref: '#/components/schemas/NumberPricing'
          - type: 'null'
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: ISO 4217 three-letter currency code.
      example: EUR
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    ComplianceSubmissionID:
      type: string
      minLength: 1
      pattern: ^csb_[0-9a-hjkmnp-tv-z]{26}$
      example: csb_01krdgeqcxet5s7t44vh8rt9mg
    AvailableNumber:
      type: object
      readOnly: true
      additionalProperties: false
      required:
      - number
      - country_code
      - number_type
      - capabilities
      - ownership_registration_required
      properties:
        number:
          type: string
          minLength: 1
          description: Phone number in E.164 format.
        country_code:
          $ref: '#/components/schemas/CountryCode'
        number_type:
          allOf:
          - $ref: '#/components/schemas/NumberType'
          description: Physical type of this phone number.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/NumberCapability'
          description: Capabilities supported by this number.
        ownership_registration_required:
          type: boolean
          description: Whether ownership paperwork must be approved before outbound SMS and voice use. Customer availability accounts for organization exemptions; admin supplier searches report the general country and number-type requirement. You can acquire the number, including Bird stock, and submit paperwork afterward. Any `pricing.setup_price` is charged during purchase, plus any tax. The recurring charge, net of tax `pricing.recurring_price` multiplied by `pricing.intervals_per_charge`, is taken with any tax at assignment and at each renewal, even while approval is pending; assignment may follow completion of a pending supplier order.
        ownership_address_scope:
          type: string
          x-extensible-enum:
          - anywhere
          - country
          - number_area
          description: "Where the carrier requires the business address on this number's ownership registration\nto be. Present only when the carrier itself registers the number before it carries\ntraffic and states a rule; omitted otherwise. An address that does not meet the rule\nis refused after purchase, and only an address that meets it can fix the registration.\n\n- `anywhere`: any business address.\n- `country`: a business address in the number's country.\n- `number_area`: a business address inside the number's own area code, for example in\n  Amsterdam for an Amsterdam (020) number.\n"
        pricing:
          description: What your organization pays for this number. Omitted on admin supplier searches, which have no organization to price for.
          allOf:
          - $ref: '#/components/schemas/AvailableNumberPricing'
    AvailableNumberList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/AvailableNumber'
      - $ref: '#/components/schemas/_ListEnvelope'
    NumbersOrderStatus:
      type: string
      minLength: 1
      x-extensible-enum:
      - charging
      - ordering
      - pending
      - completed
      - failed
      description: 'Lifecycle state of a number purchase order:


        - `charging`: Securing funds.

        - `ordering`: Placing the order with the carrier.

        - `pending`: The carrier accepted the order and is provisioning the number.

        - `completed`: Your workspace owns the number.

        - `failed`: The purchase did not complete.


        A setup fee already charged is non-refundable. Contact support about a failed

        order.'
    NumbersOrderCreate:
      type: object
      additionalProperties: false
      required:
      - number
      properties:
        number:
          type: string
          minLength: 1
          description: The number to acquire, in E.164 format, as returned by `GET /v1/numbers/available`.
          example: '+18005550100'
        reference:
          type: string
          minLength: 1
          maxLength: 100
          description: Your own reference to set on the number when this purchase completes. Leading and trailing whitespace is removed. A pending order keeps the reference until the number is allocated.
          example: STORE-042
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency_code
      properties:
        amount:
          type: string
          minLength: 1
          description: Decimal amount as a string, in major currency units.
          example: '0.00995'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          description: ISO 4217 currency code.
          example: USD
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    AllocatedNumberID:
      type: string
      minLength: 1
      pattern: ^(nda|nal)_[0-9a-hjkmnp-tv-z]{26}$
      example: nda_01krdgeqcxet5s7t44vh8rt9mg
      description: Identifier of a number allocated to your workspace, as returned in the id field of `GET /v1/numbers`.
    NumberType:
      type: string
      minLength: 1
      x-extensible-enum:
      - mobile
      - local
      - national
      - short_code
      - short_code_fteu
      - toll_free
      description: Physical type of a phone number. New number types may be added over time, so treat unrecognized values as supported types rather than errors.
    NumberPricing:
      type: object
      readOnly: true
      additionalProperties: false
      description: What your organization pays for a number it holds, net of tax.
      required:
      - recurring_price
      - recurring_period
      - intervals_per_charge
      - error
      properties:
        recurring_price:
          description: 'What your organization is charged for this number per `recurring_period`, net of tax, in the currency this number is charged in: your billing currency, unless this number''s subscription predates a change of your billing currency, in which case its own currency is returned. `null` when no price applies.'
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        recurring_period:
          description: The rate's interval, or a fixed price's whole renewal period. `null` when `recurring_price` is `null`.
          oneOf:
          - $ref: '#/components/schemas/BillingPricingInterval'
          - type: 'null'
          example:
            unit: month
            count: 1
        intervals_per_charge:
          description: How many `recurring_period`s one renewal charges. When `releases_at` is set no renewal follows, and the value still describes the subscription's cadence until the release. `1` for a fixed price. `null` when `recurring_price` is `null`.
          type:
          - integer
          - 'null'
          minimum: 1
          example: 12
        error:
          example: null
          description: A retryable failure to read the price. Retry a GET of the number; do not repeat a completed write. `null` when the price was read or no price applies.
          oneOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: 'null'
    NumberCapability:
      type: string
      minLength: 1
      x-extensible-enum:
      - sms
      - mms
      - voice
      description: A capability supported by a phone number. New capabilities may be added over time, so treat unrecognized values as supported capabilities rather than errors.
    BillingPricingInterval:
      type: object
      description: 'A period: a unit and a count. A day is a fixed 24-hour UTC period. A larger `count` lengthens the period without multiplying the amount quoted for it.'
      additionalProperties: false
      required:
      - unit
      - count
      properties:
        unit:
          $ref: '#/components/schemas/BillingInterval'
          description: The calendar unit the period is counted in.
        count:
          type: integer
          minimum: 1
          maximum: 366
          description: Number of units in the period.
          example: 3
    NumbersDedicatedAllocationID:
      type: string
      minLength: 1
      pattern: ^nda_[0-9a-hjkmnp-tv-z]{26}$
      example: nda_01krdgeqcxet5s7t44vh8rt9mg
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    BillingInterval:
      type: string
      minLength: 1
      enum:
      - day
      - month
      - year
      description: The recurring interval one subscription charge covers.
      example: month
    NumbersOrder:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - country_code
      - number_type
      - status
      - created_at
      - updated_at
      properties:
        id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/NumbersOrderID'
          description: Identifier of this purchase order.
        number:
          type: string
          minLength: 1
          readOnly: true
          description: The number being acquired, in E.164 format.
        country_code:
          allOf:
          - $ref: '#/components/schemas/CountryCode'
          readOnly: true
        number_type:
          allOf:
          - $ref: '#/components/schemas/NumberType'
          readOnly: true
          description: Physical type of the number being acquired.
        status:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/NumbersOrderStatus'
        number_id:
          readOnly: true
          description: 'Identifier of the number this order produced, set when `status` is `completed`. Pass it as `number_id` to `GET /v1/numbers/{number_id}` or `DELETE /v1/numbers/{number_id}`. `null` until the order completes.

            '
          oneOf:
          - $ref: '#/components/schemas/NumbersDedicatedAllocationID'
          - type: 'null'
        failure_reason:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Human-readable reason the purchase failed. `null` unless status is failed. An order can fail some time after it was created, so `updated_at` tells you when the failure was recorded rather than when the order was placed.

            '
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: 'When the purchase completed and the number became owned (status completed). `null` for orders still in progress or failed.

            '
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
        updated_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
    NumberList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Number'
      - $ref: '#/components/schemas/_ListEnvelope'
