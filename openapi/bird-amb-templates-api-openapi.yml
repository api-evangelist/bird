openapi: 3.2.0
info:
  title: Bird Amb Templates API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: amb-templates
  description: Create and publish multilingual workspace Apple Messages templates and browse built-in templates. Published workspace versions preserve their language content; built-in versions reflect the current catalogue.
paths:
  /v1/amb/templates:
    get:
      operationId: listAMBTemplates
      x-snippet-key: amb.templates.list
      summary: List Apple Messages templates
      description: 'Returns Apple Messages templates as a cursor-paginated list. The workspace''s templates

        come first, newest first, followed by our built-in templates by default.

        Set `order=asc` to reverse this order.


        Filter by scope, category, status, content kind, or language. Use `q` for a

        case-insensitive substring match against slug, name, and description. The

        response is shallow; read a version to retrieve its content and variables.'
      tags:
      - amb-templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: scope
        in: query
        required: false
        description: Filter by who owns the template. Use `system` for built-in templates and `workspace` for templates your workspace created.
        schema:
          $ref: '#/components/schemas/TemplateScope'
      - name: category
        in: query
        required: false
        description: Return templates in this category.
        schema:
          $ref: '#/components/schemas/AMBTemplateCategory'
      - name: status
        in: query
        required: false
        description: Return templates with this lifecycle status.
        schema:
          $ref: '#/components/schemas/TemplateStatus'
      - name: content_kind
        in: query
        required: false
        description: Return templates whose live or draft content is this kind.
        schema:
          $ref: '#/components/schemas/AMBContentKind'
      - name: language
        in: query
        required: false
        description: Return templates whose published content contains this language, after the tag is canonicalized. Draft-only languages do not match.
        schema:
          $ref: '#/components/schemas/LanguageTag'
      - name: q
        in: query
        required: false
        description: A case-insensitive substring search across slug, name, and description.
        schema:
          type: string
          minLength: 1
      - name: sort
        in: query
        required: false
        description: Field to sort by.
        schema:
          $ref: '#/components/schemas/AMBTemplateSortField'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of Apple Messages templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBTemplateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/templates/{template_ref}:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: 'The template''s ID (`amt_…`) or slug. Built-in templates use a `bird_` slug. Write operations accept workspace templates because built-in templates are read-only.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 63
      example: bird_otp_verification
    get:
      operationId: getAMBTemplate
      x-snippet-key: amb.templates.get
      summary: Get an Apple Messages template
      description: Returns one Apple Messages template's metadata, policies, language states, draft revision, and draft and live version IDs. The response is shallow; read a version to retrieve content and variables. An unknown or deleted template returns `404`.
      tags:
      - amb-templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: The requested Apple Messages template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/templates/{template_ref}/versions:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: The template's ID (`amt_…`) or slug.
      schema:
        type: string
        minLength: 1
        maxLength: 63
      example: order-shipped
    get:
      operationId: listAMBTemplateVersions
      x-snippet-key: amb.templates.versions.list
      summary: List an Apple Messages template's versions
      description: Returns a cursor-paginated version history, newest first. Each entry is shallow and names its variables and languages. Read a version item or one of its languages to retrieve text. A built-in template exposes its current catalogue content as one synthetic published version.
      tags:
      - amb-templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: sort
        in: query
        required: false
        description: Field to sort by.
        schema:
          $ref: '#/components/schemas/AMBTemplateSortField'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of template versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBTemplateVersionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/templates/{template_ref}/versions/{version_id}:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: The template's ID (`amt_…`) or slug.
      schema:
        type: string
        minLength: 1
        maxLength: 63
      example: order-shipped
    - name: version_id
      in: path
      required: true
      description: The version to read or reset.
      schema:
        $ref: '#/components/schemas/AMBTemplateVersionID'
    get:
      operationId: getAMBTemplateVersion
      x-snippet-key: amb.templates.versions.get
      summary: Get an Apple Messages template version
      description: Returns one version with its variables and text in every language. A workspace draft is editable, while published workspace versions are immutable. A built-in template exposes its current catalogue content through a synthetic published version.
      tags:
      - amb-templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: The requested Apple Messages template version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBTemplateVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/templates/{template_ref}/versions/{version_id}/languages:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: The template's ID (`amt_…`) or slug.
      schema:
        type: string
        minLength: 1
        maxLength: 63
      example: order-shipped
    - name: version_id
      in: path
      required: true
      description: The version whose languages to list.
      schema:
        $ref: '#/components/schemas/AMBTemplateVersionID'
    get:
      operationId: listAMBTemplateVersionLanguages
      x-snippet-key: amb.templates.versions.languages.list
      summary: List an Apple Messages template version's languages
      description: Returns the languages a version holds, ordered by canonical language tag, without their text. Each summary includes the revision and content hash needed to detect changes. A version holds at most 25 languages.
      tags:
      - amb-templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: The version's language summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBTemplateLanguageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/templates/{template_ref}/versions/{version_id}/languages/{language}:
    parameters:
    - name: template_ref
      in: path
      required: true
      description: The template's ID (`amt_…`) or slug.
      schema:
        type: string
        minLength: 1
        maxLength: 63
      example: order-shipped
    - name: version_id
      in: path
      required: true
      description: The version that holds the language.
      schema:
        $ref: '#/components/schemas/AMBTemplateVersionID'
    - name: language
      in: path
      required: true
      description: The language as a BCP-47 tag. Case and separator differences are accepted and canonicalized.
      schema:
        $ref: '#/components/schemas/LanguageTag'
      example: pt-BR
    get:
      operationId: getAMBTemplateVersionLanguage
      x-snippet-key: amb.templates.versions.languages.get
      summary: Get an Apple Messages template version's language
      description: Returns one language's full text, revision, content hash, and update time. The response echoes the language in its canonical BCP-47 form.
      tags:
      - amb-templates
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: The requested language and its text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBTemplateLanguage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  schemas:
    AMBRichLinkConstruct:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          minLength: 1
          description: The App Clip, Apple Music, or Apple Maps URL to build a preview for. An `http://` URL is refused with a `422` `AMBEndpointNotHTTPS`. A URL Apple cannot build a preview for is refused with a `422` `AMBConstructPayloadFailed`; send `rich_link` content with your own `title` and `image` instead.
          example: https://apps.apple.com/app/id123456789?clip=1
          x-sensitive: true
        store_region:
          $ref: '#/components/schemas/CountryCode'
          description: App Store storefront used to build an App Clip preview. Defaults to `US` when omitted.
      description: Asks Apple to build the rich link preview when the message is sent, rather than through a prior `POST /v1/amb/messages/construct-payload` call. No caller holds a signed reference until the send itself resolves one.
    AMBFormPickerPage:
      allOf:
      - $ref: '#/components/schemas/AMBFormPageCommon'
      - type: object
        required:
        - type
        - items
        properties:
          type:
            type: string
            minLength: 1
            const: picker
          picker_title:
            type: string
            description: Text beside the picker field. Omit to center the field without a label.
          selected_item_index:
            type: integer
            minimum: 0
            description: Zero-based index into `items`. Defaults to `0`. Must be less than the number of items; otherwise sending returns `422` `AMBFormPagesInvalid`.
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AMBFormPickerItem'
      unevaluatedProperties: false
    AMBTemplateLanguage:
      type: object
      additionalProperties: false
      description: One language's full Apple Messages template content and revision metadata.
      required:
      - language
      - content
      - revision
      - content_hash
      - updated_at
      properties:
        language:
          $ref: '#/components/schemas/LanguageTag'
          readOnly: true
          description: The language in canonical BCP-47 form.
        content:
          $ref: '#/components/schemas/AMBMessageContent'
          readOnly: true
          description: Stored template content, including its `{{ variable }}` placeholders.
        revision:
          type: integer
          minimum: 0
          readOnly: true
          description: This language's revision counter, used for concurrent-edit checks on draft writes.
        content_hash:
          readOnly: true
          $ref: '#/components/schemas/AMBTemplateContentHash'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When this language was last saved. Null for a built-in template.
      example:
        language: en
        content:
          type: text
          body: Your order {{ order_number }} is on its way.
        revision: 1
        content_hash: sha256:3d948846f5f773fb7bed8ab81b57f3d0ff2cbff24cb549718f4d389f1ab0300a
        updated_at: '2026-09-10T09:00:00Z'
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    AMBNativeInteractiveData:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          minLength: 1
          description: App Store identifier of the iMessage app.
        app_name:
          type: string
          minLength: 1
          description: Name of the iMessage app.
        bid:
          type: string
          minLength: 1
          description: Identifier of the iMessage extension, in Apple's `com.apple.messages.MSMessageExtensionBalloonPlugin:team-id:extension-id` format.
        url:
          x-sensitive: true
          type: string
          minLength: 1
          description: Opaque URL string that Messages passes to the iMessage app.
          example: ?order=1234&view=detail
        use_live_layout:
          type: boolean
          description: Whether Messages renders the received and reply bubbles using Live Layout.
        session_identifier:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Session UUID to preserve across interactions. Apple creates one when omitted.
        received_message:
          $ref: '#/components/schemas/AMBMessageBubble'
          description: Content Messages shows in the received message bubble.
        reply_message:
          $ref: '#/components/schemas/AMBMessageBubble'
          description: Content Messages shows in the reply message bubble.
        app_icon_source_url:
          type: string
          minLength: 1
          description: Publicly accessible HTTPS URL of the app's PNG icon. The icon must be smaller than 15 kB. We fetch and include it in the request to Apple. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          x-sensitive: true
        data:
          $ref: '#/components/schemas/AMBNativeInteractivePayload'
      description: A built-in interaction or custom iMessage app. Custom apps require the app metadata and both message bubbles.
      oneOf:
      - required:
        - data
        not:
          anyOf:
          - properties:
              app_id: {}
            required:
            - app_id
          - properties:
              app_name: {}
            required:
            - app_name
          - properties:
              bid: {}
            required:
            - bid
          - properties:
              url: {}
            required:
            - url
          - properties:
              app_icon_source_url: {}
            required:
            - app_icon_source_url
          - properties:
              use_live_layout: {}
            required:
            - use_live_layout
      - required:
        - app_id
        - app_name
        - bid
        - url
        - app_icon_source_url
        - use_live_layout
        - received_message
        - reply_message
        not:
          properties:
            data: {}
          required:
          - data
    TemplateSlug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$
      description: 'A template''s slug: what you send it by, for example `welcome-email`. Email and SMS slugs stay fixed after creation. WhatsApp slugs can change only before the first submission. A slug can contain lowercase letters, numbers, hyphens, and underscores, has to start and end with a letter or a number, and can be up to 63 characters long.

        '
      example: welcome-email
    AMBTemplateLanguageState:
      type: object
      additionalProperties: false
      description: Whether a language is live and whether its draft has unpublished changes.
      required:
      - status
      properties:
        status:
          readOnly: true
          $ref: '#/components/schemas/TemplateLanguageStatus'
        draft:
          type: boolean
          readOnly: true
          description: 'Whether the draft has an unpublished change for this language. When true beside `live`, sends keep using the older published content until submit.

            '
    AMBTemplateList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            description: One page of Apple Messages templates.
            items:
              $ref: '#/components/schemas/AMBTemplateSummary'
      - $ref: '#/components/schemas/_ListEnvelope'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    AMBMessageBubbleStyle:
      type: string
      enum:
      - icon
      - small
      - large
      description: Layout of an Apple interactive message bubble.
    AMBFormInputPage:
      allOf:
      - $ref: '#/components/schemas/AMBFormPageCommon'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            minLength: 1
            const: input
          hint_text:
            type: string
          options:
            $ref: '#/components/schemas/AMBFormInputOptions'
      unevaluatedProperties: false
    AMBTemplateVersionStatus:
      type: string
      minLength: 1
      readOnly: true
      enum:
      - draft
      - published
      description: 'Whether the version is the editable draft or published. Published workspace versions are immutable and remain `published` after a later version goes live. A built-in template''s synthetic published version projects the current catalogue entry.

        '
      example: published
    AMBNativeImage:
      type: object
      additionalProperties: false
      required:
      - identifier
      - source_url
      properties:
        identifier:
          type: string
          description: Identifier referenced by a bubble, item, or event.
          minLength: 1
        source_url:
          type: string
          description: HTTPS URL of a PNG image up to 200 kB. Total interactive image data must not exceed 5 MB. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          minLength: 1
          x-sensitive: true
        description:
          type: string
          description: Accessibility description read by VoiceOver.
          x-sensitive: true
    AMBAuthenticationID:
