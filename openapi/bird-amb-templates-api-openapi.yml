    TemplateVariable:
      type: object
      additionalProperties: false
      description: 'A single variable slot a template fills in when it sends. Most slots are filled from the values supplied when sending; on email, a slot with `system` true is filled by Bird itself, per recipient. The same shape on email, SMS and WhatsApp, so reading what a template needs works the same way whichever channel you are sending on.

        '
      required:
      - key
      - type
      - required
      - constraint
      properties:
        key:
          type: string
          minLength: 1
          readOnly: true
          description: 'The key this slot is filled by. When `system` is true it is the reserved `bird` key or a dotted path beneath it, such as `bird.contact.first_name`, and naming it in a send is rejected. Otherwise, on email and SMS it is the key you set in the send''s `parameters` object, and on WhatsApp the `name` you repeat on the matching parameter inside `components`, or, for a template whose placeholders are positional, the position itself as `1`, `2` and so on.

            '
        type:
          type: string
          minLength: 1
          readOnly: true
          x-extensible-enum:
          - code
          - ttl
          - count
          - ref
          - date
          - date_time
          - amount
          - currency
          - text
          description: 'The value type this slot accepts. Built-in SMS templates use typed slots (`code`, `amount` and the rest), each of which rejects a value that does not match its `constraint`. Email, WhatsApp and workspace SMS templates use `text`. Workspace SMS parameters must be scalar values. Open enum: treat an unrecognized value as a future type rather than an error.

            '
        required:
          type: boolean
          readOnly: true
          description: 'Whether the send must supply this variable. Omitting a required value returns `422` on email, SMS, and WhatsApp sends. Always false when `system` is true, because you do not supply that slot''s value.

            '
        constraint:
          type: string
          minLength: 1
          readOnly: true
          description: 'A plain-language description of what values this variable accepts. When `system` is true it names where Bird takes the value from instead, because there is no value for you to send.

            '
        sensitive:
          type: boolean
          readOnly: true
          default: false
          description: 'Whether this slot''s value is redacted from stored message content. A placeholder replaces the sensitive value in message history; transport queues can still carry the text needed for delivery.

            '
        system:
          type: boolean
          readOnly: true
          default: false
          description: 'Whether the value comes from Bird rather than from the send. Absent means false. Only email templates have system slots, identified by the reserved `bird` key or a dotted path beneath it; every SMS and WhatsApp slot is yours to fill. A draft can also name a reserved key no Bird value fills, including `bird` itself: `constraint` says so, and publishing that draft is rejected.

            '
    TemplateOnMissingLanguage:
      type: string
      minLength: 1
      enum:
      - fallback
      - fail
      x-enum-varnames:
      - TemplateOnMissingLanguageFallback
      - TemplateOnMissingLanguageFail
      description: 'What a send or a preview does when it asks for a language the template

        cannot serve.


        `fallback` serves the closest match instead. It tries a broader form of the

        same language first, so a request for `pt-BR` can be served by a stocked

        `pt`, and then the template''s default language. A send never fails because a

        language is missing.


        `fail` rejects the send rather than serving a different language, for content

        where sending the wrong language is worse than not sending at all. It matches

        the requested tag or a broader form of it and refuses a sibling variant, so

        `pt-BR` is never served by `pt-PT`. A send that names no language still uses

        the default language.


        The default is per channel and stated on each channel''s own field, because

        what a wrong-language send costs differs. Where every language is separately

        reviewed and separately priced, falling back silently would send content the

        recipient did not expect at a rate the sender did not choose.

        '
      example: fallback
