        '
    AMBTemplateCategory:
      type: string
      minLength: 1
      enum:
      - transactional
      - marketing
      description: 'Why messages use this template, fixed at creation. On Apple Messages the category describes intent and becomes the message''s reporting `category`; it grants and restricts nothing. Use `marketing` for promotions and `transactional` for service messages.

        '
    AMBTemplateVersionList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            description: One page of the template's versions, newest first.
            items:
              $ref: '#/components/schemas/AMBTemplateVersionSummary'
      - $ref: '#/components/schemas/_ListEnvelope'
    AMBNativeInteractiveContent:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          const: interactive
          description: Always interactive.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Automatic introductions for inline quick replies are enabled regionally in stages. When enabled for a new send containing `interactive_data.data.quick_reply`, a nonblank body is sent as separate text before the choices. Messages using `interactive_data_ref` do not receive this automatic introduction, even after activation. All parts belong to one message, which becomes sent after Apple accepts all parts. For referenced interactions, before activation, and for retries retaining legacy behavior, body is included in the interactive request and is not guaranteed to appear on the device. To ensure an introduction without relying on activation, send a separate text message and omit body from the quick reply. Omit body to send choices only. For list pickers, time pickers and forms, use interactive_data.received_message for the visible introduction. Use one U+FFFC object replacement character per attachment to control placement.
          x-sensitive: true
        subject:
          type: string
          description: Subject displayed above the message body.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments. Each object supplies a source URL or an encrypted Apple reference.
        interactive_data:
          $ref: '#/components/schemas/AMBNativeInteractiveData'
        interactive_data_ref:
          $ref: '#/components/schemas/AMBRichLinkReference'
      oneOf:
      - required:
        - interactive_data
        not:
          properties:
            interactive_data_ref: {}
          required:
          - interactive_data_ref
      - required:
        - interactive_data_ref
        not:
          properties:
            interactive_data: {}
          required:
          - interactive_data
    AMBNativeRichLinkContent:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          const: rich_link
          description: Always rich_link.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Automatic introductions for rich links are enabled regionally in stages. When enabled for a new send, a nonblank body is sent as a separate text before the link. All parts belong to one message, which becomes sent after Apple accepts all parts. Before activation, and for retries retaining legacy behavior, body is included in the rich link request and is not guaranteed to appear on the device. To ensure an introduction without relying on activation, send a separate text message and omit body from the rich link. Use one U+FFFC object replacement character per attachment to control placement.
          x-sensitive: true
        subject:
          type: string
          description: Subject displayed above the message body.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments. Each object supplies a source URL or an encrypted Apple reference.
        rich_link_data:
          $ref: '#/components/schemas/AMBNativeRichLinkData'
        rich_link_data_ref:
          $ref: '#/components/schemas/AMBRichLinkReference'
        rich_link_construct:
          $ref: '#/components/schemas/AMBRichLinkConstruct'
      oneOf:
      - required:
        - rich_link_data
        not:
          properties:
            rich_link_data_ref: {}
            rich_link_construct: {}
          required:
          - rich_link_data_ref
          - rich_link_construct
      - required:
        - rich_link_data_ref
        not:
          properties:
            rich_link_data: {}
            rich_link_construct: {}
          required:
          - rich_link_data
          - rich_link_construct
      - required:
        - rich_link_construct
        not:
          properties:
            rich_link_data: {}
            rich_link_data_ref: {}
          required:
          - rich_link_data
          - rich_link_data_ref
    AMBTemplateID:
      type: string
      minLength: 1
      pattern: ^amt_[0-9a-hjkmnp-tv-z]{26}$
      example: amt_01krdgeqcxet5s7t44vh8rt9mg
    TemplateStatus:
      type: string
      minLength: 1
      readOnly: true
      enum:
      - draft
      - pending
      - active
      - rejected
      - inactive
      description: 'Where the template stands as a whole. The same five states on every channel.


        - `draft`: nothing has ever gone live.

        - `pending`: nothing is live and at least one language is in review.

        - `active`: at least one language is live, so something can be sent.

        - `rejected`: it was reviewed and every language was refused.

        - `inactive`: nothing is live and nothing is in review, so content was withdrawn or was blocked before anything went live.


        A template with one language live is `active` even while another is still

        drafted or refused. Read `languages` for the state of each language and its

        reason.


        Which values a channel reports follows its review model. A channel whose

        content a third party reviews uses all five. On email and SMS, where content

        goes live on publish, a template is `draft`, `active` or `inactive`, and

        `pending` and `rejected` are reserved for the review stage coming to both, so

        a template reaching either is not a breaking change.

        '
      example: active
    AMBNativeRichLinkAssets:
