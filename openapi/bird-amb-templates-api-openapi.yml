      - category
      - content_kind
      - default_language
      - available_languages
      - languages
      - on_missing_language
      - language_source_required
      - draft_version_id
      - live_version_id
      - published_version_id
      - revision
      - last_submitted_at
      - created_at
      - updated_at
      properties:
        id:
          readOnly: true
          description: Template ID.
          $ref: '#/components/schemas/AMBTemplateID'
        workspace_id:
          readOnly: true
          description: The workspace that owns the template. Null for a built-in `system` template.
          oneOf:
          - $ref: '#/components/schemas/WorkspaceID'
          - type: 'null'
        slug:
          allOf:
          - $ref: '#/components/schemas/TemplateSlug'
          readOnly: true
          description: 'The immutable handle used to address and send the template. A built-in template''s slug starts with `bird_`.

            '
          example: order-shipped
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The template's display name. It defaults to the slug and can be changed on workspace templates.
          example: Order shipped
        description:
          type:
          - string
          - 'null'
          description: What the template is for. Null if it has no description.
        scope:
          $ref: '#/components/schemas/TemplateScope'
        status:
          $ref: '#/components/schemas/TemplateStatus'
        category:
          $ref: '#/components/schemas/AMBTemplateCategory'
        content_kind:
          readOnly: true
          description: 'Derived message classification, matching the default language''s content. Every language of a version shares one content_kind; a translation changes wording, not message type.

            '
          $ref: '#/components/schemas/AMBContentKind'
        draft_version_id:
          readOnly: true
          description: The permanent editable draft version. Null for a built-in template.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        live_version_id:
          readOnly: true
          description: 'The version sends resolve to, or null before a workspace template is first published. A built-in template points to a synthetic published version that projects its current catalogue content.

            '
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        published_version_id:
          readOnly: true
          deprecated: true
          description: Deprecated. Use `live_version_id`, which carries the same value.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        revision:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: The draft revision to use for concurrent-edit checks. Null for a built-in template.
        languages:
          type: object
          readOnly: true
          propertyNames:
            type: string
            minLength: 2
            maxLength: 35
          additionalProperties:
            $ref: '#/components/schemas/AMBTemplateLanguageState'
          description: 'Each language the template has, keyed by canonical BCP-47 tag, with its live state and whether the draft contains unpublished changes. Content is available from version reads.

            '
          example:
            en:
              status: live
            nl:
              status: live
              draft: true
        default_language:
          $ref: '#/components/schemas/LanguageTag'
          readOnly: true
          description: 'The draft''s default language. Sends continue using the live version''s default until the draft is published.

            '
        available_languages:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LanguageTag'
          description: 'Languages the live version can currently send. Empty before first publication.

            '
          example:
          - en
        on_missing_language:
          allOf:
          - $ref: '#/components/schemas/TemplateOnMissingLanguage'
          readOnly: true
          description: How a send handles a requested language that the live version does not have.
        language_source_required:
          type: boolean
          readOnly: true
          description: Whether each send must name a language instead of using the live version's default.
        last_submitted_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the template was last published. Null before first publication and for built-in templates.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the template was created. Null for built-in templates.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the template was last modified. Null for built-in templates.
    AMBFormSplash:
      type: object
      additionalProperties: false
      required:
      - button_title
      properties:
        header:
          type: string
        splash_text:
          type: string
        button_title:
          type: string
          minLength: 1
        image_identifier:
          type: string
          minLength: 1
    AMBNativeAuthentication:
      type: object
      additionalProperties: false
      readOnly: true
      description: Authentication attempt created through the conversation authentication endpoint. Contains no authorization parameters or credentials.
      required:
      - authentication_id
      properties:
        authentication_id:
          readOnly: true
          $ref: '#/components/schemas/AMBAuthenticationID'
    AMBTimeSlot:
      type: object
      additionalProperties: false
      required:
      - identifier
      - start_at
      - duration_seconds
      properties:
        identifier:
          type: string
          minLength: 1
          description: Opaque slot identifier. Apple may instead return only a localized label in interactive_data.reply_message.title.
        start_at:
          type: string
          format: date-time
          minLength: 1
          description: When this slot begins. Seconds and fractional seconds must be zero, for example `2026-09-02T14:30:00Z`; otherwise sending returns `422` with error code `E01001`. The timestamp is converted to UTC for Apple while preserving the instant.
        duration_seconds:
          type: integer
          minimum: 0
          description: Duration in seconds. Zero indicates no duration.
    CountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^[A-Za-z]{2}$
      description: ISO 3166-1 alpha-2 country code.
      example: US
    AMBNativeTextContent:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          const: text
          description: Always text.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Text displayed in the message. Use one U+FFFC object replacement character per attachment to control placement.
          x-sensitive: true
        subject:
          type: string
          description: Subject displayed above the message body.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments. Each object supplies a source URL or an encrypted Apple reference.
      anyOf:
      - required:
        - body
      - required:
        - attachments
        properties:
          attachments:
            minItems: 1
  parameters:
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: Cursor from the `prev_cursor` or `refresh_cursor` field of a previous list response. Returns items immediately before the cursor position in the current sort order. `prev_cursor` returns the preceding page. `refresh_cursor` anchors at the first row of that response, which on a newest-first sort is how to fetch the items that have appeared since.
      schema:
        type: string
    XWorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace context for the request. Required for dashboard authentication and master keys. Workspace keys and access tokens already identify their workspace; send that workspace or omit the header. A different one is rejected.
      schema:
        type: string
        pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
    OrderDesc:
      name: order
      in: query
      required: false
      description: 'Sort direction. Defaults to `desc`, which sorts from newest to oldest or largest to smallest, depending on the selected sort field.

        '
      schema:
        $ref: '#/components/schemas/SortOrder'
        default: desc
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: Cursor from the `next_cursor` field of a previous list response. Returns items immediately after the cursor position in the current sort order.
      schema:
        type: string
    PaginationLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    XOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Organization context for the request. Required for dashboard authentication. An API key or access token carries its own organization, so send either that organization or no header at all; a different one is rejected.
      schema:
        type: string
        pattern: ^org_[0-9a-hjkmnp-tv-z]{26}$
  responses:
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Workspace

        keys use `bk_{region}_*`; organization master keys use `bm_{region}_*`.

        The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
