          description: 'Derived message classification, matching the default language''s content.

            '
          $ref: '#/components/schemas/AMBContentKind'
        draft_version_id:
          readOnly: true
          description: The permanent editable draft version. Null for a built-in template.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        live_version_id:
          readOnly: true
          description: The version sends resolve to, or null before first publication.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        published_version_id:
          readOnly: true
          deprecated: true
          description: Deprecated. Use `live_version_id`, which carries the same value.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        languages:
          type: object
          readOnly: true
          propertyNames:
            type: string
            minLength: 2
            maxLength: 35
          additionalProperties:
            $ref: '#/components/schemas/AMBTemplateLanguageState'
          description: Each language and its live or draft state, keyed by canonical BCP-47 tag.
        default_language:
