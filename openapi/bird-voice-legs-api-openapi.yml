openapi: 3.2.0
info:
  title: Bird Voice Legs API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: voice-legs
  description: Call records (CDR) for the workspace, in flight and completed.
paths:
  /v1/voice/legs:
    get:
      operationId: listVoiceLegs
      x-snippet-key: voice.list
      summary: List legs
      description: 'Returns a paginated list of the workspace''s legs, ordered by start time

        descending.


        The `status` filter selects where in the lifecycle you look, and any

        combination is a single page: in-flight statuses (`ringing`,

        `in_progress`), final ones, or both together. Omit it and you get

        completed legs, which is what this list has always returned.


        A leg in flight carries no economics yet: `duration_ms`, `billable_ms`,

        `ended_at`, and `cost` are null until it ends. It keeps the same `id`

        throughout, so the same leg answers under one identity from the first

        ring to settlement.'
      tags:
      - voice-legs
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      parameters:
      - name: direction
        in: query
        required: false
        description: Return only legs in this direction.
        schema:
          $ref: '#/components/schemas/VoiceCallDirection'
      - name: status
        in: query
        required: false
        description: 'Return only legs with one of these statuses, comma-separated.

          In-flight and final statuses may be combined freely.

          '
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/VoiceCallStatus'
      - name: call_id
        in: query
        required: false
        description: Return only legs belonging to this call, which is how the legs of one multi-party or transferred call are correlated.
        schema:
          $ref: '#/components/schemas/VoiceSessionID'
      - name: sip_trunk_id
        in: query
        required: false
        description: Return only legs carried by this SIP trunk.
        schema:
          $ref: '#/components/schemas/SIPTrunkID'
      - name: from
        in: query
        required: false
        description: 'Return only legs placed from this calling party number, matched as a whole number rather than as a fragment. Give it in international form: `+14155551234`, `14155551234`, and `0014155551234` all select the same legs. A number given without a country code is read as an international one, so give the country code to be sure of what you are matching. Use `number` instead to match part of a number, or either side of the leg.

          '
        schema:
          type: string
          minLength: 1
          maxLength: 32
          example: '+14155551234'
      - name: to
        in: query
        required: false
        description: 'Return only legs placed to this called party number, matched as a whole number rather than as a fragment. Give it in international form: `+16505559876`, `16505559876`, and `0016505559876` all select the same legs. A number given without a country code is read as an international one, so give the country code to be sure of what you are matching. Use `number` instead to match part of a number, or either side of the leg.

          '
        schema:
          type: string
          minLength: 1
          maxLength: 32
          example: '+16505559876'
      - name: number
        in: query
        required: false
        description: Return only legs where the calling or called number contains this value. Matches a partial number, so a country or area-code prefix returns every leg to or from it. Combines with `from`/`to`, which match one side exactly.
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - $ref: '#/components/parameters/TagFilter'
      - name: started_after
        in: query
        required: false
        description: Return only legs that started at or after this instant, inclusive. RFC 3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: started_before
        in: query
        required: false
        description: Return only legs that started at or before this instant, inclusive. RFC 3339 timestamp.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of leg records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceLegList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
  /v1/voice/legs/{leg_id}:
    parameters:
    - name: leg_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VoiceCallID'
      example: vcl_01k0p3v9wera3v6q6xw3e9y2mh
    get:
      operationId: getVoiceLeg
      x-snippet-key: voice.get
      summary: Get a leg
      description: 'Returns a single leg at any point in its lifecycle. A leg that is still ringing or connected answers with its in-flight `status` and no economics: `duration_ms`, `billable_ms`, and `ended_at` fill in once it ends, at this same URL, and `cost` does too unless the leg was never rated, as with a verification call Bird places and answers on your behalf. Returns a 404 `not_found_error` if the leg does not exist in the workspace.'
      tags:
      - voice-legs
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - command
      responses:
        '200':
          description: The leg's current status, timing, and routing details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceLeg'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - n8n
      - sdk
components:
  schemas:
    VoiceInboundForwardAs:
      type: string
      minLength: 1
      enum:
      - dialed_number
      - calling_number
      description: 'Which of a forwarded call''s two numbers it shows as the caller.


        `dialed_number` presents the Bird number the caller dialed. Whoever answers

        sees which of your numbers was called. Older configurations without a stored

        choice use this value. Carrier screening can still affect delivery.


        `calling_number` presents the caller''s own number, so the phone rings as though

        they had dialed it directly and the call can be returned from the call log. Because

        the number is not one you own, some carriers (most often in the US and parts of

        Europe) mark such calls as unverified, replace the number, or screen them.

        '
      example: dialed_number
    VoiceMediaQuality:
      type: object
      additionalProperties: false
      required:
      - mos
      - jitter_ms
      - packet_loss_pct
      - round_trip_time_ms
      properties:
        mos:
          type: number
          minimum: 1
          maximum: 5
          readOnly: true
          description: 'Mean opinion score, the single number for how the call sounded, from 1 (unintelligible) to 5 (as good as being in the same room). Anything at or above 4.0 is what most people would call a clear line, and below 3.5 is where callers start asking each other to repeat themselves. The three other fields are the impairments that move it.

            '
          example: 4.32
        jitter_ms:
          type: integer
          minimum: 0
          readOnly: true
          description: Variation in the arrival time of the audio packets, in milliseconds. Audio arriving unevenly is heard as choppiness even when no packets are lost at all.
          example: 12
        packet_loss_pct:
          type: number
          minimum: 0
          readOnly: true
          description: Percentage of audio packets that never arrived. Heard as brief gaps or clipped words, and the impairment that degrades a call fastest.
          example: 1.5
        round_trip_time_ms:
          type: integer
          minimum: 0
          readOnly: true
          description: Round-trip time between the two ends, in milliseconds. It does not distort the audio. Above roughly 300 ms, the two parties start talking over each other.
          example: 42
    VoiceSessionID:
      type: string
      minLength: 1
      pattern: ^vcs_[0-9a-hjkmnp-tv-z]{26}$
      example: vcs_01krdgeqcxet5s7t44vh8rt9mg
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: ISO 4217 three-letter currency code.
      example: EUR
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    WorkspaceID:
      type: string
      minLength: 1
      pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
      example: ws_01krdgeqcxet5s7t44vh8rt9mg
    VoiceLegRejectionReason:
      type: string
      minLength: 1
      enum:
      - source_not_allowed
      - caller_id_not_verified
      - routing_not_configured
      - no_route_found
      - destination_blocked
      - destination_not_enabled
      - insufficient_balance
      - daily_spend_exceeded
      - concurrent_calls_exceeded
      - calls_per_second_exceeded
      - call_not_permitted
      - number_ownership_not_verified
      x-enum-varnames:
      - VoiceCallRejectionReasonSourceNotAllowed
      - VoiceCallRejectionReasonCallerIDNotVerified
      - VoiceCallRejectionReasonRoutingNotConfigured
      - VoiceCallRejectionReasonNoRouteFound
      - VoiceCallRejectionReasonDestinationBlocked
      - VoiceCallRejectionReasonDestinationNotEnabled
      - VoiceCallRejectionReasonInsufficientBalance
      - VoiceCallRejectionReasonDailySpendExceeded
      - VoiceCallRejectionReasonConcurrentCallsExceeded
      - VoiceCallRejectionReasonCallsPerSecondExceeded
      - VoiceCallRejectionReasonCallNotPermitted
      - VoiceCallRejectionReasonNumberOwnershipNotVerified
      description: "Why we rejected the leg. Use `rejection_reason` to identify the cause;\n`sip_response_code` alone cannot distinguish these reasons.\n\nYou can resolve these issues:\n\n- `source_not_allowed`: The leg came from an IP address that is not in the\n  trunk's allowed-address list. Add the address your PBX sends from.\n- `caller_id_not_verified`: The number in the `From` header is not a verified\n  caller ID for this workspace. Verify it or use a verified caller ID.\n- `number_ownership_not_verified`: The ownership documents for this purchased\n  number have not yet been accepted under its country's requirements. We\n  block outgoing and incoming legs on the number until verification is\n  complete. Blocked incoming legs never reach your PBX, and their route type\n  is `reject` regardless of the number's configuration. Open the number\n  under **Numbers** and complete its ownership requirements, then retry\n  the leg.\n- `destination_not_enabled`: Calling to this destination country is disabled.\n  Enable it in your voice destination settings.\n- `insufficient_balance`: Your wallet balance was too low for the leg.\n  Top up or enable automatic top-ups.\n- `daily_spend_exceeded`: The leg would exceed your organization's daily\n  voice spend limit. Retry after the limit resets at the start of the next\n  UTC day.\n- `concurrent_calls_exceeded`: You already have as many legs in progress as\n  your account allows. Wait for one to end or ask support to raise the limit.\n- `calls_per_second_exceeded`: You placed legs faster than your account\n  allows. Reduce your dialing rate and retry.\n\nFor all other reasons, contact support and provide the leg `id`:\n\n- `routing_not_configured`: This trunk has no dial plan, which can happen on\n  a new trunk.\n- `no_route_found`: A dial plan is attached, but no rule in it covers this\n  destination.\n- `destination_blocked`: The destination is blocked by our routing\n  configuration.\n- `call_not_permitted`: The leg could not be priced for your account.\n"
      example: destination_not_enabled
    SIPTrunkID:
      type: string
      minLength: 1
      pattern: ^spt_[0-9a-hjkmnp-tv-z]{26}$
      example: spt_01krdgeqcxet5s7t44vh8rt9mg
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    VoiceLeg:
      type: object
      additionalProperties: false
      required:
      - id
      - workspace_id
      - direction
      - from
      - to
      - status
      - started_at
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/VoiceCallID'
          description: Unique identifier for this leg record.
        call_id:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/VoiceSessionID'
          - type: 'null'
          description: Call identifier shared across all legs of a multi-party or transferred call. Use this to correlate related leg records. `null` when call correlation is not available for the leg.
        workspace_id:
          readOnly: true
          $ref: '#/components/schemas/WorkspaceID'
        direction:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/VoiceCallDirection'
        from:
          type: string
          minLength: 1
          readOnly: true
          description: Calling party number in E.164 format.
          example: '+14155551234'
        to:
          type: string
          minLength: 1
          readOnly: true
          description: Called party number in E.164 format.
          example: '+16505559876'
        actor:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Actor'
          description: 'Who placed the leg: the API key whose credentials it used, the integration acting for the workspace, or the user who placed it from a browser or the CLI. Absent when the leg was admitted only by its source IP address, or when no actor was recorded.'
        sip_trunk_id:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/SIPTrunkID'
          - type: 'null'
          description: Identifier of the SIP trunk that originated this leg. `null` when no trunk is associated.
        sip_call_id:
          type: string
          minLength: 1
          readOnly: true
          description: 'The SIP `Call-ID` of this leg''s signalling. We relay it unchanged, so it matches what the carrier and your own equipment logged for the same leg: the carrier''s value on an incoming leg, and your system''s value on a leg you place through a SIP trunk. Use it to match this leg against a carrier''s records or your PBX logs. Legs recorded before this field existed carry it only if they were answered.'
          example: 3f9a1c8e7b2d4a5f@sip.example.net
        status:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/VoiceCallStatus'
        sip_response_code:
          readOnly: true
          type:
          - integer
          - 'null'
          minimum: 100
          description: Final SIP response code received from the carrier. `null` when no SIP response was received, for example on timeout or DNS failure.
          example: 200
        rejection_reason:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/VoiceLegRejectionReason'
          description: 'Why we rejected the leg. Absent on connected legs and legs rejected

            by the carrier or recipient. For carrier or recipient rejections, see

            `sip_response_code`; a `6xx` decline gives the leg a `rejected` status.


            Read alongside `route` when present. A refusal caused by the number''s

            configuration has no rejection reason; the route records that

            configuration.

            '
        route:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/VoiceLegInboundRoute'
          description: Which answer your number gave an incoming leg. Its `type` selects the shape, and each answer carries its own fields; the variants below are the full set you can receive. Recorded when the leg was handled, so changing the number's setup afterwards does not change what its past legs say. Absent on outbound legs, and on legs recorded before this field existed.
        tags:
          type: array
          maxItems: 5
          readOnly: true
          items:
            $ref: '#/components/schemas/Tag'
          description: 'Your own `{name, value}` labels for this leg, taken from the `X-Bird-Call-Tag` headers on the INVITE that placed it. Set them to organise legs by a dimension of your own (campaign, queue, agent, cost centre), then filter this list by them with `tag`. Read-only here: a leg is labelled when it is placed, and never afterwards. What is here may be less than what was sent, and the leg still goes through either way: a tag whose name or value breaks the rules below is dropped, anything past the first five is ignored, and a name sent more than once keeps its first value. Absent when the leg carried none, and on legs recorded before this field existed.'
        started_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When the leg was initiated.
        answered_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the leg was answered (`200` OK received). `null` for unanswered legs.
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the leg ended (BYE or final non-2xx response). `null` for legs that ended abnormally without a recorded end event.
        duration_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: Total leg duration in milliseconds, measured from the first INVITE to the BYE or final response. `null` while the leg is still in progress and has no final duration yet.
          example: 65000
        pdd_ms:
          type: integer
          minimum: 0
          readOnly: true
          description: 'Post-dial delay in milliseconds: how long the caller heard nothing between dialing and the phone starting to ring at the other end. High values are what callers experience as the leg `not going through`. Absent when the leg never rang, either because it failed first or because the carrier answered it immediately.

            '
          example: 850
        billable_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          readOnly: true
          description: Billable duration in milliseconds, measured from answer to leg end. Zero for unanswered legs, and `null` while the leg is still in progress.
          example: 60000
        media_quality:
          $ref: '#/components/schemas/VoiceMediaQuality'
          readOnly: true
          description: How the audio sounded, as opposed to whether the leg connected. Absent when the leg carried no audio, or when the far end reported nothing to measure from.
        cost:
          $ref: '#/components/schemas/VoiceLegCost'
          readOnly: true
          description: What the leg cost, net of tax, at full precision, split into the components that make it up. Absent until the leg has been rated; unanswered or unpriced legs have no cost, and neither does a verification call Bird places and answers on your behalf, which is exempt from rating.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    VoiceCallStatus:
      type: string
      minLength: 1
      enum:
      - answered
      - no_answer
      - busy
      - canceled
      - failed
      - rejected
      - unknown
      - ringing
      - in_progress
      description: "Call status.\n\nA call that has ended carries one of:\n\n- `answered` means it connected and the far end picked up.\n- `no_answer` means nobody picked up before the call timed out.\n- `rejected` means it was refused rather than attempted. Either we turned it\n  away before dialing a carrier, in which case `rejection_reason` names the\n  check it failed where there was one, or the far end declined it.\n- `failed` means it was attempted and did not work, and `sip_response_code`\n  is what came back.\n- `unknown` means the outcome could not be determined. Contact support with\n  the call `id` if you see one.\n\nAn active call carries `ringing` before it is picked up and `in_progress`\nafterward. The call list's `status` filter takes any mix of the two sets.\n\n`busy` and `canceled` are reserved for incoming calls delivered to your own\nnumbers: `busy` for a called party that rejected the call as busy, `canceled`\nfor a caller who hung up before it was picked up. Neither is emitted yet and\nboth outcomes are reported as `failed` today.\n"
      example: answered
    VoiceLegInboundRouteSequence:
      type: object
      additionalProperties: false
      required:
      - type
      - sequence_id
      - entry_node_id
      properties:
        type:
          $ref: '#/components/schemas/VoiceLegInboundRouteType'
          const: sequence
          description: The leg was handled by one of your sequences.
        sequence_id:
          allOf:
          - $ref: '#/components/schemas/VoiceSequenceID'
          description: 'The sequence that handled the leg. Recorded as it was at the time, so it may name a sequence you have since changed or deleted.

            '
        entry_node_id:
          allOf:
          - $ref: '#/components/schemas/VoiceSequenceNodeID'
          description: 'The entry the leg started from in the publication that handled it. Recorded as it was at the time, so it may name an entry the sequence no longer has.

            '
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    VoiceLegInboundRouteTrunk:
      type: object
      additionalProperties: false
      required:
      - type
      - trunk_id
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/VoiceLegInboundRouteType'
          const: trunk
          description: The leg was delivered to one of your SIP trunks.
        trunk_id:
          allOf:
          - $ref: '#/components/schemas/SIPTrunkID'
          description: 'The SIP trunk the leg was delivered to. Recorded as it was at the time, so it may name a trunk you have since changed or deleted.

            '
    VoiceSequenceID:
      type: string
      minLength: 1
      pattern: ^vsq_[0-9a-hjkmnp-tv-z]{26}$
      example: vsq_01krdgeqcxet5s7t44vh8rt9mg
    VoiceLegList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/VoiceLeg'
      - $ref: '#/components/schemas/_ListEnvelope'
    VoiceLegInboundRouteType:
      type: string
      minLength: 1
      enum:
      - reject
      - trunk
      - forward
      - sequence
      description: 'Which answer handled this incoming leg.


        - `reject`: the call was refused.

        - `trunk`: the call was delivered to one of your SIP trunks.

        - `forward`: the call was forwarded to one of your verified caller IDs.

        - `sequence`: the call was handled by one of your sequences.

        '
      example: trunk
    VoiceLegCost:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency_code
      - outbound_amount
      - inbound_amount
      - call_handling_amount
      - recording_amount
      - transcription_amount
      description: 'What was charged for a leg, split into the components that make it up.

        '
      properties:
        amount:
          type: string
          minLength: 1
          readOnly: true
          description: 'Total charged, as a decimal string: the sum of the components below. Net of tax, which applies to your wallet balance rather than to an individual charge.

            '
          example: '0.013000'
        currency_code:
          readOnly: true
          $ref: '#/components/schemas/CurrencyCode'
          description: ISO 4217 currency code. Every component is denominated in this currency.
          example: USD
        outbound_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to carry the leg to the destination network, as a decimal string. `null` until this component is priced.

            '
          example: '0.013000'
        inbound_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to receive the leg from the originating network, as a decimal string. Only a leg that arrived at your number can carry it. `null` until this component is priced.

            '
          example: null
        call_handling_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged for handling the call itself, as a decimal string. A call is charged for handling once, however many legs it has, so only one leg''s record carries it. `null` until this component is priced.

            '
          example: null
        recording_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to record the leg, as a decimal string, billed per second over the same billable time as the rest of the leg. `null` until this component is priced.

            '
          example: null
        transcription_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to transcribe the leg''s audio, as a decimal string, billed per second of recorded audio rather than for the length of the leg. A transcript is produced after the leg ends, so this can appear after the rest of the cost. `null` until this component is priced.

            '
          example: null
    Tag:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      description: 'Structured key/value label attached to a message or a call. Use tags for low-cardinality filtering dimensions (category, experiment ID, template ID); they surface in the list filter of whatever carries them.


        On a message they also surface in the event log and in webhook payloads, and a message can carry `metadata` beside them for arbitrary per-send context that does not need to be filterable. A call has none of those three: its tags are set on the wire when the call is placed, and the call record is the one place you read them back.


        Whatever carries the tags defines how many it may have. Tag names are unique: a send that repeats one is rejected, and on a call the first instance of a name wins.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag name. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 32 characters.

            '
          example: category
        value:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag value. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 64 characters.

            '
          example: welcome
    VoiceLegInboundRoute:
      description: 'The routing choice recorded for an incoming leg. A recorded route does not

        guarantee that the leg connected. Check `status` for the outcome and

        `rejection_reason` for the cause when present.

        '
      oneOf:
      - $ref: '#/components/schemas/VoiceLegInboundRouteReject'
      - $ref: '#/components/schemas/VoiceLegInboundRouteTrunk'
      - $ref: '#/components/schemas/VoiceLegInboundRouteForward'
      - $ref: '#/components/schemas/VoiceLegInboundRouteSequence'
      discriminator:
        propertyName: type
        mapping:
          reject: '#/components/schemas/VoiceLegInboundRouteReject'
          trunk: '#/components/schemas/VoiceLegInboundRouteTrunk'
          forward: '#/components/schemas/VoiceLegInboundRouteForward'
          sequence: '#/components/schemas/VoiceLegInboundRouteSequence'
    Actor:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      properties:
        id:
          type: string
          minLength: 1
          description: Actor identifier.
          example: usr_01krdgeqcxet5s7t44vh8rt9mg
        type:
          type: string
          minLength: 1
          x-extensible-enum:
          - user
          - api_key
          - oauth_token
          - system
          - sso
          - service_account
          - automation
          description: 'New actor types may be added. Treat unrecognized values as future types, not errors.

            - `user`: a member''s own session.

            - `api_key`: a workspace API key.

            - `oauth_token`: a token issued to a caller on a member''s behalf.

            - `system`: an action we perform without a customer actor.

            - `sso`: an organization''s SSO connection.

            - `service_account`: a workspace''s connected Integration acting with no member behind it.

            - `automation`: an automation execution in your workspace.'
          example: user
        display_name:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'The label the actor is shown under: typically a member''s name or email address, or the API key''s name. Null when it could not be resolved.

            '
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    VoiceCallID:
      type: string
      minLength: 1
      pattern: ^vcl_[0-9a-hjkmnp-tv-z]{26}$
      example: vcl_01krdgeqcxet5s7t44vh8rt9mg
    VoiceSequenceNodeID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]{0,63}$
      not:
        enum:
        - 'false'
        - in
        - 'null'
        - 'true'
      description: Stable identifier for a node within one sequence definition.
    VoiceCallDirection:
      type: string
      minLength: 1
      enum:
      - inbound
      - outbound
      description: Whether the call was placed from your side, by your PBX, the API, the browser or Bird dialing onward for you (outbound), or arrived from a remote party (inbound).
      example: outbound
    VoiceLegInboundRouteForward:
      type: object
      additionalProperties: false
      required:
      - type
      - forward_to
      - forward_as
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/VoiceLegInboundRouteType'
          const: forward
          description: The leg was forwarded to another of your numbers.
        forward_to:
          type: string
          minLength: 1
          description: 'The number the leg was forwarded to, in E.164 format. Recorded as it was at the time, so it may name a number you have since stopped verifying.

            '
          example: '+14155551234'
        forward_as:
          allOf:
          - $ref: '#/components/schemas/VoiceInboundForwardAs'
          description: 'Which of the leg''s two numbers the forwarded leg presented as its caller. The value that went on the wire, not the one the number is set to now.

            '
    VoiceLegInboundRouteReject:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/VoiceLegInboundRouteType'
          const: reject
          description: 'The number turned the leg away, either because its own route is reject or because it has none and the workspace default inbound route is reject.

            '
  parameters:
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: Cursor from the `prev_cursor` or `refresh_cursor` field of a previous list response. Returns items immediately before the cursor position in the current sort order. `prev_cursor` returns the preceding page. `refresh_cursor` anchors at the first row of that response, which on a newest-first sort is how to fetch the items that have appeared since.
      schema:
        type: string
    PaginationLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    TagFilter:
      name: tag
      in: query
      required: false
      description: 'Filter by tag. Accepts `name` to match any record carrying that tag name, or `name:value` to match a specific tag pair (for example `category:welcome`). Repeat the parameter to add more tags. A record must match every tag listed to be returned.

        '
      schema:
        type: array
        items:
          type: string
    XWorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace context for the request. Required for dashboard authentication and master keys. Workspace keys and access tokens already identify their workspace; send that workspace or omit the header. A different one is rejected.
      schema:
        type: string
        pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: Cursor from the `next_cursor` field of a previous list response. Returns items immediately after the cursor position in the current sort order.
      schema:
        type: string
    XOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Organization context for the request. Required for dashboard authentication. An API key or access token carries its own organization, so send either that organization or no header at all; a different one is rejected.
      schema:
        type: string
        pattern: ^org_[0-9a-hjkmnp-tv-z]{26}$
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
  responses:
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Workspace

        keys use `bk_{region}_*`; organization master keys use `bm_{region}_*`.

        The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
