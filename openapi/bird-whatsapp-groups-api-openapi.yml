openapi: 3.2.0
info:
  title: Bird Whatsapp Groups API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: whatsapp-groups
  description: 'WhatsApp groups your business creates and administers: their invite links, who is in them, and the requests to join them.'
paths:
  /v1/whatsapp/groups:
    get:
      operationId: listWhatsAppGroups
      x-snippet-key: whatsapp.groups.list
      summary: List WhatsApp groups
      description: 'Returns the WhatsApp groups your workspace created as a cursor-paginated

        list, newest first. Each group carries the number that administers it, its

        subject, its status, its invite link once WhatsApp has issued one, its

        participant count, and its participant list.


        Filter by the business number that administers the groups (`number`), by

        the WhatsApp Business Account that number sends under (`waba`),

        or by `status`. `q` searches the subject and the description for a

        substring, case-insensitively.


        A group stays in the list after it is deleted, with `status` `deleted`, so

        filter it out to see only the groups you can still message.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: sort
        in: query
        required: false
        description: Field to sort by.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupSortField'
      - $ref: '#/components/parameters/OrderDesc'
      - name: number
        in: query
        required: false
        description: 'Filter by the business number that administers the group, as either the number in E.164 format or the number''s `id` (`wan_` prefix). A value that parses as a valid ID resolves by ID; any other value must be an E.164 number, and anything else is a `422`. The E.164 form is matched against the group''s stored record of the number it was created on.

          '
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: '+13124495648'
      - name: waba
        in: query
        required: false
        description: 'Filter by the WABA identifier returned on the group. Groups with `waba: null` do not match this filter.

          '
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: '102290129340398'
      - name: q
        in: query
        required: false
        description: Case-insensitive substring match against the group's subject or description.
        schema:
          type: string
          minLength: 1
        example: support
      - name: status
        in: query
        required: false
        description: Filter by status. Repeat the parameter to match any of several statuses.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppGroupStatus'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: A page of the WhatsApp groups your workspace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroupList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    post:
      operationId: createWhatsAppGroup
      x-snippet-key: whatsapp.groups.create
      summary: Create a WhatsApp group
      description: 'Creates a WhatsApp group administered by one of your business numbers. The

        number must hold Official Business Account status, which WhatsApp grants a

        number whose business is verified and whose display name is approved;

        without it the request returns a `412` `WhatsAppGroupsNotEligible`.

        `GET /v1/whatsapp/numbers` reports it per number as

        `is_official_business_account`, so read it there rather than discovering it

        from the refusal. A group

        holds 8 people besides your business, and a number can own 10,000 groups;

        a number already at that limit returns a `409` `WhatsAppGroupLimitReached`.


        The `202` response is the accepted group, with `status` `pending`. WhatsApp

        confirms the group moments later, and that is when it issues the invite link

        and the group becomes messageable, so the response carries no

        `invite_link`. Read the group back until its `status` is `active`. If WhatsApp refuses, the

        group ends at `failed` with `last_operation.last_error` set, and creating

        another group is the way forward.


        Nobody is added at create time, and there is no way to add someone later:

        people join by opening the group''s invite link. Send the link with the group

        invite template, and choose at create time whether opening it joins the

        group outright or raises a join request you approve.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppGroupCreate'
      responses:
        '202':
          description: Group accepted for creation at WhatsApp.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/whatsapp/groups/{group_id}:
    get:
      operationId: getWhatsAppGroup
      x-snippet-key: whatsapp.groups.get
      summary: Get a WhatsApp group
      description: 'Returns one group as it currently stands, including who is in it. The business

        number that administers the group is not counted among the participants.


        Read the group back after creating it to watch `status` move from `pending`

        to `active`, which is when WhatsApp has issued the `invite_link`. A

        `suspended` group is one WhatsApp has stopped activity in; a `deleted` one is

        kept here so a reference to it still resolves.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group, as returned when it was created.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    patch:
      operationId: updateWhatsAppGroup
      x-snippet-key: whatsapp.groups.update
      summary: Update a WhatsApp group
      description: 'Changes what participants see at the top of the group: its subject, its

        description, and its picture. Fields you omit are left as they are; send

        `null` to clear the description. A `null` picture clears the one Bird

        stores, but WhatsApp offers no way to take a group''s photo down, so

        participants keep seeing the current one until a new picture replaces it.


        WhatsApp applies each field separately, so a change can be part-applied:

        one field refused while the others take effect. The `202` response is the

        change accepted, not applied: it echoes the group as Bird holds it, with

        `last_operation` at `pending`. WhatsApp reports the outcome on the

        `group_settings_update` webhook, which settles `last_operation` to `success`

        or `failed` and fills its `results` with one entry per field, so a part-apply

        says which field was refused and why. Re-read the group to see what took

        effect.


        Two `409`s guard this, and `status` is checked first: a group that is not

        `active` returns `WhatsAppGroupNotActive`, whatever its `last_operation` says.

        That matters for a group still being created, which is `pending` on both counts

        at once, and the group-level answer is the more useful one, since no change can

        land until it exists. Once the group is `active`, a change already outstanding

        returns `WhatsAppGroupUpdateInProgress` while `last_operation.status` is

        `pending`.


        The picture names a file in your workspace''s media library, and WhatsApp

        takes only a square JPEG. `join_approval_mode` and the administering number

        are fixed when the group is created and cannot be changed here.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group to change.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppGroupUpdate'
      responses:
        '202':
          description: Change accepted; the group as Bird holds it. Re-read for what WhatsApp applied.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
    delete:
      operationId: deleteWhatsAppGroup
      x-snippet-key: whatsapp.groups.delete
      summary: Delete a WhatsApp group
      description: 'Deletes the group at WhatsApp. Every participant loses access, your business

        included, and the invite link stops working. This cannot be undone. To run

        the conversation again, create a new group and send its link.


        The `202` response is the accepted deletion. The group is readable

        afterwards with `status` `deleted`, so a stored reference to it still

        resolves rather than turning into a `404`.


        A `failed` group can be deleted too, and that one does not reach WhatsApp:

        the create never produced a group there, so the row is Bird''s own

        bookkeeping and clearing it reaches no external system. It answers `202`

        like any other delete, and the row stays readable at `deleted` rather than

        leaving the list. Every other

        status refuses with a `409` `WhatsAppGroupNotActive`: a `deleted` group is

        already gone, a `suspended` one is WhatsApp''s to release, and a `pending`

        one has an outcome still coming, which is why a create that never confirms

        is given up on and moved to `failed` rather than left pending.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group to delete.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '202':
          description: Deletion accepted; the group as Bird holds it. Re-read to confirm it went through.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/whatsapp/groups/{group_id}/invite-link/rotate:
    post:
      operationId: rotateWhatsAppGroupInviteLink
      x-snippet-key: whatsapp.groups.invite_link.rotate
      summary: Rotate a WhatsApp group's invite link
      description: 'Issues a new invite link for the group. Every link issued before stops

        working, so anyone still holding one cannot join. Rotate the link when a

        link has spread further than you intended, or after removing someone you do

        not want back.


        Rotating is not how you read the current link: the group carries its

        `invite_link`, so

        `GET /v1/whatsapp/groups/{group_id}` is the read.

        Only an `active` group has a link to rotate; any other status returns a `409`

        `WhatsAppGroupNotActive`.


        Like pinning and unpinning, this answers `200` rather than `202`.

        WhatsApp issues the new link in its own reply and sends no webhook for a

        rotation, so the link in the response is the rotation itself having

        happened, not an acknowledgement that it will.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group whose invite link is being replaced.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The group's new invite link.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroupInviteLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/whatsapp/groups/{group_id}/participants/{participant_ref}:
    delete:
      operationId: deleteWhatsAppGroupParticipant
      x-snippet-key: whatsapp.groups.participants.remove
      summary: Remove a participant from a WhatsApp group
      description: 'Removes one person from the group. Name them by either identifier the

        group''s `participants` list them under: `bsuid`, which everyone has, or

        `phone_number`, which is there only when WhatsApp shares it.


        **Removal cannot be undone.** WhatsApp blocks a removed person from joining

        the group by invite link, and the block follows the person rather than the

        link they were removed under: rotating the invite link does not let them

        back in. There is no add operation to pair with this one either, because

        WhatsApp lets nobody be added directly and people join only by opening the

        link. So nothing returns someone to this group once they are out, and

        reaching them again means creating another group and inviting them to it.


        The `202` response is the removal accepted, not applied: WhatsApp can still

        refuse it, which arrives on the `group_participants_update` webhook. The

        outcome lands on that participant''s own `last_operation`, `pending` until the

        webhook settles it, so removing several people at once gives each their own

        state and their own failure rather than one shared verdict. Re-read the group

        to see who is left.


        A second removal of the same participant while theirs is `pending` returns a

        `409` `WhatsAppGroupUpdateInProgress`; removing a different participant does

        not. Only an `active` group can be changed; any other status returns a `409`

        `WhatsAppGroupNotActive`.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group to remove someone from.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - name: participant_ref
        in: path
        required: true
        description: 'The person to remove, named by either identifier the group lists them under: their `bsuid`, or their `phone_number` in E.164 format (`+16505551234`) when WhatsApp gives you one. Pass the value as it reads: percent-encode the leading `+` as `%2B` only when your client does not do that for you. A value naming someone who is not in the group returns a `422` `WhatsAppGroupParticipantNotFound`.

          '
        schema:
          type: string
          minLength: 1
          example: '+16505551234'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '202':
          description: Removal accepted; the group as Bird holds it. Re-read for who is left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/whatsapp/groups/{group_id}/pinned-messages:
    post:
      operationId: createWhatsAppGroupPinnedMessage
      x-snippet-key: whatsapp.groups.pins.create
      summary: Pin a message in a WhatsApp group
      description: 'Pins one of the group''s messages at the top of its chat, where it stays for

        the number of days you give, from 1 to 30. Pin the message a conversation

        keeps coming back to, so a participant joining later does not have to

        scroll for it.


        The message has to be one this group carries: a message in another group, or

        a one-to-one message, returns a `422` `WhatsAppMessageNotInGroup`. A

        `message_id` naming no message the workspace still holds returns a `404`

        instead, which is also what an id older than the 30 days messages stay

        readable for gets. Only an

        `active` group can be changed; any other status returns a `409`

        `WhatsAppGroupNotActive`.


        A group holds 3 pinned messages at once, and pinning a fourth unpins the

        oldest rather than failing. Pinning an already-pinned message replaces its

        expiry. What the group currently pins is on the group itself, as

        `pinned_messages`.


        WhatsApp confirms a pin in its reply rather than on a webhook, so the

        response is the applied pin and the entry appears in the group''s

        `pinned_messages` straight away. Nothing about a pin is left in flight, so a

        pin never blocks the next pin or unpin.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group to pin a message in.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppGroupPinnedMessageCreate'
      responses:
        '200':
          description: 'The applied pin: the message and when its pin expires.'
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroupPinnedMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/whatsapp/groups/{group_id}/pinned-messages/{message_id}:
    delete:
      operationId: deleteWhatsAppGroupPinnedMessage
      x-snippet-key: whatsapp.groups.pins.delete
      summary: Unpin a message in a WhatsApp group
      description: 'Takes the message off the top of the group''s chat before its pin would have

        expired. WhatsApp unpins a message on its own once the days you gave have

        passed, so unpin only to take one down early.


        The message has to be one this group carries: a message in another group, or

        a one-to-one message, returns a `422` `WhatsAppMessageNotInGroup`. Past the

        30 days messages stay readable for, that check can no longer run, so a

        message holding no pin answers `200` whichever group it belonged to. Only an

        `active` group can be changed; any other status returns a `409`

        `WhatsAppGroupNotActive`.


        Unpinning a message this group carries that is not currently pinned changes

        nothing and still answers `200`, so a repeated call is safe. WhatsApp

        confirms a successful unpin in its reply rather than on a webhook, so the

        entry is gone from `pinned_messages` by the time the response returns.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group to unpin a message in.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - name: message_id
        in: path
        required: true
        description: ID of the message to unpin, as returned in the send response's `id`.
        schema:
          $ref: '#/components/schemas/WhatsAppMessageID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The unpin applied; the group as Bird holds it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
