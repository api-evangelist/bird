  /v1/whatsapp/groups/{group_id}/join-requests:
    get:
      operationId: listWhatsAppGroupJoinRequests
      x-snippet-key: whatsapp.groups.join_requests.list
      summary: List a WhatsApp group's join requests
      description: 'Returns the join requests still waiting for a decision, oldest first. Each

        carries the person who asked and when they asked.


        Only a group created with `join_approval_mode` `approval_required` collects

        join requests; on any other group the list is empty. A request leaves the

        list once you decide it, and also when the person cancels it themselves.


        Decide requests with

        `POST /v1/whatsapp/groups/{group_id}/join-requests/batch-approve`

        or

        `POST /v1/whatsapp/groups/{group_id}/join-requests/batch-reject`.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group whose join requests are being listed.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - name: sort
        in: query
        required: false
        description: Field to sort by.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupJoinRequestSortField'
      - $ref: '#/components/parameters/OrderAsc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: A page of the group's pending join requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroupJoinRequestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/whatsapp/groups/{group_id}/join-requests/batch-approve:
    post:
      operationId: approveWhatsAppGroupJoinRequests
      x-snippet-key: whatsapp.groups.join_requests.approve
      summary: Approve WhatsApp group join requests
      description: 'Approves the named join requests, up to 50 in one call.


        WhatsApp decides each request on its own, so the batch can be part-applied:

        the response lists the ones it accepted in `decided` and the rest in

        `failed` with the reason each was refused. A refusal is usually a person

        who has not accepted WhatsApp''s current terms, which no retry fixes.


        Each person approved can enter the group through its invite link. Re-read the

        group to see who has arrived.


        A group holds 8 participants besides your business. Approving more than the

        group has room for does not refuse the call: the requests that fit are

        decided and the rest come back in `failed`, each saying the approval would

        take the group past its participant limit. A group that is not `active`

        does refuse the whole call, with a `409` `WhatsAppGroupNotActive`.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group whose join requests are being decided.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppGroupJoinRequestDecision'
      responses:
        '202':
          description: What happened to each join request in the batch.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroupJoinRequestDecisionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/whatsapp/groups/{group_id}/join-requests/batch-reject:
    post:
      operationId: rejectWhatsAppGroupJoinRequests
      x-snippet-key: whatsapp.groups.join_requests.reject
      summary: Reject WhatsApp group join requests
      description: 'Rejects the named join requests, up to 50 in one call.


        WhatsApp decides each request on its own, so the batch can be part-applied:

        the response lists the ones it accepted in `decided` and the rest in

        `failed` with the reason each was refused. A refusal is usually a person

        who has not accepted WhatsApp''s current terms, which no retry fixes.


        A group that is not `active` refuses the whole call, with a `409`

        `WhatsAppGroupNotActive`, rather than returning per-request failures.


        Each person rejected sees the option to ask again the next time they open the invite link, so a rejection is not a ban. Remove someone through the participants operation if they should not be able to come back.'
      tags:
      - whatsapp-groups
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      parameters:
      - name: group_id
        in: path
        required: true
        description: ID of the group whose join requests are being decided.
        schema:
          $ref: '#/components/schemas/WhatsAppGroupID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppGroupJoinRequestDecision'
      responses:
        '202':
          description: What happened to each join request in the batch.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppGroupJoinRequestDecisionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  schemas:
    WhatsAppMessageID:
      type: string
      minLength: 1
      pattern: ^wam_[0-9a-hjkmnp-tv-z]{26}$
      example: wam_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppGroupOperationField:
      type: string
      minLength: 1
      enum:
      - subject
      - description
      - profile_picture_url
      description: Which of the group's settings a `settings_update` result reports on.
      example: subject
    WhatsAppGroupJoinApprovalMode:
      type: string
      minLength: 1
      enum:
      - auto_approve
      - approval_required
      description: 'How someone opening the invite link gets in:


        - `auto_approve` means they join the moment they open the link. This is the default when the group is created.

        - `approval_required` means opening the link raises a join request you approve or reject.


        Fixed when the group is created.

        '
      example: auto_approve
    WhatsAppGroupOperationResult:
      type: object
      additionalProperties: false
      required:
      - field
      - applied
      description: 'What became of one field in a `settings_update`. WhatsApp applies each field separately, so a single update can leave some applied and others refused.

        '
      properties:
        field:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupOperationField'
          readOnly: true
          description: The setting this result reports on.
        applied:
          type: boolean
          readOnly: true
          description: Whether WhatsApp applied this field. False when it refused this one, whatever it did with the others.
          example: false
        error:
          $ref: '#/components/schemas/WhatsAppGroupError'
          readOnly: true
          description: Why WhatsApp refused this field. Present only when `applied` is false.
    WhatsAppGroupSortField:
      type: string
      enum:
      - created_at
      default: created_at
      description: Sortable fields for a WhatsApp group list.
    WhatsAppGroupError:
      type: object
      additionalProperties: false
      readOnly: true
      required:
      - description
      description: 'Why a change to a group did not take effect. Meta documents no code vocabulary for a group refusal, since every sample payload carries an undocumented `code` beside its message, so this relays what it said rather than classifying it, the way a template submission failure does.

        '
      properties:
        description:
          type: string
          minLength: 1
          readOnly: true
          description: 'WhatsApp''s own explanation of the refusal, passed through. Show it to the person who asked for the change; never match on its text. Carries Bird''s own words instead when the failure was Bird''s verdict, such as a confirmation that never arrived.

            '
          example: Group subject contains content that cannot be used.
        meta_error_code:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'WhatsApp''s most specific code for the refusal: its error subcode where it sent one, otherwise its top-level code. Treat it as an opaque string. Null when the failure was Bird''s own verdict rather than a WhatsApp refusal.

            '
          example: '2388024'
    WhatsAppGroupPinnedMessageCreate:
      type: object
      additionalProperties: false
      description: A message to pin at the top of the group's chat.
      required:
      - message_id
      properties:
        message_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppMessageID'
          description: 'The message to pin. It has to be one this group carries: a message in another group, or a one-to-one message, returns a `422` `WhatsAppMessageNotInGroup`.

            '
        duration_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
          description: How many days the message stays pinned before WhatsApp unpins it, from 1 to 30.
          example: 7
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    Timestamps:
      type: object
      required:
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          example: '2026-05-20T09:14:52Z'
        updated_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          example: '2026-05-25T16:42:01Z'
    WhatsAppGroupID:
      type: string
      minLength: 1
      pattern: ^wag_[0-9a-hjkmnp-tv-z]{26}$
      example: wag_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppGroup:
      allOf:
      - type: object
        description: 'A WhatsApp group your business created and administers. People join by opening its invite link, not by being added.

          '
        required:
        - id
        - whatsapp_number_id
        - waba
        - subject
        - status
        - join_approval_mode
        - participant_count
        properties:
          id:
            allOf:
            - $ref: '#/components/schemas/WhatsAppGroupID'
            readOnly: true
            description: Unique identifier for the group. Accepted by every `/v1/whatsapp/groups/{group_id}` operation, and as `to` when sending a message to the group.
          whatsapp_number_id:
            allOf:
            - $ref: '#/components/schemas/WhatsAppNumberID'
            readOnly: true
            description: 'The business number that created the group. It is the group''s admin and the number every message to the group is sent from. Fixed when the group is created.

              '
          waba:
            type:
            - string
            - 'null'
            minLength: 1
            readOnly: true
            description: 'Meta''s identifier for the WhatsApp Business Account recorded when the group was created. This is a historical snapshot, not a live account directory projection. Null for a number we operate on your behalf, whose account is not yours to see.

              '
            example: '102290129340398'
          subject:
            type: string
            minLength: 1
            maxLength: 128
            description: The group's name, shown to participants and to anyone who opens the invite link.
            example: New Purchase Inquiry
          description:
            type:
            - string
            - 'null'
            maxLength: 2048
            description: The group's description, shown alongside the subject. Null when the group has none.
            example: Jim would like to learn about new car purchase options for current year models.
          status:
            allOf:
            - $ref: '#/components/schemas/WhatsAppGroupStatus'
            readOnly: true
            description: Where the group stands. A group is messageable only while it is `active`.
          join_approval_mode:
            allOf:
            - $ref: '#/components/schemas/WhatsAppGroupJoinApprovalMode'
            readOnly: true
            description: Whether opening the invite link joins the group outright or raises a join request to approve.
          invite_link:
            type:
            - string
            - 'null'
            readOnly: true
            description: 'The link that lets someone join the group, which is the only way in. A group has one link at a time. Null while the group is `pending`, since WhatsApp issues the link when it confirms the group. Rotating it through `POST /v1/whatsapp/groups/{group_id}/invite-link/rotate` replaces it, and every link the group had before then stops working.

              '
            example: https://chat.whatsapp.com/JZm4S9tCkQx2LpVr7Ny8Ab
          participants:
            type: array
            readOnly: true
            description: 'Who is in the group, as of the last update WhatsApp sent, and the whole set rather than a page: WhatsApp holds a group to a handful of people, so there is never a page''s worth to return. The business number that created the group is its admin and is not listed.

              '
            items:
              $ref: '#/components/schemas/WhatsAppGroupParticipant'
          participant_count:
            type: integer
            readOnly: true
            minimum: 0
            description: How many people are in the group, excluding your business.
            example: 6
          pinned_messages:
            type: array
            readOnly: true
            description: 'The group''s pins, newest first. WhatsApp holds a few at once, and pinning past that unpins the oldest rather than refusing. No entry here is merely requested. An entry stays listed until it is unpinned, so one whose `pinned_until` has passed is still listed after WhatsApp has taken it off the chat.

              '
            items:
              $ref: '#/components/schemas/WhatsAppGroupPinnedMessage'
          profile_picture_url:
            type:
            - string
            - 'null'
            readOnly: true
            description: Address of the group's picture, as WhatsApp serves it. Null when the group has none.
            example: https://media.example.com/whatsapp/groups/JZm4S9tCkQx2.jpg
          last_operation:
            $ref: '#/components/schemas/WhatsAppGroupOperation'
            readOnly: true
            description: 'The last create, settings change or delete asked of the group. `pending` while WhatsApp has yet to confirm it, which is what a client shows as in-progress and what refuses the next change to the group. A settings change carries per-field `results`, since WhatsApp can refuse one field and apply the others. A removal reports on the participant''s own entry rather than here, so several can be in flight at once. Pinning is synchronous and reports nothing.

              '
          suspended_at:
            type: string
            format: date-time
            minLength: 1
            readOnly: true
            description: When WhatsApp suspended the group. Present only while the group is `suspended`, and gone once WhatsApp lifts the suspension.
            example: '2026-08-20T11:04:00Z'
      - $ref: '#/components/schemas/Timestamps'
    WhatsAppGroupJoinRequestDecisionResult:
      type: object
      additionalProperties: false
      description: 'What happened to each join request in the batch. WhatsApp decides them one by one, so a batch can be part-applied: the requests it accepted are in `decided`, and the rest are in `failed` with the reason.

        '
      required:
      - decided
      - failed
      properties:
        decided:
          type: array
          readOnly: true
          description: The join requests WhatsApp accepted the decision for. A person approved here can enter the group; a person rejected here sees the join button again.
          items:
            $ref: '#/components/schemas/WhatsAppGroupJoinRequestID'
        failed:
          type: array
          readOnly: true
          description: The join requests WhatsApp refused, each with its reason. Empty when the whole batch was applied.
          items:
            $ref: '#/components/schemas/WhatsAppGroupJoinRequestFailure'
    WhatsAppGroupOperationType:
      type: string
      minLength: 1
      enum:
      - create
      - settings_update
      - delete
      - remove
      description: 'What was asked of the thing carrying the operation:


        - `create` and `delete` act on the group itself.

        - `settings_update` changes the group''s subject, description or picture.

        - `remove` takes one participant out of the group.

        '
      example: settings_update
    WhatsAppGroupCreate:
      type: object
      additionalProperties: false
      description: 'The group to create. WhatsApp issues the invite link, and people join by opening it, so a create request names no participants.

        '
      required:
      - whatsapp_number_id
      - subject
      properties:
        whatsapp_number_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppNumberID'
          description: 'The business number that will own and administer the group, as its id in `GET /v1/whatsapp/numbers`. It must be a number your workspace can send from, and WhatsApp must have granted it Official Business Account status; a number without that status returns a `412` `WhatsAppGroupsNotEligible`. The number cannot be changed afterwards, and every message to the group is sent from it.

            '
        subject:
          type: string
          minLength: 1
          maxLength: 128
          description: The group's name, shown to participants and to anyone who opens the invite link. Surrounding whitespace is trimmed.
          example: New Purchase Inquiry
        description:
          type: string
          maxLength: 2048
          description: The group's description, shown alongside the subject.
          example: Jim would like to learn about new car purchase options for current year models.
        join_approval_mode:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupJoinApprovalMode'
          description: 'Whether opening the invite link joins the group outright, or raises a join request for you to approve. Defaults to `auto_approve`. It cannot be changed once the group exists.

            '
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    WhatsAppGroupJoinRequestDecision:
      type: object
      additionalProperties: false
      description: The join requests to decide on.
      required:
      - join_request_ids
      properties:
        join_request_ids:
          type: array
          minItems: 1
          maxItems: 50
          description: 'The join requests to act on, as returned by `GET /v1/whatsapp/groups/{group_id}/join-requests`. Each is decided on its own, so one can fail while the rest succeed. An ID that names no waiting request returns a `422` `WhatsAppGroupJoinRequestNotFound`. The 50 is Bird''s own request bound, not a WhatsApp one: how many people the group can hold does not limit how many can queue at its link, so a rejection sweep is not held to the size of the group it is refusing entry to.

            '
          items:
            $ref: '#/components/schemas/WhatsAppGroupJoinRequestID'
    WhatsAppGroupStatus:
      type: string
      minLength: 1
      enum:
      - pending
      - active
      - suspended
      - deleted
      - failed
      description: 'Where the group stands. Values, in lifecycle order:


        - `pending` means the request to create the group has been accepted and WhatsApp has not confirmed it yet. The group has no invite link, and it cannot be messaged or changed.

        - `active` means the group exists at WhatsApp and carries an invite link. Only an active group can be messaged.

        - `suspended` means WhatsApp has stopped activity in the group, which it does when a group breaks its policies. Sends fail while it lasts, and WhatsApp can lift it on its own.

        - `deleted` means the group is gone, either because you deleted it or because WhatsApp removed it. Every participant lost access, and the state is terminal.

        - `failed` means WhatsApp refused to create the group; `last_operation.last_error` says why. The state is terminal, so create another group rather than retrying this one.

        '
      example: active
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    WhatsAppGroupPinnedMessage:
      type: object
      additionalProperties: false
      description: A message pinned at the top of a group's chat.
      required:
      - message_id
      - pinned_until
      properties:
        message_id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/WhatsAppMessageID'
          description: The pinned message, as returned in the send response's `id`.
        pinned_until:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: 'When the pin is due to lapse, projected from the `duration_days` the pin was asked for. An entry stays listed until it is unpinned, so a time in the past means WhatsApp has already taken the message off the chat.

            '
          example: '2026-09-01T09:14:52Z'
    WhatsAppGroupList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            description: The groups your workspace created, newest first.
            items:
              $ref: '#/components/schemas/WhatsAppGroup'
      - $ref: '#/components/schemas/_ListEnvelope'
    WhatsAppNumberID:
      type: string
      minLength: 1
      pattern: ^wan_[0-9a-hjkmnp-tv-z]{26}$
      example: wan_01krdgeqcxet5s7t44vh8rt9mg
    WhatsAppGroupParticipant:
      type: object
      additionalProperties: false
      required:
      - bsuid
      description: Someone who joined the group. The business number that created the group is its admin and is not listed.
      properties:
        bsuid:
          type: string
          minLength: 1
          readOnly: true
          description: 'Business-scoped user ID, Meta''s identifier for this person against your business. The one identifier every participant has: WhatsApp always sends it, and it is stable for as long as they are in the group.

            '
          example: US.1566655121691972
        phone_number:
          type: string
          minLength: 1
          readOnly: true
          description: 'Phone number in E.164 format. Absent when WhatsApp withholds it, which it does for anyone who has not shared their number with your business, so a group is normally a mix of participants with one and without.

            '
          example: '+16505551234'
        username:
          type: string
          minLength: 1
          readOnly: true
          description: 'The WhatsApp username this person chose. Absent when they have none, and not an identifier to address them by: it is theirs to change, so it names them in a list rather than keying anything.

            '
          example: john.doe
        last_operation:
          $ref: '#/components/schemas/WhatsAppGroupOperation'
          readOnly: true
          description: 'A removal asked of this participant that has not taken effect: `pending` while WhatsApp has yet to confirm it, or `failed` when WhatsApp refused. Never `success`, because a removal that succeeds takes the participant off this list: the entry disappearing is what says it worked. A `pending` removal refuses a second removal of the same person while leaving other participants free to be removed at the same time.

            '
    WhatsAppGroupOperation:
      type: object
      additionalProperties: false
      readOnly: true
      required:
      - type
      - status
      - requested_at
      description: 'The last change asked of this group or participant, and where it got to. WhatsApp confirms a change on a webhook rather than in its reply, so an operation is `pending` until that arrives. While it is, another change to the same thing is refused with a `409` `WhatsAppGroupUpdateInProgress`; a change to a different participant is not, so several removals can be in flight at once. Absent on something nothing has been asked of yet.

        '
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupOperationType'
          readOnly: true
          description: What was asked.
        status:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupOperationStatus'
          readOnly: true
          description: Where it got to. `pending` is what a client shows as in-progress, and what refuses the next change.
        requested_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When Bird accepted the request.
          example: '2026-08-27T14:02:11Z'
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When WhatsApp reported the outcome. Null while `pending`.
          example: '2026-08-27T14:02:14Z'
        results:
          type: array
          readOnly: true
          maxItems: 3
          description: 'Per-field outcomes, on a `settings_update` that has settled. One entry per field the update carried, so a client can put a refusal next to the input it came from. Absent on every other operation type, which change one thing and report it on `status`.

            '
          items:
            $ref: '#/components/schemas/WhatsAppGroupOperationResult'
        last_error:
          $ref: '#/components/schemas/WhatsAppGroupError'
          readOnly: true
          description: 'Why the operation failed as a whole. Present when `status` is `failed`, including when the confirmation never arrived and Bird gave up waiting. A `settings_update` that failed on some fields and not others carries the per-field detail in `results`.

            '
    WhatsAppGroupUpdate:
      type: object
      additionalProperties: false
      description: 'The changes to make. Fields you omit are left as they are. WhatsApp applies each field separately, so one can be rejected while the others take effect; the group''s `updated_at` moves when a change lands.

        '
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 128
          description: A new name for the group. Participants see the change in the group's chat.
          example: Watch Enthusiasts
        description:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 2048
          description: A new description for the group. Send `null` to clear it; an empty string is a `422` rather than a second way to clear.
          example: Discuss the latest timepieces and share reviews.
        profile_picture_url:
          type:
          - string
          - 'null'
          minLength: 1
          description: 'A new picture for the group, naming a file in your workspace''s media library. WhatsApp takes a square JPEG of at least 192 by 192 pixels and up to 5 MB; anything else returns a `422`. Sending `null` clears the picture Bird stores, and an empty string is a `422` rather than a second way to clear it; WhatsApp has no operation for removing a group''s photo, so the one participants see stays until another picture replaces it.

            '
          example: https://media.example.com/whatsapp/groups/square.jpg
    WhatsAppGroupJoinRequestFailure:
      type: object
      additionalProperties: false
      description: A join request the decision could not be applied to.
      required:
      - join_request_id
      - error
      properties:
        join_request_id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupJoinRequestID'
          readOnly: true
          description: The join request that was not decided.
        error:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupError'
          readOnly: true
          description: 'Why WhatsApp refused. The common one is a person who has not accepted WhatsApp''s current terms, which no retry fixes.

            '
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    WhatsAppGroupJoinRequest:
      type: object
      additionalProperties: false
      description: Someone waiting to be let into a group that requires approval.
      required:
      - id
      - bsuid
      - created_at
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/WhatsAppGroupJoinRequestID'
          readOnly: true
          description: Unique identifier for the join request. Pass it to the batch-approve and batch-reject operations.
        bsuid:
          type: string
          minLength: 1
          readOnly: true
          description: 'Business-scoped user ID, Meta''s identifier for this person against your business. The one identifier every request has, and the one that carries over to `participants` if you approve it.

            '
          example: US.1566655121691972
        phone_number:
          type: string
          minLength: 1
          readOnly: true
          description: 'Phone number in E.164 format. Absent when WhatsApp withholds it, which it does for anyone who has not shared their number with your business.

            '
          example: '+16505551234'
        username:
          type: string
          minLength: 1
          readOnly: true
          description: 'The WhatsApp username this person chose. Absent when they have none, and theirs to change, so it names them in a list rather than keying anything.

            '
          example: john.doe
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When the request was made.
          example: '2026-08-24T10:07:57Z'
    WhatsAppGroupJoinRequestSortField:
      type: string
      enum:
      - created_at
      default: created_at
      description: Sortable fields for a WhatsApp group join-request list.
    WhatsAppGroupJoinRequestList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            description: The join requests still waiting for a decision, oldest first.
            items:
              $ref: '#/components/schemas/WhatsAppGroupJoinRequest'
      - $ref: '#/components/schemas/_ListEnvelope'
    WhatsAppGroupInviteLink:
      type: object
      additionalProperties: false
      description: A group's invite link.
      required:
      - invite_link
      properties:
        invite_link:
          type: string
          minLength: 1
          readOnly: true
          description: The group's one invite link. Every link the group had before this one stops working.
          example: https://chat.whatsapp.com/JZm4S9tCkQx2LpVr7Ny8Ab
    SortOrder:
      type: string
      enum:
      - asc
      - desc
      description: Sort direction, ascending or descending.
    WhatsAppGroupOperationStatus:
      type: string
      minLength: 1
      enum:
      - pending
      - success
      - failed
      description: "How the operation ended:\n\n- `pending` means WhatsApp accepted the request and has not reported back. Another\n  operation on the same thing is refused while this lasts.\n- `success` means WhatsApp applied everything asked of it. A change whose success\n  removes its own carrier is never seen in this state: a removed participant and an\n  unpinned message leave their lists, and the entry going away is the confirmation.\n- `failed` means WhatsApp applied none of it, or only part: `last_error` says why,\n  and on a `settings_update` the per-field `results` say which fields did apply.\n"
      example: pending
    WhatsAppGroupJoinRequestID:
      type: string
      minLength: 1
      pattern: ^wgj_[0-9a-hjkmnp-tv-z]{26}$
      example: wgj_01krdgeqcxet5s7t44vh8rt9mg
  parameters:
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: Cursor from the `prev_cursor` or `refresh_cursor` field of a previous list response. Returns items immediately before the cursor position in the current sort order. `prev_cursor` returns the preceding page. `refresh_cursor` anchors at the first row of that response, which on a newest-first sort is how to fetch the items that have appeared since.
      schema:
        type: string
    CreatedBefore:
      name: created_before
      in: query
      required: false
      description: Limits the response to resources created before this timestamp. Combine it with `created_after` to select a time window. Use an RFC 3339 timestamp with a timezone offset.
      schema:
        type: string
        format: date-time
        example: '2026-06-01T00:00:00Z'
    PaginationLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OrderDesc:
      name: order
      in: query
      required: false
      description: 'Sort direction. Defaults to `desc`, which sorts from newest to oldest or largest to smallest, depending on the selected sort field.

        '
      schema:
        $ref: '#/components/schemas/SortOrder'
        default: desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Client-supplied key. On operations supporting request deduplication, a retained\nresponse is replayed for duplicate requests with the same key within the\nidempotency window (3 hours by default). This protection requires a workspace,\norganization, or staff-account scope. User-only and unscoped unauthenticated operations,\nstreams, and operations with a separate replay contract do not use this\nresponse replay.\n\nOn a supported operation, if idempotency protection is unavailable before execution, the API returns\n`503 IdempotencyUnavailable` (E01033) without executing this attempt. Retry with\nbackoff using the same key and request. An operation that takes effect before\nits response is retained can still execute again on retry.\n\nTwo distinct 409 errors signal misuse:\n\n- `request_in_progress` (E01004): The same key is currently being\n  processed by a concurrent request. Wait briefly and retry. The lock expires within 30 seconds.\n- `idempotency_key_reuse` (E01005): The same key has already completed\n  against a different request body or method. Generate a new key.\n\nRecommended key format is `<event-type>/<entity-id>` (for example `welcome-user/usr_abc123`).\n"
      schema:
        type: string
        maxLength: 255
    OrderAsc:
      name: order
      in: query
      required: false
      description: 'Sort direction. Defaults to `asc`, which sorts alphabetically or from oldest to newest, depending on the selected sort field.

        '
      schema:
        $ref: '#/components/schemas/SortOrder'
        default: asc
    CreatedAfter:
      name: created_after
      in: query
      required: false
      description: Limits the response to resources created at or after this timestamp. Combine it with `created_before` to select a time window. Use an RFC 3339 timestamp with a timezone offset.
      schema:
        type: string
        format: date-time
        example: '2026-05-01T00:00:00Z'
    XWorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace context for the request. Required for dashboard authentication and master keys. Workspace keys and access tokens already identify their workspace; send that workspace or omit the header. A different one is rejected.
      schema:
        type: string
        pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: Cursor from the `next_cursor` field of a previous list response. Returns items immediately after the cursor position in the current sort order.
      schema:
        type: string
    XOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Organization context for the request. Required for dashboard authentication. An API key or access token carries its own organization, so send either that organization or no header at all; a different one is rejected.
      schema:
        type: string
        pattern: ^org_[0-9a-hjkmnp-tv-z]{26}$
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    IdempotencyReplay:
      description: The API includes this header when it replays the response for an earlier request that used the same `Idempotency-Key`. The API does not process the request again.
      schema:
        type: string
        enum:
        - 'true'
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
  responses:
    ServiceUnavailable:
      description: 'The service is temporarily unavailable. If `Retry-After` is present, wait for that delay before retrying; otherwise, retry with exponential backoff. Reuse the same idempotency key and request when retrying a mutation.

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: Precondition failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Workspace

        keys use `bk_{region}_*`; organization master keys use `bm_{region}_*`.

        The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
