          allOf:
          - $ref: '#/components/schemas/AMBBusinessID'
          readOnly: true
        apple_business_id:
          type: string
          format: uuid
          minLength: 1
          readOnly: true
          description: The Apple business UUID frozen when this attempt was submitted.
        name:
          type: string
          minLength: 1
          readOnly: true
          description: The customer-supplied Bird account name frozen when this attempt was submitted.
        readiness_attachment:
          allOf:
          - $ref: '#/components/schemas/Attachment'
          readOnly: true
        use_cases_attachment:
          allOf:
          - $ref: '#/components/schemas/Attachment'
          readOnly: true
        video_attachment:
          allOf:
          - $ref: '#/components/schemas/Attachment'
          readOnly: true
        status:
