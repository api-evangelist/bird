openapi: 3.2.0
info:
  title: Bird Amb Business Accounts API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: amb-business-accounts
  description: The Apple Messages for Business brand record your workspace sends as, its approval state, and the channel settings and landing page Apple requires.
paths:
  /v1/amb/business-accounts/{business_account_id}/reconnect:
    post:
      operationId: restoreAMBBusinessAccount
      x-snippet-key: amb.business_accounts.reconnect
      summary: Reconnect an Apple business account
      description: Restores the local connection. The retained approval and suspension state still determines whether the account can send. Repeated reconnects return the current account.
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The reconnected business account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/business-accounts/{business_account_id}/events:
    get:
      operationId: listAMBBusinessAccountEvents
      x-snippet-key: amb.business_accounts.events.list
      summary: List Apple business account events
      description: Returns account activity with event time, summary and source metadata, newest first by default.
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - name: sort
        in: query
        description: 'Field to sort by. Possible values: `created_at`. Defaults to `created_at`.'
        schema:
          $ref: '#/components/schemas/AMBBusinessAccountEventSort'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/IncludeTotal'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: A page of business account activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccountEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/business-accounts:
    get:
      operationId: listAMBBusinessAccounts
      x-snippet-key: amb.business_accounts.list
      summary: List Apple Messages for Business records
      description: 'Returns a paginated list of your workspace''s Apple Messages for Business

        records. A workspace can register multiple businesses.'
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: sort
        in: query
        required: false
        description: 'Field to sort by. Possible values: `created_at`. Defaults to `created_at`.'
        schema:
          $ref: '#/components/schemas/AMBBusinessAccountSort'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/IncludeTotal'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: A page of your workspace's Apple Messages for Business records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccountList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    post:
      operationId: createAMBBusinessAccount
      x-snippet-key: amb.business_accounts.create
      summary: Create an Apple Messages for Business record
      description: 'Creates an Apple Messages for Business record in your workspace. Each

        Apple Business ID can belong to only one retained business record in this region.

        Disconnecting an account does not release its identifier.


        The account starts with `status: pending` and no `account_review_status`,

        including when you supply `apple_business_id`. Upload the required evidence

        and create a submission to begin review. The account remains pending until

        approved; its submission records review progress.'
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMBBusinessAccountCreate'
            example:
              name: Acme Retail
      responses:
        '201':
          description: The created Apple Messages for Business record.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/business-accounts/{business_account_id}:
    get:
      operationId: getAMBBusinessAccount
      x-snippet-key: amb.business_accounts.get
      summary: Get an Apple Messages for Business record
      description: Returns your workspace's Apple Messages for Business record, including its current status with Apple.
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        description: Bird business account ID (abz_) or Apple business UUID. Both resolve within the current workspace.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The Apple Messages for Business record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    patch:
      operationId: updateAMBBusinessAccount
      x-snippet-key: amb.business_accounts.update
      summary: Update an Apple Messages for Business record
      description: 'Changes your workspace''s Apple Messages for Business record. Fields you

        omit are left as they are.


        Sending `apple_business_id` identifies the draft but does not submit it.

        Create a submission with all three evidence attachments when the record

        is ready for review.'
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        description: ID of the Apple Messages for Business record, as returned by the business list.
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMBBusinessAccountUpdate'
            example:
              apple_business_id: b52d6267-2b62-4f8a-8842-0533d0f1dc07
      responses:
        '200':
          description: The updated Apple Messages for Business record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
    delete:
      operationId: deleteAMBBusinessAccount
      x-snippet-key: amb.business_accounts.delete
      summary: Disconnect an Apple business account
      description: Stops new and queued sends while retaining the account, Apple UUID, approval, credentials and history. Repeated disconnects succeed without changing history. An already-started send attempt may finish; provider requests cannot be recalled. This is a local Bird connection change, not Apple deregistration.
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '204':
          description: The business account is disconnected.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/business-accounts/{business_account_id}/submissions:
    get:
      operationId: listAMBBusinessAccountSubmissions
      x-snippet-key: amb.business_accounts.submissions.list
      summary: List Apple Messages for Business submissions
      description: Returns review attempts with frozen evidence for this business, newest first, with fresh private evidence URLs.
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - name: sort
        in: query
        description: 'Field to sort by. Possible values: `created_at`. Defaults to `created_at`.'
        schema:
          $ref: '#/components/schemas/AMBBusinessAccountSubmissionSort'
      - $ref: '#/components/parameters/OrderDesc'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/IncludeTotal'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: A page of submission attempts, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccountSubmissionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    post:
      operationId: createAMBBusinessAccountSubmission
      x-snippet-key: amb.business_accounts.submissions.create
      summary: Submit an Apple Messages for Business business for review
      description: Submits an account for review, making its name, Apple UUID and three uploaded evidence attachments available to Bird staff. This does not approve the account.
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMBBusinessAccountSubmissionCreate'
      responses:
        '201':
          description: The submission with its frozen evidence manifest.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBBusinessAccountSubmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/business-account-attachments:
    post:
      operationId: createAMBBusinessAccountAttachment
      summary: Upload Apple Messages for Business review evidence
      description: Uploads a private PDF or MP4 for a later business submission and returns expiring download and preview links.
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AMBBusinessAccountAttachmentUpload'
      responses:
        '200':
          description: An existing same-content attachment in this workspace, which may already be committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '201':
          description: The uploaded evidence attachment.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-snippet-key: none
      x-surfaces:
      - cli
      - mcp
  /v1/amb/business-accounts/{business_account_id}/channel-settings:
    get:
      operationId: getAMBChannelSettings
      x-snippet-key: amb.business_accounts.settings.get
      summary: Get Apple Messages for Business channel settings
      description: 'Returns the channel settings for your workspace''s Apple Messages for Business record: its entry points, default locale, and the brand name and logo shown on the landing page customers use to connect it.'
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        description: ID of the Apple Messages for Business record, as returned by the business list.
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The business's channel settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBChannelSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-surfaces:
      - cli
      - mcp
      - sdk
    patch:
      operationId: updateAMBChannelSettings
      x-snippet-key: amb.business_accounts.settings.update
      summary: Update Apple Messages for Business channel settings
      description: 'Changes the channel settings for your workspace''s Apple Messages for

        Business record. Fields you omit are left as they are, except

        `entry_points`: sending it replaces the entire set, since there is no

        way to add or remove a single entry point without resending the rest.'
      tags:
      - amb-business-accounts
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: business_account_id
        in: path
        required: true
        description: ID of the Apple Messages for Business record, as returned by the business list.
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMBChannelSettingsUpdate'
            example:
              brand_name: Acme Retail
              default_locale: en-US
              entry_points:
              - id: website-footer
                group: support
                intent: general-inquiry
                body: Hi, I have a question about my order.
      responses:
        '200':
          description: The updated channel settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBChannelSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  schemas:
    AssetID:
      type: string
      minLength: 1
      pattern: ^ast_[0-9a-hjkmnp-tv-z]{26}$
      example: ast_01krdgeqcxet5s7t44vh8rt9mg
    AttachmentID:
      type: string
      minLength: 1
      pattern: ^tca_[0-9a-hjkmnp-tv-z]{26}$
      example: tca_01krdgeqcxet5s7t44vh8rt9mg
    AMBBusinessAccountSubmissionSort:
      type: string
      enum:
      - created_at
      default: created_at
      description: Field used to order the records.
    AMBBusinessAccountCreate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The brand name shown for this business record inside Bird.
          example: Acme Retail
        apple_business_id:
          type: string
          format: uuid
          minLength: 1
