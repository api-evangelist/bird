openapi: 3.2.0
info:
  title: Bird Voice Calls API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: voice-calls
  description: One navigational entry per call and every leg that belongs to it, with whether it produced a recording or a transcript.
paths:
  /v1/voice/calls:
    post:
      operationId: createVoiceCall
      summary: Create a call
      description: 'Accepts a real outbound call that runs a voice sequence after the

        recipient answers, starting at the selected entry node. Supply exactly one

        of `sequence.id`, to run the active publication of a saved sequence, or

        `sequence.definition`, to run a complete definition once without saving

        it. Production availability rules and normal calling charges apply.

        Requires both voice management write and voice calling write permissions

        and a permitted calling number. Browser users and API keys are supported.

        Draft and test selectors are not accepted. See the

        Create Call guide.


        An inline definition must pass the same checks as publishing a sequence;

        the first blocking problem returns 422 with its location under

        `/sequence/definition`. Its run executes at most 16 commands, including

        gather prompts; a call that needs a 17th ends with the `call_limit`

        trace error instead of running it. The accepted call''s

        `sequence.id` is `null`, because its run belongs to no saved sequence.


        Supply sequence trigger data as an explicit object matching the selected

        entry''s configured data schema, or an empty object when no data is needed.

        The active publication or inline definition, entry node, and trigger data

        are frozen when the call is accepted. The response contains reserved call and initial-leg IDs.

        Its `null` `started_at`, `false` `live`, and empty `parties` describe the

        acceptance snapshot. Acceptance does not guarantee that dialing starts or

        that call and leg reads become available. A call that fails or is canceled

        before registration might never appear in those reads. Read progress

        in the sequence''s Runs tab in the dashboard. Once the initial leg is

        registered, use its `initial_leg_id` with `GET /v1/voice/legs/{leg_id}` to

        inspect the telephone outcome; that read requires voice read permission.


        Idempotency is optional. Without an `Idempotency-Key` header, each request

        accepts a new call attempt. To protect retries, supply a key on the first

        attempt and reuse it for the same intended call.

        Requests are limited to 128 KiB. The same idempotency key and exact request

        bytes replay the original acceptance snapshot for three hours. Changed

        requests return 409. Authorization and calling-number permission are

        checked on every request, including replays. Replays include the

        Idempotency-Replay header with value true.'
      tags:
      - voice-calls
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - public
      - dashboard
      - command
      x-snippet-key: voice.calls.create
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceCallRequest'
            example:
              from: '+12025550100'
              to: '+12025550101'
              sequence:
                id: vsq_01krdgeqcxet5s7t44vh8rt9mg
                entry_node_id: start
                trigger_data: {}
      responses:
        '202':
          description: Immutable acceptance snapshot for the call.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceCall'
              example:
                id: vcs_01krdgeqcxet5s7t44vh8rt9mg
                workspace_id: ws_01krdgeqcxet5s7t44vh8rt9mg
                initial_leg_id: vcl_01krdgeqcxet5s7t44vh8rt9mg
                direction: outbound
                started_at: null
                ended_at: null
                live: false
                has_recording: false
                has_transcript: false
                parties: []
                sequence:
                  id: vsq_01krdgeqcxet5s7t44vh8rt9mg
                  run_id: vsr_01krdgeqcxet5s7t44vh8rt9mg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  schemas:
    VoiceInboundForwardAs:
      type: string
      minLength: 1
      enum:
      - dialed_number
      - calling_number
      description: 'Which of a forwarded call''s two numbers it shows as the caller.


        `dialed_number` presents the Bird number the caller dialed. Whoever answers

        sees which of your numbers was called. Older configurations without a stored

        choice use this value. Carrier screening can still affect delivery.


        `calling_number` presents the caller''s own number, so the phone rings as though

        they had dialed it directly and the call can be returned from the call log. Because

        the number is not one you own, some carriers (most often in the US and parts of

        Europe) mark such calls as unverified, replace the number, or screen them.

        '
      example: dialed_number
    VoiceSequencePresentation:
      type: object
      additionalProperties: true
      properties:
        preview:
          $ref: '#/components/schemas/VoiceSequenceSavedPreview'
          description: Saved hypothetical authoring samples. Save checks their shape; preview and evaluation check their meaning only when explicitly submitted. These values never supply live call context or results. They remain part of retained drafts, versions and frozen definitions, including when a gather is private.
      description: Optional editor layout, labels and saved authoring samples. These fields do not drive execution. Their bytes still count toward definition and execution size limits.
    VoiceSequenceDefinitionNode:
      type: object
      additionalProperties: true
      description: An authored node object. Drafts retain incomplete configuration, input and connections for later validation. Connections map output port names to objects with explicit node_id and port fields; validation reports incomplete or invalid targets. Omitted connections or an empty map leaves every output unconnected, with behavior determined by the node contract.
    CreateVoiceCallRequest:
      type: object
      additionalProperties: false
      x-sensitive: true
      required:
      - from
      - to
      - sequence
      properties:
        from:
          $ref: '#/components/schemas/VoiceSequencePhoneNumber'
          description: Calling number that this workspace is permitted to present.
        to:
          $ref: '#/components/schemas/VoiceSequencePhoneNumber'
          description: Recipient number in canonical E.164 form.
        ringing_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 120
          default: 30
          description: Maximum ringing time for the original dialing attempt, shared across routing candidates.
        sequence:
          $ref: '#/components/schemas/CreateVoiceCallSequenceRequest'
    VoiceSequencePreviewSample:
      oneOf:
      - $ref: '#/components/schemas/VoiceSequencePortSample'
      - $ref: '#/components/schemas/VoiceSequenceCompletionSample'
      description: A hypothetical node outcome. Managed builtin transfers use explicit completion; nodes with output ports use a port and its output. These forms cannot be combined.
    VoiceSequenceSavedExecutionEndpoint:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 128
    VoiceSessionID:
      type: string
      minLength: 1
      pattern: ^vcs_[0-9a-hjkmnp-tv-z]{26}$
      example: vcs_01krdgeqcxet5s7t44vh8rt9mg
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    VoiceSequenceRunID:
      type: string
      minLength: 1
      pattern: ^vsr_[0-9a-hjkmnp-tv-z]{26}$
      example: vsr_01krdgeqcxet5s7t44vh8rt9mg
    VoicePartyBridgeSIPEndpoint:
      type: object
      readOnly: true
      additionalProperties: false
      required:
      - trunk_id
      properties:
        trunk_id:
          $ref: '#/components/schemas/SIPTrunkID'
          description: The workspace trunk the leg was delivered onward to. It is distinct from the party's own `trunk_id`, which is the trunk this side itself sat behind.
    VoicePartySIPEndpoint:
      type: object
      readOnly: true
      additionalProperties: false
      required:
      - contact
      properties:
        contact:
          type: string
          minLength: 1
          description: The address the user agent registered, as a `sip:` or `sips:` URI. It is where the endpoint asked to be reached, which is not always the address that was dialled.
          example: sip:ua@203.0.113.7:5060
    VoiceCallSequence:
      type: object
      additionalProperties: false
      required:
      - id
      - run_id
      properties:
        id:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/VoiceSequenceID'
          - type: 'null'
          description: Voice sequence selected for this call. Null for a call that ran an inline definition.
        run_id:
          readOnly: true
          $ref: '#/components/schemas/VoiceSequenceRunID'
          description: Run created from the sequence's frozen publication or the call's inline definition.
    VoiceParty:
      type: object
      additionalProperties: false
      properties:
        endpoint:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/VoicePartyEndpoint'
          - type: 'null'
          description: 'What kind of participant sat on this side of a leg, and the coordinate that kind carries: a telephone endpoint off the platform, a SIP or WebRTC endpoint, Bird answering, or the platform placing a leg onward. It does not name a person.

            `null` on an observation this API could not read. The entry stays, because the call counted it when it deduplicated, and dropping it here would report fewer participants than were observed.'
        address:
          readOnly: true
          type:
          - string
          - 'null'
          description: This side's own address, in E.164 or as a `sip:` URI. `null` when the observation carried none, which does not say whether one was withheld, missing, or nonexistent.
          example: '+14155551234'
        trunk_id:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/SIPTrunkID'
          - type: 'null'
          description: The workspace trunk on this side of the leg. `null` when this side sat behind no trunk.
    VoiceSequencePhoneNumber:
      type: string
      minLength: 5
      maxLength: 16
      pattern: ^\+[1-9][0-9]{3,14}$
      description: Canonical E.164 phone number, with a leading plus sign and four to fifteen digits.
    WorkspaceID:
      type: string
      minLength: 1
      pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
      example: ws_01krdgeqcxet5s7t44vh8rt9mg
    VoiceSequenceSavedExecutionParty:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - endpoint
      description: Saved hypothetical party, or null for an absent observation. Strings may be stale; explicit preview and evaluation validate endpoint types and telephone addresses.
      properties:
        endpoint:
          $ref: '#/components/schemas/VoiceSequenceSavedExecutionEndpoint'
        address:
          type: string
          minLength: 1
          maxLength: 128
    VoiceSequenceSavedExecutionSample:
      type: object
      additionalProperties: false
      required:
      - id
      - started_at
      - call
      description: Saved hypothetical values, which may be stale or incomplete in meaning. Each string is nonempty and limited to 128 bytes. Explicit preview and evaluation require valid typed identifiers and a timestamp.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        started_at:
          type: string
          minLength: 1
          maxLength: 128
        call:
          $ref: '#/components/schemas/VoiceSequenceSavedExecutionCallSample'
    VoiceSequenceSavedPreview:
      type: object
      additionalProperties: false
      x-sensitive: true
      required:
      - trigger_node_id
      - trigger_data
      description: Saved authoring scenario. Values are checked against node contracts only when explicitly submitted to preview or evaluation.
      properties:
        trigger_node_id:
          $ref: '#/components/schemas/VoiceSequenceNodeID'
        trigger_data:
          type: object
          additionalProperties: true
        node_samples:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/VoiceSequencePreviewSample'
        execution_sample:
          $ref: '#/components/schemas/VoiceSequenceSavedExecutionSample'
    SIPTrunkID:
      type: string
      minLength: 1
      pattern: ^spt_[0-9a-hjkmnp-tv-z]{26}$
      example: spt_01krdgeqcxet5s7t44vh8rt9mg
    VoiceSequenceDefinition:
      type: object
      additionalProperties: false
      x-go-type-skip-optional-pointer: true
      required:
      - schema_version
      - expression_environment
      - nodes
      properties:
        schema_version:
          type: integer
          enum:
          - 1
          description: Version of the voice graph definition envelope.
          example: 1
        expression_environment:
          $ref: '#/components/schemas/VoiceSequenceExpressionEnvironment'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/VoiceSequenceDefinitionNode'
          description: Nodes keyed by stable IDs. Incomplete node objects may be saved in a draft. Array order has no execution meaning.
        settings:
          type: object
          additionalProperties: true
          description: Sequence policies being authored. Omission leaves the definition without explicit settings.
        presentation:
          $ref: '#/components/schemas/VoiceSequencePresentation'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    VoiceSequenceID:
      type: string
      minLength: 1
      pattern: ^vsq_[0-9a-hjkmnp-tv-z]{26}$
      example: vsq_01krdgeqcxet5s7t44vh8rt9mg
    VoicePartyEndpointType:
      type: string
      minLength: 1
      x-extensible-enum:
      - pstn
      - sip
      - voicemail
      - bridge_pstn
      - bridge_sip
      - webhook
      description: The technical participant observed on one side of a call. Additional endpoint types may appear in retained observations.
      example: pstn
    VoiceSequenceExpressionEnvironment:
      type: string
      minLength: 1
      enum:
      - bird.cel.v1
      description: Expression language used by explicitly marked values in a voice sequence definition.
    VoiceSequencePortSample:
      type: object
      additionalProperties: false
      required:
      - node_id
      - port
      - output
      properties:
        node_id:
          $ref: '#/components/schemas/VoiceSequenceNodeID'
        port:
          $ref: '#/components/schemas/AutomationPortKey'
        output:
          type: object
          additionalProperties: true
          x-go-type-skip-optional-pointer: true
          description: Original hypothetical output matching the resolved port schema, limited to 128 KiB. A webhook sample must also fit its 16 KiB native outcome envelope; business ports use the configured object schema and failure uses a fixed technical error code. Gather digits and reason must match collection constraints and the selected port. Private gather results are checked before removal from returned steps.
    VoicePartyBridgePSTNEndpoint:
      type: object
      readOnly: true
      additionalProperties: false
      required:
      - forward_to
      - forward_as
      properties:
        forward_to:
          type: string
          minLength: 3
          maxLength: 16
          pattern: ^\+[1-9][0-9]{1,14}$
          description: The number the platform placed the leg onward to, in E.164. The party's own `address` is the number that was dialled, so the two together are one hop of the call.
          example: '+31612345678'
        forward_as:
          $ref: '#/components/schemas/VoiceInboundForwardAs'
          description: Which number the forwarded leg presented to the far end.
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    VoiceCall:
      type: object
      additionalProperties: false
      description: 'A call summary. Call reads report observed state. Call creation returns an immutable acceptance snapshot: `started_at` and `ended_at` are `null`, the boolean observation fields are `false`, and `parties` is empty. Replays return that same snapshot after the call progresses.'
      required:
      - id
      - workspace_id
      - initial_leg_id
      - direction
      - started_at
      - live
      - has_recording
      - has_transcript
      - parties
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/VoiceSessionID'
          description: Unique identifier for this call, shared by every leg that belongs to it.
        workspace_id:
          readOnly: true
          $ref: '#/components/schemas/WorkspaceID'
        initial_leg_id:
          readOnly: true
          $ref: '#/components/schemas/VoiceCallID'
          description: The initial leg identity. For an accepted outbound call, this identity is reserved before the leg starts.
        direction:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/VoiceCallDirection'
          description: Direction of the initial leg.
        started_at:
          readOnly: true
          type:
          - string
          - 'null'
          minLength: 1
          format: date-time
          description: When the initial leg started. `null` in the acceptance snapshot returned by call creation.
          example: '2026-05-21T12:00:00Z'
        ended_at:
          readOnly: true
          type:
          - string
          - 'null'
          format: date-time
          description: When the call's last leg ended. `null` while any leg is still in progress. Recordings and transcripts can still arrive after this instant, so it does not mean the call is finished being written.
        live:
          readOnly: true
          type: boolean
          description: Whether any leg in the call is still held live. A leg stays live until its end is recorded or, when no end is observed, until its liveness window expires, so this can remain `true` briefly after a disconnect. `false` covers the interval between a leg ending and its settlement being confirmed, and says nothing about whether transcription has finished.
          example: false
        has_recording:
          readOnly: true
          type: boolean
          description: Whether the call ever produced a recording. It stays `true` for the life of the call, so it records that a recording was made rather than promising one can still be fetched.
          example: false
        has_transcript:
          readOnly: true
          type: boolean
          description: Whether the call ever produced a transcript. A failed transcription attempt does not set it, and a later failure does not clear it.
          example: false
        parties:
          readOnly: true
          type: array
          description: The distinct participant observations the call's legs recorded, for display beside the call. The length is not a count of people and not a reconstruction of the leg graph.
          items:
            $ref: '#/components/schemas/VoiceParty'
        sequence:
          readOnly: true
          $ref: '#/components/schemas/VoiceCallSequence'
          description: Sequence and run accepted for this outbound call. Present in the immutable acceptance snapshot returned by call creation. Current call detail and list reads omit this property, including for calls created from a sequence.
    VoicePartyEndpoint:
      type: object
      readOnly: true
      additionalProperties: false
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/VoicePartyEndpointType'
          description: What kind of participant sat on this side of a leg. It selects which payload below is present, and most kinds carry none because the party's `address` is already their coordinate.
        sip:
          $ref: '#/components/schemas/VoicePartySIPEndpoint'
          description: The registered contact of a `sip` endpoint. Absent when the observation recorded none, and on every other kind of endpoint.
        bridge_pstn:
          $ref: '#/components/schemas/VoicePartyBridgePSTNEndpoint'
          description: Where the platform placed the leg onward, on a `bridge_pstn` endpoint. Absent on every other kind of endpoint.
        bridge_sip:
          $ref: '#/components/schemas/VoicePartyBridgeSIPEndpoint'
          description: The trunk the platform delivered the leg onward to, on a `bridge_sip` endpoint. Absent on every other kind of endpoint.
    CreateVoiceCallSequenceRequest:
      type: object
      additionalProperties: false
      description: Supply exactly one of `id`, to run a saved sequence's active publication, or `definition`, to run a sequence once without saving it.
      required:
      - entry_node_id
      - trigger_data
      properties:
        id:
          $ref: '#/components/schemas/VoiceSequenceID'
          description: Published voice sequence to run after the recipient answers.
        definition:
          allOf:
          - $ref: '#/components/schemas/VoiceSequenceDefinition'
          x-go-type-skip-optional-pointer: false
          description: Complete sequence definition to run once after the recipient answers. It must pass the same checks as publishing a sequence, is frozen when the call is accepted, and creates no saved sequence.
        entry_node_id:
          $ref: '#/components/schemas/VoiceSequenceNodeID'
          description: Voice call entry node to start.
        trigger_data:
          type: object
          additionalProperties: true
          description: Data matching the selected entry's configured schema, limited to 16 KiB before and after normalization. Use an empty object when the entry needs no data. Fields remain application data and cannot provide trusted call identity or routing authority.
      oneOf:
      - required:
        - id
      - required:
        - definition
    VoiceCallID:
      type: string
      minLength: 1
      pattern: ^vcl_[0-9a-hjkmnp-tv-z]{26}$
      example: vcl_01krdgeqcxet5s7t44vh8rt9mg
    VoiceSequenceNodeID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]{0,63}$
      not:
        enum:
        - 'false'
        - in
        - 'null'
        - 'true'
      description: Stable identifier for a node within one sequence definition.
    VoiceCallDirection:
      type: string
      minLength: 1
      enum:
      - inbound
      - outbound
      description: Whether the call was placed from your side, by your PBX, the API, the browser or Bird dialing onward for you (outbound), or arrived from a remote party (inbound).
      example: outbound
    VoiceSequenceCompletionSample:
      type: object
      additionalProperties: false
      required:
      - node_id
      - completion
      properties:
        node_id:
          $ref: '#/components/schemas/VoiceSequenceNodeID'
        completion:
          type: string
          minLength: 9
          maxLength: 9
          const: completed
          description: Hypothetical completion of a managed builtin transfer. No media effects run during preview.
    VoiceSequenceSavedExecutionCallSample:
      type: object
      additionalProperties: false
      required:
      - id
      - session_id
      - orig
      - dest
      description: Saved hypothetical root call identities. Strings may be stale; explicit preview and evaluation require valid typed identifiers.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        orig:
          $ref: '#/components/schemas/VoiceSequenceSavedExecutionParty'
        dest:
          $ref: '#/components/schemas/VoiceSequenceSavedExecutionParty'
    AutomationPortKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]{0,63}$
      description: Stable named input or output declared by a node-type version.
      example: success
  headers:
    RetryAfter:
      description: 'Number of seconds to wait before retrying the request.

        '
      schema:
        type: integer
        minimum: 0
      example: 35
    IdempotencyReplay:
      description: The API includes this header when it replays the response for an earlier request that used the same `Idempotency-Key`. The API does not process the request again.
      schema:
        type: string
        enum:
        - 'true'
    RateLimit-Policy:
      description: 'Effective quota for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";q=<quota>;w=<window_seconds>`.

        '
      schema:
        type: string
      example: '"email_send";q=1000;w=60'
    RateLimit:
      description: 'Remaining capacity for the request''s rate-limit policy as an IETF Structured Field. Format: `"<policy>";r=<remaining>;t=<seconds_until_reset>`.

        '
      schema:
        type: string
      example: '"email_send";r=842;t=35'
  responses:
    ServiceUnavailable:
      description: 'The service is temporarily unavailable. If `Retry-After` is present, wait for that delay before retrying; otherwise, retry with exponential backoff. Reuse the same idempotency key and request when retrying a mutation.

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request has invalid field values, violates a business rule, or carries a query parameter the endpoint does not declare. Field validation errors use `type: validation_error` and include the affected fields in `details`. Business-rule errors identify the failed rule in `type`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Client-supplied key. On operations supporting request deduplication, a retained\nresponse is replayed for duplicate requests with the same key within the\nidempotency window (3 hours by default). This protection requires a workspace,\norganization, or staff-account scope. User-only and unscoped unauthenticated operations,\nstreams, and operations with a separate replay contract do not use this\nresponse replay.\n\nOn a supported operation, if idempotency protection is unavailable before execution, the API returns\n`503 IdempotencyUnavailable` (E01033) without executing this attempt. Retry with\nbackoff using the same key and request. An operation that takes effect before\nits response is retained can still execute again on retry.\n\nTwo distinct 409 errors signal misuse:\n\n- `request_in_progress` (E01004): The same key is currently being\n  processed by a concurrent request. Wait briefly and retry. The lock expires within 30 seconds.\n- `idempotency_key_reuse` (E01005): The same key has already completed\n  against a different request body or method. Generate a new key.\n\nRecommended key format is `<event-type>/<entity-id>` (for example `welcome-user/usr_abc123`).\n"
      schema:
        type: string
        maxLength: 255
    XWorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace context for the request. Required for dashboard authentication and master keys. Workspace keys and access tokens already identify their workspace; send that workspace or omit the header. A different one is rejected.
      schema:
        type: string
        pattern: ^ws_[0-9a-hjkmnp-tv-z]{26}$
    XOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Organization context for the request. Required for dashboard authentication. An API key or access token carries its own organization, so send either that organization or no header at all; a different one is rejected.
      schema:
        type: string
        pattern: ^org_[0-9a-hjkmnp-tv-z]{26}$
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Pass the API key as a bearer token in the `Authorization` header. Workspace

        keys use `bk_{region}_*`; organization master keys use `bm_{region}_*`.

        The prefix identifies the region and selects the

        API endpoint. Official Bird SDKs and the CLI derive the region from the key.

        '
    CookieAuth:
      type: apiKey
      in: cookie
      name: bird_session
      description: 'Session cookie set after signing in to the Bird dashboard. The cookie

        value is an opaque session token; no session data is stored in the cookie

        itself.

        '
    RealtimeKey:
      type: apiKey
      in: header
      name: X-Realtime-Key
      description: 'The Realtime app key. Together with `X-Realtime-Secret`, it authenticates a

        request to the Realtime API in addition to the workspace credential. Both

        values come from the app''s credentials and must belong to the calling

        workspace. Official Bird SDKs accept the pair as client configuration.

        '
    RealtimeSecret:
      type: apiKey
      in: header
      name: X-Realtime-Secret
      description: 'The Realtime app secret paired with `X-Realtime-Key`. The API returns the

        secret only when the key is created and does not store it. Create a new key

        and revoke the current key if you lose the secret. Official Bird SDKs accept

        the pair as client configuration.

        '
