      example: pt-BR
    SMSTemplateVersionStatus:
      type: string
      minLength: 1
      readOnly: true
      enum:
      - draft
      - published
      description: 'Whether the version is the editable draft or published. Published workspace versions are immutable and remain `published` after a later version goes live. A built-in template''s synthetic published version projects the current catalogue entry.

        '
      example: published
    SMSTemplateID:
      type: string
      minLength: 1
      pattern: ^smt_[0-9a-hjkmnp-tv-z]{26}$
      example: smt_01krdgeqcxet5s7t44vh8rt9mg
    SMSTemplateCategory:
      type: string
      minLength: 1
      enum:
      - transactional
      - marketing
      - authentication
      description: 'Why messages use this template. Use `authentication` for one-time codes, `marketing` for promotions, and `transactional` for service messages.

        '
    SortOrder:
      type: string
      enum:
      - asc
      - desc
      description: Sort direction, ascending or descending.
    SMSTemplateVersion:
      type: object
      additionalProperties: false
      description: 'One SMS template version with its content. A workspace template keeps one editable draft and immutable published versions. A built-in template exposes its current catalogue content as one synthetic published version.

        '
      required:
      - id
      - template_id
      - version_number
      - status
      - revision
      - variables
      - languages
      - default_language
      - created_at
      - published_at
      properties:
        id:
          readOnly: true
          description: Template version ID.
          $ref: '#/components/schemas/SMSTemplateVersionID'
        template_id:
          readOnly: true
          description: The template this version belongs to.
          $ref: '#/components/schemas/SMSTemplateID'
        version_number:
          type:
          - integer
          - 'null'
          minimum: 1
          readOnly: true
          description: Sequential publication number. Null for the draft; a built-in template reports 1.
        status:
          readOnly: true
          $ref: '#/components/schemas/SMSTemplateVersionStatus'
        revision:
          type: integer
          minimum: 0
          readOnly: true
          description: 'The version revision. A draft revision advances with each metadata or content change. Published workspace versions are frozen; a built-in template''s synthetic version reports 0.

            '
        variables:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/TemplateVariable'
          description: 'Variables inferred from the version''s text. Every language in a publishable SMS version uses the same set. Built-in templates may apply additional typed constraints described by each variable.

            '
        languages:
          type: object
          readOnly: true
          propertyNames:
            type: string
            minLength: 2
            maxLength: 35
          additionalProperties:
            $ref: '#/components/schemas/SMSTemplateVersionLanguage'
          description: Full content for each language, keyed by canonical BCP-47 tag.
        default_language:
          $ref: '#/components/schemas/LanguageTag'
          readOnly: true
          description: The language this version treats as its default.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the version was created. Null for a built-in template's synthetic version.
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the version was published. Null for the draft and for a built-in template's synthetic version.
      example:
        id: smv_01krdgeqcxet5s7t44vh8rt9mg
        template_id: smt_01krdgeqcxet5s7t44vh8rt9mg
