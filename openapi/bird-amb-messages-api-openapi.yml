    AMBNativeInboundInteractiveContent:
      type: object
      additionalProperties: false
      required:
      - type
      - interactive_data
      properties:
        type:
          const: interactive
          description: Always interactive.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Message body supplied by Apple.
          x-sensitive: true
        subject:
          type: string
          description: Message subject supplied by Apple.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments supplied by Apple.
        interactive_data:
          $ref: '#/components/schemas/AMBNativeInboundInteractiveData'
    AMBNativeInboundListPicker:
      type: object
      additionalProperties: false
      required:
      - sections
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeInboundListPickerSection'
          description: Sections returned by Apple. Sections can include unselected options; preserve their titles and item grouping.
    AMBNativeInteractiveContent:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          const: interactive
          description: Always interactive.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Automatic introductions for inline quick replies are enabled regionally in stages. When enabled for a new send containing `interactive_data.data.quick_reply`, a nonblank body is sent as separate text before the choices. Messages using `interactive_data_ref` do not receive this automatic introduction, even after activation. All parts belong to one message, which becomes sent after Apple accepts all parts. For referenced interactions, before activation, and for retries retaining legacy behavior, body is included in the interactive request and is not guaranteed to appear on the device. To ensure an introduction without relying on activation, send a separate text message and omit body from the quick reply. Omit body to send choices only. For list pickers, time pickers and forms, use interactive_data.received_message for the visible introduction. Use one U+FFFC object replacement character per attachment to control placement.
          x-sensitive: true
        subject:
          type: string
          description: Subject displayed above the message body.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments. Each object supplies a source URL or an encrypted Apple reference.
        interactive_data:
          $ref: '#/components/schemas/AMBNativeInteractiveData'
        interactive_data_ref:
          $ref: '#/components/schemas/AMBRichLinkReference'
      oneOf:
      - required:
        - interactive_data
        not:
          properties:
            interactive_data_ref: {}
          required:
          - interactive_data_ref
      - required:
        - interactive_data_ref
        not:
          properties:
            interactive_data: {}
          required:
          - interactive_data
    AMBNativeRichLinkContent:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          const: rich_link
          description: Always rich_link.
          $ref: '#/components/schemas/AMBMessageType'
        body:
          type: string
          description: Automatic introductions for rich links are enabled regionally in stages. When enabled for a new send, a nonblank body is sent as a separate text before the link. All parts belong to one message, which becomes sent after Apple accepts all parts. Before activation, and for retries retaining legacy behavior, body is included in the rich link request and is not guaranteed to appear on the device. To ensure an introduction without relying on activation, send a separate text message and omit body from the rich link. Use one U+FFFC object replacement character per attachment to control placement.
          x-sensitive: true
        subject:
          type: string
          description: Subject displayed above the message body.
          x-sensitive: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AMBNativeAttachment'
          description: Ordered attachments. Each object supplies a source URL or an encrypted Apple reference.
        rich_link_data:
          $ref: '#/components/schemas/AMBNativeRichLinkData'
        rich_link_data_ref:
          $ref: '#/components/schemas/AMBRichLinkReference'
        rich_link_construct:
          $ref: '#/components/schemas/AMBRichLinkConstruct'
      oneOf:
      - required:
        - rich_link_data
        not:
          properties:
            rich_link_data_ref: {}
            rich_link_construct: {}
          required:
          - rich_link_data_ref
          - rich_link_construct
      - required:
        - rich_link_data_ref
        not:
          properties:
            rich_link_data: {}
            rich_link_construct: {}
          required:
          - rich_link_data
          - rich_link_construct
      - required:
        - rich_link_construct
        not:
          properties:
            rich_link_data: {}
            rich_link_data_ref: {}
          required:
          - rich_link_data
          - rich_link_data_ref
    AMBTemplateID:
      type: string
      minLength: 1
      pattern: ^amt_[0-9a-hjkmnp-tv-z]{26}$
      example: amt_01krdgeqcxet5s7t44vh8rt9mg
    AMBConversationID:
      type: string
      minLength: 1
      pattern: ^acv_[0-9a-hjkmnp-tv-z]{26}$
      example: acv_01krdgeqcxet5s7t44vh8rt9mg
    AMBStatsErrorCode:
      type: string
      minLength: 1
      pattern: ^(bird:[a-z0-9_]+|apple:\d{3})$
      description: 'Machine-readable reason a send failed, in one of two namespaces: `bird:` for a reason Bird''s own pipeline assigned (for example `bird:business_not_registered`), or `apple:` followed by the HTTP status Apple''s API returned for the send attempt (for example `apple:404`). This is an open, growing set in both namespaces; accept unrecognized values.

        '
      example: bird:business_not_registered
    AMBNativeRichLinkAssets:
      type: object
      additionalProperties: false
      required:
      - image
      properties:
        image:
          $ref: '#/components/schemas/AMBNativeRichLinkImage'
        video:
          $ref: '#/components/schemas/AMBNativeRichLinkVideo'
    AMBTemplateVersionID:
      type: string
      minLength: 1
      pattern: ^amv_[0-9a-hjkmnp-tv-z]{26}$
      example: amv_01krdgeqcxet5s7t44vh8rt9mg
    AMBNativeAttachment:
      type: object
      additionalProperties: false
      description: Provide source_url or the complete encrypted reference, never both.
      properties:
        source_url:
          type: string
          minLength: 1
          description: HTTPS URL Bird downloads and uploads to Apple. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          x-sensitive: true
        name:
          type: string
          description: Display filename.
        mime_type:
          type: string
          description: Media type of the attachment.
        url:
          type: string
          format: uri
          pattern: ^https://
          minLength: 1
          description: Encrypted attachment URL returned by Apple.
        owner:
          type: string
          minLength: 1
          description: Opaque owner value returned by Apple.
        signature_base64:
          type: string
          minLength: 1
          description: Attachment authorization signature returned by Apple.
        key:
          type: string
          minLength: 66
          maxLength: 66
          pattern: ^00[0-9a-fA-F]{64}$
          description: Attachment decryption key returned by Apple.
        size:
          type: integer
          format: int64
          minimum: 1
          description: Attachment size in bytes.
          maximum: 99999999
      oneOf:
      - required:
        - source_url
        not:
          anyOf:
          - properties:
              url: {}
            required:
            - url
          - properties:
              owner: {}
            required:
            - owner
          - properties:
              key: {}
            required:
            - key
          - properties:
              signature_base64: {}
            required:
            - signature_base64
          - properties:
              size: {}
            required:
            - size
      - required:
        - url
        - owner
        - key
        - signature_base64
        - size
        not:
          properties:
            source_url: {}
          required:
          - source_url
    AMBListPickerSection:
      type: object
      additionalProperties: false
      required:
      - title
      - items
      properties:
        title:
          type: string
          minLength: 1
          description: Heading shown above this section's rows.
        order:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Where this section sits relative to its siblings, ascending. Sections omitting it are laid out in list order, after any that specify one.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AMBListPickerItem'
          description: The rows in this section.
        multiple_selection:
          type: boolean
          default: false
          description: Whether the customer can select more than one row in this section.
    MessageCost:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - amount
      - currency_code
      - transaction_amount
      - passthrough_amount
      description: 'What was charged for a message, split into the components that make it up. `null` until at least one component has been priced.

        '
      properties:
        amount:
          type: string
          minLength: 1
          readOnly: true
          description: 'Total charged, as a decimal string: the sum of the components below. Net of tax, which applies to your wallet balance rather than to an individual charge.

            '
          example: '0.00990'
        currency_code:
          readOnly: true
          $ref: '#/components/schemas/CurrencyCode'
          description: ISO 4217 currency code. Every component is denominated in this currency.
          example: USD
        transaction_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'What we charged to carry the message, as a decimal string. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00790'
        passthrough_amount:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Third-party fees we pass on, as a decimal string, such as US 10DLC carrier surcharges. `null` when this component was not priced; `"0.00000"` when it priced at zero.

            '
          example: '0.00200'
    NextAction:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      properties:
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
          - operation
          - external
          - wait
          - terminal
          description: "What you do about this step.\n\n- `operation`: call the operation named in `operation`, then\n  read again.\n- `external`: act somewhere this API does not reach, then read\n  again.\n- `wait`: nothing is asked of you, so read again later.\n- `terminal`: nothing you do resolves this, so stop retrying.\n\nTolerate a value you do not recognize: show the `description` and\noffer no action.\n"
        description:
          type: string
          minLength: 1
          description: A short, human-readable label for the step, suitable for display.
        operation:
          type: string
          minLength: 1
          description: 'The operationId to call. Present only when `kind` is `operation`. The operation''s own schema says how to call it; this says only which one, and what to address it with.

            '
        params:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          description: 'The parameters that address the operation, by name: `{"sender_id": "…"}` for an operation on `/v1/sms/senders/{sender_id}/requirements`. A parameter the operation takes in its query string is given the same way, so an operation addressed as `?subject_id=` carries `{"subject_id": "…"}`. Every parameter the call needs is here, whether its value came from the thing you were acting on or is fixed for this step, so you can make the call from this object alone. Present only when `kind` is `operation` and the operation names a subject. A request body, when the operation takes one, is described by the operation''s own schema and never appears here.

            '
        url:
          type: string
          format: uri
          description: 'A URL to open. Present only when `kind` is `external`, and only when the step has one. An external step whose `description` says to go and do something with no URL to open is normal.

            '
    AMBFormPageType:
      type: string
      minLength: 1
      enum:
      - select
      - picker
      - date_picker
      - input
    AMBRichLinkReference:
      type: object
      additionalProperties: false
      required:
      - url
      - owner
      - signature_base64
      - size
      description: Reusable Apple content reference. Supply the decryption key, or the signed bid and data_ref_sig returned by Apple.
      properties:
        title:
          type: string
          minLength: 1
          description: Title supplied by Apple for the preview.
        bid:
          type: string
          minLength: 1
          description: Messages extension identifier supplied by Apple, when present.
        data_ref_sig:
          type: string
          minLength: 1
          description: Signature binding the reference to the business, when supplied by Apple.
        url:
          type: string
          format: uri
          pattern: ^https://
          minLength: 1
          description: Location of the encrypted preview.
        owner:
          type: string
          minLength: 1
          description: Owner identifier supplied by Apple.
        signature_base64:
          type: string
          minLength: 1
          description: Signature supplied by Apple.
        key:
          type: string
          minLength: 66
          maxLength: 66
          pattern: ^00[0-9a-fA-F]{64}$
          description: Decryption key supplied by Apple.
        size:
          type: integer
          format: int64
          minimum: 1
          description: Size of the encrypted preview in bytes.
      anyOf:
      - required:
        - key
      - required:
        - bid
        - data_ref_sig
      x-sensitive: true
    AMBMessageEventType:
      type: string
      minLength: 1
      description: 'Message timeline event type:


        - `amb.accepted`: The API accepted the request.

        - `amb.sent`: The message was handed to Apple.

        - `amb.send_failed`: Apple refused the message, or its send attempts were exhausted.

        - `amb.rejected`: Bird refused the message before any send attempt.

        - `amb.received`: An inbound message arrived from the customer.


        This is an open enum. Accept unrecognized values.

        '
      x-extensible-enum:
      - amb.accepted
      - amb.sent
      - amb.send_failed
      - amb.rejected
      - amb.received
      example: amb.sent
    AMBNativeDynamic:
      type: object
      additionalProperties: false
      required:
      - data
      description: Form content. Bird supplies Apple’s messageForms template and protocol version.
      properties:
        data:
          $ref: '#/components/schemas/AMBNativeFormData'
    AMBError:
      type:
      - object
      - 'null'
      additionalProperties: false
      readOnly: true
      required:
      - code
      - description
      - occurred_at
      description: Failure detail for a message or invitation that could not be sent or was rejected.
      properties:
        code:
          $ref: '#/components/schemas/AMBStatsErrorCode'
        description:
          type: string
          minLength: 1
          description: The failure in words. Free-form, so branch on `code` and show this to a human.
          example: Apple refused the message with HTTP status 404.
        occurred_at:
          type: string
          format: date-time
          minLength: 1
          description: When the failure occurred.
    AMBInboundFormItem:
      type: object
      additionalProperties: false
      required:
      - identifier
      - type
      - title
      - value
      properties:
        identifier:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/AMBFormPageType'
        title:
          type: string
          minLength: 0
          x-sensitive: true
          description: Display value Apple returned, including any input prefix. May be empty for an optional input.
        value:
          type: string
          minLength: 0
          x-sensitive: true
          description: Machine value Apple returned for the selection or input. May be empty for an optional input.
    AMBFormDatePickerOptions:
      type: object
      additionalProperties: false
      description: Apple defaults to UTC when interpreting these dates.
      properties:
        date_format:
          type: string
          minLength: 1
          description: Format used to read the date values in these options. Defaults to `MM/dd/yyyy`.
        start_date:
          type: string
          minLength: 1
          description: Date initially shown by the picker, written in `date_format`. Defaults to the current date.
        maximum_date:
          type: string
          minLength: 1
          description: Latest date the picker shows, written in `date_format`. Defaults to the current date.
        minimum_date:
          type: string
          minLength: 1
          description: Earliest date the picker shows, written in `date_format`.
        label_text:
          type: string
          description: Label beside the date field. Defaults to `Date`.
    AMBFormSplash:
      type: object
      additionalProperties: false
      required:
      - button_title
      properties:
        header:
          type: string
        splash_text:
          type: string
        button_title:
          type: string
          minLength: 1
        image_identifier:
          type: string
          minLength: 1
    AMBNativeAuthentication:
      type: object
      additionalProperties: false
      readOnly: true
      description: Authentication attempt created through the conversation authentication endpoint. Contains no authorization parameters or credentials.
      required:
      - authentication_id
      properties:
        authentication_id:
          readOnly: true
          $ref: '#/components/schemas/AMBAuthenticationID'
    AMBTimeSlot:
      type: object
      additionalProperties: false
      required:
      - identifier
      - start_at
      - duration_seconds
      properties:
        identifier:
          type: string
          minLength: 1
          description: Opaque slot identifier. Apple may instead return only a localized label in interactive_data.reply_message.title.
        start_at:
          type: string
          format: date-time
          minLength: 1
          description: When this slot begins. Seconds and fractional seconds must be zero, for example `2026-09-02T14:30:00Z`; otherwise sending returns `422` with error code `E01001`. The timestamp is converted to UTC for Apple while preserving the instant.
        duration_seconds:
          type: integer
          minimum: 0
          description: Duration in seconds. Zero indicates no duration.
    AMBNativeInboundPayload:
      type: object
      additionalProperties: false
      properties:
        request_identifier:
