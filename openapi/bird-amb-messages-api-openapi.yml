      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    AMBNativePayment:
      type: object
      additionalProperties: false
      readOnly: true
      description: Apple Pay request created through the conversation payment endpoint. Contains no payment token or provider credentials.
      required:
      - payment_id
      properties:
        payment_id:
          readOnly: true
          $ref: '#/components/schemas/AMBPaymentID'
    AMBTemplateContentHash:
      type: string
      minLength: 1
      readOnly: true
      description: 'A fingerprint of Apple Messages template content, prefixed with its algorithm. Compare it within this API version to identify the exact source without transferring it.

        '
      example: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    Tag:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      description: 'Structured key/value label attached to a message or a call. Use tags for low-cardinality filtering dimensions (category, experiment ID, template ID); they surface in the list filter of whatever carries them.


        On a message they also surface in the event log and in webhook payloads, and a message can carry `metadata` beside them for arbitrary per-send context that does not need to be filterable. A call has none of those three: its tags are set on the wire when the call is placed, and the call record is the one place you read them back.


        Whatever carries the tags defines how many it may have. Tag names are unique: a send that repeats one is rejected, and on a call the first instance of a name wins.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag name. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 32 characters.

            '
          example: category
        value:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Tag value. ASCII letters, digits, underscore, and hyphen only. Case-sensitive. Maximum 64 characters.

            '
          example: welcome
    AMBNativeInboundImage:
      type: object
      additionalProperties: false
      required:
      - identifier
      - download_url
      properties:
        identifier:
          type: string
          description: Identifier used by the received message.
          minLength: 1
        description:
          type: string
          description: Accessibility description supplied by Apple.
          x-sensitive: true
        download_url:
          type: string
          description: Relative Bird API URL for downloading the image with the same authentication and workspace as the message.
          format: uri-reference
          minLength: 1
    AMBFormPageCommon:
      type: object
