openapi: 3.2.0
info:
  title: Bird Amb Messages API
  version: 1.0.0
  description: 'Build communications into your applications and AI workflows with the Bird API.

    Explore endpoints for email, SMS, WhatsApp, verification, and realtime messaging.


    Start with the developer documentation, browse the

    API reference, or connect your agent through the

    Bird MCP server.


    Setting a `User-Agent` header is recommended but not required. Official Bird

    SDKs set it automatically (format: `bird-/`). The header is

    used for operational logging and customer-support diagnostics; the API never

    rejects requests that omit it.


    Rate limits are advertised on every response from a rate-limited endpoint as

    IETF `RateLimit` and `RateLimit-Policy` headers (Structured Fields per RFC

    9651; spec draft-ietf-httpapi-ratelimit-headers-11). On 429 responses, a

    `Retry-After` header in seconds is also returned. Clients should pace

    themselves against the `r` (remaining) and `t` (seconds until reset) params

    in the `RateLimit` header rather than only reacting to 429s.


    The deprecation policy explains how

    the API marks a deprecated field, query parameter, or body shape, including

    the `Deprecation` response header (RFC 9745).'
servers:
- url: https://{region}.platform.bird.com
  description: 'Regional API endpoint. Use the host for the region your organization is hosted in. Official Bird SDKs and the CLI select it automatically from your API key, so you rarely need to set it by hand.

    '
  variables:
    region:
      default: us1
      enum:
      - us1
      - eu1
      description: The region your organization's data is hosted in.
- url: https://platform.bird.com
  description: Region-independent endpoint for authentication and account administration.
- url: http://localhost:8080
  description: Local development.
security:
- BearerAuth: []
tags:
- name: amb-messages
  description: Send Apple Messages for Business messages into a conversation a customer opened, and read the messages your workspace sent and received, including their status and lifecycle events.
paths:
  /v1/amb/messages/{message_id}/attachments/{index}:
    get:
      operationId: getAMBMessageAttachment
      summary: Get a message attachment
      description: 'Downloads the attachment at the zero-based `index` in a message''s

        `content.attachments` array and returns its decrypted bytes with the

        media type the attachment declares. A declared PNG, JPEG, GIF or WebP

        type is kept only when the bytes match it; a missing, malformed or

        mismatched type returns `application/octet-stream`. The

        `Content-Disposition` header carries the original filename.

        Works for attachments a customer sent and for attachments

        you sent. For a received attachment, `message_id` is the `message.id`

        of the `amb.received` webhook event, and `index` is the attachment''s

        position in that message''s `content.attachments` array.


        Apple retains an attachment for 30 days, renewed each time its reference

        is reused; availability after that period is not guaranteed, so download

        an attachment when the message arrives rather than on demand later. An unknown message or

        index returns `404`; an unavailable or expired Apple reference returns

        `503`.'
      tags:
      - amb-messages
      x-audiences:
      - dashboard
      - public
      - command
      x-snippet-key: none
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        description: Message identifier. Starts with `amb_`. For a received attachment, use the `message.id` from the `amb.received` webhook event.
        schema:
          $ref: '#/components/schemas/AMBMessageID'
      - name: index
        in: path
        required: true
        description: Zero-based position in the message's `content.attachments` array.
        schema:
          type: integer
          minimum: 0
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: The raw attachment bytes.
          headers:
            Content-Disposition:
              description: 'Downloads the attachment with its original filename.

                '
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
  /v1/amb/messages:
    get:
      operationId: listAMBMessages
      x-snippet-key: amb.list
      summary: List messages
      description: 'Returns your business''s Apple Messages for Business messages across

        conversations, newest first, both received and sent. To page through

        older messages, use `starting_after`. Messages do not expire based on age.


        To list messages within a single conversation, use

        `listAMBConversationMessages`.'
      tags:
      - amb-messages
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - name: conversation_id
        in: query
        required: false
        description: Filter to messages belonging to this conversation.
        schema:
          $ref: '#/components/schemas/AMBConversationID'
      - name: business_account_id
        in: query
        required: false
        description: Filter to messages belonging to this business.
        schema:
          $ref: '#/components/schemas/AMBBusinessID'
      - name: direction
        in: query
        required: false
        description: Filter to received (`inbound`) or sent (`outbound`) messages.
        schema:
          $ref: '#/components/schemas/AMBMessageDirection'
      - name: status
        in: query
        required: false
        description: Filter to messages with this status.
        schema:
          $ref: '#/components/schemas/AMBMessageStatus'
      - name: kind
        in: query
        required: false
        description: Filter to messages whose content is this shape.
        schema:
          $ref: '#/components/schemas/AMBContentKind'
      - name: category
        in: query
        required: false
        description: Filter to outbound messages sent with this category, exact match.
        schema:
          type: string
          maxLength: 64
        example: order_update
      - $ref: '#/components/parameters/TagFilter'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Paginated list of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBMessageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
    post:
      operationId: createAMBMessage
      x-snippet-key: amb.send
      summary: Send a message
      description: 'Send a message in an existing Apple Messages for Business conversation. `from` is the Apple business identifier and `to` is the customer’s opaque identifier for that business. An unknown conversation returns 404; a closed conversation returns 422. Only the customer can reopen a conversation.


        Choose text, rich_link, or interactive content. Interactive content contains a quick reply, list picker, event, form, or custom iMessage app. Native payment and authentication requests are not available through this public operation. Device support varies; an unsupported interaction returns 422.


        Supply attachment URLs or reusable Apple references. Bird downloads source URLs and uploads the files before sending. Interactive images must be PNG files up to 200 kB each, totaling at most 5 MB. Each attachment must be smaller than 100 MB. A media or provider failure after acceptance changes the message status to send_failed.


        The 202 response confirms acceptance, not delivery. Read the message to obtain its final status and any reusable reference returned by Apple.'
      tags:
      - amb-messages
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XOrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMBMessageSendRequest'
            examples:
              text:
                summary: A plain text message
                value:
                  content:
                    type: text
                    body: Your order shipped and will arrive tomorrow.
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
              quick-reply:
                summary: Two quick-reply buttons
                value:
                  content:
                    type: interactive
                    interactive_data:
                      data:
                        quick_reply:
                          summary_text: Would you like to reschedule?
                          items:
                          - identifier: reschedule
                            title: Reschedule
                          - identifier: keep
                            title: Keep as is
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
              rich-link:
                summary: A link with an image preview
                value:
                  content:
                    type: rich_link
                    rich_link_data:
                      url: https://example.com/orders/123
                      title: Your order
                      assets:
                        image:
                          source_url: https://media.example.com/order.png
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
              attachment:
                summary: A PDF attachment
                value:
                  content:
                    type: text
                    body: 'Your receipt

                      ￼'
                    attachments:
                    - source_url: https://media.example.com/receipt.pdf
                      name: receipt.pdf
                      mime_type: application/pdf
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
              list-picker:
                summary: A menu with multiple selections
                value:
                  content:
                    type: interactive
                    interactive_data:
                      received_message:
                        title: Browse topics
                        style: large
                      reply_message:
                        title: Selected topics
                        style: small
                      data:
                        list_picker:
                          sections:
                          - title: Topics
                            multiple_selection: true
                            items:
                            - identifier: products
                              title: Products
                            - identifier: support
                              title: Support
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
              time-picker:
                summary: Two appointment times
                value:
                  content:
                    type: interactive
                    interactive_data:
                      data:
                        event:
                          timeslots:
                          - identifier: morning
                            start_at: '2026-09-10T09:00:00Z'
                            duration_seconds: 1800
                          - identifier: afternoon
                            start_at: '2026-09-10T14:00:00Z'
                            duration_seconds: 1800
                          title: Choose an appointment
                          location:
                            title: Online consultation
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
              form:
                summary: A short satisfaction survey
                value:
                  content:
                    type: interactive
                    interactive_data:
                      received_message:
                        title: Tell us how we did
                      reply_message:
                        title: Feedback submitted
                      data:
                        dynamic:
                          data:
                            start_page_identifier: feedback
                            show_summary: true
                            pages:
                            - type: select
                              page_identifier: feedback
                              subtitle: Was your question answered?
                              submit_form: true
                              items:
                              - identifier: 'yes'
                                title: 'Yes'
                                value: 'yes'
                              - identifier: 'no'
                                title: 'No'
                                value: 'no'
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
              imessage-app:
                summary: Open a business's iMessage app
                value:
                  content:
                    type: interactive
                    interactive_data:
                      received_message:
                        title: View your order
                      reply_message:
                        title: Order selected
                      app_id: '123456789'
                      app_name: Acme Service
                      bid: com.apple.messages.MSMessageExtensionBalloonPlugin:ABCDE12345:com.example.acme.messages
                      url: ?order=123
                      use_live_layout: true
                      app_icon_source_url: https://media.example.com/app-icon.png
                  from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
                  to: the-opaque-user-id-from-the-conversation
      responses:
        '202':
          description: Message accepted for asynchronous delivery.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/messages/{message_id}:
    parameters:
    - name: message_id
      in: path
      required: true
      description: Message identifier. Starts with `amb_`.
      schema:
        $ref: '#/components/schemas/AMBMessageID'
    get:
      operationId: getAMBMessage
      x-snippet-key: amb.get
      summary: Get a message
      description: 'Returns a single Apple Messages for Business message: its current status, the content it carries, and failure detail when it failed. There is no delivery or read receipt on this channel, so an outbound message''s `status` advances only as far as `sent`. For the per-event timeline, use `listAMBMessageEvents` instead. Messages do not expire based on age.'
      tags:
      - amb-messages
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      x-surfaces:
      - cli
      - mcp
      - sdk
  /v1/amb/messages/{message_id}/events:
    parameters:
    - name: message_id
      in: path
      required: true
      description: Message identifier. Starts with `amb_`.
      schema:
        $ref: '#/components/schemas/AMBMessageID'
    get:
      operationId: listAMBMessageEvents
      x-snippet-key: amb.list_events
      summary: List events for a message
      description: Returns a message's lifecycle events in chronological order, one entry per status transition (`amb.accepted`, `amb.sent`, `amb.send_failed`, `amb.received`). The timeline is bounded and returned in full, so this list is not paginated. Event history does not expire based on age.
      tags:
      - amb-messages
      security:
      - BearerAuth: []
      - CookieAuth: []
      x-audiences:
      - dashboard
      - public
      - command
      parameters:
      - name: type
        in: query
        required: false
        description: 'Keep only events of this exact type (for example `amb.sent` or `amb.send_failed`). Omit for the full timeline.

          '
        schema:
          $ref: '#/components/schemas/AMBMessageEventType'
      - $ref: '#/components/parameters/XWorkspaceId'
      - $ref: '#/components/parameters/XOrganizationId'
      responses:
        '200':
          description: Event timeline for this message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMBMessageEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-surfaces:
      - cli
      - mcp
      - sdk
components:
  schemas:
    AMBRichLinkConstruct:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          minLength: 1
          description: The App Clip, Apple Music, or Apple Maps URL to build a preview for. An `http://` URL is refused with a `422` `AMBEndpointNotHTTPS`. A URL Apple cannot build a preview for is refused with a `422` `AMBConstructPayloadFailed`; send `rich_link` content with your own `title` and `image` instead.
          example: https://apps.apple.com/app/id123456789?clip=1
          x-sensitive: true
        store_region:
          $ref: '#/components/schemas/CountryCode'
          description: App Store storefront used to build an App Clip preview. Defaults to `US` when omitted.
      description: Asks Apple to build the rich link preview when the message is sent, rather than through a prior `POST /v1/amb/messages/construct-payload` call. No caller holds a signed reference until the send itself resolves one.
    AMBNativeInboundQuickReply:
      type: object
      additionalProperties: false
      required:
      - selected_identifier
      properties:
        selected_identifier:
          type: string
          description: Identifier selected by the customer.
          minLength: 1
        selected_index:
          type: integer
          minimum: 0
          description: Index reported by Apple.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AMBQuickReplyItem'
          description: Items returned by the customer device.
    AMBFormPickerPage:
      allOf:
      - $ref: '#/components/schemas/AMBFormPageCommon'
      - type: object
        required:
        - type
        - items
        properties:
          type:
            type: string
            minLength: 1
            const: picker
          picker_title:
            type: string
            description: Text beside the picker field. Omit to center the field without a label.
          selected_item_index:
            type: integer
            minimum: 0
            description: Zero-based index into `items`. Defaults to `0`. Must be less than the number of items; otherwise sending returns `422` `AMBFormPagesInvalid`.
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AMBFormPickerItem'
      unevaluatedProperties: false
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: ISO 4217 three-letter currency code.
      example: EUR
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      - message
      - doc_url
      - request_id
      properties:
        type:
          type: string
          minLength: 1
          description: Broad category for coarse client branching.
          enum:
          - auth_error
          - bad_request_error
          - billing_error
          - client_closed_request_error
          - conflict_error
          - gone_error
          - internal_error
          - misdirected_error
          - not_found_error
          - not_implemented_error
          - payload_too_large_error
          - permission_error
          - precondition_error
          - rate_limit_error
          - service_unavailable_error
          - too_early_error
          - validation_error
        code:
          type: string
          minLength: 1
          pattern: ^E\d{5}$
          description: Opaque, stable, unique error identifier. Never reused.
        name:
          type: string
          minLength: 1
          description: Human-readable slug for log readability. Paired with code, never replaces it.
        message:
          type: string
          minLength: 1
          description: Human-readable description. Not stable; clients must not parse it.
        param:
          type: string
          minLength: 1
          description: Identifies the offending field. Omitted when not applicable.
        doc_url:
          type: string
          minLength: 1
          format: uri
          description: Stable link to the docs page for this error code.
        request_id:
          type: string
          minLength: 1
          description: Request correlation ID for support and troubleshooting. Also returned in the `X-Request-Id` response header.
        vendor_code:
          type: string
          minLength: 1
          description: 'Verbatim error code from an external system, such as an SMTP response code or a payment decline code. Present only when the code may help you resolve the error.

            '
        details:
          type: array
          description: Per-field validation errors. Present only on validation_error responses.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        remediation:
          type: string
          minLength: 1
          description: A human-readable next step to resolve this error. Present when a recovery is known.
        next:
          type: array
          description: 'The steps that resolve this error. Perform them in order, re-reading after each; a `wait` or `terminal` step is always last. Present for errors with a well-defined recovery, such as unmet preconditions and conflicts.

            '
          items:
            $ref: '#/components/schemas/NextAction'
    AMBNativeInboundDynamic:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AMBNativeInboundFormData'
    AMBNativeInboundInteractiveData:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          description: Custom app identifier.
        app_name:
          type: string
          description: Custom app name.
        bid:
          type: string
          description: Apple extension identifier.
        url:
          type: string
          description: Opaque custom app response URL.
          x-sensitive: true
        use_live_layout:
          type: boolean
          description: Whether the app uses live layout.
        session_identifier:
          type: string
          description: Apple interaction session identifier.
        reply_message:
          $ref: '#/components/schemas/AMBMessageBubble'
        received_message:
          $ref: '#/components/schemas/AMBMessageBubble'
        data:
          $ref: '#/components/schemas/AMBNativeInboundPayload'
        app_icon_url:
          type: string
          description: Relative Bird API URL for downloading the custom app icon with the same authentication and workspace as the message.
          format: uri-reference
    AMBMessageDirection:
      type: string
      minLength: 1
      enum:
      - outbound
      - inbound
      description: 'Whether a message was sent by the business or received from the customer:


        - `outbound`: A reply the business sent into the conversation.

        - `inbound`: A message the customer sent.

        '
    AMBNativeInteractiveData:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          minLength: 1
          description: App Store identifier of the iMessage app.
        app_name:
          type: string
          minLength: 1
          description: Name of the iMessage app.
        bid:
          type: string
          minLength: 1
          description: Identifier of the iMessage extension, in Apple's `com.apple.messages.MSMessageExtensionBalloonPlugin:team-id:extension-id` format.
        url:
          x-sensitive: true
          type: string
          minLength: 1
          description: Opaque URL string that Messages passes to the iMessage app.
          example: ?order=1234&view=detail
        use_live_layout:
          type: boolean
          description: Whether Messages renders the received and reply bubbles using Live Layout.
        session_identifier:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Session UUID to preserve across interactions. Apple creates one when omitted.
        received_message:
          $ref: '#/components/schemas/AMBMessageBubble'
          description: Content Messages shows in the received message bubble.
        reply_message:
          $ref: '#/components/schemas/AMBMessageBubble'
          description: Content Messages shows in the reply message bubble.
        app_icon_source_url:
          type: string
          minLength: 1
          description: Publicly accessible HTTPS URL of the app's PNG icon. The icon must be smaller than 15 kB. We fetch and include it in the request to Apple. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          x-sensitive: true
        data:
          $ref: '#/components/schemas/AMBNativeInteractivePayload'
      description: A built-in interaction or custom iMessage app. Custom apps require the app metadata and both message bubbles.
      oneOf:
      - required:
        - data
        not:
          anyOf:
          - properties:
              app_id: {}
            required:
            - app_id
          - properties:
              app_name: {}
            required:
            - app_name
          - properties:
              bid: {}
            required:
            - bid
          - properties:
              url: {}
            required:
            - url
          - properties:
              app_icon_source_url: {}
            required:
            - app_icon_source_url
          - properties:
              use_live_layout: {}
            required:
            - use_live_layout
      - required:
        - app_id
        - app_name
        - bid
        - url
        - app_icon_source_url
        - use_live_layout
        - received_message
        - reply_message
        not:
          properties:
            data: {}
          required:
          - data
    AMBNativeInboundAuthentication:
      type: object
      additionalProperties: false
      x-sensitive: true
      properties:
        status:
          type: string
          description: Authentication status reported by Apple. This does not establish an authenticated Bird session.
    TemplateSlug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$
      description: 'A template''s slug: what you send it by, for example `welcome-email`. Email and SMS slugs stay fixed after creation. WhatsApp slugs can change only before the first submission. A slug can contain lowercase letters, numbers, hyphens, and underscores, has to start and end with a letter or a number, and can be up to 63 characters long.

        '
      example: welcome-email
    AMBNativeInboundListPickerSection:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        title:
          type: string
          minLength: 1
          description: Heading shown above this section's rows.
        order:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Where this section sits relative to its siblings, ascending. Sections omitting it are laid out in list order, after any that specify one.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AMBListPickerItem'
          description: The rows in this section.
        multiple_selection:
          type: boolean
          default: false
          description: Whether the customer can select more than one row in this section.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - param
      - message
      properties:
        param:
          type: string
          minLength: 1
          description: 'Dotted field path, such as `to[0].email`, `subject`, or `.`. When the request was rejected for a query parameter the endpoint does not declare, this carries that parameter''s name instead of a field path.

            '
        message:
          type: string
          minLength: 1
          description: What is wrong with this field.
    AMBMessageStatus:
      type: string
      minLength: 1
      enum:
      - accepted
      - sent
      - send_failed
      - rejected
      - received
      description: "Send status:\n\n- `accepted`: Accepted and queued for delivery to Apple.\n- `sent`: Handed to Apple. There is no delivery or read receipt on this\n  channel, so `sent` is the furthest an outbound message's status\n  advances.\n- `send_failed`: Sending stopped because of a business or conversation\n  restriction, a recipient opt-out, an Apple refusal, or exhausted attempts.\n  An earlier attempt may have reached Apple if its response or the local\n  record of success was lost. See `last_error` for why sending stopped.\n- `rejected`: Refused by Bird before any send attempt and never charged:\n  the destination has no price, the wallet could not fund the send, or the\n  content cannot be sent yet. See `last_error`.\n- `received`: Received as an inbound message.\n"
    AMBMessageBubbleStyle:
      type: string
      enum:
      - icon
      - small
      - large
      description: Layout of an Apple interactive message bubble.
    AMBFormInputPage:
      allOf:
      - $ref: '#/components/schemas/AMBFormPageCommon'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            minLength: 1
            const: input
          hint_text:
            type: string
          options:
            $ref: '#/components/schemas/AMBFormInputOptions'
      unevaluatedProperties: false
    AMBNativeImage:
      type: object
      additionalProperties: false
      required:
      - identifier
      - source_url
      properties:
        identifier:
          type: string
          description: Identifier referenced by a bubble, item, or event.
          minLength: 1
        source_url:
          type: string
          description: HTTPS URL of a PNG image up to 200 kB. Total interactive image data must not exceed 5 MB. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          minLength: 1
          x-sensitive: true
        description:
          type: string
          description: Accessibility description read by VoiceOver.
          x-sensitive: true
    AMBAuthenticationID:
      type: string
      minLength: 1
      pattern: ^amauth_[0-9a-hjkmnp-tv-z]{26}$
      example: amauth_01krdgeqcxet5s7t44vh8rt9mg
    AMBLocation:
      type: object
      additionalProperties: false
      dependentRequired:
        latitude:
        - longitude
        longitude:
        - latitude
      properties:
        title:
          type: string
          description: Name shown for the appointment location.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude in degrees. Set together with `longitude`.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude in degrees. Set together with `latitude`.
        radius:
          type: number
          format: double
          minimum: 0
          description: Location radius in meters. Apple ignores it without coordinates.
    AMBMessageBubble:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Text shown on the message bubble.
        subtitle:
          type: string
          maxLength: 512
          description: Secondary text shown below the title.
        style:
          $ref: '#/components/schemas/AMBMessageBubbleStyle'
          description: Bubble layout. Apple defaults to `icon` when omitted and ignores it for custom iMessage apps.
        image_identifier:
          type: string
          minLength: 1
          description: Identifier of an image in interactive_data.data.images. Apple ignores it for custom iMessage apps.
        image_title:
          type: string
          maxLength: 512
          description: Title shown over an attached image in a custom iMessage app bubble.
        image_subtitle:
          type: string
          maxLength: 512
          description: Subtitle shown over an attached image in a custom iMessage app bubble.
        secondary_subtitle:
          type: string
          maxLength: 512
          description: Right-aligned title in a custom iMessage app bubble.
        tertiary_subtitle:
          type: string
          maxLength: 512
          description: Right-aligned subtitle in a custom iMessage app bubble.
    AMBFormDatePickerPage:
      allOf:
      - $ref: '#/components/schemas/AMBFormPageCommon'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            minLength: 1
            const: date_picker
          hint_text:
            type: string
          options:
            $ref: '#/components/schemas/AMBFormDatePickerOptions'
      unevaluatedProperties: false
    AMBMessageList:
      allOf:
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            description: Page of Apple Messages for Business messages, newest first.
            items:
              $ref: '#/components/schemas/AMBMessage'
      - $ref: '#/components/schemas/_ListEnvelope'
    AMBInboundFormSelection:
      type: object
      additionalProperties: false
      required:
      - page_identifier
      - title
      - subtitle
      - items
      properties:
        page_identifier:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 0
          description: Page title returned by Apple. Empty when the page has no title.
        subtitle:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/AMBInboundFormItem'
    AMBFormInputOptions:
      type: object
      additionalProperties: false
      properties:
        regex:
          type: string
          minLength: 1
          description: Pattern Apple uses to validate the input. Use JSON string escaping for backslashes.
        placeholder:
          type: string
          description: Shown when the field is empty. Defaults to `Required` when `required` is true, otherwise `Optional`.
        required:
          type: boolean
          default: false
          description: Disables the next-page button until the customer enters a value.
        input_type:
          $ref: '#/components/schemas/AMBFormInputType'
          description: Defaults to `singleline`.
        label_text:
          type: string
          description: Label for `singleline` input only. Omit for no label.
        prefix_text:
          type: string
          description: Text beside `singleline` input only, such as a currency symbol. Omit for no prefix.
        maximum_character_count:
          type: integer
          minimum: 1
          description: Defaults to 30 for `singleline` input and 300 for `multiline` input.
        keyboard_type:
          $ref: '#/components/schemas/AMBFormKeyboardType'
          description: Keyboard to display. Defaults to `default`.
        text_content_type:
          $ref: '#/components/schemas/AMBFormTextContentType'
          description: Content hint used for autofill.
    LanguageTag:
      type: string
      minLength: 2
      maxLength: 35
      description: A language tag in BCP-47 form, for example `en` or `pt-BR`.
      example: pt-BR
    AMBNativeInboundPayment:
      type: object
      additionalProperties: false
      x-sensitive: true
      properties:
        state:
          type: string
          description: Payment state reported by Apple. This does not confirm that a payment settled.
    AMBQuickReplyItem:
      type: object
      additionalProperties: false
      required:
      - identifier
      - title
      properties:
        identifier:
          type: string
          minLength: 1
          description: Opaque choice identifier returned in interactive_data.data.quick_reply.selected_identifier.
        title:
          type: string
          minLength: 1
          description: Label shown on the button.
    AMBNativeRichLinkData:
      type: object
      additionalProperties: false
      required:
      - url
      - title
      - assets
      properties:
        url:
          type: string
          description: HTTPS URL opened by the preview. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          minLength: 1
          x-sensitive: true
        title:
          type: string
          description: Preview title.
          minLength: 1
        assets:
          $ref: '#/components/schemas/AMBNativeRichLinkAssets'
    AMBMessageSendRequest:
      type: object
      additionalProperties: false
      description: 'A message to send. Supply exactly one of `content` (native content) or `template` (a stored template, whose category is derived). Supplying both, or neither, is rejected.

        '
      required:
      - from
      - to
      anyOf:
      - required:
        - content
      - required:
        - template
      not:
        anyOf:
        - required:
          - content
          - template
          properties:
            content: {}
            template: {}
        - required:
          - template
          - category
          properties:
            template: {}
            category: {}
      properties:
        from:
          type: string
          minLength: 1
          description: Apple business identifier of the brand sending the message. Read it from the business’s apple_business_id. The customer must have opened the conversation with this business.
          example: b52d6267-2b62-4f8a-8842-0533d0f1dc07
        to:
          example: opaque-customer-id
          type: string
          minLength: 1
          description: Apple’s opaque customer identifier for this business, available as the conversation’s recipient.opaque_user_id. The conversation must exist and its native status must be open.
        source:
          $ref: '#/components/schemas/AMBMessageSource'
          description: Who this message is sent as. A signed-in session may send as `operator` or `automation`; an API key may send as `api` or `automation`. Omit it to take the default for your credential. Naming a source your credential cannot use is refused with a `422` `AMBMessageSourceNotPermitted`.
        content:
          $ref: '#/components/schemas/AMBMessageContent'
          description: Message content in Apple’s native text, rich_link, or interactive family. Required unless `template` is supplied (the two are mutually exclusive).
          x-sensitive: true
        template:
          allOf:
          - $ref: '#/components/schemas/AMBTemplateSend'
          description: 'Send using a stored template instead of native content. The category is derived from the template, so `category` is rejected alongside it.

            '
        category:
          type: string
          maxLength: 64
          description: Free-form reporting label; it does not change sending or suppression policy, for example `order_update`. Omit it to send with the default empty category. Rejected alongside `template`, where the category is derived from the template.
          example: order_update
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSON object for per-message context. Maximum 2 KB serialized. Top-level keys beginning with `__bird` are reserved. Returned in the send response, message reads and customer message webhooks.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          maxItems: 20
          description: Structured `{name, value}` labels for filtering. Maximum 20 tags per send.
        group:
          type: string
          description: Department identifier for this message.
        intent:
          type: string
          description: Purpose of this conversation.
        locale:
          type: string
          description: Apple locale identifier, for example en_US. Defaults to the conversation locale.
      example:
        from: b52d6267-2b62-4f8a-8842-0533d0f1dc07
        to: opaque-customer-id
        content:
          type: text
          body: Your order is ready.
    _ListEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      - refresh_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page. Pass back as `starting_after` to advance forward. `null` when no next page exists.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE0OjAzOjEwWlwiIiwiaSI6IjAxOTJmM2IxLTRjN2UtN2EyYi05ZDYxLThmM2E1YzJlN2I0MCJ9
        prev_cursor:
          type:
          - string
          - 'null'
          description: Cursor for the previous page. Pass back as `ending_before` to step backward. `null` when no previous page exists.
          example: null
        refresh_cursor:
          type:
          - string
          - 'null'
          description: Refresh anchor, the first row of this response. Pass back as `ending_before` to fetch what precedes it in the current sort order. On a newest-first sort those are the items that have appeared since; on any other sort they are the items that sort earlier, so refreshing such a list means re-fetching it instead. Non-`null` whenever `data` is non-empty; `null` only on an empty page. Distinct from `prev_cursor`.
          example: eyJ2IjoxLCJzIjoiXCIyMDI2LTA1LTI1VDE2OjQyOjAxWlwiIiwiaSI6IjAxOTJmM2IxLTllMDQtN2NkMy1iODE3LTJhNmY0ZDFjOGUwOSJ9
    AMBFormSelectPage:
      allOf:
      - $ref: '#/components/schemas/AMBFormPageCommon'
      - type: object
        required:
        - type
        - items
        properties:
          type:
            type: string
            minLength: 1
            const: select
          multiple_selection:
            type: boolean
            default: false
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AMBFormSelectItem'
        if:
          required:
          - multiple_selection
          properties:
            multiple_selection:
              const: true
        then:
          properties:
            items:
              items:
                properties:
                  next_page_identifier:
                    not: {}
        else:
          properties:
            next_page_identifier:
              not: {}
      if:
        required:
        - submit_form
        properties:
          submit_form:
            const: true
      then:
        properties:
          items:
            items:
              properties:
                next_page_identifier:
                  not: {}
      unevaluatedProperties: false
    AMBNativeListPicker:
      type: object
      additionalProperties: false
      required:
      - sections
      properties:
        sections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AMBListPickerSection'
          description: The menu's sections, each with its own heading and rows.
    AMBNativeQuickReply:
      type: object
      additionalProperties: false
      required:
      - summary_text
      - items
      properties:
        summary_text:
          type: string
          minLength: 1
          x-sensitive: true
          description: Text used for the device notification and shown in the transcript after the customer chooses an item. Automatic introductions through the enclosing content.body depend on regional activation and the send retry mode; see content.body. For an introduction independent of activation, send a separate text message and omit content.body from the quick reply.
        items:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: '#/components/schemas/AMBQuickReplyItem'
          description: The buttons offered to the customer. Apple requires between two and five; outside that range the request is refused with a `422` `AMBQuickReplyItemsInvalid`. For more choices, send `list_picker` content instead.
    AMBFormPage:
      oneOf:
      - $ref: '#/components/schemas/AMBFormSelectPage'
      - $ref: '#/components/schemas/AMBFormPickerPage'
      - $ref: '#/components/schemas/AMBFormDatePickerPage'
      - $ref: '#/components/schemas/AMBFormInputPage'
      discriminator:
        propertyName: type
        mapping:
          select: '#/components/schemas/AMBFormSelectPage'
          picker: '#/components/schemas/AMBFormPickerPage'
          date_picker: '#/components/schemas/AMBFormDatePickerPage'
          input: '#/components/schemas/AMBFormInputPage'
    AMBInboundContent:
      description: Received text, attachments, and interactive replies, preserving Apple message structure.
      oneOf:
      - $ref: '#/components/schemas/AMBNativeTextContent'
      - $ref: '#/components/schemas/AMBNativeInboundInteractiveContent'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/AMBNativeTextContent'
          interactive: '#/components/schemas/AMBNativeInboundInteractiveContent'
    AMBNativeRichLinkVideo:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          description: HTTPS video URL fetched by Apple. A non-HTTPS URL is refused with a `422` `AMBEndpointNotHTTPS`. In a template it may contain `{{ }}` placeholders; the rendered value must be HTTPS.
          minLength: 1
          x-sensitive: true
        mime_type:
          type: string
          description: Media type of the video. Defaults to video/mp4; supply the actual type for other formats.
          default: video/mp4
    AMBMessageSource:
      type: string
      minLength: 1
      enum:
      - operator
      - automation
      - api
      description: "Who sent an outbound message:\n\n- `operator`: A person, through a signed-in dashboard session.\n- `automation`: A workflow or bot acting on the workspace's behalf,\n  through a signed-in session.\n- `api`: A direct API call, authenticated with an API key.\n\nA credential can send only the sources it is permitted; naming one\noutside that set is refused with a `422` `AMBMessageSourceNotPermitted`.\n\nThis is not `from`, which a send carries alongside it. That names\nthe brand the message goes out as; this names who composed it.\n"
    AMBMessageID:
      type: string
      minLength: 1
      pattern: ^amb_[0-9a-hjkmnp-tv-z]{26}$
      example: amb_01krdgeqcxet5s7t44vh8rt9mg
    AMBBusinessID:
      type: string
      minLength: 1
      pattern: ^abz_[0-9a-hjkmnp-tv-z]{26}$
      example: abz_01krdgeqcxet5s7t44vh8rt9mg
    AMBFormTextContentType:
      type: string
      minLength: 1
      x-extensible-enum:
      - name
      - namePrefix
      - givenName
      - middleName
      - familyName
      - nameSuffix
      - nickname
      - jobTitle
      - organizationName
      - location
      - fullStreetAddress
      - streetAddressLine1
      - streetAddressLine2
      - addressCity
      - addressState
      - addressCityAndState
      - sublocality
      - countryName
      - postalCode
      - telephoneNumber
      - emailAddress
      - URL
      - creditCardNumber
      - username
      - password
      - newPassword
      - oneTimeCode
      description: Apple UIKit value, passed through without changing its spelling.
    AMBMessageEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - occurred_at
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/AMBEventID'
          description: ID of the event, unique within the message's timeline.
        type:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageEventType'
        occurred_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: When this event occurred.
        error:
          readOnly: true
          $ref: '#/components/schemas/AMBError'
          description: Failure detail, on an `amb.send_failed` or `amb.rejected` event. Null on every other event type.
    AMBMessage:
      type: object
      additionalProperties: false
      dependentRequired:
        reply_message_id:
        - replied_at
        replied_at:
        - reply_message_id
      required:
      - id
      - conversation_id
      - business_account_id
      - direction
      - status
      - kind
      - content
      - created_at
      - cost
      - requested_language
      - resolved_language
      - template_id
      - template_version_id
      - template_content_hash
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageID'
          description: ID of the message, assigned when it is accepted or received. Pass it as `message_id` to the get-message and list-events endpoints.
        conversation_id:
          readOnly: true
          $ref: '#/components/schemas/AMBConversationID'
          description: The conversation this message belongs to.
        business_account_id:
          readOnly: true
          $ref: '#/components/schemas/AMBBusinessID'
          description: The business the message was sent from or received by.
        from:
          type: string
          readOnly: true
          minLength: 1
          description: Apple business identifier on outbound messages, or the customer's opaque Apple identifier on inbound messages. Omitted when that address is unavailable on a historical record.
        to:
          type: string
          readOnly: true
          minLength: 1
          description: Customer's opaque Apple identifier on outbound messages, or the Apple business identifier on inbound messages. Omitted when that address is unavailable on a historical record.
        direction:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageDirection'
        status:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageStatus'
        kind:
          readOnly: true
          $ref: '#/components/schemas/AMBContentKind'
          description: Derived content classification for filtering and statistics.
        source:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageSource'
          description: Who sent this message. Absent on an inbound message, which has no source to report.
        content:
          readOnly: true
          description: Native message content. Outgoing interactions contain requests; incoming interactions contain replies.
          anyOf:
          - $ref: '#/components/schemas/AMBMessageContent'
          - $ref: '#/components/schemas/AMBInboundContent'
          x-sensitive: true
        in_reply_to_message_id:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageID'
          description: Original message matched through Apple’s request identifier within the same workspace, business, and conversation. Omitted when no verified match exists, including when more than one sent message in the conversation uses the reply's request identifier.
        reply_message_id:
          readOnly: true
          $ref: '#/components/schemas/AMBMessageID'
          example: amb_01krdgh7m2zq8w4x6y9b3c5d7e
          description: Latest customer reply whose `in_reply_to_message_id` names this message. Omitted until a reply is matched, and in webhook payloads.
        replied_at:
          type: string
          format: date-time
          readOnly: true
          description: When Apple delivered the reply in `reply_message_id` to Bird. This can be slightly earlier than that reply's `created_at`, which records when Bird processed it. Omitted until a reply is matched, and in webhook payloads.
          example: '2026-10-13T10:09:00Z'
        locale:
          type:
          - string
          - 'null'
          readOnly: true
          minLength: 1
          description: Locale for this message, preserved in Apple’s format, for example en_US. Outbound messages use the request override, then the conversation locale, then the business default. Inbound messages preserve the locale in Apple’s callback. Null when unknown.
          example: en_US
        category:
          type: string
          readOnly: true
          description: The category this message was sent with, for reporting only. It does not affect sending or suppression policy, or select an Apple department or purpose. Defaults to an empty string when a send names no category. Absent on an inbound message, which has no category to report.
          example: order_update
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSON object for per-message context. Maximum 2 KB serialized. Top-level keys beginning with `__bird` are reserved. Returned in the send response, message reads and customer message webhooks.
          readOnly: true
        tags:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Tag'
          description: Structured `{name, value}` filter labels applied to this message. Absent on an inbound message.
        cost:
          readOnly: true
          $ref: '#/components/schemas/MessageCost'
          description: Recorded per-message charge before MAC pricing. Null in the initial send response, while unpriced, and for MAC-covered replies. MAC fees belong to monthly contact usage, not individual messages. Historical charges have no priced passthrough component.
        last_error:
          readOnly: true
          description: Failure detail on a message whose send failed or that Bird rejected before any send attempt. Omitted when there is no failure detail.
          $ref: '#/components/schemas/AMBError'
        created_at:
          type: string
          format: date-time
          minLength: 1
          readOnly: true
          description: The moment this message was accepted (outbound), or recorded by Bird after Apple delivered it (inbound). This is the timestamp the outbound statistics families bucket and attribute on; there is no separate `accepted_at` field.
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the selected sending outcome occurred. Null unless the current status is `sent` and the message is outbound. For older messages without a retained sending event, the stored record time is used.
        data_ref:
          $ref: '#/components/schemas/AMBRichLinkReference'
          readOnly: true
          description: Reusable encrypted content reference returned by Apple after a successful send. Absent until Apple returns one.
        group:
          type: string
          readOnly: true
          minLength: 1
          description: Apple department identifier carried by this message. Omitted when absent from the message or unavailable on a historical record.
        intent:
          type: string
          readOnly: true
          minLength: 1
          description: Apple purpose identifier carried by this message. Omitted when absent from the message or unavailable on a historical record.
        requested_language:
          readOnly: true
          description: 'The template language requested by the send, in canonical form. Null when the send named no language or used no template.

            '
          oneOf:
          - $ref: '#/components/schemas/LanguageTag'
          - type: 'null'
        resolved_language:
          readOnly: true
          description: 'The template language whose text was rendered, in canonical form. Null when the send used no template. This can differ from `requested_language` when the template''s fallback policy selects another language.

            '
          oneOf:
          - $ref: '#/components/schemas/LanguageTag'
          - type: 'null'
        template_id:
          readOnly: true
          description: The template rendered for this message, or null for a message sent with native content.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateID'
          - type: 'null'
        template_version_id:
          readOnly: true
          description: 'The workspace published version or synthetic built-in version rendered at acceptance, or null for a message sent with native content. For a built-in template, `template_content_hash` identifies the exact catalogue source.

            '
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateVersionID'
          - type: 'null'
        template_content_hash:
          readOnly: true
          description: The rendered language's source fingerprint, or null for a message sent with native content.
          oneOf:
          - $ref: '#/components/schemas/AMBTemplateContentHash'
          - type: 'null'
    AMBPaymentID:
      type: string
      minLength: 1
      pattern: ^apay_[0-9a-hjkmnp-tv-z]{26}$
      example: apay_01krdgeqcxet5s7t44vh8rt9mg
    AMBFormPickerItem:
      type: object
      additionalProperties: false
      required:
      - identifier
      - title
      - value
      properties:
        identifier:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 0
        value:
          type: string
          minLength: 0
    AMBMessageContent:
      description: Apple message families with Bird field naming and media URLs. Authentication and Apple Pay requests are created through their dedicated conversation endpoints.
      oneOf:
      - $ref: '#/components/schemas/AMBNativeTextContent'
      - $ref: '#/components/schemas/AMBNativeRichLinkContent'
      - $ref: '#/components/schemas/AMBNativeInteractiveContent'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/AMBNativeTextContent'
          rich_link: '#/components/schemas/AMBNativeRichLinkContent'
          interactive: '#/components/schemas/AMBNativeInteractiveContent'
    AMBContentKind:
      type: string
      minLength: 1
      enum:
      - text
      - attachment
      - rich_link
      - quick_reply
      - list_picker
      - time_picker
      - form
      - apple_pay
      - authenticate
      - imessage_app
      - interactive
      description: 'Derived message classification for filtering and statistics. Send requests use the native content.type families. Create Apple Pay and authentication requests through the conversation payment and authentication operations.


        - text: Text, optionally with a subject.

        - attachment: One or more files, images, audio clips, or videos.

        - rich_link: A link with a preview card.

        - quick_reply: Two to five reply choices.

        - list_picker: A grouped menu of choices.

        - time_picker: Appointment time slots; a reply may contain only a selected label.

        - form: A multi-page form.

        - imessage_app: A custom iMessage app interaction on a compatible device.

        - interactive: An opaque interactive reference whose subtype is unknown.

        - apple_pay: An Apple Pay request created through the conversation payment operations.

        - authenticate: An identity verification request created through the conversation authentication operations.'
    AMBFormKeyboardType:
      type: string
      minLength: 1
      x-extensible-enum:
      - default
      - asciiCapable
      - numbersAndPunctuation
      - URL
      - numberPad
      - phonePad
      - namePhonePad
      - emailAddress
      - decimalPad
      - webSearch
      description: Apple UIKit value, passed through without changing its spelling.
    AMBMessageEventList:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          description: 'The message''s events, oldest first. Not paginated: a message''s timeline is bounded and returned in full.

            '
          items:
            $ref: '#/components/schemas/AMBMessageEvent'
    AMBListPickerItem:
      type: object
      additionalProperties: false
      required:
      - identifier
      - title
      properties:
        identifier:
          type: string
          minLength: 1
          description: Opaque item identifier returned in interactive_data.data.list_picker.sections.
        title:
          type: string
          minLength: 1
          description: Label shown on the row.
        subtitle:
          type:
          - string
          - 'null'
          description: Secondary line shown under the title.
        image_identifier:
          type:
          - string
          - 'null'
          minLength: 1
          description: Identifier of an image in interactive_data.data.images, shown next to this row. A key with no matching entry in `images` is refused with a `422` `AMBInteractiveImageInvalid`.
        order:
          type: integer
          minimum: 0
          description: Position within the section, ascending. Defaults to the row's array position.
    AMBNativeInboundFormData:
